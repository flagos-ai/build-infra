# Per-image changelog; schema and rules: docs/changelog.md.
# Written retrospectively: the deliveries recorded here predate this layer
# having a changelog, so their dates are the registry's own push_time, read
# back from Harbor rather than backfilled by a workflow.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image. The
# entries recorded here predate the field, so their `reason_zh` was
# translated afterwards rather than written with the entry.

image: flagos-base-hygon-dtk26.04
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - `vendor.sh` no longer overwrites a caller's `PYTHONPATH`: it now
        prepends the SDK paths only when they are absent, keeping any path the
        container was started with (#1866).
      - Non-interactive bash loads `vendor.sh` through `BASH_ENV`, so the old
        absolute `export` dropped the caller's entries before Python ever ran
        and broke imports that depended on them.
    reason_zh: |-
      - `vendor.sh` 不再覆盖调用方的 `PYTHONPATH`：仅在 SDK 路径缺失时前置，
        容器启动时传入的路径全部保留（#1866）。
      - 非交互 bash 通过 `BASH_ENV` 加载 `vendor.sh`，旧的绝对 `export` 会在
        Python 运行前就丢掉调用方的条目，导致依赖它们的 import 失败。
    upstream_prs: []
    date: '2026-11-19T13:58:04.072Z'
  - date: ''
    reason: |-
      - The aillvm tree is now the `dtk_llvm-1.0.0+dtk2604...5f9d5e` build, and
        it replaces the bare `dtk_llvm.run` tree instead of sitting beside it,
        so this image carries one LLVM. That build is what both compilers now
        need: FlagTree from 0.7.1a1 emits `make.buffer.rsrc` with an i64
        numRecords the bare tree's clang-18 rejects, and vendor triton 3.6.0
        passes `-amdgpu-disable-backoff-barrier=false`, which it also rejects.
        The `.run` only adds `aillvm/` and `bin/` to the SDK root, so
        `/opt/dtk/env.sh` and the rest of the DTK layout are unchanged; the
        runtime's `compiler()` points `TRITON_HIP_CLANG_PATH` at this tree for
        both compilers.
    reason_zh: |-
      - aillvm 树改为 `dtk_llvm-1.0.0+dtk2604...5f9d5e` 构建，并取代裸
        `dtk_llvm.run` 树而非与之并存，镜像因此只带一套 LLVM。两个编译器现在都需要
        它：FlagTree 自 0.7.1a1 起发出 i64 numRecords 的 `make.buffer.rsrc`，
        裸树 clang-18 拒绝；厂商 triton 3.6.0 传入
        `-amdgpu-disable-backoff-barrier=false`，它同样拒绝。该 `.run` 只向 SDK
        根追加 `aillvm/` 与 `bin/`，故 `/opt/dtk/env.sh` 与其余 DTK 布局不变；
        runtime 的 `compiler()` 对两个编译器都将 `TRITON_HIP_CLANG_PATH` 指向此树。
    upstream_prs: []
  - date: '2026-10-27T02:02:24.528Z'
    reason: |-
      - `libgoogle-glog0v6t64` is installed for the `libglog.so.1` soname: torch's
        c10 headers make an extension build link glog (`C10_USE_GLOG`) and DTK
        ships no such library, so `import vllm_fl._C` failed and this backend's
        application layer could not load its native plugin.
    reason_zh: |-
      - 安装 `libgoogle-glog0v6t64` 是为了 `libglog.so.1` 这个 soname：torch 的 c10 头文件使扩展构建链接 glog（`C10_USE_GLOG`），而 DTK 不提供该库，导致 `import vllm_fl._C` 失败，此后端的应用层无法加载其原生插件。
    upstream_prs: []
- tag: 2.2.0
  entries:
  - date: '2026-09-17T01:20:40.030Z'
    reason: |-
      - Rebuilt to carry the new stack-wide tag; nothing in this layer changed.
    reason_zh: |-
      - 仅为携带新的全栈 tag 而重建；本层无任何改动。
    upstream_prs: []
- tag: 2.1.2
  entries:
  - date: '2026-08-16T03:44:50.882Z'
    reason: |-
      - First delivery: Hygon DTK 26.04 with the DTK LLVM toolchain on
        ubuntu:24.04. The DTK build is the Ubuntu 22.04 one — there is no 24.04
        release — and the image takes the newer base for the libstdc++ FlagTree
        needs.
      - The DTK LLVM package ships in it — the toolchain FlagTree's DCU backend
        builds against.
      - `libnuma1`, `libgfortran5`, `libdrm-amdgpu1`, `libdw1`, `libelf1` and
        `libpciaccess0` carry the userspace the torch build and the DCU detection
        path need.
      - The SDK environment is captured into `/etc/profile.d/vendor.sh` at build
        time; `env.sh` runs under bash because it finds DTKROOT through
        `BASH_SOURCE[0]`, which dash does not support.
    reason_zh: |-
      - 首次交付：海光 DTK 26.04 及 DTK LLVM 工具链，基于 ubuntu:24.04。DTK 构建产物是 Ubuntu 22.04 版 —— 没有 24.04 发行版 —— 镜像取更新的基础系统以满足 FlagTree 需要的 libstdc++。
      - DTK LLVM 包随其提供 —— 即 FlagTree 的 DCU 后端所针对构建的工具链。
      - `libnuma1`、`libgfortran5`、`libdrm-amdgpu1`、`libdw1`、`libelf1` 和 `libpciaccess0` 提供 torch 构建和 DCU 检测路径所需的用户态库。
      - SDK 环境在构建时固化进 `/etc/profile.d/vendor.sh`；`env.sh` 在 bash 下执行，因为它通过 `BASH_SOURCE[0]` 找到 DTKROOT，而 dash 不支持这一写法。
    upstream_prs: []
