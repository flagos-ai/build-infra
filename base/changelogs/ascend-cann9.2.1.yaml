# Per-image changelog; schema and rules: docs/changelog.md.

image: flagos-base-ascend-cann9.2.1
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - Re-push with the OCI provenance labels the first build could not write:
        `org.opencontainers.image.revision`, `.created` and `last-updated`. The
        `cann921` runner had no git in `PATH`, so the build stamped no commit
        and no timestamp.
      - Image content is unchanged. Without the revision label,
        `scripts/base_image_status.py` reports this backend UNKNOWN and cannot
        answer whether the pushed image is behind HEAD.
    reason_zh: |-
      - 重推补上首次构建未能写入的 OCI provenance 标签：
        `org.opencontainers.image.revision`、`.created` 与 `last-updated`。
        `cann921` runner 当时 `PATH` 里没有 git，构建因此既没有记录 commit
        也没有记录时间戳。
      - 镜像内容不变。缺少 revision 标签时，`scripts/base_image_status.py`
        会把这个后端报成 UNKNOWN，无法判断已推送镜像是否落后于 HEAD。
    upstream_prs: []
    date: '2026-11-04T14:05:09.589Z'
  - reason: |-
      - First delivery: CANN 9.2.1 — toolkit, the 910B ops package and NNAL — on
        aarch64 ubuntu:24.04.
      - Carries python 3.12 rather than 3.11. The torch 2.13.0 / torch_npu 2.13.0
        stack this line exists for is cp312-only.
      - The SDK environment is captured into `/etc/profile.d/vendor.sh` at build
        time, so nothing has to be sourced inside the container.
    reason_zh: |-
      - 首次交付：CANN 9.2.1 —— toolkit、910B ops 包和 NNAL —— 基于 aarch64 ubuntu:24.04。
      - 携带 python 3.12 而非 3.11。本线服务 torch 2.13.0 / torch_npu 2.13.0。
      - SDK 环境在构建时固化进 `/etc/profile.d/vendor.sh`，容器内无需 source。
    upstream_prs: []
    date: '2026-11-03T10:55:38.269Z'
