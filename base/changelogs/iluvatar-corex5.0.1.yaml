# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by base-image.yml after the push -- never hand-typed.

image: flagos-base-iluvatar-corex5.0.1
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - `libopenmpi3t64` provides the `libmpi.so.40` that corex 5.0.1's
        `libnvshmem_host.so` needs — torch reaches it through `torch_nvshmem`
        (`libtorch.so` and four more of its libraries carry the NEEDED entry),
        so `import torch` fails in the runtime without it.
    reason_zh: |-
      - `libopenmpi3t64` 提供 corex 5.0.1 的 `libnvshmem_host.so` 所需的
        `libmpi.so.40` —— torch 经 `torch_nvshmem` 访问它（`libtorch.so` 等五个
        torch 库带该 NEEDED 条目），缺了它 runtime 中 `import torch` 失败。
    upstream_prs: []
  - reason: |-
      - The image now carries the CoreX driver userspace: libcuda.so.1,
        libixml.so and ixsmi are unpacked from the bundled driver installer into
        /usr/local/corex. The first build ran only the SDK installer, so
        `import torch` failed in the runtime with "libcuda.so.1: cannot open
        shared object file".
    reason_zh: |-
      - 镜像现在带上 CoreX 驱动用户态：从随包驱动安装器解出 libcuda.so.1、
        libixml.so 与 ixsmi 到 /usr/local/corex。首次构建只跑了 SDK 安装器，
        导致 runtime 中 `import torch` 报 "libcuda.so.1: cannot open shared
        object file"。
    upstream_prs: []
    date: '2026-11-12T09:22:38.602Z'
  - reason: |-
      - First corex5.0.1 base image: Iluvatar CoreX 5.0.1 SDK and driver 5.0.1,
        CUDA header 260604 and CMake 3.31.8 on Ubuntu 24.04. This line succeeds
        the retired corex4.4.0 and moves the stack to torch 2.13.
    reason_zh: |-
      - 首个 corex5.0.1 base 镜像：Ubuntu 24.04 上的天数 CoreX 5.0.1 SDK 与驱动
        5.0.1、CUDA 头文件 260604、CMake 3.31.8。该线接替已退役的 corex4.4.0，
        并将技术栈推进到 torch 2.13。
    upstream_prs: []
    date: '2026-11-12T05:17:06.615Z'
