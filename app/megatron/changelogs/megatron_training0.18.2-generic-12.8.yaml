# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                   Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                   THIS image (not the mechanical bump). Human-written.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.

image: megatron_training0.18.2-generic-12.8
tags:
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-27T09:45:38.535Z'
    reason: >-
      True rebuild on the re-tagged MLF v0.3.0 wheel (213d05856): the first round-2
      push re-used the cached pip layer, so the image still carries the
      pre-#192/#193 wheel. This build runs --no-cache (push=false verify pass
      first), so the vendor index is resolved fresh and the installed wheel is the
      post-merge one.
    upstream_prs: []
  - date: '2026-09-27T08:37:45.717Z'
    reason: >-
      Rebuild on the re-tagged MLF v0.3.0 wheel, which now carries MLF #192
      (NullTokenizer bos / local-impl packed-seq guard) and #193 (capability-based
      paged-attention dispatch for non-NPU platforms). The 0.18.2 app images
      installed the pre-#192/#193 wheel; the fix matters for this image because RL
      E2E on the non-NPU backends runs the platform paged kernel.
    upstream_prs: []
  - date: '2026-09-26T15:11:20.660Z'
    reason: >-
      First megatron-core 0.18.2 app image on the FlagOS 2.2.0 stack. Built
      from the MLF v0.3.0 tag (full-scope wheel, MLF #189) on the flagcx-fixed
      runtime, whose flagcx wheel's libflagcx_device.bc parses in flagtree's
      reader.
    upstream_prs: []
