image: megatron_rl0.17.1-mthreads-musa4.3.6
tags:
- tag: 2.2.0-0.2.3
  entries:
  - date: '2026-09-23T13:56:28.640Z'
    reason: >-
      First megatron_rl image on this backend. The RL line resumes for image
      publication after MLF PR 114 declared the [rl] extra and PR 116 replaced
      the hard flash-attn >= 2.7.3 assert with a platform / DotProductAttention
      gate. Built on the FlagOS 2.2.0 stack with the release-line wheel, pinned
      exactly (0.17.1+fl.0.2.3) rather than resolving ==0.17.1 to whichever
      local version the index held. This backend ships no flash-attn, so the ungated dynamic-batching
      path needs --attention-backend unfused (DotProductAttention is exempt
      from the gate). The RL scenario has not been measured on this image.
    upstream_prs: []
