image: sglang0.5.18-sunrise-tangrt1.2.0
tags:
- tag: 2.2.0-0.1.dev1_g3b94dae1f
  entries:
  - date: '2026-09-28T16:49:04.174Z'
    reason: >-
      Rebuild on a rebuilt sunrise runtime. The FlagTree sunrise wheel was faulty
      (missing sunriseTritonPlugin.so, so flag_gems could not import triton) and has
      been re-uploaded; runtime v2 :2.2.0 and v1 :2.2.0-build were rebuilt on it (digests
      38eec/8b6fc). This app image was built on the broken runtime and is redone on
      the fixed one. Same plugin and app pins as the image it replaces.
    reason_zh: |-
      在重建后的 sunrise runtime 上重建。FlagTree 的 sunrise wheel 有缺陷（缺少 sunriseTritonPlugin.so，导致 flag_gems 无法导入 triton），已重新上传；runtime v2 :2.2.0 与 v1 :2.2.0-build 在其上重建（digest 38eec/8b6fc）。本 app 镜像此前构建于坏 runtime 上，现改用修复后的 runtime 重做。插件与 app 锁定与所替代镜像相同。
    upstream_prs: []

- tag: 2.1.2-0.1.dev1_g3b94dae1f
  entries:
  - date: '2026-09-11T07:48:15.174Z'
    reason: >-
      sglang 0.5.18 on sunrise TANGRT 1.2.0. First image for this backend: the plugin
      gains a vendor layer for a platform whose torch is a +cpu build carrying the
      PTPU
      device, so the core never short-circuits to its CUDA paths and reaches two
      fallbacks that only a non-CUDA-alias platform can hit (the device string and
      the
      pccl distributed backend). Two flag_gems operators are blacklisted in the app
      env
      because the vendor override does not implement them compatibly here: the SDPA
      math
      kernel rejects enable_gqa (breaks every GQA model at the first prefill) and
      the pow
      fallback fails on scalar**tensor — both are accepted indefinitely, so they are
      part
      of the delivered configuration rather than pending follow-ups. The runtime
      additionally moves to flag_gems 5.3.6 for the asin fallback and the sunrise
      cumsum
      guard. F/T dual-compiler serve verified on Qwen3-4B.
    reason_zh: |-
      sunrise TANGRT 1.2.0 上的 sglang 0.5.18。本后端的首个镜像：插件为该平台新增厂商层，其 torch 是携带 PTPU 设备的 +cpu 构建，因此内核不会短路到 CUDA 路径，而是走到只有非 CUDA 别名平台才会触发的两处回退（设备字符串与 pccl 分布式后端）。app env 中拉黑两个 flag_gems 算子，因为厂商 override 在此无法兼容地实现它们：SDPA math kernel 拒绝 enable_gqa（会在首次 prefill 时弄坏所有 GQA 模型），pow 回退在 scalar**tensor 上失败——二者被无限期接受，因此属于已交付配置的一部分，而非待办跟进。runtime 另外升到 flag_gems 5.3.6，以取得 asin 回退与 sunrise cumsum 守卫。F/T 双编译器 serve 已在 Qwen3-4B 上验证。
    upstream_prs:
    - https://github.com/flagos-ai/sglang-plugin-FL/pull/103
