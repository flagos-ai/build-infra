image: sglang0.5.18-iluvatar-corex4.5.0
tags:
- tag: 2.2.0-0.1.dev1_g201484665
  entries:
  - date: '2026-09-23T11:33:09.374Z'
    reason: >-
      First rebuild since the stack moved to 2.2.0, so the tag leaves 2.1.2. The
      base and runtime underneath are new for two reasons: the CoreX cmake
      installer was being handed a flag it silently ignores, leaving every image
      in the chain with a cmake that cannot run (#1011), and FlagGems moves to
      the version this stack pins. Same sglang and plugin pins as the 2.1.2
      image it replaces.
    reason_zh: |-
      stack 迁到 2.2.0 后的首次重建，因此 tag 退出 2.1.2。底下的 base 与 runtime 是新的，原因有二：CoreX cmake 安装器被传入一个它静默忽略的 flag，使链上每个镜像都带上一个无法运行的 cmake（#1011）；以及 FlagGems 升到本 stack pin 的版本。sglang 与插件 pin 与其替代的 2.1.2 镜像相同。
    upstream_prs: []
- tag: 2.1.2-0.1.dev1_g201484665
  entries:
  - date: '2026-09-10T11:59:36.635Z'
    reason: >-
      sglang 0.5.18 on iluvatar CoreX 4.5.0. corex torch is CUDA-alias, so sglang's
      is_cuda() is true while the platform has neither an NVIDIA device nor the
      NVIDIA-only packages its CUDA paths expect: the plugin branch closes the four
      resulting gaps (flashinfer import face via an on-disk stub package, the sm75
      dtype floor, the nvcc-JIT clamp_position, and vendor triton 3.2 missing the
      PDL
      intrinsics). F/T dual-compiler E2E verified on Qwen3-4B.
    reason_zh: |-
      天数智芯 CoreX 4.5.0 上的 sglang 0.5.18。corex 的 torch 是 CUDA 别名，因此 sglang 的 is_cuda() 为真，而本平台既没有 NVIDIA 设备，也没有其 CUDA 路径所期待的 NVIDIA 专属包：插件分支补齐由此产生的四处缺口（通过磁盘上的 stub 包提供 flashinfer 导入面、sm75 dtype 下限、nvcc JIT 的 clamp_position，以及厂商 triton 3.2 缺失 PDL 内建）。F/T 双编译器 E2E 已在 Qwen3-4B 上验证。
    upstream_prs:
    - https://github.com/flagos-ai/sglang-plugin-FL/pull/102
