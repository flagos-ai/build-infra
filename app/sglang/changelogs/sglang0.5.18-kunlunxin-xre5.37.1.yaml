image: sglang0.5.18-kunlunxin-xre5.37.1
tags:
- tag: 2.1.2-0.1.dev1_g7fb22a0c2
  entries:
  - date: '2026-09-12T05:11:04.035Z'
    reason: >-
      sglang 0.5.18 on Kunlunxin P800 (XRE 5.37.1). First image for this backend.
      The plugin stops deriving the vendor from torch attributes, which labelled
      every CUDA-alias platform nvidia and left kunlunxin.yaml — its bisected
      operator blacklist, the silu_and_mul routing, the oot_blacklist — never
      loaded; adapts the vendor layer to 0.5.18 (the overlap_utils symbol is gone,
      the KV pool moved off ForwardBatch, and the patch runner now isolates one
      failure instead of letting it disable the rest); forces the JIT CUDA
      predicates False, since this device answers capability (8, 6) and a real
      nvcc therefore compiles sm_86 SASS successfully and fails at the launch
      with "invalid device function"; and routes attention to torch_native, as
      the vendor klx_attention_* ops exist only in a vendor-compiled sgl_kernel
      build we do not ship — the SDPA family is blacklisted so flag_gems does not
      hijack the native path into the same XPU flash-attention compiler failure.
      F/T dual-compiler serve verified on Qwen3-4B.
    reason_zh: |-
      昆仑芯 P800（XRE 5.37.1）上的 sglang 0.5.18。本后端的首个镜像。插件不再从 torch 属性推导厂商，该做法此前把每个 CUDA 别名平台都标为 nvidia，使 kunlunxin.yaml 从未被加载——其中的二分定位算子黑名单、silu_and_mul 路由、oot_blacklist 皆然；插件把厂商层适配到 0.5.18（overlap_utils 符号已消失，KV pool 不再挂在 ForwardBatch 上，补丁执行器现在隔离单个失败，而不是让它连带禁用其余部分）；强制 JIT 的 CUDA 判定为 False，因为本设备回报 capability (8, 6)，真实 nvcc 因此能成功编译 sm_86 SASS，却在启动时以「invalid device function」失败；并把 attention 路由到 torch_native，因为厂商的 klx_attention_* 算子只存在于我方不发布的厂商编译版 sgl_kernel 构建中——SDPA 系列已被拉黑，以免 flag_gems 把原生路径劫持到同一个 XPU flash-attention 编译器失败上。F/T 双编译器 serve 已在 Qwen3-4B 上验证。
    upstream_prs:
    - https://github.com/flagos-ai/sglang-plugin-FL/pull/104
