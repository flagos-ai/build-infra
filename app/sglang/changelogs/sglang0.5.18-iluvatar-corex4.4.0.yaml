image: sglang0.5.18-iluvatar-corex4.4.0
tags:
- tag: 2.1.2-0.1.dev1_g4d44a24cd
  entries:
  - date: '2026-09-12T11:17:47.215Z'
    reason: >-
      sglang 0.5.18 on Iluvatar CoreX 4.4.0. First image for this backend, whose
      SDK pins torch 2.7.1 — below what sglang 0.5.18 assumes. Two torch surfaces
      it imports at startup exist only from 2.8 and neither is reachable from a
      plugin, because the scheduler worker imports them before any plugin loads:
      the torch.cuda.memory allocator entry points torch renamed (the caller
      itself switches between the two spellings by version), and
      torch.distributed._symmetric_memory, an NVLink multicast all-gather this
      platform never runs. The torch-compat-shim addon supplies both from
      interpreter start. Separately, the PDL no-op the plugin injects for the
      vendor triton had to answer triton 3.1.0's own call check, which asserts
      where 3.2 only tests — a defect on our side that the newer SDK never
      exposed. F/T dual-compiler serve verified on Qwen3-4B.
    upstream_prs:
    - https://github.com/flagos-ai/sglang-plugin-FL/pull/105
