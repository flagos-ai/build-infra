# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                  Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                  THIS image (not the mechanical bump). Human-written
#                  markdown, one item per bullet; published beside the image.
#     reason_zh:   the same reason in Chinese, same structure (one item per
#                  bullet). Required on a new entry; absent on the entries
#                  dated before the field existed.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.


image: vllm0.24.0-mthreads-musa4.3.6
tags:
- tag: 2.3.0-0.3.0
  entries:
  - date: '2026-10-26T12:25:32.556Z'
    reason: |-
      - The runtime introduces two container-start flags,
        `-e FLAGTREE_VERSION=<ver|latest>` and `-e FLAGGEMS_VERSION=<ver|latest>`,
        which override the compiler and FlagGems versions baked into the image. A
        request that cannot be honoured stops the container instead of letting it
        run on another version.
      - flagcx 0.14.0 is now a runtime dependency, pinned as
        flagcx==0.14.0+musa4.3.6.
    reason_zh: |-
      - runtime 引入两个容器启动期 flag，
        `-e FLAGTREE_VERSION=<ver|latest>` 与 `-e FLAGGEMS_VERSION=<ver|latest>`，
        用于覆盖镜像内烘焙的编译器与 FlagGems 版本。无法满足的请求会终止容器，
        而不是让它跑在另一个版本上。
      - flagcx 0.14.0 现为 runtime 依赖，pin 为
        flagcx==0.14.0+musa4.3.6。
    upstream_prs: []
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-29T08:16:21.520Z'
    reason: >-
      Rebuild on the mthreads runtime rebuilt with the updated flagtree wheel
      (same 0.7.0+mthreads3.6 version, new contents, 2026-09-29). Same plugin
      and app pins as the image it replaces.
    reason_zh: |-
      改用基于更新后 flagtree wheel 重建的摩尔线程 runtime 重建（版本号同为 0.7.0+mthreads3.6，内容更新，2026-09-29）。插件与 app pin 与被替代的镜像相同。
    upstream_prs: []
  - date: '2026-09-28T14:05:41.548Z'
    reason: >-
      The 0.24.0 line moves to the vllm-plugin-FL formal release v0.3.0 (tag = commit
      f105277). The plugin now ships as the release version (vllm-plugin-fl==0.3.0,
      one py3-none-any wheel, sha adf5a9e3...451f62, on every vendor index) instead
      of the v0.3.0-rc2.post2 delivery tag. Same stack and app pins as the rc2.post2
      image it replaces; the only delta is the formal release of the same code.
    reason_zh: |-
      0.24.0 线迁移到 vllm-plugin-FL 正式发布版 v0.3.0（tag = commit f105277）。插件现在以发布版本交付（vllm-plugin-fl==0.3.0，单个 py3-none-any wheel，sha adf5a9e3...451f62，每个 vendor index 都有），此前用的是 v0.3.0-rc2.post2 交付 tag。stack 与 app pin 与被替代的 rc2.post2 镜像相同；唯一差别是同一份代码的正式发布。
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: '2026-09-20T09:56:21.578Z'
    reason: >-
      This moves the image from 990a8f7 onto the release tag, which carries the MUSA
      fix that landed with it: PR 537 binds TP workers before the runtime patches,
      so a TP>1 run no longer places every shard on device 0. Rebuilt on the FlagOS
      2.2.0 stack, whose base and runtime carry FlagGems 5.4.0-rc2.post3, and on the
      vllm-plugin-FL release tag v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the
      plugin comes from a released tag rather than a pre-merge commit — an immutable
      pin, and one wheel served by every vendor index.
    reason_zh: |-
      本镜像从 990a8f7 移到发布 tag，该 tag 带上了随之落地的 MUSA 修复：PR 537 在 runtime 打补丁之前先绑定 TP worker，因此 TP>1 的运行不再把每个 shard 都放在 device 0 上。改用 FlagOS 2.2.0 stack（其 base 与 runtime 携带 FlagGems 5.4.0-rc2.post3）与 vllm-plugin-FL 发布 tag v0.3.0-rc2.post2（0891073，0.3.0-rc2 的 head）重建：插件取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.3.0rc2.post1_g990a8f7.d20260916
  entries:
  - date: '2026-09-16T14:07:50.039Z'
    reason: >-
      Rebuild on the vllm-plugin-FL 0.3.0-rc2 branch head 990a8f7 — the
      previous image pinned 5b592be, the pre-merge branch commit of PR 386, which
      is not the tip of any branch or tag upstream, so no named plugin ref can
      rebuild it. The image now sits on the release line and carries its
      dispatch/worker changes as a set: reference fallbacks stay registered when
      a backend is unavailable (PR 440), FlagGems blacklist entries can be
      appended per deployment (PR 439), the OOT graph path takes the
      BreakableCUDAGraphWrapper (PR 342), and the packed-decode GDN beta stays
      fp32 (PR 385). Rebuilt because PR 386 and FlagGems 5130 — the two upstream
      dependencies this image was tracking — are merged, so nothing is pending on
      either.
    reason_zh: |-
      改用 vllm-plugin-FL 0.3.0-rc2 分支 head 990a8f7 重建——前一个镜像 pin 的是 5b592be，PR 386 的合并前分支 commit，它不是上游任何分支或 tag 的 tip，因此没有具名的插件 ref 能重建它。镜像现在位于发布线上，并成组携带其 dispatch/worker 改动：后端不可用时 reference 回退仍保持注册（PR 440），FlagGems 黑名单条目可按部署追加（PR 439），OOT graph 路径改用 BreakableCUDAGraphWrapper（PR 342），packed-decode 的 GDN beta 保持 fp32（PR 385）。重建原因是 PR 386 与 FlagGems 5130——本镜像跟踪的两个上游依赖——均已合并，两边都没有待办。
    upstream_prs: []
- tag: 2.1.2-0.3.0rc0_g5b592be.d20260817
  entries:
  - date: 2026-09-01T14:14:03Z
    reason: >-
      vllm 0.24.0 on mthreads (PR 386 enablement + FlagGems 5130 mul device-gate fix).
      F/T verified.
    reason_zh: |-
      摩尔线程上的 vllm 0.24.0（PR 386 使能 + FlagGems 5130 mul device-gate 修复）。F/T 已验证。
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/386
    - https://github.com/flagos-ai/FlagGems/pull/5130
