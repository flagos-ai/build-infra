# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                  Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                  THIS image (not the mechanical bump). Human-written
#                  markdown, one item per bullet; published beside the image.
#     reason_zh:   the same reason in Chinese, same structure (one item per
#                  bullet). Required on a new entry; absent on the entries
#                  dated before the field existed.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.


image: vllm0.24.0-generic-12.8
tags:
- tag: 2.3.0-0.3.0
  entries:
  - date: '2026-10-26T23:10:25.787Z'
    reason: |-
      - The runtime introduces two container-start flags,
        `-e FLAGTREE_VERSION=<ver|latest>` and `-e FLAGGEMS_VERSION=<ver|latest>`,
        which override the compiler and FlagGems versions baked into the image. A
        request that cannot be honoured stops the container instead of letting it
        run on another version.
      - flagcx 0.14.0 is now a runtime dependency, pinned as
        flagcx==0.14.0+cuda12.8.
      - This backend installs the native plugin build `0.3.0+cuda12.8`: it
        carries `vllm_fl._C` and registers `weak_ref_tensor` on the CUDA
        dispatch key, without which vLLM's cudagraph capture leaks VRAM
        per captured graph.
    reason_zh: |-
      - runtime 引入两个容器启动期 flag，
        `-e FLAGTREE_VERSION=<ver|latest>` 与 `-e FLAGGEMS_VERSION=<ver|latest>`，
        用于覆盖镜像内烘焙的编译器与 FlagGems 版本。无法满足的请求会终止容器，
        而不是让它跑在另一个版本上。
      - flagcx 0.14.0 现为 runtime 依赖，pin 为
        flagcx==0.14.0+cuda12.8。
      - 本后端安装原生插件构建 `0.3.0+cuda12.8`：它带有 `vllm_fl._C`，
        并在 CUDA dispatch key 上注册 `weak_ref_tensor`；缺少它时 vLLM 的
        cudagraph 捕获会按每个捕获的 graph 泄漏 VRAM。
    upstream_prs: []
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-28T14:08:12.320Z'
    reason: >-
      The 0.24.0 line moves to the vllm-plugin-FL formal release v0.3.0 (tag = commit
      f105277). The plugin now ships as the release version (vllm-plugin-fl==0.3.0,
      one py3-none-any wheel, sha adf5a9e3...451f62, on every vendor index) instead
      of the v0.3.0-rc2.post2 delivery tag. Same stack and app pins as the rc2.post2
      image it replaces; the only delta is the formal release of the same code.
    reason_zh: |-
      0.24.0 线迁移到 vllm-plugin-FL 正式发布版 v0.3.0（tag = commit f105277）。插件现在以发布版本交付（vllm-plugin-fl==0.3.0，单个 py3-none-any wheel，sha adf5a9e3...451f62，每个 vendor index 都有），此前用的是 v0.3.0-rc2.post2 交付 tag。stack 与 app pin 与被替代的 rc2.post2 镜像相同；唯一差别是同一份代码的正式发布。
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: '2026-09-20T09:58:26.876Z'
    reason: >-
      The NVIDIA image leaves the v0.3.0-rc0 tag, a 0.2.0-line build, for the 0.3.0
      release line, so it now carries the plugin the rest of the 0.24.0 matrix is
      built on. Rebuilt on the FlagOS 2.2.0 stack, whose base and runtime carry
      FlagGems 5.4.0-rc2.post3, and on the vllm-plugin-FL release tag
      v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the plugin comes from a
      released tag rather than a pre-merge commit — an immutable pin, and one wheel
      served by every vendor index.
    reason_zh: |-
      NVIDIA 镜像离开 v0.3.0-rc0 tag（一个 0.2.0 线的构建）转入 0.3.0 发布线，因此现在携带 0.24.0 矩阵其余部分所基于的插件。改用 FlagOS 2.2.0 stack（其 base 与 runtime 携带 FlagGems 5.4.0-rc2.post3）与 vllm-plugin-FL 发布 tag v0.3.0-rc2.post2（0891073，0.3.0-rc2 的 head）重建：插件取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.2.0_ga9435a3.d20260821
  entries:
  - date: 2026-08-24T06:04:48Z
    reason: >-
      Initial vllm 0.24.0 deliverable on NVIDIA (repacked empty wheel, single-step
      install). Rust frontend
      components make the wheel ABI-bound to (python, arch); F/T dual-compiler E2E
      verified.
    reason_zh: |-
      NVIDIA 上 vllm 0.24.0 的首次交付（repack 空 wheel，单步安装）。Rust 前端组件使 wheel 与（python, arch）ABI 绑定；F/T 双编译器 E2E 已验证。
