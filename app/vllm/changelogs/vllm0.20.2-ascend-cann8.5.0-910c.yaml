# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                  Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                  THIS image (not the mechanical bump). Human-written
#                  markdown, one item per bullet; published beside the image.
#     reason_zh:   the same reason in Chinese, same structure (one item per
#                  bullet). Required on a new entry; absent on the entries
#                  dated before the field existed.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.


image: vllm0.20.2-ascend-cann8.5.0-910c
tags:
- tag: 2.2.0-0.2.2
  entries:
  - date: '2026-09-28T06:12:21Z'
    reason: >-
      Rebuild on the vllm-plugin-FL formal release v0.2.2 (tag = commit 675548ab, the head of 0.2.2-rc2). The plugin now ships as the release version (vllm-plugin-fl==0.2.2, one py3-none-any wheel, sha 90a4ba10...27fa2, on all 11 vendor indexes) instead of the v0.2.2-rc2.post2 delivery tag — the only delta is the backport of #553 (bounded/safe multiprocessing worker shutdown), which the 2.2.0 stack line now carries. App image rebuilt from that wheel, pinned exactly.
    reason_zh: |-
      改用 vllm-plugin-FL 正式发布版 v0.2.2 重建（tag = commit 675548ab，即 0.2.2-rc2 的 head）。插件现在以发布版本交付（vllm-plugin-fl==0.2.2，单个 py3-none-any wheel，sha 90a4ba10...27fa2，11 个 vendor index 全都有），此前用的是 v0.2.2-rc2.post2 交付 tag——唯一差别是回移的 #553（有界/安全的 multiprocessing worker 关闭），2.2.0 stack 线现已带上该修复。app 镜像从该 wheel 重建，精确 pin 到该版本。
    upstream_prs: []
- tag: 2.2.0-0.2.2rc2.post2
  entries:
  - date: '2026-09-20T11:02:54.471Z'
    reason: >-
      Rebuild on the FlagOS 2.2.0 stack and on the vllm-plugin-FL release tag
      v0.2.2-rc2.post2 (214804a, head of 0.2.2-rc2). Both layers move at once:
      the stack brings the 2.2.0 base and runtime, with FlagGems 5.4.0-rc2.post3
      and FlagTree 0.6.0+ascend3.2, and the plugin now comes from a released tag
      rather than a pre-merge commit — an immutable pin, and one wheel served by
      every vendor index.
    reason_zh: |-
      改用 FlagOS 2.2.0 stack 与 vllm-plugin-FL 发布 tag v0.2.2-rc2.post2（214804a，0.2.2-rc2 的 head）重建。两层同时变动：stack 带来 2.2.0 的 base 与 runtime，含 FlagGems 5.4.0-rc2.post3 与 FlagTree 0.6.0+ascend3.2；插件改为取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.2.2rc2.post1_gdb28502.d20260915
  entries:
  - date: "2026-09-15T10:50:17.737Z"
    reason: >-
      Rebuild on the vllm-plugin-FL 0.2.2-rc2 branch head db28502, which
      replaces the fork-synthesized source (2b6b635 = release-0.2 plus three
      cherry-picks) this image was originally built from. The ascend changes it
      carried are merged upstream and present at this head: PR 361 lift_fresh /
      _to_copy blacklist (coreDim=0 on scalar tensor init) and PR 402 pow_scalar,
      so the wheel is built from the plain upstream repo again. The wheel version
      base follows the branch's own version (0.2.2rc2.post1) rather than the
      0.2.0 line this image carries; only the base SDK differs from the 910B4
      line (CANN 910C Ops).
    reason_zh: |-
      改用 vllm-plugin-FL 0.2.2-rc2 分支 head db28502 重建，取代本镜像最初构建所用的 fork 合成源码（2b6b635 = release-0.2 加三个 cherry-pick）。它当时携带的 ascend 改动已并入上游并存在于该 head：PR 361 lift_fresh / _to_copy 黑名单（标量 tensor 初始化时 coreDim=0）与 PR 402 pow_scalar，因此 wheel 重新从纯上游仓库构建。wheel 的版本基址跟随分支自身版本（0.2.2rc2.post1），而非本镜像所在的 0.2.0 线；与 910B4 线相比仅 base SDK 不同（CANN 910C Ops）。
- tag: 2.1.2-0.2.0_g2b6b635.d20260824
  entries:
  - date: "2026-09-10T10:48:19.678Z"
    reason: >-
      Initial vllm 0.20.2 deliverable on Ascend 910C / CANN 8.5.0 (ascend-cann8.5.0-910c).
      Same repacked vllm +flagos wheel and vllm-plugin-FL ascend 0.20.2 enablement
      as the 910B4
      line; only the base SDK's chip-split ops package differs (CANN 910C Ops). Single-step
      install matrix-inert; F/T dual-compiler E2E verified.
    reason_zh: |-
      Ascend 910C / CANN 8.5.0（ascend-cann8.5.0-910c）上 vllm 0.20.2 的首次交付。与 910B4 线相同的 repack vllm +flagos wheel 与 vllm-plugin-FL ascend 0.20.2 使能；仅 base SDK 的芯片拆分 ops 包不同（CANN 910C Ops）。单步安装，对矩阵无影响；F/T 双编译器 E2E 已验证。
