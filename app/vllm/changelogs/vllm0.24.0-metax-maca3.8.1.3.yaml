image: vllm0.24.0-metax-maca3.8.1.3
tags:
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: ''
    reason: >-
      This moves the image from 990a8f7, one commit past v0.3.0-rc2.post1, onto the
      release tag itself. Rebuilt on the FlagOS 2.2.0 stack, whose base and runtime
      carry FlagGems 5.4.0-rc2.post3, and on the vllm-plugin-FL release tag
      v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the plugin comes from a
      released tag rather than a pre-merge commit — an immutable pin, and one wheel
      served by every vendor index.
    upstream_prs: []
- tag: 2.1.2-0.3.0rc2.post1_g990a8f7.d20260916
  entries:
  - date: '2026-09-16T11:03:01.890Z'
    reason: >-
      Rebuild on the vllm-plugin-FL 0.3.0-rc2 branch head 990a8f7 — PR 377, the
      metax 0.24.0 enablement this image was waiting on, now on the release line.
      The four compatibility fixes that previously had to be applied to
      site-packages by hand live in the plugin: a new metax
      patches/vllm024_compat.py redefines the triton _load_ptr (_load_ptr's
      tl.pointer_type called with a constexpr element type, which metax triton
      3.0.0 rejects — unwrapped via elem_dtype.value) and _penalties_kernel (the
      chained boolean use_rep_penalty or use_freq_penalty or use_pres_penalty
      parenthesized for the same compiler), and moves the SamplingStates
      get_top_k_top_p / PoolingRunner.pool indexing onto CPU because metax UVA
      views are CPU-typed tensors; the gdn_linear_attn import of
      GatedDeltaNetAttention is version-gated (0.24 moved it to mamba/gdn/base.py)
      and the fused_moe router guards its ROCm-only aiter imports (0.24 dropped
      fused_moe.rocm_aiter_fused_moe). __init__.py adds _patch_torch_accelerator,
      binding the torch.cuda memory-stats APIs MACA's partial torch.accelerator
      lacks; fa_utils.py takes reshape_and_cache_flash from flag_gems, as the
      0.20.2 fix does (the empty wheel has no compiled _C_cache_ops). The
      previous image pinned 5c511da, a commit on PR 377's pre-merge branch that
      is not the tip of any branch or tag upstream, so no named plugin ref can
      rebuild it. Same wheel as maca3.7.2.1 (pure-python, both run python 3.12).
    upstream_prs: []
- tag: 2.1.2-0.2.1_g5c511da.d20260901
  entries:
  - date: 2026-09-03T01:17:21Z
    reason: >-
      vllm 0.24.0 on metax maca3.8.1.3 (PR 377). F/T verified.
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/377
