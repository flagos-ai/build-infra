#                  action itself and are NOT listed here.


image: vllm0.24.0-ascend-cann8.5.0-910c
tags:
- tag: 2.3.0-0.3.0
  entries:
  - date: '2026-10-26T12:20:13.595Z'
    reason: |-
      - The runtime introduces two container-start flags,
        `-e FLAGTREE_VERSION=<ver|latest>` and `-e FLAGGEMS_VERSION=<ver|latest>`,
        which override the compiler and FlagGems versions baked into the image. A
        request that cannot be honoured stops the container instead of letting it
        run on another version.
      - flagcx 0.14.0 is now a runtime dependency, pinned as
        flagcx==0.14.0+cann8.5.0.910c.
      - The runtime re-asserts the venv prefix after this vendor's SDK env assigns
        PATH absolutely; `pip` otherwise resolved to the system interpreter, or to
        none.
    reason_zh: |-
      - runtime 引入两个容器启动期 flag，
        `-e FLAGTREE_VERSION=<ver|latest>` 与 `-e FLAGGEMS_VERSION=<ver|latest>`，
        用于覆盖镜像内烘焙的编译器与 FlagGems 版本。无法满足的请求会终止容器，
        而不是让它跑在另一个版本上。
      - flagcx 0.14.0 现为 runtime 依赖，pin 为
        flagcx==0.14.0+cann8.5.0.910c。
      - 本 vendor 的 SDK env 以绝对路径赋值 PATH 后，runtime 会重新声明 venv 前缀；
        否则 `pip` 会解析到系统解释器，或者解析不到任何解释器。
    upstream_prs: []
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-28T14:01:13.474Z'
    reason: >-
      The 0.24.0 line moves to the vllm-plugin-FL formal release v0.3.0 (tag = commit
      f105277). The plugin now ships as the release version (vllm-plugin-fl==0.3.0,
      one py3-none-any wheel, sha adf5a9e3...451f62, on every vendor index) instead
      of the v0.3.0-rc2.post2 delivery tag. Same stack and app pins as the rc2.post2
      image it replaces; the only delta is the formal release of the same code.
    reason_zh: |-
      0.24.0 线迁移到 vllm-plugin-FL 正式发布版 v0.3.0（tag = commit f105277）。插件现在以发布版本交付（vllm-plugin-fl==0.3.0，单个 py3-none-any wheel，sha adf5a9e3...451f62，每个 vendor index 都有），此前用的是 v0.3.0-rc2.post2 交付 tag。stack 与 app pin 与被替代的 rc2.post2 镜像相同；唯一差别是同一份代码的正式发布。
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: '2026-09-20T10:11:13.914Z'
    reason: >-
      The ascend 0.24.0 port (PR 387) is on the release line now, so this image
      leaves f31b199, the head that carries the index_select blacklist this
      backend's vendor triton 3.2.0 needs. Rebuilt on the FlagOS 2.2.0 stack, whose
      base and runtime carry FlagGems 5.4.0-rc2.post3, and on the vllm-plugin-FL
      release tag v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the plugin comes
      from a released tag rather than a pre-merge commit — an immutable pin, and one
      wheel served by every vendor index.
    reason_zh: |-
      ascend 0.24.0 移植（PR 387）已进入发布线，因此本镜像离开 f31b199，即携带本后端 vendor triton 3.2.0 所需 index_select 黑名单的那个 head。改用 FlagOS 2.2.0 stack（其 base 与 runtime 携带 FlagGems 5.4.0-rc2.post3）与 vllm-plugin-FL 发布 tag v0.3.0-rc2.post2（0891073，0.3.0-rc2 的 head）重建：插件取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.2.0_gf31b199.d20260911
  entries:
  - date: "2026-09-11T10:54:44.964Z"
    reason: >-
      Rebuild pinning vllm-plugin-FL to the index_select blacklist fix
      (vllm-plugin-FL #387 head f31b199, replacing cf8998c). Without it this
      backend's vendor triton 3.2.0 path degrades deterministically: triton
      3.2.0 ships no triton.experimental, the generic flag_gems index_select
      is wrong at the shape torch_npu._npu_rotary_embedding uses internally
      (inp 40960x128, dim 0, idx size 5), and the corrupted cos/sin reach
      every attention head. Blacklisting the op routes it back to aten.
    reason_zh: |-
      重建并把 vllm-plugin-FL pin 到 index_select 黑名单修复（vllm-plugin-FL #387 head f31b199，取代 cf8998c）。没有它，本后端的 vendor triton 3.2.0 路径会确定性地退化：triton 3.2.0 不带 triton.experimental，通用 flag_gems index_select 在 torch_npu._npu_rotary_embedding 内部使用的形状上结果是错的（inp 40960x128，dim 0，idx size 5），被污染的 cos/sin 会传到每一个 attention head。把该 op 拉黑即可让它回到 aten。
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/387
- tag: 2.1.2-0.2.0_gcf8998c.d20260818
  entries:
  - date: "2026-09-10T10:57:00.437Z"
    reason: >-
      Initial vllm 0.24.0 deliverable on Ascend 910C / CANN 8.5.0 (ascend-cann8.5.0-910c).
      Same repacked vllm +flagos wheel and vllm-plugin-FL ascend 0.24.0 port as the
      910B4 line;
      only the base SDK's chip-split ops package differs (CANN 910C Ops). Single-step
      install
      matrix-inert; F/T dual-compiler E2E verified.
    reason_zh: |-
      Ascend 910C / CANN 8.5.0（ascend-cann8.5.0-910c）上 vllm 0.24.0 的首次交付。与 910B4 线相同的 repack vllm +flagos wheel 与 vllm-plugin-FL ascend 0.24.0 移植；仅 base SDK 的芯片拆分 ops 包不同（CANN 910C Ops）。单步安装，对矩阵无影响；F/T 双编译器 E2E 已验证。
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/387
