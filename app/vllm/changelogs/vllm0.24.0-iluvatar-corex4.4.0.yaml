# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                  Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                  THIS image (not the mechanical bump). Human-written.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.


image: vllm0.24.0-iluvatar-corex4.4.0
tags:
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-28T14:02:12.199Z'
    reason: >-
      The 0.24.0 line moves to the vllm-plugin-FL formal release v0.3.0 (tag = commit
      f105277). The plugin now ships as the release version (vllm-plugin-fl==0.3.0,
      one py3-none-any wheel, sha adf5a9e3...451f62, on every vendor index) instead
      of the v0.3.0-rc2.post2 delivery tag. Same stack and app pins as the rc2.post2
      image it replaces; the only delta is the formal release of the same code.
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post3
  entries:
  - date: '2026-09-28T21:17:04Z'
    reason: >-
      The symmetric-memory stub on the release line catches ImportError now,
      not just ModuleNotFoundError (vllm-plugin-FL v0.3.0-rc2.post3): the
      iluvatar corex torch 2.7.1 ships torch.distributed._symmetric_memory
      whose import of torch._C._distributed_c10d._SymmetricMemory raises
      ImportError (a torch 2.8 symbol), so the old stub never fired and the
      plugin could not load. post3 is the first wheel with the fix and is on
      the iluvatar index. Same stack (0.6.1 flagtree + USE_FLAGTUNE_COST_MODEL=0)
      and app pins as the post2 image it replaces; the T path stays
      undeliverable on the vendor corex triton 3.1 defect (iluvatar backend
      doc §14.4).
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: '2026-09-28T18:16:28Z'
    reason: >-
      Rebuild on the 4.4.0 runtime with FlagTree downgraded to 0.6.1
      (0.7.0 hard-loads libflagcx.so; the CoreX 4.4.0 SDK ships no libixccl,
      so the runtime failed to import flag_gems). Same stack, plugin and
      app pins as the 0.7.0-era image it replaces. The T path stays
      undeliverable on the vendor corex triton 3.1 defect (iluvatar backend
      doc §14.4); this rebuild reruns the F path only.
    upstream_prs: []
  - date: '2026-09-20T17:43:35Z'
    reason: >-
      The symmetric-memory stub (PR 491) is on the release line now, so this image
      leaves c9e2573, a commit of the main line. The F path stays the deliverable
      one; the T path remains undeliverable on the vendor corex triton 3.1 defect
      recorded in the iluvatar backend doc. Rebuilt on the FlagOS 2.2.0 stack, whose
      base and runtime carry FlagGems 5.4.0-rc2.post3, and on the vllm-plugin-FL
      release tag v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the plugin comes
      from a released tag rather than a pre-merge commit — an immutable pin, and one
      wheel served by every vendor index.
    upstream_prs: []
- tag: 2.1.2-0.2.1_gc9e2573.d20260913
  entries:
  - date: "2026-09-13T14:43:58.834Z"
    reason: >-
      Rebuild on the unified vllm-plugin-FL head that carries the symm_mem
      stub, superseding the one-off wheel pinned to VPF #434. F path
      deliverable; T path not deliverable (vendor corex triton 3.1 defect, see
      the iluvatar backend doc).
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/491
- tag: 2.1.2-0.2.1_g84a4ca2.d20260902
  entries:
  - date: 2026-09-02T12:14:27Z
    reason: >-
      vllm 0.24.0 on iluvatar corex4.4.0 (PR 434 symm_mem stub for torch<2.8). F path
      deliverable; T path
      not deliverable (vendor corex triton 3.1 defect, see iluvatar doc).
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/434
