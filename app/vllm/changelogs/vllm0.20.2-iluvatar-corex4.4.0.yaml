#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.

image: vllm0.20.2-iluvatar-corex4.4.0
tags:
- tag: 2.2.0-0.2.2
  entries:
  - date: '2026-09-28T11:59:13.835Z'
    reason: >-
      Rebuild on the vllm-plugin-FL formal release v0.2.2 (tag = commit 675548ab,
      the head of 0.2.2-rc2). The plugin now ships as the release version (vllm-plugin-fl==0.2.2,
      one py3-none-any wheel, sha 90a4ba10...27fa2, on all 11 vendor indexes) instead
      of the v0.2.2-rc2.post2 delivery tag — the only delta is the backport of #553
      (bounded/safe multiprocessing worker shutdown), which the 2.2.0 stack line now
      carries. App image rebuilt from that wheel, pinned exactly.
    reason_zh: |-
      改用 vllm-plugin-FL 正式发布版 v0.2.2 重建（tag = commit 675548ab，即 0.2.2-rc2 的 head）。插件现在以发布版本交付（vllm-plugin-fl==0.2.2，单个 py3-none-any wheel，sha 90a4ba10...27fa2，11 个 vendor index 全都有），此前用的是 v0.2.2-rc2.post2 交付 tag——唯一差别是回移的 #553（有界/安全的 multiprocessing worker 关闭），2.2.0 stack 线现已带上该修复。app 镜像从该 wheel 重建，精确 pin 到该版本。
    upstream_prs: []
- tag: 2.2.0-0.2.2rc2.post2
  entries:
  - date: '2026-09-28T10:16:28Z'
    reason: >-
      Rebuild on the 4.4.0 runtime with FlagTree downgraded to 0.6.1
      (0.7.0 hard-loads libflagcx.so; the CoreX 4.4.0 SDK ships no libixccl,
      so the runtime failed to import flag_gems). Same stack, plugin and
      app pins as the 0.7.0-era image it replaces.
    reason_zh: |-
      改用把 FlagTree 降级到 0.6.1 的 4.4.0 runtime 重建（0.7.0 会硬加载 libflagcx.so；CoreX 4.4.0 SDK 不带 libixccl，导致 runtime import flag_gems 失败）。stack、插件与 app pin 与被替代的 0.7.0 时代镜像相同。
    upstream_prs: []
  - date: '2026-09-23T11:00:43.433Z'
    reason: >-
      Rebuild on a corrected base image. The CoreX cmake installer was being
      handed a flag it silently ignores, so every image in this chain shipped a
      cmake that cannot run (#1011). Nothing else moves: same stack, same base
      and runtime recipe, same plugin pin.
    reason_zh: |-
      改用修正后的 base 镜像重建。CoreX 的 cmake 安装器被传入一个它静默忽略的 flag，导致这条链上的每个镜像都带上了无法运行的 cmake（#1011）。其余不变：同一 stack、同一 base 与 runtime 配方、同一插件 pin。
    upstream_prs: []
  - date: '2026-09-20T10:55:02.266Z'
    reason: >-
      Rebuild on the FlagOS 2.2.0 stack and on the vllm-plugin-FL release tag
      v0.2.2-rc2.post2 (214804a, head of 0.2.2-rc2). Both layers move at once:
      the stack brings the 2.2.0 base and runtime, with FlagGems 5.4.0-rc2.post3
      and the 0.7.0-era FlagTree, and the plugin now comes from a released tag
      rather than a pre-merge commit — an immutable pin, and one wheel served by
      every vendor index.
    reason_zh: |-
      改用 FlagOS 2.2.0 stack 与 vllm-plugin-FL 发布 tag v0.2.2-rc2.post2（214804a，0.2.2-rc2 的 head）重建。两层同时变动：stack 带来 2.2.0 的 base 与 runtime，含 FlagGems 5.4.0-rc2.post3 与 0.7.0 时代的 FlagTree；插件改为取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.2.1_g16e8655.d20260907
  entries:
  - date: 2026-09-07T11:06:11Z
    reason: >-
      Determinism fix on corex4.4.0: blacklist the flag_gems GEMM family
      (linear/mm/addmm/bmm) so GEMMs fall back to native corex ixblas.
      Flagtree-compiled flag_gems GEMM kernels are launch-to-launch
      nondeterministic in the live engine (~1-2 bf16 ulp), flipping temp=0
      decode at near-tie bands; native GEMMs are deterministic and faster.
      F/T both 30/30 temp=0-deterministic. Earlier publishes (gec9fded:
      pytorch sampler fallback + torch<2.8 symm_mem guard wheel; g71b9482:
      silu_and_mul blacklist) were not temp=0-deterministic and are
      superseded.
    reason_zh: |-
      corex4.4.0 的确定性修复：把 flag_gems 的 GEMM 家族（linear/mm/addmm/bmm）拉黑，使 GEMM 回退到原生 corex ixblas。flagtree 编译的 flag_gems GEMM kernel 在真实 engine 中逐次启动不确定（约 1-2 bf16 ulp），会让接近平票区间的 temp=0 decode 发生翻转；原生 GEMM 既确定又更快。F/T 均 30/30 temp=0 确定。更早的发布（gec9fded：pytorch sampler 回退 + torch<2.8 symm_mem guard wheel；g71b9482：silu_and_mul 黑名单）不是 temp=0 确定的，已被取代。
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/450
    - https://github.com/flagos-ai/FlagGems/issues/6054
    - https://github.com/flagos-ai/FlagGems/issues/6055
    - https://github.com/flagos-ai/FlagGems/issues/6056
    - https://github.com/flagos-ai/FlagGems/issues/6057
