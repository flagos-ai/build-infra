image: vllm0.20.2-iluvatar-corex4.4.0
tags:
- tag: 2.1.2-0.2.1_g16e8655.d20260907
  entries:
  - date: 2026-09-07T11:06:11Z
    reason: >-
      Determinism fix on corex4.4.0: blacklist the flag_gems GEMM family
      (linear/mm/addmm/bmm) so GEMMs fall back to native corex ixblas.
      Flagtree-compiled flag_gems GEMM kernels are launch-to-launch
      nondeterministic in the live engine (~1-2 bf16 ulp), flipping temp=0
      decode at near-tie bands; native GEMMs are deterministic and faster.
      F/T both 30/30 temp=0-deterministic. Earlier publishes (gec9fded:
      pytorch sampler fallback + torch<2.8 symm_mem guard wheel; g71b9482:
      silu_and_mul blacklist) were not temp=0-deterministic and are
      superseded.
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/450
    - https://github.com/flagos-ai/FlagGems/issues/6054
    - https://github.com/flagos-ai/FlagGems/issues/6055
    - https://github.com/flagos-ai/FlagGems/issues/6056
    - https://github.com/flagos-ai/FlagGems/issues/6057
