#
# Per-image changelog. Schema:
#   image:  repo image name (no tag)
#   tags:   one block per tag that has been published, newest first. Only the
#           latest (registry-resident) tag carries entries; superseded tags
#           are folded into its entries as history — the registry no longer
#           holds them, so this file is their only trace.
#   entries: ordered newest first; one entry per substantive change.
#     date:        push_time, backfilled by the app-image workflow after push.
#                  Empty while a build is pending review/gate.
#     reason:      why this rebuild happened — the change that matters for
#                  THIS image (not the mechanical bump). Human-written
#                  markdown, one item per bullet; published beside the image.
#     reason_zh:   the same reason in Chinese, same structure (one item per
#                  bullet). Required on a new entry; absent on the entries
#                  dated before the field existed.
#     upstream_prs: PENDING PRs in OTHER repos (vllm-plugin-FL / FlagGems /
#                  ...) that this build is waiting on — a tracking list, so a
#                  merged PR does not belong here (its change is already in
#                  the tag being built). build-infra PRs are the delivery
#                  action itself and are NOT listed here.


image: vllm0.20.2-metax-maca3.7.2.1
tags:
- tag: 2.2.0-0.2.2
  entries:
  - date: '2026-09-28T06:36:05.010Z'
    reason: >-
      Rebuild on the vllm-plugin-FL formal release v0.2.2 (tag = commit 675548ab,
      the head of 0.2.2-rc2). The plugin now ships as the release version (vllm-plugin-fl==0.2.2,
      one py3-none-any wheel, sha 90a4ba10...27fa2, on all 11 vendor indexes) instead
      of the v0.2.2-rc2.post2 delivery tag — the only delta is the backport of #553
      (bounded/safe multiprocessing worker shutdown), which the 2.2.0 stack line now
      carries. App image rebuilt from that wheel, pinned exactly.
    reason_zh: |-
      改用 vllm-plugin-FL 正式发布版 v0.2.2 重建（tag = commit 675548ab，即 0.2.2-rc2 的 head）。插件现在以发布版本交付（vllm-plugin-fl==0.2.2，单个 py3-none-any wheel，sha 90a4ba10...27fa2，11 个 vendor index 全都有），此前用的是 v0.2.2-rc2.post2 交付 tag——唯一差别是回移的 #553（有界/安全的 multiprocessing worker 关闭），2.2.0 stack 线现已带上该修复。app 镜像从该 wheel 重建，精确 pin 到该版本。
    upstream_prs: []
- tag: 2.2.0-0.2.2rc2.post2
  entries:
  - date: '2026-09-20T07:21:14.288Z'
    reason: >-
      Rebuild on the FlagOS 2.2.0 stack and on the vllm-plugin-FL release tag
      v0.2.2-rc2.post2 (214804a, head of 0.2.2-rc2). Both layers move at once:
      the stack brings the 2.2.0 base and runtime, with FlagGems 5.4.0-rc2.post3
      and FlagTree 0.6.1+metax3.6, and the plugin now comes from a released tag
      rather than a pre-merge commit — an immutable pin, and one wheel served by
      every vendor index.
    reason_zh: |-
      改用 FlagOS 2.2.0 stack 与 vllm-plugin-FL 发布 tag v0.2.2-rc2.post2（214804a，0.2.2-rc2 的 head）重建。两层同时变动：stack 带来 2.2.0 的 base 与 runtime，含 FlagGems 5.4.0-rc2.post3 与 FlagTree 0.6.1+metax3.6；插件改为取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.2.2rc2.post1_gdb28502.d20260915
  entries:
  - date: "2026-09-15T10:39:50.037Z"
    reason: >-
      Rebuild on the vllm-plugin-FL 0.2.2-rc2 branch head db28502 — the tag
      v0.2.2-rc2.post1 plus two merged commits. The one that matters here is
      metax PR 333: reshape_and_cache_flash is routed through the flag_gems
