  entries:
  - date: ''
    reason: |-
      - First vllm 0.32.0 app image on hygon-dtk26.04: torch 2.10.0, triton 3.6.0, FlagTree 0.7.1a1+hcu3.6, FlagGems 5.4.0 (FlagOS 2.3.0 stack).
      - Installs the native plugin wheel `0.5.0.dev0+g4856534.d20261125.dtk26.4` (commit 4856534 on the vllm-plugin-FL 0.5.0-dev branch): it carries `vllm_fl._C`, whose `weak_ref_tensor` restores a real weak reference so vLLM's cudagraph capture no longer leaks VRAM per graph.
      - Adds `flaggems_vllm==0.3.0.dev20261123` as an app-layer dependency: the 0.5.0-dev plugin's FlagGems backend imports it for its core ops (silu/gelu/rotary/moe/attention/mla) and does not declare it.
    reason_zh: |-
      - hygon-dtk26.04 上 vllm 0.32.0 的首次交付：torch 2.10.0、triton 3.6.0、FlagTree 0.7.1a1+hcu3.6、FlagGems 5.4.0，基于 FlagOS 2.3.0 stack。
      - 安装原生插件 wheel `0.5.0.dev0+g4856534.d20261125.dtk26.4`（vllm-plugin-FL 0.5.0-dev 分支 4856534）：其中 `vllm_fl._C` 的 `weak_ref_tensor` 提供真正的弱引用，vLLM 的 cudagraph 捕获不再按图泄漏显存。
      - 新增 app 层依赖 `flaggems_vllm==0.3.0.dev20261123`：0.5.0-dev 插件的 FlagGems 后端为其核心算子（silu/gelu/rotary/moe/attention/mla）import 该包，但插件自身未声明它。
