image: vllm0.20.2-enflame-tops1.10.6
tags:
- tag: 2.1.2-0.2.2rc2.post1_gdcc8966.d20260916
  entries:
  - date: ''
    reason: >-
      Rebuild on the vllm-plugin-FL 0.2.2-rc2 branch head dcc8966 — PR 357, the
      first time the GCU300 work is on the release line. GCU attention moves off
      the plugin's standalone AttentionGCUBackend onto vLLM's native
      FlashAttentionBackend, reached through Enflame's flash_attn package (new
      impl/flash_attn_backend.py and impl/slot_mapping.py), and enflame.yaml's
      flagos_blacklist grows the int64-IR ops the GCU300 PassManager rejects plus
      the sampling sort/top-k path and argmax, which go back to torch_gcu. The
      images were previously built from the pre-merge enflame branch (c2e496d),
      whose commits never reached this line. The wheel version base follows the
      branch's own version (0.2.2rc2.post1), as the metax 0.20.2 images do.
    upstream_prs: []
- tag: 2.1.2-0.2.1_gc2e496d.d20260905
  entries:
  - date: '2026-09-05T12:54:19Z'
    reason: Initial 0.20.2 deliverable on GCU300 (tops1.10.6). vllm-plugin-FL rotary-guard-ordering (c2e496d)
      guards the rotary flash_attn import in the gcu patches so engine start no longer hard-depends on
      triton_gcu; repacked vllm wheel pins xgrammar==0.2.3+flagos (an earlier loose pin pulled triton
      3.8.0 over the runtime's). F/T both serve correctly (Paris anchor).
    upstream_prs: []
