image: vllm0.20.2-tsingmicro-tsm260610
tags:
- tag: 2.1.2-0.2.1_g90ffdf0.d20260912
  entries:
  - date: "2026-09-13T07:07:04.279Z"
    reason: >-
      Initial vllm 0.20.2 deliverable on tsingmicro TSM 260610 (Tsingmicro
      TX8110). TX8110 computes the flag_gems attention, rms_norm and
      rotary_embedding kernels silently wrong, so attention runs through
      torch SDPA with plain-index KV writes and the other two fall back to
      reference; the triton copy/cast kernels are blacklisted because they
      hang on dtype-changing casts during sampling. F/T dual-compiler serve
      plus inference E2E verified, both paths token-identical on the anchor
      prompts.
    upstream_prs:
    - https://github.com/flagos-ai/vllm-plugin-FL/pull/489
