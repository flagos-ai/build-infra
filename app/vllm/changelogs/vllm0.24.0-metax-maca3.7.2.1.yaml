image: vllm0.24.0-metax-maca3.7.2.1
tags:
- tag: 2.3.0-0.3.0
  entries:
  - date: '2026-10-26T23:17:22.648Z'
    reason: |-
      - The runtime introduces two container-start flags,
        `-e FLAGTREE_VERSION=<ver|latest>` and `-e FLAGGEMS_VERSION=<ver|latest>`,
        which override the compiler and FlagGems versions baked into the image. A
        request that cannot be honoured stops the container instead of letting it
        run on another version.
      - flagcx 0.14.0 is now a runtime dependency, pinned as
        flagcx==0.14.0+maca3.7.2.1.
      - This backend installs the native plugin build `0.3.0+maca3.7.2.1`: it
        carries `vllm_fl._C` and registers `weak_ref_tensor` on the CUDA
        dispatch key, without which vLLM's cudagraph capture leaks VRAM
        per captured graph.
    reason_zh: |-
      - runtime 引入两个容器启动期 flag，
        `-e FLAGTREE_VERSION=<ver|latest>` 与 `-e FLAGGEMS_VERSION=<ver|latest>`，
        用于覆盖镜像内烘焙的编译器与 FlagGems 版本。无法满足的请求会终止容器，
        而不是让它跑在另一个版本上。
      - flagcx 0.14.0 现为 runtime 依赖，pin 为
        flagcx==0.14.0+maca3.7.2.1。
      - 本后端安装原生插件构建 `0.3.0+maca3.7.2.1`：它带有 `vllm_fl._C`，
        并在 CUDA dispatch key 上注册 `weak_ref_tensor`；缺少它时 vLLM 的
        cudagraph 捕获会按每个捕获的 graph 泄漏 VRAM。
    upstream_prs: []
- tag: 2.2.0-0.3.0
  entries:
  - date: '2026-09-28T14:06:04.825Z'
    reason: >-
      The 0.24.0 line moves to the vllm-plugin-FL formal release v0.3.0 (tag = commit
      f105277). The plugin now ships as the release version (vllm-plugin-fl==0.3.0,
      one py3-none-any wheel, sha adf5a9e3...451f62, on every vendor index) instead
      of the v0.3.0-rc2.post2 delivery tag. Same stack and app pins as the rc2.post2
      image it replaces; the only delta is the formal release of the same code.
    reason_zh: |-
      0.24.0 线迁移到 vllm-plugin-FL 正式发布版 v0.3.0（tag = commit f105277）。插件现在以发布版本交付（vllm-plugin-fl==0.3.0，单个 py3-none-any wheel，sha adf5a9e3...451f62，每个 vendor index 都有），此前用的是 v0.3.0-rc2.post2 交付 tag。stack 与 app pin 与被替代的 rc2.post2 镜像相同；唯一差别是同一份代码的正式发布。
    upstream_prs: []
- tag: 2.2.0-0.3.0rc2.post2
  entries:
  - date: '2026-09-20T09:55:46.608Z'
    reason: >-
      This moves the image from 990a8f7, one commit past v0.3.0-rc2.post1, onto the
      release tag itself. Rebuilt on the FlagOS 2.2.0 stack, whose base and runtime
      carry FlagGems 5.4.0-rc2.post3, and on the vllm-plugin-FL release tag
      v0.3.0-rc2.post2 (0891073, head of 0.3.0-rc2): the plugin comes from a
      released tag rather than a pre-merge commit — an immutable pin, and one wheel
      served by every vendor index.
    reason_zh: |-
      本镜像从 990a8f7（v0.3.0-rc2.post1 之后的一个 commit）移到发布 tag 本身。改用 FlagOS 2.2.0 stack（其 base 与 runtime 携带 FlagGems 5.4.0-rc2.post3）与 vllm-plugin-FL 发布 tag v0.3.0-rc2.post2（0891073，0.3.0-rc2 的 head）重建：插件取自发布 tag 而非合并前的 commit——不可变 pin，且每个 vendor index 提供同一个 wheel。
    upstream_prs: []
- tag: 2.1.2-0.3.0rc2.post1_g990a8f7.d20260916
  entries:
  - date: '2026-09-16T10:30:23.009Z'
    reason: >-
      Rebuild on the vllm-plugin-FL 0.3.0-rc2 branch head 990a8f7 — PR 377, the
      metax 0.24.0 enablement this image was waiting on, now on the release line.
      The four compatibility fixes that previously had to be applied to
      site-packages by hand live in the plugin: a new metax
      patches/vllm024_compat.py redefines the triton _load_ptr (_load_ptr's
      tl.pointer_type called with a constexpr element type, which metax triton
      3.0.0 rejects — unwrapped via elem_dtype.value) and _penalties_kernel (the
      chained boolean use_rep_penalty or use_freq_penalty or use_pres_penalty
      parenthesized for the same compiler), and moves the SamplingStates
      get_top_k_top_p / PoolingRunner.pool indexing onto CPU because metax UVA
      views are CPU-typed tensors; the gdn_linear_attn import of
      GatedDeltaNetAttention is version-gated (0.24 moved it to mamba/gdn/base.py)
      and the fused_moe router guards its ROCm-only aiter imports (0.24 dropped
      fused_moe.rocm_aiter_fused_moe). __init__.py adds _patch_torch_accelerator,
      binding the torch.cuda memory-stats APIs MACA's partial torch.accelerator
      lacks; fa_utils.py takes reshape_and_cache_flash from flag_gems, as the
      0.20.2 fix does (the empty wheel has no compiled _C_cache_ops). The
      previous image pinned 5c511da, a commit on PR 377's pre-merge branch that
      is not the tip of any branch or tag upstream, so no named plugin ref can
      rebuild it. The wheel version base follows the branch's own version
      (0.3.0rc2.post1), as the other 0.24.0 backends do.
    reason_zh: |-
      改用 vllm-plugin-FL 0.3.0-rc2 分支 head 990a8f7 重建——PR 377，本镜像一直等待的 metax 0.24.0 使能，现已进入发布线。此前必须手工打进 site-packages 的四个兼容修复现已内置于插件：新增的 metax patches/vllm024_compat.py 重定义了 triton 的 _load_ptr（_load_ptr 的 tl.pointer_type 以 constexpr 元素类型调用，metax triton 3.0.0 会拒绝，通过 elem_dtype.value 解包）与 _penalties_kernel（链式布尔 use_rep_penalty or use_freq_penalty or use_pres_penalty 针对同一编译器加括号），并把 SamplingStates 的 get_top_k_top_p / PoolingRunner.pool 索引移到 CPU，因为 metax 的 UVA view 是 CPU 类型 tensor；gdn_linear_attn 对 GatedDeltaNetAttention 的 import 做了版本门控（0.24 把它移到了 mamba/gdn/base.py），fused_moe 的 router 也守住了它仅 ROCm 的 aiter import（0.24 去掉了 fused_moe.rocm_aiter_fused_moe）。__init__.py 新增 _patch_torch_accelerator，绑定 MACA 那个不完整的 torch.accelerator 所缺的 torch.cuda 内存统计 API；fa_utils.py 从 flag_gems 取 reshape_and_cache_flash，与 0.20.2 的修复一致（空 wheel 没有编译出的 _C_cache_ops）。前一个镜像 pin 的是 5c511da，PR 377 合并前分支上的一个 commit，它不是上游任何分支或 tag 的 tip，因此没有具名的插件 ref 能重建它。wheel 的版本基址跟随分支自身版本（0.3.0rc2.post1），与其他 0.24.0 后端一致。
    upstream_prs: []
- tag: 2.1.2-0.2.1_g5c511da.d20260901
  entries:
  - date: 2026-09-03T01:24:31Z
    reason: >-
