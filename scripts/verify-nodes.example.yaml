# Backend -> local SSH alias map for the verify debug-loop.
#
# Copy to scripts/verify-nodes.local.yaml (git-ignored) and edit to match
# your ~/.ssh/config aliases. The committed file is only a template; the loop
# falls back to DEFAULT_NODES in verify-debug-loop when neither file exists,
# and the local file overrides the example.
#
# All aliases hop through bastion.aiops.baai.ac.cn (Port 2224). Rule 22: after
# ssh, `su -` to a non-root user (secure/tengqm) before acting on the node.

