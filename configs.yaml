# FlagOS build configuration.
#
# Single source of truth for all vendor/backend dependencies and build
# settings. Used by scripts/build_base.py and scripts/build_runtime.py.
#
# Stack-level fields:
#   version:  release version (e.g. "2.1.1") — seeds all base image tags.
#   flaggems: FlagGems wheel version for runtime builds — override with --flaggems.
#
# Base image naming convention:
#   {base_image_prefix}-{vendor}-{backend}:{version}
#   e.g. flagos-base-nvidia-cuda12.8:2.1.2
# All backends share the same flat tag during a release cycle; rebuilt
# images overwrite it. Whether a pushed image is stale is answered by
# scripts/base_image_status.py (OCI labels vs base/<name> Containerfile),
# not by a per-tag commit-count affix.
#
# Runtime image naming convention:
#   flagos-runtime-{vendor}-{backend}:{version}
#   e.g. flagos-runtime-nvidia-cuda12.8:2.1.2
#
# The PyPI index URL is auto-generated: pypi_base.format(vendor=<vendor>).
# Override per-backend with an explicit "index:" field if needed.
#
# Each vendor maps directly to its backends (backend name → backend spec).
# The backend name (e.g. "cuda12.8") matches base/{vendor}-{backend}.
#
# Backend spec fields:
#   "enabled:"         — false freezes the backend: it leaves every build matrix
#                        (base, runtime and the app images on it) while its spec,
#                        the images already on the registry and its docs stay.
#                        scripts/backend_enabled.py is the one resolver, shared
#                        by the build side and the status reports, so no two
#                        consumers can disagree about what is still built.
#                        A stack version bump does not lift the freeze: the
#                        frozen backend keeps the tag it was last built at, so
#                        the flat tag never claims a rebuild that did not
#                        happen. The record of WHY lives on the vendor's fact
#                        page (docs/vendors/) — this field is the mechanism.
#                        Absent = enabled; only a literal false freezes.
#   "extras:"          — FlagGems pyproject extra name, passed verbatim as the
#                        EXTRAS_GROUP build-arg (`pip install ".[<extras>]"`).
#                        Opaque to build-infra; the naming is owned by FlagGems.
#   "python:"          — Python version for the venv.
#   "cmake_backend:"   — FLAGGEMS_BACKEND for C++ extensions (only where supported).
#   "triton:"          — vendor Triton package(s).
#   "flagtree:"        — FlagTree package (preferred compiler).
#   "flagtree_daily:"  — this backend's distribution name on flagos-pypi-daily,
#                        which is what `-e FLAGTREE_VERSION=latest` installs.
#                        Declared, never derived from the vendor or backend
#                        key: the daily line names one project per backend
#                        (packaging/flagtree/backends.yaml `daily.dist_name`),
#                        and the two sets do not line up — ascend has two
#                        (one per CANN line), hygon's projects are `flagtree-hcu`
#                        (26.04) and `flagtree-hcu-dtk2610` (26.10) after
#                        FlagTree's own backend name, and cambricon /
#                        spacemit have no daily line at all. Absent =
#                        no daily line: `latest` refuses rather than guessing a
#                        name. The spelling here is what pip is handed, and pip
#                        canonicalizes it itself (PEP 503), so it need not match
#                        this row's `dist_name` character for character.
#   "triton_post_install:" — extra packages installed after Triton (COMPILER=triton).
#   "env:"             — environment split by which image consumes it:
#                          base:        vars baked into flagos-base-{vendor}-{backend}
#                          runtime:     vars baked into flagos-runtime-{vendor}-{backend}
#                          app:         per-app vars baked into
#                                       flagos-app/{app}{app_version}-{vendor}-{backend},
#                                       keyed by app name (vllm / sglang /
#                                       megatron_training / megatron_rl — the bare name;
#                                       deps_app keys carry the version).
#                                       The {vendor}-{backend} segment of an app image
#                                       is its app-layer public identity (app_public
#                                       below) — the app layer is published
#                                       vendor-neutral, base/runtime are not.
#                        base/runtime/app must mirror EXACTLY what the image sets —
#                        the source of truth for per-image env documentation.
#   "deps:"            — Python dependencies (torch stack, etc.).
#   "deps_app:"        — per-app vendor-conditional Python packages, keyed by
#                        app name + packaged version: megatron_training0.17.1 /
#                        megatron_rl0.17.1 / vllm<version> / sglang<version>.
#                        Every app is split per version — vllm/sglang per
#                        repacked version (vllm0.24.0 / vllm0.20.2 /
#                        sglang0.5.18), megatron per megatron-core release
#                        (megatron_training0.17.1, and 0.18.2 when it lands):
#                        each is verified independently and its empty wheel
#                        binds a CPython minor version.
#                        KEY PRESENCE = the backend is admitted to that app's
#                        build matrix. It does not assert verification: the
#                        app's own status matrix carries that (packaging/
#                        megatron/, packaging/vllm/, packaging/sglang/), and
#                        its launch_docs flag gates the launch page — so a key
#                        can be added to trigger a build whose result is still
#                        pending. Backends without a key neither build the app
#                        nor get a launch page.
#                        [] means "buildable, but has no vendor package".
#                        Public packages never appear here (they ride the
#                        wheel's extras, see packaging/megatron).
#                        The app's own wheel is NOT a deps_app entry — it is
#                        the app's identity and is carried by the Containerfile
#                        (e.g. MEGATRON_VERSION), not per-backend conditionality.
#                        Key presence also gates which app launch pages are
#                        generated (scripts/docs/gen_data.py) and which backends enter
#                        the app build matrix (scripts/generate_matrix.py --app).
#   "hardware:"        — chip models the image targets (rendered as a prerequisite).
#   "driver:"          — minimum host driver version required on the node — a
#                        prerequisite distinct from the in-container SDK. Probed
#                        from the vendor's smi tool (nvidia-smi, npu-smi, ...).

# FlagOS software stack version — the single anchor for the whole release.
# This version seeds all base image tags and the runtime Containerfile OCI labels.
# Runtime images also pull the corresponding FlagGems wheel version below.
#
# At release: bump both fields → git tag v<VERSION> → done.
version: "2.3.0"
flaggems: "5.4.0"

# Versions of build tools needed to compile the cpp operator wheel inside the
# runtime image.  Pinned so a future pip install won't silently pull an
# incompatible release.
flaggems_cpp_build_deps:
  - "setuptools>=64.0,<77"
  - "setuptools-scm>=8,<10"
  - "scikit-build-core==0.12.2"
  - "pybind11==3.0.3"
  - "cmake>=3.20,<4"
  - "ninja==1.13.0"

# Common Python packages installed in every runtime image before FlagGems.
# These are standard PyPI packages (not vendor-specific), installed from
# the mirror. pybind11 is a runtime dep of flagtree (ascend backend);
# ninja is needed for C++ extension builds; PyYAML is a FlagGems
# core dep that vendor torch packages import without declaring.
# numpy is pinned to 1.26.4 stack-wide — the safest version across all
# vendors' torch builds (Python 3.10-3.12 range). The opencv-python-headless
# numpy>=2 requirement was over-claimed; its wheel is runtime
# backward-compatible with numpy>=1.19, and the upgrade attempt broke many
# backends. torch is built against the numpy 1.x C ABI.
runtime_prereqs:
  - "pybind11==3.0.3"
  - "ninja==1.13.0"
  - "PyYAML==6.0.1"
  - "setuptools-scm>=8,<10"

base_image_prefix: "flagos-base"

pypi_base: "https://resource.flagos.net/repository/flagos-pypi-{vendor}/simple"
pypi_daily: "https://resource.flagos.net/repository/flagos-pypi-daily/simple"
mirror: "https://mirrors.cloud.tencent.com/pypi/simple"

# Which backend publishes a wheel to flagos-pypi-hosted, per (python, arch).
# Hosted holds one file per wheel (two backends on the same pair would
# overwrite each other under one filename), and it is the address the catalog
# and the site point users at, so the choice is declared, not derived.
# {python: {arch: backend}}; a pair with no entry has no hosted publisher.
wheel_hosted_publishers:
  "3.10":
    x86_64: hygon-dtk26.04
  "3.11":
    aarch64: ascend-cann9.0.0
  "3.12":
    x86_64: nvidia-cuda13.3
    aarch64: ascend-cann9.2.1

# App-layer public identity — how a vendor's app images are NAMED and SHOWN.
# App images and their launch pages are published vendor-neutral: the app image
# tag, the app catalog, the launch page, and the per-image changelog all carry
# this identity instead of the chip brand. Only the app layer: base and runtime
# images keep the real {vendor}-{backend} they are built and pushed under, and
# an app page still prints the runtime image it was built on, verbatim.
#
#   vendor:         public vendor slug (app image tag + catalog "code" column)
#   vendor_{en,zh}: the vendor name the app catalog prints
#   drop:           tokens removed from the backend segment of the app name
#                   (cuda 字样直接删除 — cuda12.8 -> 12.8)
#   model_{en,zh}:  the generic model the app page prints in place of this
#                   backend's `hardware:` — a model, not a SKU
#
# A vendor absent here is published under its own name (app_name == backend key).
# Note: this `generic` is unrelated to the `generic` launch tier in
# .github/build-config.yml `run` (a plain `docker run` with no device flags).
app_public:
  nvidia:
    vendor: generic
    vendor_en: Generic
    vendor_zh: 通用
    drop: [cuda]
    model_en: Generic GPU
    model_zh: 通用 GPU

vendors:
  amd:
    rocm7.2.4:
      extras: amd
      hardware: ["AMD Radeon PRO W7900"]   # gfx1100, RDNA3
      driver: "6.16.13"
      python: "3.12"
      # No cmake_backend: FlagGems has no ROCm/HIP C++ backend yet
      # (release_flaggems.py VENDOR_MAP has no HIP/ROCM). Revisit when it lands.
      # cmake_backend: hip
      
      # torch==2.13.0+rocm7.2 Requires-Dist triton-rocm==3.7.1, not triton.
      # Source: https://download.pytorch.org/whl/rocm7.2/triton-rocm/
      # (triton_rocm-3.7.1-cp312-cp312-linux_x86_64.whl).
      triton: triton-rocm==3.7.1
      # Bundles triton 3.6.0: there is no amd3.7 FlagTree tag yet, and torch
      # 2.13's floor is 3.6 (_TRITON_MINIMUM_VERSION_MINOR), so the two hold.
      flagtree: flagtree==0.7.0+amd3.6
      flagtree_daily: flagtree-amd
      env:
        base:
          # Mirrors ENV from base image. No HIP_VISIBLE_DEVICES: HIP 7.2 takes
          # ordinals or GPU-UUIDs only, so "all" enumerates zero devices.
          ROCM_PATH: /opt/rocm
          PATH: /opt/rocm/bin:$PATH
          LD_LIBRARY_PATH: /opt/rocm/lib
        runtime:
          # TransformerEngine's default GEMM backend is hipBLASLt, and on
          # gfx1100 it has no bias-gradient-fused wgrad kernel: a
          # TransformerLayer backward dies with "Unable to find any suitable
          # algorithms" in layernorm_linear.py's wgrad_gemm (the same call
          # without `bias` is fine). TE's own Triton GEMM backend clears it
          # (finite-difference gradcheck rel_err ~2e-06), and it works under
          # this image's default flagtree compiler as well as /opt/triton --
          # both were checked on the W7900 node. Baked in rather than left to
          # every consumer to remember; see docs/vendors/amd.md.
          NVTE_GEMM_BACKEND: TRITON
      deps:
        - torch==2.13.0+rocm7.2
        - torchaudio==2.11.0+rocm7.2
        - torchvision==0.28.0+rocm7.2
        - numpy==1.26.4
        # The installed flagcx, not the copy triton/_C bundles: FlagTree prefers
        # the package's libflagcx.so, and a local label needs an exact pin.
        - flagcx==0.14.1+rocm7.2.4
        # The base image keeps only ROCm's amdsmi source tree — never pip-installed,
        # and the amd-smi CLI does not expose the Python API.
        - amdsmi==7.0.2
      deps_app:
        # The 0.5.0-dev plugin's FlagGems provider hard-imports flaggems_vllm
        # (activation/rotary/moe/mla); no runtime image ships it.
        vllm0.32.0:
          - flaggems_vllm==0.3.0.dev20261126
      sdk:
        # apt-native from repo.radeon.com, no filestore
        - ROCm 7.2.4 (x86_64)

  nvidia:
    # Frozen 2026-11-05, not deleted: torch 2.13 publishes no cu128 wheel (the
    # cu128 track tops out at 2.11.0), so this line cannot follow the stack's
    # torch and its reason to exist has gone. Its images, docs and app lines
    # stay as published — the freeze only drops it from the build matrices.
    # Its images therefore stay at the 2.3.0 tag the freeze happened under:
    # a later stack version bump must not be read as covering this line.
    # Why and what replaced it: docs/vendors/nvidia.md.
    cuda12.8:
      enabled: false
      extras: nvidia-cuda128
      hardware: ["NVIDIA H20"]   # TODO: add other validated NVIDIA GPUs
      driver: "610.43.02"
      python: "3.12"
      cmake_backend: CUDA
      triton: triton==3.6.0
      flagtree: flagtree==0.7.0
      flagtree_daily: flagtree-nvidia
      env:
        base:
          # Effective env — inherited verbatim from nvcr 12.8.0-runtime-ubuntu24.04
          # (our layer adds no ENV of its own). Re-verify against nvcr on version bump.
          PATH: /usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64
          NVIDIA_VISIBLE_DEVICES: all
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        app:
          vllm:
            # vLLM 0.24.0 unconditionally imports flashinfer (sampler switch
            # defaults to True). The runtime does not ship flashinfer — turn
            # the sampler off at the app layer.
            VLLM_USE_FLASHINFER_SAMPLER: "0"
      deps:
        - torch==2.10.0+cu128
        - torchaudio==2.10.0+cu128
        - torchvision==0.25.0+cu128
        - numpy==1.26.4
        # 0.7.0's flagcx resolution prefers the flagcx wheel package's
        # libflagcx.so (PR #1266); without it, triton/_C/libflagcx.so (the
        # flagtree-bundled one) is the fallback, and that is not the library a
        # runtime should run collectives with. The +cuda12.8 wheel links
        # libcudart.so.12, present in this image.
        - flagcx==0.14.0+cuda12.8
      deps_app:
        megatron_training0.17.1: []
        megatron_training0.18.2: []
        # flash-attn is a hard dependency of the RL dynamic engine
        # (attention.py flash_attn_with_kvcache assertion, ≥2.7.3 gate). The
        # wheel is source-built (packaging/flash-attn/Containerfile) with the
        # ABI locked to this backend's torch: build-time torch must equal the
        # runtime torch, hence the per-backend +fl.cu128.torch210 tag.
        megatron_rl0.17.1:
          - flash_attn==2.8.3.post1+fl.cu128.torch210
        # rl deps re-verified for 0.18.2: same flash-attn ABI pins hold
        # (0.18.2 rl extra still pins flash_attn_with_kvcache; per MLF #114/#189).
        megatron_rl0.18.2:
          - flash_attn==2.8.3.post1+fl.cu128.torch210
        vllm0.20.2: []
        vllm0.24.0: []
      sdk:
        - CUDA 12.8 (x86_64)

    cuda13.3:
      extras: nvidia-cuda133
      hardware: ["NVIDIA H20"]   # TODO: add other validated NVIDIA GPUs
      driver: "610.43.02"
      python: "3.12"
      cmake_backend: CUDA
      # torch 2.13 declares `triton==3.7.1`, so the T path moves with it (amd's
      # rocm row is the same move: triton-rocm==3.7.1). Source:
      # https://download.pytorch.org/whl/cu130/triton/
      triton: triton==3.7.1
      # 0.7.0 links its flagcx against the flagcx wheel's libflagcx.so (PR
      # #1266), not triton/_C/libflagcx.so (libcudart.so.12, absent on CUDA 13) —
      # the flagcx wheel for cuda13.3 (flagcx-0.14.1+cuda13.3) is a dep.
      # Unchanged by the torch bump: FlagTree bundles its own triton, so the
      # pin above moves only the T path. Verify the pair on-node in the same
      # rebuild (amd's rocm row carries the same flagtree 0.7.0 / triton 3.7.1
      # pairing).
      flagtree: flagtree==0.7.0
      flagtree_daily: flagtree-nvidia
      env:
        base:
          # Effective env — inherited verbatim from nvcr 13.3.0-runtime-ubuntu24.04
          # (our layer adds no ENV of its own). Re-verify against nvcr on version bump.
          PATH: /usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
          NVIDIA_VISIBLE_DEVICES: all
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        runtime:
          # flag_gems 5.4.0rc2.post3's FlagTune cost model probes flagtree's
          # exception contract. The 0.6.x flagtree here ships a partial flagtune
          # (no runtime/errors.py), so its errors are outside the fallback set and
          # abort the operator instead of degrading. Verified on-node.
          USE_FLAGTUNE_COST_MODEL: "0"
        app:
          vllm:
            # vLLM 0.24.0 unconditionally imports flashinfer (sampler switch
            # defaults to True). The runtime does not ship flashinfer — turn
            # the sampler off at the app layer.
            VLLM_USE_FLASHINFER_SAMPLER: "0"
      deps:
        - torch==2.13.0+cu130
        # Stays at 2.11.0: the cu130 index carries no newer torchaudio, and the
        # 2.11.0 wheel declares no requires-dist at all, so it is version-
        # independent of the torch above.
        - torchaudio==2.11.0+cu130
        - torchvision==0.28.0+cu130
        - numpy==1.26.4
        # 0.7.0's flagcx resolution prefers the flagcx wheel package's
        # libflagcx.so (PR #1266); without it, triton/_C/libflagcx.so (which
        # links libcudart.so.12, absent here) is the fallback and the TLE
        # import OSError from #1234 returns. The +cuda13.3 wheel links
        # libcudart.so.13, present in this image. The 0.14.0 wheel was built
        # against pre-2.13 headers, where c10's materialize_cow_storage still
        # existed; torch 2.13 replaced it with materialize_cow, and flagcx is a
        # privateuse1 backend torch auto-loads, so the undefined symbol broke
        # `import torch` itself. The wheel's build env is the flagcx builder
        # image, whose torch pin is read from this same deps list — that image
        # rebuilds first.
        - flagcx==0.14.1+cuda13.3
      deps_app:
        megatron_training0.17.1: []
        megatron_training0.18.2: []
        # flash-attn wheel source-built with ABI locked to torch 2.13.0+cu130
        # (build-time torch == runtime torch; see cuda12.8 comment).
        megatron_rl0.17.1:
          - flash_attn==2.8.3.post1+fl.cu130.torch213
        # rl deps re-verified for 0.18.2: same ABI pins hold on cuda13.3.
        megatron_rl0.18.2:
          - flash_attn==2.8.3.post1+fl.cu130.torch213
        vllm0.20.2: []
        vllm0.24.0: []
        # The 0.5.0-dev plugin's FlagGems provider hard-imports flaggems_vllm
        # (activation/rotary/moe/mla); no runtime image ships it.
        # numpy + ml-dtypes pins, both required: tilelang (a vllm 0.32
        # dependency) resolves ml-dtypes 0.7.0, which requires numpy>=2 and is
        # built against NumPy 2.0's C-API, so the vllm install alone floats
        # numpy off the runtime's 1.26.4 pin (matrix gate) — and holding numpy
        # at 1.26.4 without this pair fails the ml_dtypes import instead.
        # ml-dtypes alone is not enough: installed afterwards, it downgrades
        # itself but leaves numpy at 2.x (nothing else then constrains it).
        # 0.5.4 accepts numpy>=1.26 on py3.12, so the runtime pin holds.
        vllm0.32.0:
          - flaggems_vllm==0.3.0.dev20261126
          - ml-dtypes==0.5.4
          - numpy==1.26.4
      sdk:
        - CUDA 13.3 (x86_64)

    # Experimental, not yet a supported line: the toolkit is 13.0.3 rather than
    # 13.3 so the CUDA minor matches what the cu130 wheels (torch 2.13.0+cu130
    # and the third-party packages vLLM pulls in) were compiled against. CUDA
    # minor-version compatibility runs forward only, so a base newer than the
    # wheels' target is the direction that breaks.
    # No `extras:` yet: it only feeds build_bundle's extras install and the
    # name is FlagGems's to publish; add it when this line is formalised.
    cuda13.0.3:
      hardware: ["NVIDIA H20"]
      driver: "610.43.02"
      python: "3.12"
      cmake_backend: CUDA
      triton: triton==3.7.1
      flagtree: flagtree==0.7.0
      flagtree_daily: flagtree-nvidia
      env:
        base:
          # Inherited from nvcr 13.0.3-runtime-ubuntu24.04 — our layer sets no
          # ENV of its own. Same shape as the 13.3 line; confirm against the
          # built image as part of the verify pass.
          PATH: /usr/local/nvidia/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          LD_LIBRARY_PATH: /usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
          NVIDIA_VISIBLE_DEVICES: all
          NVIDIA_DRIVER_CAPABILITIES: compute,utility
        runtime:
          # Same reason as the 13.3 line: flagtree 0.7.0 ships a partial
          # flagtune (no runtime/errors.py) and flag_gems' cost model aborts the
          # operator on errors outside its fallback set.
          USE_FLAGTUNE_COST_MODEL: "0"
        app:
          vllm:
            VLLM_USE_FLASHINFER_SAMPLER: "0"
      deps:
        - torch==2.13.0+cu130
        - torchaudio==2.11.0+cu130
        - torchvision==0.28.0+cu130
        - numpy==1.26.4
        # This line's own build: compiled in its builder against the 2204 NCCL
        # this CUDA minor ships, so the wheel and the toolkit agree.
        - flagcx==0.14.1+cuda13.0.3
      sdk:
        - CUDA 13.0.3 (x86_64)

  ascend:
    cann8.5.0:
      extras: ascend-cann850
      hardware: ["Ascend 910B"]   # TODO: confirm 910C
      driver: "25.5.0"
      python: "3.11"
      cmake_backend: NPU
      triton: triton-ascend==3.2.0
      flagtree: flagtree==0.6.0+ascend3.2
      flagtree_daily: flagtree-ascend-cann8-5-0
      env:
        app:
          sglang:
            # flag_gems OFF for cann8.5.0, measured 2026-09-07: the per-op
            # blacklist (21 ops in plugin ascend.yaml incl. the pow family)
            # clears every crash/compile-error path, but with flag_gems ON
            # generation stays pathologically slow (~0.05 tok/s vs ~10.2 OFF;
            # AICore ~83% busy, no named kernel) — a flagtree 0.6.0+ascend3.2
            # codegen efficiency defect with no discrete op left to blacklist.
            # So cann8.5.0 follows the cann9.0.0 baseline (USE_FLAGGEMS=0).
            USE_FLAGGEMS: "0"
            TORCHINDUCTOR_COMPILE_THREADS: "1"
            SGLANG_IS_FLASHINFER_AVAILABLE: "false"
            SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK: "1"
      deps:
        - torch==2.9.0+cpu
        - torch-npu==2.9.0
        - torchvision==0.24.0
        - torchaudio==2.9.0
        - numpy==1.26.4
        # tbe imports these at module load and CANN does not declare them.
        - ml-dtypes==0.4.1
        - scipy==1.17.1
        # ms-service-profiler's vllm plugin needs these; the SDK omits them.
        - opentelemetry-exporter-otlp-proto-grpc==1.45.2
