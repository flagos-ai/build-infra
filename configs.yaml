# FlagOS build configuration.
#
# Single source of truth for all vendor/backend dependencies and build
# settings. Used by scripts/build_base.py and scripts/build_runtime.py.
#
# Stack-level fields:
#   version:  release version (e.g. "2.1.1") — seeds all base image tags.
#   flaggems: FlagGems wheel version for runtime builds — override with --flaggems.
#
# Base image naming convention:
#   {base_image_prefix}-{vendor}-{backend}:{version}
#   e.g. flagos-base-nvidia-cuda12.8:2.1.2
# All backends share the same flat tag during a release cycle; rebuilt
# images overwrite it. Whether a pushed image is stale is answered by
# scripts/base_image_status.py (OCI labels vs base/<name> Containerfile),
# not by a per-tag commit-count affix.
#
# Runtime image naming convention:
#   flagos-runtime-{vendor}-{backend}:{version}
#   e.g. flagos-runtime-nvidia-cuda12.8:2.1.2
#
# The PyPI index URL is auto-generated: pypi_base.format(vendor=<vendor>).
# Override per-backend with an explicit "index:" field if needed.
#
# Each vendor maps directly to its backends (backend name → backend spec).
# The backend name (e.g. "cuda12.8") matches base/{vendor}-{backend}.
#
# Backend spec fields:
#   "extras:"          — FlagGems pyproject extra name, passed verbatim as the
#                        EXTRAS_GROUP build-arg (`pip install ".[<extras>]"`).
#                        Opaque to build-infra; the naming is owned by FlagGems.
#   "python:"          — Python version for the venv.
#   "cmake_backend:"   — FLAGGEMS_BACKEND for C++ extensions (only where supported).
#   "triton:"          — vendor Triton package(s).
#   "flagtree:"        — FlagTree package (preferred compiler).
#   "triton_post_install:" — extra packages installed after Triton (COMPILER=triton).
#   "env:"             — environment split by which image consumes it:
#                          base:        vars baked into flagos-base-{vendor}-{backend}
#                          runtime:     vars baked into flagos-runtime-{vendor}-{backend}
#                          app:         per-app vars baked into
#                                       flagos-app/{app}-{vendor}-{backend}, keyed by
#                                       app name (vllm / megatron_training / megatron_rl)
#                        base/runtime/app must mirror EXACTLY what the image sets —
#                        the source of truth for per-image env documentation.
#   "deps:"            — Python dependencies (torch stack, etc.).
#   "deps_app:"        — per-app vendor-conditional Python packages, keyed by
#                        app name: megatron_training / megatron_rl /
#                        vllm<version>. vllm is split per repacked version
#                        (vllm0.24.0 / vllm0.20.2): each is verified
#                        independently and its empty wheel binds a CPython
#                        minor version.
#                        KEY PRESENCE = the app is VERIFIED on this backend
#                        (per the verification matrices in packaging/megatron/
#                        docs/ and packaging/vllm/docs/). Backends without a
#                        key neither build the app nor get a launch page.
#                        [] means "verified, but has no vendor package".
#                        Public packages never appear here (they ride the
#                        wheel's extras, see packaging/megatron).
#                        The app's own wheel is NOT a deps_app entry — it is
#                        the app's identity and is carried by the Containerfile
#                        (e.g. MEGATRON_VERSION), not per-backend conditionality.
#                        Key presence also gates which app launch pages are
#                        generated (docs/gen_data.py) and which backends enter
#                        the app build matrix (scripts/generate_matrix.py --app).
#   "hardware:"        — chip models the image targets (rendered as a prerequisite).
#   "driver:"          — host driver version installed on the node — a prerequisite,
#                        distinct from the in-container SDK. Probed from the vendor's
#                        smi tool (nvidia-smi, npu-smi, ...).

# FlagOS software stack version — the single anchor for the whole release.
# This version seeds all base image tags and the runtime Containerfile OCI labels.
# Runtime images also pull the corresponding FlagGems wheel version below.
#
# At release: bump both fields → git tag v<VERSION> → done.
version: "2.1.2"
flaggems: "5.3.5"

# Versions of build tools needed to compile the cpp operator wheel inside the
# runtime:v1 container.  Pinned so a future pip install won't silently pull an
# incompatible release.
flaggems_cpp_build_deps:
  - "setuptools>=64.0,<77"
  - "setuptools-scm>=8,<10"
  - "scikit-build-core==0.12.2"
  - "pybind11==3.0.3"
  - "cmake>=3.20,<4"
  - "ninja==1.13.0"

# Common Python packages installed in every runtime image before FlagGems.
# These are standard PyPI packages (not vendor-specific), installed from
# the mirror. pybind11 is a runtime dep of flagtree (ascend backend);
# ninja is needed for C++ extension builds; PyYAML is a FlagGems
# core dep that vendor torch packages import without declaring.
# numpy is pinned to 1.26.4 stack-wide — the safest version across all
# vendors' torch builds (Python 3.10-3.12 range). The opencv-python-headless
# numpy>=2 requirement was over-claimed; its wheel is runtime
# backward-compatible with numpy>=1.19, and the upgrade attempt broke many
# backends. torch is built against the numpy 1.x C ABI.
runtime_prereqs:
  - "pybind11==3.0.3"
  - "ninja==1.13.0"
  - "PyYAML==6.0.1"
  - "setuptools-scm>=8,<10"

base_image_prefix: "flagos-base"

pypi_base: "https://resource.flagos.net/repository/flagos-pypi-{vendor}/simple"
pypi_daily: "https://resource.flagos.net/repository/flagos-pypi-daily/simple"
mirror: "https://mirrors.aliyun.com/pypi/simple"

vendors:
  nvidia:
    cuda12.8:
      extras: nvidia-cuda128
      hardware: ["NVIDIA H20"]   # TODO: add other validated NVIDIA GPUs
      driver: "610.43.02"
      python: "3.12"
      cmake_backend: CUDA
      triton: triton==3.6.0
      flagtree: flagtree==0.6.1
      env:
        base:
          PATH: /usr/local/cuda/bin:$PATH
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH
        app:
          vllm:
            # vLLM 0.24.0 unconditionally imports flashinfer (sampler switch
            # defaults to True). The runtime does not ship flashinfer — turn
            # the sampler off at the app layer.
            VLLM_USE_FLASHINFER_SAMPLER: "0"
      deps:
        - torch==2.10.0+cu128
        - torchaudio==2.10.0+cu128
        - torchvision==0.25.0+cu128
        - numpy==1.26.4
      deps_app:
        megatron_training: []
        # flash-attn is a hard dependency of the RL dynamic engine
        # (attention.py flash_attn_with_kvcache assertion, ≥2.7.3 gate). The
        # wheel is source-built (packaging/flash-attn/Containerfile) with the
        # ABI locked to this backend's torch: build-time torch must equal the
        # runtime torch, hence the per-backend +fl.cu128.torch210 tag.
        megatron_rl:
          - flash_attn==2.8.3.post1+fl.cu128.torch210
        vllm0.20.2: []
        vllm0.24.0: []
      sdk:
        - CUDA 12.8 (x86_64)

    cuda13.3:
      extras: nvidia-cuda133
      hardware: ["NVIDIA H20"]   # TODO: add other validated NVIDIA GPUs
      driver: "610.43.02"
      python: "3.12"
      cmake_backend: CUDA
      triton: triton==3.6.0
      flagtree: flagtree==0.6.1
      env:
        base:
          PATH: /usr/local/cuda/bin:$PATH
          LD_LIBRARY_PATH: /usr/local/cuda/lib64:$LD_LIBRARY_PATH
        app:
          vllm:
            # vLLM 0.24.0 unconditionally imports flashinfer (sampler switch
            # defaults to True). The runtime does not ship flashinfer — turn
            # the sampler off at the app layer.
            VLLM_USE_FLASHINFER_SAMPLER: "0"
      deps:
        - torch==2.11.0+cu130
        - torchaudio==2.11.0+cu130
        - torchvision==0.26.0+cu130
        - numpy==1.26.4
      deps_app:
        megatron_training: []
        # flash-attn wheel source-built with ABI locked to torch 2.11.0+cu130
        # (build-time torch == runtime torch; see cuda12.8 comment).
        megatron_rl:
          - flash_attn==2.8.3.post1+fl.cu130.torch211
        vllm0.20.2: []
        vllm0.24.0: []
      sdk:
        - CUDA 13.3 (x86_64)

