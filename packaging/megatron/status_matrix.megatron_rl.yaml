# Status matrix — megatron_rl app image
#
# Structured twin of the human-readable matrix in
# packaging/megatron/docs/megatron-verification-matrix.md. Schema and status
# legend: docs/status-matrix.md. scripts/render_status_matrix.py renders this
# file into the md's marker blocks; keep marker blocks in sync.
#
# Cell symbols: ✅ = 已验证通过 / ❌ = 已屏蔽/失败有结论 / ⛔ = 挂起（上游阻塞）
# / ⏸ = 暂停（app 线降级/搁置，非验证失败——megatron_rl 转向 verl） / ？ =
# 成功概率不确定 / ⬜ = 待验证 / — = 该后端无此编译器。
# Column suffix: T = Triton 编译器, F = FlagTree 编译器.

type: megatron
app: megatron_rl
description: Megatron RL app image — megatron-core[rl] single-step install on
  the vendor runtime. 优先级调低：RL 框架转向 verl，除已通过后端外全场景暂停。
