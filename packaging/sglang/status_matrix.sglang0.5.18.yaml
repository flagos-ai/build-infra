# Status matrix — sglang0.5.18
#
# Structured twin of the human-readable matrix in
# packaging/sglang/docs/sglang-verification-matrix.md. Schema and status legend:
# docs/status-matrix.md. scripts/render_status_matrix.py renders this file
# into the md's marker blocks; keep marker blocks in sync.
#
# Cell symbols: ✅ = 已验证通过 / ❌ = 已屏蔽/失败有结论 / ⛔ = 挂起（上游阻塞）
# / ？ = 成功概率不确定 / ⬜ = 待验证 / — = 该后端无此编译器。
# Column suffix: T = Triton 编译器, F = FlagTree 编译器.
#
# 注：configs.yaml deps_app.sglang0.5.18 键存在 = 该后端 sglang app 可构建
# （有基础镜像）；非空项（如 metax 的 compressed-tensors pin）是 serve 硬
# 依赖，随 Containerfile APP_DEPS 安装。

type: sglang
app: sglang0.5.18
description: sglang 0.5.18 app — srt_empty 基座 +flagos wheel + sglang-plugin-FL
  单步安装于 vendor runtime（exp/0.5.18 分支插件）。
