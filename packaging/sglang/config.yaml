# ── Wheel Repack Classification Rules ────────────────────────────────
# Each key is a set of *package names* (no version, case-insensitive).
#
# Top-level rules (applied to sglang's own METADATA):
#   remove_torch_chain, remove_cuda_only, remove_orphaned
#
# Indirect-dep rules (applied to retained deps that declare torch/triton
# in their own METADATA — discovered automatically by repack_recursive):
#   strip_from_indirect
#
# sglang builds from the non-CUDA pyproject variant (srt_empty base) — the
# wheel's METADATA is torch-free / sglang-kernel-free by construction, so
# all rules below are empty: repack.py only stamps the +flagos local
# version and downgrades Metadata-Version (2.4 → 2.2, Nexus requirement).
# See docs/sglang-0.5.18/decisions.md §2.

# ── Top-level removal rules (applied to sglang's own METADATA) ──
remove_torch_chain: []

# NVIDIA / CUDA-only packages.
remove_cuda_only: []

# Packages whose only consumer was stripped above (no other consumers left).
remove_orphaned: []

# ── Indirect dependency stripping rules ───────────────────────────────
strip_from_indirect: []

# ── Per-package extra strip rules ─────────────────────────────────────
strip_extra_from_indirect: {}

# ── Per-package indirect version pins ──────────────────────────────────
pin_indirect: {}
