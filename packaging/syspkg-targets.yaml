  FlagTree-xpu:
    repo: FlagTree
    default_ref: ""
    default_version: ""
    publish_runs_on: ["self-hosted", "h20"]
    deb:
      script: packaging/debian/build-helpers/build-flagtree.sh
      base_arg: env
      script_arg: xpu
      outdir: dist/output
      arches: [amd64]
      images:
        ubuntu22.04: ubuntu:22.04

  FlagDNN:
    repo: FlagDNN
    # Tag v0.3.0 predates both the Ubuntu 22.04/24.04 DEB recipe and the
    # Fedora 43 / openEuler 24.03 RPM recipe (FlagDNN#26); pass inputs.ref
    # explicitly until the next release tag is cut.
    default_ref: ""
    default_version: ""
    require_tag_publish: true
    deb:
      script: packaging/debian/build-helpers/build-flag-dnn.sh
      base_arg: arg
      outdir: debian-packages
      arches: [amd64]
      deps: [libtriton-jit-nvidia, libtriton-jit-nvidia-dev]
      images:
        ubuntu22.04: nvidia/cuda:12.8.0-devel-ubuntu22.04
        ubuntu24.04: nvidia/cuda:12.8.0-devel-ubuntu24.04
    rpm:
      script: packaging/rpm/build-flag-dnn-rpm.sh
      base_arg: arg
      spec: packaging/rpm/specs/flag-dnn.spec
      outdir: rpm-packages
      arches: [x86_64]
      deps: [libtriton-jit-nvidia, libtriton-jit-nvidia-devel]
      images:
        fedora43: fedora:43
        openeuler24.03: openeuler/cuda:13.0.0-oe2403lts
        rhel9: nvidia/cuda:12.6.0-devel-rockylinux9

  FlagTensor:
    repo: FlagTensor
    # Tag v0.3.0 predates both the Ubuntu 22.04/24.04 DEB recipe and the
    # Fedora 43 / openEuler 24.03 RPM recipe (FlagTensor#35); pass inputs.ref
    # explicitly until the next release tag is cut.
    default_ref: ""
    default_version: ""
    require_tag_publish: true
    deb:
      script: packaging/debian/build-helpers/build-flagtensor.sh
      base_arg: arg
      outdir: debian-packages
      arches: [amd64]
      deps: [libtriton-jit-nvidia, libtriton-jit-nvidia-dev]
      images:
        ubuntu22.04: nvidia/cuda:12.8.0-devel-ubuntu22.04
        ubuntu24.04: nvidia/cuda:12.8.0-devel-ubuntu24.04
    rpm:
      script: packaging/rpm/build-flagtensor-rpm.sh
      base_arg: arg
      spec: packaging/rpm/specs/flagtensor.spec
      outdir: rpm-packages
      arches: [x86_64]
      deps: [libtriton-jit-nvidia, libtriton-jit-nvidia-devel]
      images:
        fedora43: fedora:43
        openeuler24.03: openeuler/cuda:13.0.0-oe2403lts
        rhel9: nvidia/cuda:12.6.0-devel-rockylinux9

  FlagFFT:
    repo: FlagFFT
    # Tag v0.2.0 predates the bundled triton_jit nlohmann-json 3.10.5 patch;
    # pass inputs.ref explicitly until the next release tag is cut.
    default_ref: ""
    default_version: ""
    require_tag_publish: true
    deb:
      script: packaging/debian/build-helpers/build-flagfft.sh
      base_arg: flag
      outdir: debian-packages
      arches: [amd64]
      images:
        ubuntu22.04: nvidia/cuda:12.8.0-devel-ubuntu22.04
        ubuntu24.04: nvidia/cuda:12.8.0-devel-ubuntu24.04
    rpm:
      script: packaging/rpm/build-flagfft-rpm.sh
      base_arg: flag
      spec: packaging/rpm/specs/flagfft.spec
      outdir: rpm-packages
      arches: [x86_64]
      base_pkgs: [nlohmann-json-devel, python3-wheel]
      images:
        openeuler24.03: openeuler/cuda:13.0.0-oe2403lts

  flagtree-cpu:
    repo: flagtree-cpu
    default_ref: ""
    default_version: ""
    deb:
      script: packaging/debian/build-helpers/build-flagtree-cpu.sh
      base_arg: env
      outdir: dist/output
      arches: [amd64, arm64]
      images:
        ubuntu22.04: ubuntu:22.04
        ubuntu24.04: ubuntu:24.04
    rpm:
      script: packaging/rpm/helpers/build-flagtree-cpu-rpm.sh
      base_arg: env
      spec: packaging/rpm/specs/flagtree-cpu.spec
      outdir: dist-rpm/output
      arches: [x86_64, aarch64]
      images:
        fedora43: fedora:43
        openeuler24.03: openeuler/openeuler:24.03-lts
