      images:
        ubuntu24.04: ubuntu:24.04

  FlagTree-tileir:
    repo: FlagTree
    default_ref: ""
    default_version: ""
    publish_runs_on: ["self-hosted", "h20"]
    deb:
      script: packaging/debian/build-helpers/build-flagtree.sh
      base_arg: env
      script_arg: tileir
      outdir: dist/output
      arches: [amd64]
      images:
        ubuntu24.04: ubuntu:24.04

  FlagTree-hcu:
    repo: FlagTree
    default_ref: ""
    default_version: ""
    publish_runs_on: ["self-hosted", "h20"]
    deb:
      script: packaging/debian/build-helpers/build-flagtree.sh
