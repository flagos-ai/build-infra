# Per-version app-layer requirements the bundle installs, on top of the shared
# runtime layer. Read by scripts/build_bundle.py.
# flagcx is absent: every backend now carries its own pin in configs.yaml
# deps:, so it is a runtime-layer wheel, not an app-layer delta.
# `entrypoint`/`launcher` let the bundle install a bare-metal `vllm-serve` the
# same way app/vllm/Containerfile does (python -m <entrypoint>); the verify
# smoke then exercises the real launcher instead of skipping it.
entrypoint: vllm.entrypoints.openai.api_server
launcher: vllm-serve
versions:
  "0.20.2":
    - vllm==0.20.2+flagos
    - vllm-plugin-fl==0.2.2
  "0.24.0":
    - vllm==0.24.0+flagos
    - vllm-plugin-fl==0.3.0
