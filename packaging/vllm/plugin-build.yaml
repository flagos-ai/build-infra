# The vllm-plugin-FL native-wheel build line: one entry per backend that builds
# the plugin's own `vllm_fl._C` extension (the host-side `weak_ref_tensor` op
# from csrc/cuda/) instead of the pure-python wheel. Read by
# vllm-plugin-wheel.yml's build-native job.
#
# A backend ABSENT from this file builds the pure-python wheel (the default
# fan-out) — presence here is what selects the native build, nothing else.
# The wheel is built inside that backend's runtime image (build env == delivery
# env), so each row's .so links the exact torch/ABI the app image runs against,
# and uploads to that vendor's own index only.
#
# Why this exists: the pure-python wheel carries no weak_ref_tensor provider, so
# vllm_fl falls back to `("weak_ref_tensor", lambda t: t)` — a strong reference —
# and vLLM cudagraph capture leaks VRAM per graph until it OOMs (see
# flagos-ai/build-infra#1428 hygon, #1431 MetaX). The native op registers on
# c10::kCUDA, which every CUDA-dispatch backend (nvidia/metax/hygon) routes
# through, so one host-side op restores a real weak reference for all of them.
#
#   apt             build-only packages installed in the build container before
#                   the wheel build. gflags/glog are transitive torch-header
#                   requirements (c10/util/Flags.h -> <gflags/gflags.h> when
#                   C10_USE_GFLAGS is defined, c10/util/Logging.h ->
#                   <glog/stl_logging.h>); neither is linked into the .so.
#   cmake_args      passed as CMAKE_ARGS to the build. hygon's is its own
#                   historical recipe (docker/hygon/Dockerfile.0.20.2).
#   cuda_path       exported as CUDA_PATH for the build. MACA's torch is a
#                   CUDA-based build and its cu-bridge toolchain lives beside
#                   the device root, so it needs the explicit path; nvidia's
#                   toolkit is at /usr/local/cuda (Caffe2Config's default) and
#                   hygon's torch is a HIP build that never reads it.
#   librt_symlink   torch's TorchConfig on ubuntu 24.04 links a librt.so that the
#                   24.04 toolchain does not ship a bare symlink for (#1428 hit
#                   this); create it before building.
#   wire_cuda_repo  nvidia only: torch's Caffe2Config CUDA-detection gate FATALs
#                   without nvcc, and the nvidia runtime base
#                   (nvcr cuda-runtime) ships none. Install the CUDA apt repo via
#                   cuda-keyring and apt-install cuda-nvcc + the torch-header -dev
#                   set, exactly the flagcx builder recipe
#                   (packaging/flagcx/backends.yaml nvidia rows + its
#                   Containerfile.builder). curand/cccl/math -dev are transitive
#                   torch-header includes only; the .so links no math lib.

backends:
  hygon-dtk26.04:
    cmake_args: "-DCMAKE_PREFIX_PATH=/opt/dtk;/opt/dtk/hip;/opt/dtk/hsa;/opt/hyhal;/usr/local/hyhal"
    apt: [libgflags-dev, libgoogle-glog-dev]
    librt_symlink: true

  metax-maca3.8.1.3:
    apt: [libgflags-dev, libgoogle-glog-dev]
    # MACA's torch is a CUDA-based build (torch==2.10.0+metax3.8.1.0); its
    # Caffe2Config resolves the toolkit through CUDA_PATH/CUDA_HOME, and metax's
    # cu-bridge — the CUDA-compatible toolchain — sits beside the device root
    # (/opt/maca/tools/cu-bridge), not inside it. The build exports this as
    # CUDA_PATH, the same value flagcx surfaces via wheel.cuda_path.
    cuda_path: /opt/maca/tools/cu-bridge

  nvidia-cuda12.8:
    wire_cuda_repo: true
    cuda_nvcc: cuda-nvcc-12-8
    apt: [libgflags-dev, libgoogle-glog-dev]

  nvidia-cuda13.3:
    wire_cuda_repo: true
    cuda_nvcc: cuda-nvcc-13-3
    apt: [libgflags-dev, libgoogle-glog-dev]
