# The vllm-plugin-FL native-wheel build line: one entry per backend that builds
# the plugin's own `vllm_fl._C` extension (the host-side `weak_ref_tensor` op
# from csrc/cuda/) instead of the pure-python wheel. Read by
# vllm-plugin-wheel.yml's build-native job.
#
# A backend ABSENT from this file builds the pure-python wheel (the default
# fan-out) — presence here is what selects the native build, nothing else.
# The wheel is built inside that backend's runtime image (build env == delivery
# env), so each row's .so links the exact torch/ABI the app image runs against,
# and uploads to that vendor's own index only.
#
# Why this exists: the pure-python wheel carries no weak_ref_tensor provider, so
# vllm_fl falls back to `("weak_ref_tensor", lambda t: t)` — a strong reference —
# and vLLM cudagraph capture leaks VRAM per graph until it OOMs (see
# flagos-ai/build-infra#1428 hygon, #1431 MetaX). The native op registers on
# c10::kCUDA, which every CUDA-dispatch backend (nvidia/metax/hygon) routes
# through, so one host-side op restores a real weak reference for all of them.
#
#   apt             build-only packages installed in the build container before
#                   the wheel build. gflags/glog are transitive torch-header
#                   requirements (c10/util/Flags.h -> <gflags/gflags.h> when
#                   C10_USE_GFLAGS is defined, c10/util/Logging.h ->
#                   <glog/stl_logging.h>); neither is linked into the .so.
#   cmake_args      passed as CMAKE_ARGS to the build. hygon's is its own
#                   historical recipe (docker/hygon/Dockerfile.0.20.2).
#   cuda_path       exported as CUDA_PATH for the build. MACA's torch is a
#                   CUDA-based build and its cu-bridge toolchain lives beside
#                   the device root, so it needs the explicit path; nvidia's
#                   toolkit is at /usr/local/cuda (Caffe2Config's default) and
#                   hygon's torch is a HIP build that never reads it.
#   librt_symlink   torch's TorchConfig on ubuntu 24.04 links a librt.so that the
#                   24.04 toolchain does not ship a bare symlink for (#1428 hit
#                   this); create it before building.
#   wire_cuda_repo  nvidia only: torch's Caffe2Config CUDA-detection gate FATALs
#                   without nvcc, and the nvidia runtime base
#                   (nvcr cuda-runtime) ships none. The base already wires the
#                   CUDA apt source, so this flag installs cuda_nvcc +
#                   cuda_extra_apt (below) from it — no source rewrite.
#   cuda_nvcc       nvidia only: the versioned nvcc package for this backend.
#   cuda_extra_apt  nvidia only: the versioned torch-header -dev/cccl set
#                   (curand/cccl/cublas/cusparse/cusolver/cufft), mirroring
#                   flagcx builder.extra_apt. curand/cccl/math -dev are
#                   transitive torch-header includes only; the .so links no
#                   math lib.
#   metax_mxcc      metax only: build by the mxcc/g++-direct recipe (sglang
#                   setup_maca.py) instead of the cmake/torch path, which metax's
#                   CUDA-alias torch cannot satisfy without a device arch.

backends:
  hygon-dtk26.04:
    cmake_args: "-DCMAKE_PREFIX_PATH=/opt/dtk;/opt/dtk/hip;/opt/dtk/hsa;/opt/hyhal;/usr/local/hyhal"
    apt: [libgflags-dev, libgoogle-glog-dev]
    librt_symlink: true

  metax-maca3.8.1.3:
    apt: [libgflags-dev, libgoogle-glog-dev]
    # metax builds by the mxcc/g++-direct recipe (packaging/sglang/wheels/metax/
    # setup_maca.py), not the cmake/torch path: MACA's torch is a CUDA-alias
    # build whose Caffe2Config find_package(Torch) cannot resolve the cu-bridge
    # toolchain through env vars alone (the bridge ships cucc, not nvcc, and
    # torch's FindCUDAToolkit has no MACA branch). metax_mxcc selects that
    # recipe in vllm-plugin-wheel.yml; the two host-side .cpp TUs are compiled
    # with g++ -DUSE_MACA (no device code, so no arch is needed).
    metax_mxcc: true
    # Kept for the record only: metax's mxcc-direct build does not read
    # CUDA_PATH (its includes/libs are resolved inline from MACA_PATH).
    cuda_path: /opt/maca/tools/cu-bridge

  nvidia-cuda12.8:
    wire_cuda_repo: true
    cuda_nvcc: cuda-nvcc-12-8
    # Versioned -dev/cccl names, mirroring flagcx builder.extra_apt: the
    # ubuntu2404 CUDA repo carries no unversioned libcurand-dev/cuda-cccl, and
    # only the -dev flavor (which depends on the held runtime libcublas-12-8
    # at its exact installed version) can coexist with the base's pinned libs.
    cuda_extra_apt: [libcurand-dev-12-8, cuda-cccl-12-8, libcublas-dev-12-8, libcusparse-dev-12-8, libcusolver-dev-12-8, libcufft-dev-12-8]
    apt: [libgflags-dev, libgoogle-glog-dev]

  nvidia-cuda13.3:
    wire_cuda_repo: true
    cuda_nvcc: cuda-nvcc-13-3
    # 13.3's unversioned libcublas-dev-13-3 resolves to 13.6.0.2 while the base
    # holds libcublas-13-3 at 13.5.1.27-1, so a plain apt install fails with
    # "held broken packages". The workflow unholds libcublas-<track> first (the
    # build container is disposable and the .so links no math lib), which is
    # what lets the versioned -dev land beside the upgraded runtime lib.
    cuda_extra_apt: [libcurand-dev-13-3, cccl-13-3, libcublas-dev-13-3, libcusparse-dev-13-3, libcusolver-dev-13-3, libcufft-dev-13-3]
    apt: [libgflags-dev, libgoogle-glog-dev]
