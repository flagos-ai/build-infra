# ── Wheel Repack Classification Rules ────────────────────────────────
# Each key is a set of *package names* (no version, case-insensitive).
#
# Top-level rules (applied to vllm's own METADATA):
#   remove_torch_chain, remove_cuda_only, remove_orphaned
#
# Indirect-dep rules (applied to retained deps that declare torch/triton
# in their own METADATA — discovered automatically by repack_recursive):
#   strip_from_indirect
#
# The repacker no longer maintains a manual "also_repack" list.  Instead,
# repack_recursive() resolves pip's actual dependency tree at repack time,
# downloads every retained dep, inspects its METADATA, and repacks any
# that declare undesirable dependencies.

# ── Top-level removal rules (applied to e.g. vllm's own METADATA) ──

# Packages that directly or transitively depend on torch / triton.
# Stripping these from vllm's Requires-Dist prevents the entire torch
# chain from being pulled in.
remove_torch_chain:
  - torch
  - torchaudio
  - torchvision
  - torchcodec
  - torch-c-dlpack-ext

# NVIDIA / CUDA-only packages — meaningless on non-CUDA platforms.
# (vllm 0.24.0's cuda.txt also declares the vendor kernel libs below.)
remove_cuda_only:
  - PyNvVideoCodec
  - nvidia-cudnn-frontend
  - nvidia-cutlass-dsl
  - nvtx
  - numba
  - humming-kernels
  - quack-kernels
  - tokenspeed-mla

# Packages whose only consumer was stripped above (no other consumers left).
remove_orphaned: []

# ── Indirect dependency stripping rules ───────────────────────────────
# When repack_recursive() finds a retained dep whose own METADATA
# declares undesirable packages, it strips these from that dep's
# Requires-Dist.  This list is deliberately narrower than the top-level
# rules — we only strip the torch/triton family, never CUDA infrastructure
# (the repacked dep may still need e.g. nvidia-cudnn-frontend at runtime
# if the user is on CUDA hardware).
strip_from_indirect:
  - torch
  - torchaudio
  - torchvision
  - torchcodec
  - torch-c-dlpack-ext
  - triton
  - tokenspeed-triton

# ── Per-package extra strip rules ─────────────────────────────────────
# strip_from_indirect above applies uniformly to EVERY audited indirect
# dep.  Some deps need a narrower, package-specific strip that must NOT
# apply to others.  This map is keyed by the (normalized) package name of
# the dep being repacked; its value is the list of dependency names to
# strip from THAT package's Requires-Dist only.
#
# opencv-python-headless declares `numpy>=2; python_version >= "3.9"`.
# This is a *faked* floor: the wheel is built against numpy 2.x but is
# runtime-backward-compatible with numpy >=1.19 (verified via full cv2
# C-API roundtrip under numpy 1.26.4 — see report-vllm-0.20.2.md §1.7/§2.4/§2.5).
# The declaration otherwise makes a single-step
# `pip install vllm==...+flagos numpy==1.26.4` unsolvable on numpy-1.x-ABI
# backends (iluvatar, hygon).  Stripping it lets every backend install in
# one step.  numpy is NOT in strip_from_indirect precisely because other
# deps may declare it as a *real* ABI floor — this map scopes the strip to
# opencv alone.
strip_extra_from_indirect:
  opencv-python-headless:
    - numpy

# ── Per-package indirect version pins ──────────────────────────────────
# Force a specific version for a retained indirect dep, overriding what
# pip would resolve (applied in resolve_dep_versions, only to deps that
# survived resolution — never re-introduces a stripped package).
#
# xgrammar: vllm 0.24.0 requires transformers>=5.5.3, but xgrammar
# 0.2.4/0.2.5 declare `transformers<5,>=4.38.0` — an empty version window.
# Upstream pip backtracks to 0.2.3 (no upper bound, still inside vllm's
# `xgrammar>=0.2.1,<1.0.0`); the repacker's per-dep resolution picks 0.2.5
# and would freeze the conflict into the vllm wheel.  Pin restores the
# upstream choice for every backend.  See report-vllm-0.24.0.md §8.
pin_indirect:
  xgrammar: "0.2.3"
