  # Same 22.04 builder as the 9.0.0 row; ops_product is A3, the 910C ops chip
  # token.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-ascend
    sdk_version: "9.0.0"
    ops_product: A3

# ── probed in-container: enabled, or still owing one probe ─────────────────

hygon-dtk26.04:
  vendor: du
  make_flag: USE_DU
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env:
    # du.mk defaults both to ${CUDA_PATH}, which DTK never exports — only the
    # ROCm/HIP set reaches the environment. They are pinned together because
    # one root serves both: its `include` and `lib64` are symlinks into
    # targets/x86_64-linux.
    DEVICE_HOME: /opt/dtk/cuda/cuda-12
    CCL_HOME: /opt/dtk/cuda/cuda-12
  # DTK's libnccl.so is a symlink to librccl.so.1.0, so -lnccl leaves
  # librccl.so.1 in NEEDED, never libnccl.so.*.
  vendor_libs: [cuda, cudart, rccl]
  assert:
    - /opt/dtk/cuda/cuda-12/include/nccl.h
    - /opt/dtk/cuda/cuda-12/include/cuda_runtime.h
    - /opt/dtk/lib/librccl.so.1
  # DTK registers nothing with ldconfig and hands out LD_LIBRARY_PATH from a
  # bash-only profile script: an unadorned `sh` resolves none of them.
  vendor_lib_dirs: [/opt/dtk/cuda/cuda-12/lib64, /opt/dtk/lib, /opt/hyhal/lib]
  deb: {enabled: true, default_for_vendor: true}
  # The tarball name says Ubuntu22.04, but nothing in it is: the image only
  # untars it into /opt, and of the 141 shared objects it ships the highest
  # requirement is GLIBC_2.29 -- librccl 2.17, libamdhip64 2.29 -- so el9's
  # 2.34 already covers it. Checked 2026-10-17 off the tarball itself.
  rpm: {enabled: true, sdk: filestore}
  # The wheel channel reads DEVICE_HOME a third time, as CUDA_PATH: that is what
  # the du adaptor's build consults, and it falls back to /usr/local/cuda, which
  # DTK does not have.
  wheel: {enabled: true, torch_backend: vendor}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. No clang/bitcode/NCCL — du.mk compiles .cu through DTK's nvcc.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-hygon

iluvatar-corex4.4.0:
  vendor: iluvatar_corex
  make_flag: USE_ILUVATAR_COREX
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  # Same reason as cambricon: iluvatar_corex.mk leaves PLATFORM_EXTRA_SRCS
  # empty, so devApiBackend is undefined. -shared tolerates that, dlopen does not.
  make_env:
    PLATFORM_EXTRA_SRCS: flagcx/adaptor/device_api/default_dev_api_backend.cc
  vendor_libs: [cudart, nccl]
  assert: [/usr/local/corex/include/cuda_runtime.h, /usr/local/corex/include/nccl.h]
  vendor_lib_dirs: [/usr/local/corex/lib]
  deb: {enabled: true, default_for_vendor: false}
  # Probed 2026-10-17 off the installer and its payload: the 83 shared objects
  # it ships need at most GLIBC_2.17 (libnccl and libcudart 2.16), so every rpm
  # target covers them, and the toolkit installer is a self-contained ELF with
  # no dpkg, apt, rpm or yum call in it. It does read /etc/os-release, so
  # whether it accepts fedora or openEuler is the one thing left to try.
  rpm: {enabled: false, blocked_by: installer-reads-os-release}
  wheel: {enabled: true}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. Unlike the other vendor rows this one also ships device bitcode —
  # iluvatar has a bindings/ir Makefile (FlagCX #668), and its device compiler
  # is the SDK's own clang, so bitcode_arch below is the arch the wheel's .bc
  # is compiled at. The .bc triple is bi-iluvatar-ilurt, not nvptx64, so it is
  # NOT flagtree-consumable and the nvidia f6ded0be clang constraint does not
  # apply: the SDK's clang and its llvm tools produce and validate it.
  # bitcode_adaptor_flag is deliberately absent — setup.py's iluvatar entry has
  # adaptor_flag_var: None, the Makefile states its own -DUSE_ILUVATAR_ADAPTOR
  # (no comm-traits branch), and FLAGCX_BITCODE_ADAPTOR_FLAGS is not read.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-iluvatar
    sdk_version: 4.4.0
  bitcode_arch: ivcore11

