ascend-cann8.5.0:
  vendor: ascend
  make_flag: USE_ASCEND
  arch: arm64
  glibc_floor: "2.39"
  apt: []
  make_env: {}
  vendor_libs: [ascendcl, hccl]
  assert: [/usr/local/Ascend/ascend-toolkit/latest/include/hccl/hccl.h]
  deb: {enabled: true, default_for_vendor: false}
  rpm: {enabled: true, base_image: ascendai/cann}
  wheel: {enabled: true}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. The SDK (libascendcl/libhccl, max GLIBC_2.17) and torch (max
  # GLIBC_2.28) are already 22.04-clean, so only the 24.04 build toolchain was
  # the problem. libhccl.so and the canonical <hccl/hccl.h> ship in the ops
  # package, which is chip-specific, so ops_product carries the chip token the
  # recipe's ops installer filename needs (910b vs A3); sdk_version names the
  # toolkit installer. The two rows of one CANN version still build the same
  # wheel bytes — the wheel links the sonames only, never the ops binaries.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-ascend
    sdk_version: "8.5.0"
    ops_product: 910b

ascend-cann8.5.0-910c:
  vendor: ascend
  make_flag: USE_ASCEND
  arch: arm64
  glibc_floor: "2.39"
  apt: []
  make_env: {}
  vendor_libs: [ascendcl, hccl]
  assert: [/usr/local/Ascend/ascend-toolkit/latest/include/hccl/hccl.h]
  deb: {enabled: true, default_for_vendor: false}
  rpm: {enabled: true, base_image: ascendai/cann}
  wheel: {enabled: true}
  # Same 22.04 builder as the 910b row; ops_product is A3, the 910C ops chip
  # token — the only per-row difference, and it names the ops installer.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-ascend
    sdk_version: "8.5.0"
    ops_product: A3

