sunrise-tangrt1.2.0:
  vendor: sunrise
  make_flag: USE_SUNRISE
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env:
    PLATFORM_EXTRA_SRCS: flagcx/adaptor/device_api/default_dev_api_backend.cc
  vendor_libs: [tangrt, pccl]
  assert: [/usr/local/tangrt/include/tang_runtime.h, /usr/local/pccl/include/pccl.h]
  vendor_lib_dirs: [/usr/local/tangrt/targets/linux-x86_64/lib, /usr/local/pccl/lib/linux-x86_64]
  deb: {enabled: true, default_for_vendor: true}
  # Probed from the installers themselves: `--toolkit` skips the kernel driver,
  # which is the only path that consults dpkg or yum, and both archives then
  # install by copying a tree into /usr/local. Every shared object they ship
  # needs at most GLIBC_2.34, which el9 (2.34), oe2403 (2.38) and fc43 (2.42)
  # all satisfy. The SDK comes from the file store here, not a vendor image.
  rpm: {enabled: true, sdk: filestore}
  wheel: {enabled: true}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. The SDK sonames (max GLIBC_2.34) and torch 2.11.0+cpu (GLIBC_2.28) are
  # already 22.04-clean, so only the 24.04 build toolchain was the problem —
  # the enflame shape, no reglib floor work. sdk_version is the installer's own
  # spelling (v1.2.0, the `v` the key drops). The SDK-floor proof is a dlopen of
  # libpccl/libtangrt_shared, not `import torch_ptpu`: the bridge extension
  # probes the device in a constructor and aborts device-less.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-sunrise
    sdk_version: "v1.2.0"

