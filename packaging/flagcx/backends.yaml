  make_env: {}
  vendor_libs: [cudart, nccl]
  assert: []
  deb: {enabled: false, default_for_vendor: true}
  probe: >-
    DTK's CUDA_PATH is captured into /etc/profile.d/vendor.sh and re-exported
    through BASH_ENV, so the Makefile's own DEVICE_HOME/CCL_HOME defaults (both
    ${CUDA_PATH}) do resolve under a Dockerfile RUN. Confirm DTK ships nccl.h +
    libnccl.so there, and pin DEVICE_HOME and CCL_HOME together — setting
    CCL_HOME alone leaves DEVICE_LIB=/lib64 for the -lcudart link.

