# FlagCX-owned packaging facts, one entry per build-infra backend key.
#
# Only what build-infra cannot tell us lives here. `base_image`, `runson`,
# `version` and `image_tag` come from `scripts/generate_matrix.py --runtime` at
# build time and must NOT be duplicated (see deb-config.py).
#
# Field meanings:
#   vendor        FlagCX adaptor family — matches makefiles/<vendor>.mk and the
#                 ADAPTOR_TO_MAKE_FLAG key in plugin/torch/_build_config.py.
#                 Drives `Provides: libflagcx-<vendor>`. NOT necessarily the
#                 build-infra vendor name: hygon builds through du.mk, so its
#                 adaptor is `du`.
#   make_flag     USE_* flag handed to `make` (the adaptor's make flag).
#   arch          `Architecture:` in the generated control. The matrix carries
#                 no arch field at all, so this is the only source.
#   glibc_floor   `Depends: libc6 (>= ...)`, cross-checked by deb-config.py
#                 --check against the base image's Ubuntu release. It is a
#                 packaging decision (the oldest runtime libc the binary links
#                 against), which is why it lives here and not in the matrix.
#   apt           packages installed on top of the base image before the build.
#   make_env      environment forced onto `make`. The FlagCX Makefile's
#                 `DEVICE_HOME ?=` / `CCL_HOME ?=` ladders pre-assign these
#                 before the vendor `.mk` is included, so a vendor `.mk`'s own
#                 `?=` default is unreachable and an unset variable yields a
#                 *defined-but-empty* value that silently becomes /lib64 or
#                 /include. Anything env-derived in the ladder is therefore
#                 pinned here rather than inherited (cambricon's NEUWARE_HOME).
#   vendor_libs   the vendor libraries the package links but does not ship.
#                 They are supplied by the site runtime, never by Ubuntu, so
#                 dh_shlibdeps must not look for a distribution package that
#                 provides them. Also the expected `ldd` "not found" set when
#                 the package is installed into a plain ubuntu container.
#   assert        absolute paths that must exist before the build starts. This
#                 is the tripwire for nvidia.mk's silent failure mode: a
#                 missing header or compiler there produces a collector-less
#                 .so without erroring.
#   probe         what one in-container `make` + `ldd` must answer before this
#                 backend can be enabled. Present only while `enabled: false`.
#   deb.enabled   false = entry documents the backend but produces no package.
#   deb.default_for_vendor
#                 the one variant per vendor that carries
#                 `Provides: libflagcx-<vendor>`.

# ── ready: makefiles/*.mk defaults and the base-image SDK layout agree ──────

nvidia-cuda12.8:
  vendor: nvidia
  make_flag: USE_NVIDIA
  arch: amd64
  glibc_floor: "2.39"
  # Base is nvcr.io/nvidia/cuda:12.8.0-runtime — no nvcc and no NCCL, and
  # build-infra provisions NCCL for no vendor. COMPILE_KERNEL=0 means no device
  # compiler is needed, but nvidia.mk resolves CCL_INCLUDE at make-parse time.
  # CCL_HOME overrides the .mk's /usr/local/nccl/build (a build-tree path) —
  # libnccl-dev installs its header under /usr/include.
  apt: [cuda-nvcc-12-8, libnccl-dev]
  make_env: {DEVICE_HOME: /usr/local/cuda, CCL_HOME: /usr}
  vendor_libs: [cuda, cudart, nccl]
  assert: [/usr/local/cuda/include/cuda_runtime.h, /usr/include/nccl.h]
  deb: {enabled: true, default_for_vendor: true}

