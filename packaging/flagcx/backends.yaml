kunlunxin-xre5.37.1:
  vendor: klx
  make_flag: USE_KUNLUNXIN
  arch: amd64
  glibc_floor: "2.35"
  apt: []
  # Both roots kunlunxin.mk defaults are wrong for this image: it says
  # `CCL_HOME ?= /usr/local/xccl` and `MPI_HOME ?= /usr/local`, while the vendor
  # installs xccl_Linux_x86_64/ and mpich-<ver>/ under /usr/local. Given here
  # rather than patched into FlagCX, which ships the paths from its own docs.
  #
  # CPATH and LIBRARY_PATH carry the CUDA half that the wheel's plugin build
  # needs and this image does not put on the default search path.
  # _build_config.py's klx branch points at /opt/kunlun — a path this image does
  # not have — so the torch headers' `#include <cuda.h>` resolves only through
  # CPATH, and the `-lcuda` that branch lists only through the driver stub. Both
  # root at /usr/local/cuda, which the base image installs (CUDA 12.9.0); this
  # is the plugin build reading it, not a second SDK. Same shape as the nvidia
  # rows' LIBRARY_PATH, which is there for the same stub.
  #
  # /usr/local/xpu/so is deliberately NOT here. kunlunxin.mk already puts that
  # directory on the link line (DEVICE_LIB := $(DEVICE_HOME)/so), so listing it
  # again buys nothing and costs the wrong xpuml: ld takes each LIBRARY_PATH
  # entry and also searches its sibling `../lib`, where this vendor keeps only
  # libxpuml.a — so `-lxpuml` linked the archive and libflagcx.so came out
  # defining the xpuml* API itself and leaving 60 nvml* undefined, none of which
  # any shared object provides. Without the entry ld takes the shared
  # libxpuml.so from the default path, which is what the deb build does.
  make_env:
    CCL_HOME: /usr/local/xccl_Linux_x86_64
    MPI_HOME: /usr/local/mpich-3.3.2
    CPATH: /usr/local/xpu/include:/usr/local/cuda/include
    LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/lib64
  vendor_libs: [cudart, xccl]
  # xpu/runtime.h is bkcl.h's own include and resolves through DEVICE_INCLUDE
  # (`$(DEVICE_HOME)/include`, DEVICE_HOME ?= /usr/local/xpu, a symlink into the
  # XRE tree) — so it is on the path once the SDK is, and is asserted as the
  # file that proves the device half of the include closure is there too.
  assert:
    - /usr/local/xccl_Linux_x86_64/include/bkcl.h
    - /usr/local/xpu/include/xpu/runtime.h
    - /usr/local/mpich-3.3.2/include/mpi.h
  deb: {enabled: false, default_for_vendor: true}
  rpm: {enabled: false, blocked_by: mixed-run-and-deb}
  wheel: {enabled: true}

