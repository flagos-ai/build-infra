# ── probed in-container: enabled, or still owing one probe ─────────────────

hygon-dtk26.04:
  vendor: du
  make_flag: USE_DU
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env:
    # du.mk defaults both to ${CUDA_PATH}, which DTK never exports — only the
    # ROCm/HIP set reaches the environment. They are pinned together because
    # one root serves both: its `include` and `lib64` are symlinks into
    # targets/x86_64-linux.
    DEVICE_HOME: /opt/dtk/cuda/cuda-12
    CCL_HOME: /opt/dtk/cuda/cuda-12
  # DTK's libnccl.so is a symlink to librccl.so.1.0, so -lnccl leaves
  # librccl.so.1 in NEEDED, never libnccl.so.*.
  vendor_libs: [cuda, cudart, rccl]
  assert:
    - /opt/dtk/cuda/cuda-12/include/nccl.h
    - /opt/dtk/cuda/cuda-12/include/cuda_runtime.h
    - /opt/dtk/lib/librccl.so.1
  # DTK registers nothing with ldconfig and hands out LD_LIBRARY_PATH from a
  # bash-only profile script: an unadorned `sh` resolves none of them.
  vendor_lib_dirs: [/opt/dtk/cuda/cuda-12/lib64, /opt/dtk/lib, /opt/hyhal/lib]
  deb: {enabled: true, default_for_vendor: true}
  # The wheel channel reads DEVICE_HOME a third time, as CUDA_PATH: that is what
  # the du adaptor's build consults, and it falls back to /usr/local/cuda, which
  # DTK does not have.
  wheel: {enabled: true, torch_backend: vendor}

iluvatar-corex4.4.0:
  vendor: iluvatar_corex
  make_flag: USE_ILUVATAR_COREX
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  # Same reason as cambricon: iluvatar_corex.mk leaves PLATFORM_EXTRA_SRCS
  # empty, so devApiBackend is undefined. -shared tolerates that, dlopen does not.
  make_env:
    PLATFORM_EXTRA_SRCS: flagcx/adaptor/device_api/default_dev_api_backend.cc
  vendor_libs: [cudart, nccl]
  assert: [/usr/local/corex/include/cuda_runtime.h, /usr/local/corex/include/nccl.h]
  vendor_lib_dirs: [/usr/local/corex/lib]
  deb: {enabled: true, default_for_vendor: false}

