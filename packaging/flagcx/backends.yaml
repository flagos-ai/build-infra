# FlagCX-owned packaging facts, one entry per build-infra backend key.
#
# Only what build-infra cannot tell us lives here. `base_image`, `runson`,
# `version` and `image_tag` come from `scripts/generate_matrix.py --runtime` at
# build time and must NOT be duplicated (see flagcx-config.py).
#
# Field meanings:
#   vendor        FlagCX adaptor family — matches makefiles/<vendor>.mk and the
#                 ADAPTOR_TO_MAKE_FLAG key in plugin/torch/_build_config.py.
#                 Drives `Provides: libflagcx-<vendor>`. NOT necessarily the
#                 build-infra vendor name: hygon builds through du.mk, so its
#                 adaptor is `du`.
#   make_flag     USE_* flag handed to `make` (the adaptor's make flag).
#   arch          `Architecture:` in the generated control. The matrix carries
#                 no arch field at all, so this is the only source.
#   glibc_floor   `Depends: libc6 (>= ...)`, cross-checked by flagcx-config.py
#                 --check against the base image's Ubuntu release. It is a
#                 packaging decision (the oldest runtime libc the binary links
#                 against), which is why it lives here and not in the matrix.
#   apt           packages installed on top of the base image before the build.
#   make_env      environment forced onto `make`. The FlagCX Makefile's
#                 `DEVICE_HOME ?=` / `CCL_HOME ?=` ladders pre-assign these
#                 before the vendor `.mk` is included, so a vendor `.mk`'s own
#                 `?=` default is unreachable and an unset variable yields a
#                 *defined-but-empty* value that silently becomes /lib64 or
#                 /include. Anything env-derived in the ladder is therefore
#                 pinned here rather than inherited (cambricon's NEUWARE_HOME).
#                 It is also the way past a `:=` in the vendor `.mk`, since these
#                 reach make as command-line values. cambricon needs that for
#                 PLATFORM_EXTRA_SRCS: the Makefile globs flagcx/adaptor/*.cc, so
#                 flagcx_device.cc — a hard reference to devApiBackend — is always
#                 compiled, while flagcx/adaptor/device_api/ is never globbed, so
#                 the definition has to come from the `.mk` and cambricon.mk still
#                 leaves it empty (upstream fixed MUSA alone, #576). An unresolved
#                 symbol is legal in a shared-object link: the build passes and
#                 only the loader's dlopen(RTLD_NOW) reports it.
#   vendor_libs   the vendor libraries the package links but does not ship.
#                 They are supplied by the site runtime, never by Ubuntu, so
#                 dh_shlibdeps must not look for a distribution package that
#                 provides them. Also the expected `ldd` "not found" set when
#                 the package is installed into a plain ubuntu container.
#   vendor_lib_dirs
#                 extra directories dpkg-shlibdeps must search to find those
#                 libs. A soname the loader already resolves needs no entry. One
#                 the loader cannot see at all is a hard error until it is on the
#                 search path, and nothing else in the build knows the path:
#                 nvidia's libcuda.so.1 ships only under the driver's compat/.
#   assert        absolute paths that must exist before the build starts. This
#                 is the tripwire for nvidia.mk's silent failure mode: a
#                 missing header or compiler there produces a collector-less
#                 .so without erroring.
#   probe         what one in-container `make` + `ldd` must answer before this
#                 backend can be enabled. Present only while `enabled: false`.
#   deb.enabled   false = entry documents the backend but produces no package.
#   deb.default_for_vendor
#                 the one variant per vendor that carries
#                 `Provides: libflagcx-<vendor>`.
#   wheel.enabled true = this row also produces a wheel for the vendor PyPI.
#                 Absent is not drift: a row that ships a .deb and no wheel is
#                 the ordinary state of a backend nobody has asked to publish.
#   wheel.torch_backend
#                 FLAGCX_TORCH_BACKEND for the wheel build. `vendor` is the
#                 only value accepted today — _build_config.py rejects
#                 `flagos` for the du/metax adaptors outright, so a row
#                 carrying it could only ever build a wheel that fails on
#                 import.
#                 Nothing here names the local version label: it is derived
#                 from the matrix name (`hygon-dtk26.04` -> `+dtk2604`), the
#                 same way the PyPI index is named after that name's first
#                 segment. A label is normally just the suffix read back through
#                 PEP 440, which leaves `maca3.7.2.1` alone; DTK is the one row
#                 where that reading would respell the vendor's own `26.04`, so
#                 flagcx-config.py's wheel_label() names that exception in code
#                 rather than letting a field here become a third copy of a fact
#                 the matrix already carries. `vendor` above is the FlagCX
#                 adaptor family (hygon's is `du`) — the other, independent axis,
#                 and one field cannot play both roles.
#   wheel.cuda_path
#                 CUDA_PATH for the wheel build only; defaults to the row's
#                 make_env.DEVICE_HOME. Separate because on MACA the vendor
#                 torch's compiler driver lives outside the device root that
#                 make_env.DEVICE_HOME hands the `.mk`.
#   builder.enabled
#                 true = this row also publishes a build-toolchain image,
#                 `flagos-dev/flagcx-builder-<key>`. Only rows whose runtime image
#                 lacks what the FlagCX build needs (nvidia: no clang) or whose
#                 wheel must link at most glibc 2.35 (the vendor rows) carry one,
#                 so absent is the ordinary state, not drift. The image is
#                 self-contained on ubuntu:22.04 — it installs its own interpreter
#                 and torch and the row's SDK, rather than layering on the runtime
#                 image, so build env == delivery env and a builder that could not
#                 be the wheel's BASE_IMAGE would be the wrong artifact.
#   builder.containerfile
#                 the recipe, for a vendor row whose SDK installs from a tarball
#                 into /opt rather than the CUDA apt repo. Rows on the shared
#                 nvidia recipe (Containerfile.builder) leave it out.
#   builder.apt   packages installed on top of the row's own `apt` list, which
#                 the builder installs too (it is the same SDK fact, and a
#                 second copy here could disagree with it). Build-time only —
#                 nothing here needs to exist at run time.
#   builder.sdk_version
#                 the SDK tarball's own version spelling, for a vendor recipe
#                 whose tarball name does not match the key (metax 3.7.2.1 ->
#                 3.7.2.0). The enflame recipe also reads it — to name its
#                 topsruntime/topscc/... debs from one value the two rows share.
#                 The key is not a source for it because the mismatch is exactly
#                 what must not be re-derived at build time.
#   builder.aten_version
#                 the topsaten deb's version, enflame only: it is not the SDK
#                 version and not derivable from it (1.10.6 -> 3.8.20260710,
#                 1.9.10 -> 3.7.20260514), and libtorch_gcu.so NEEDs
#                 libtopsaten.so.3, so the deb is part of the SDK-floor import.
#   builder.ops_product
#                 the Ascend ops package's chip token, ascend only: the ops
#                 installer (Ascend-cann-<chip>-ops_<ver>_linux-aarch64.run) is
#                 the package that ships libhccl.so and the canonical
#                 <hccl/hccl.h>, and the chip token (910b vs A3) is not in the
#                 key. Stated for the same reason as sdk_version: the filename
#                 must not be re-derived at build time.
#   bitcode_arch  BITCODE_LIB_ARCH for the device-bitcode build, stated and not
#                 derived. The only derivation available is the gencode table in
#                 FlagCX's makefiles/nvidia_gencode.mk, and copying that table
#                 here would be the second copy that drifts. Consumed by the
#                 builder channel's verification, and by the wheel channel, which
#                 hands it to setup.py as FLAGCX_BITCODE_ARCH.
#   bitcode_adaptor_flag
#                 ADAPTOR_FLAG for that build — which is where the row's
#                 comm-traits branch is spelled out. makefiles/nvidia.mk decides
#                 that branch for the .so by reading NCCL_MAJOR/MINOR out of
#                 nccl.h, and bindings/ir/nvidia/Makefile never includes that
#                 file, so the branch can only reach the .bc as a value passed
#                 in: left out, the .bc lands in DefaultBackend while the .so is
#                 built against CCL, and the two then disagree about
#                 DeviceAPI::Window/Multimem (WHEEL-DESIGN.md, "The
#                 build-toolchain image"). The
#                 Makefile replaces ADAPTOR_FLAG wholesale rather than appending
#                 to it, so the value restates the Makefile's own
#                 -DUSE_NVIDIA_ADAPTOR default. The wheel channel passes it to
#                 setup.py as FLAGCX_BITCODE_ADAPTOR_FLAGS, which refuses an
#                 empty value whenever the arch is set rather than defaulting
#                 it — the wrong branch is not a build failure, it is a `.bc`
#                 that loads and does the wrong thing. The iluvatar rows state
#                 bitcode_arch WITHOUT it: setup.py's iluvatar entry sets
#                 adaptor_flag_var to None because its Makefile states its own
#                 flag (no comm-traits branch), so FLAGCX_BITCODE_ADAPTOR_FLAGS
#                 is never read for them and the absence is the rule, not a gap.

# ── ready: makefiles/*.mk defaults and the base-image SDK layout agree ──────

nvidia-cuda12.8:
  vendor: nvidia
  make_flag: USE_NVIDIA
  arch: amd64
  glibc_floor: "2.39"
  # Base is nvcr.io/nvidia/cuda:12.8.0-runtime — no nvcc, and a libnccl2 that
  # the NGC image `apt-mark hold`s so a stray upgrade cannot move it off the
  # 12.8 track. The hold is what makes the -dev pin necessary rather than
  # tidy: unpinned, libnccl-dev resolves to the newest in the CUDA repo (a
  # +cuda13.4 build) whose `libnccl2 (= version)` apt can only satisfy by
  # changing a held package, so it refuses the install outright. Pinning is
  # also the point — the package must link the NCCL this base carries.
  # COMPILE_KERNEL=0 means no device compiler is needed, but nvidia.mk resolves
  # CCL_INCLUDE at make-parse time. CCL_HOME overrides the .mk's
  # /usr/local/nccl/build (a build-tree path) — libnccl-dev installs its header
  # under /usr/include.
  # DEVICE_LINK is `-lcudart -lcuda`: -lcuda is the driver, whose stub ships in
  # lib64/stubs and is on no -L the Makefile passes — cuda-nvcc brings the file
  # but not the path, so LIBRARY_PATH is what puts it there.
  apt: [cuda-nvcc-12-8, libnccl-dev=2.25.1-1+cuda12.8]
  make_env:
    DEVICE_HOME: /usr/local/cuda
    CCL_HOME: /usr
    LIBRARY_PATH: /usr/local/cuda/lib64/stubs
  vendor_libs: [cuda, cudart, nccl]
  # -lcuda links the stub, but the *runtime* dependency is unresolved: the base
  # image's only libcuda.so.1 lives in the driver's compat/ dir (the real file is
  # libcuda.so.570.86.10), which is on no loader, dpkg or ldconfig path.
  vendor_lib_dirs: [/usr/local/cuda/compat]
  assert: [/usr/local/cuda/include/cuda_runtime.h, /usr/include/nccl.h]
  deb: {enabled: true, default_for_vendor: true}
  rpm: {enabled: true, base_image: nvcr.io/nvidia/cuda}
  # The wheel is built in the builder image rather than the runtime one: the
  # runtime image carries no clang, and the bitcode below is compiled by it.
  # flagcx-config.py derives that (`wheel_base_image`) rather than repeating it.
  wheel: {enabled: true, torch_backend: vendor}
  # The device-bitcode build needs clang/llvm >= 22 (the builder's own pin, both
  # NVIDIA rows take the same one, in the Containerfile) and three sets of
  # build-time-only headers that no cuda-nvcc package ships on 12.8/13.3, so they
  # live here rather than in `apt` above:
  #   - curand's mtgp32 kernel header: clang's __clang_cuda_runtime_wrapper.h
  #     force-includes it. FlagCX never calls cuRAND; the header is a compiler-
  #     side requirement only.
  #   - the four CUDA math -dev packages: torch's ATen headers reach
  #     cublas/cusparse/cusolver/cufft at build time (CUDAContextLight.h includes
  #     <cusparse.h>). The wheel's .so links no math lib, so these are consumed
  #     only for torch's transitive includes; installed unversioned because the
  #     package name already pins the track and a fresh 22.04 has nothing
  #     preinstalled to protect from an upgrade.
  #   - cuda-cccl (cub/thrust/cooperative_groups/libcudacxx): reached by the CCL
  #     comm-traits branch through NCCL's nccl_device.h (<cuda/atomic>,
  #     <cooperative_groups.h>) and by clang's CUDA wrapper in C++20 mode. This
  #     row takes the Default branch but still compiles C++20, so it keeps the
  #     package too — header-only, and identical SDK surface across the two rows.
  builder:
    enabled: true
    extra_apt: [libcurand-dev-12-8, cuda-cccl-12-8, libcublas-dev-12-8, libcusparse-dev-12-8, libcusolver-dev-12-8, libcufft-dev-12-8]
  # This row's .so is built against NCCL 2.25, so its .bc takes the same Default
  # branch — the two have to agree, and nothing in the bitcode Makefile reads
  # nccl.h to find that out.
  bitcode_arch: sm_90
  bitcode_adaptor_flag: "-DUSE_NVIDIA_ADAPTOR -DFLAGCX_COMM_TRAITS_DEFAULT"

nvidia-cuda13.3:
  vendor: nvidia
  make_flag: USE_NVIDIA
  arch: amd64
  glibc_floor: "2.39"
  # The base preinstalls and holds libnccl2 (the 13.x NGC runtime tag ships no
  # NCCL). Both are pinned: -dev's Depends names an exact libnccl2, and the
  # pinned +cuda13.3 sits at equal priority with the newest +cuda13.4 build.
  apt: [cuda-nvcc-13-3, libnccl-dev=2.31.2-1+cuda13.3, libnccl2=2.31.2-1+cuda13.3]
  make_env:
    DEVICE_HOME: /usr/local/cuda
    CCL_HOME: /usr
    LIBRARY_PATH: /usr/local/cuda/lib64/stubs
  vendor_libs: [cuda, cudart, nccl]
  vendor_lib_dirs: [/usr/local/cuda/compat]
  assert: [/usr/local/cuda/include/cuda_runtime.h, /usr/include/nccl.h]
  deb: {enabled: true, default_for_vendor: false}
  rpm: {enabled: true, base_image: nvcr.io/nvidia/cuda}
  # Same builder-built wheel as the 12.8 row, for the same reason.
  wheel: {enabled: true, torch_backend: vendor}
  # Same build-time gaps as the 12.8 row, and the same answer — plus cccl, which
  # this row genuinely needs: it takes the CCL comm-traits branch, whose
  # nccl_device.h (NCCL 2.31) reaches <cuda/atomic>, <cooperative_groups.h> and
  # <cuda_fp8.h>, all provided by cccl-13-3 (it Provides cuda-cccl-13-3).
  builder:
    enabled: true
    extra_apt: [libcurand-dev-13-3, cccl-13-3, libcublas-dev-13-3, libcusparse-dev-13-3, libcusolver-dev-13-3, libcufft-dev-13-3]
  # NCCL 2.31 here, so CCL — the branch that needs BITCODE_CXX_STD=gnu++17 (the
  # device headers under nccl_device/ use `typeof`). Both values are the ones the
  # recipe was measured at; whether one .bc covers this row's whole gencode range
  # (sm_80…sm_120) is still open, so this is one arch per row and not a range.
  bitcode_arch: sm_120
  bitcode_adaptor_flag: "-DUSE_NVIDIA_ADAPTOR -DFLAGCX_COMM_TRAITS_CCL"

metax-maca3.7.2.1:
  vendor: metax
  make_flag: USE_METAX
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env: {}
  vendor_libs: [mcruntime, mccompiler, mccl]
  assert: [/opt/maca/include/mccl.h, /opt/maca/include/mcr/mc_runtime.h]
  deb: {enabled: true, default_for_vendor: false}
  # The SDK we hold is a -deb- build, but its installer carries an rpm branch
  # (rpm -ivh alongside dpkg -i), so the vendor publishes a -rpm- build too.
  # This needs that file, not vendor work.
  rpm: {enabled: false, blocked_by: sdk-deb-build-held}
  # MACA's cu-bridge toolchain sits beside the device root, not inside it —
  # see wheel.cuda_path above.
  wheel: {enabled: true, torch_backend: vendor, cuda_path: /opt/maca/tools/cu-bridge}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. The SDK and the pinned torch are all glibc <= 2.28, so only the 24.04
  # build toolchain was the problem. sdk_version is the tarball's own spelling,
  # not the key's (3.7.2.1 -> 3.7.2.0): the recipe extracts every deb to `/` and
  # symlinks /opt/maca to the payload root.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-metax
    sdk_version: 3.7.2.0

metax-maca3.8.1.3:
  vendor: metax
  make_flag: USE_METAX
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env: {}
  vendor_libs: [mcruntime, mccompiler, mccl]
  assert: [/opt/maca/include/mccl.h, /opt/maca/include/mcr/mc_runtime.h]
  deb: {enabled: true, default_for_vendor: true}
  # The SDK we hold is a -deb- build, but its installer carries an rpm branch
  # (rpm -ivh alongside dpkg -i), so the vendor publishes a -rpm- build too.
  # This needs that file, not vendor work.
  rpm: {enabled: false, blocked_by: sdk-deb-build-held}
  wheel: {enabled: true, torch_backend: vendor, cuda_path: /opt/maca/tools/cu-bridge}
  # Same 22.04 builder as the 3.7.2.1 row, for the same reason: the wheel must
  # link at most glibc 2.35 for the bundle's physical 22.04 hosts. sdk_version
  # is the tarball's own spelling (3.8.1.3, matching the key here).
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-metax
    sdk_version: 3.8.1.3

cambricon-neuware4.4.3:
  vendor: cambricon
  make_flag: USE_CAMBRICON
  arch: amd64
  glibc_floor: "2.35"
  apt: []
  # cambricon.mk defaults DEVICE_HOME/CCL_HOME to $(NEUWARE_HOME) — env-derived,
  # so pinned here rather than inherited.
  make_env:
    DEVICE_HOME: /usr/local/neuware
    CCL_HOME: /usr/local/neuware
    PLATFORM_EXTRA_SRCS: flagcx/adaptor/device_api/default_dev_api_backend.cc
  vendor_libs: [cnrt, cncl]
  assert: [/usr/local/neuware/include/cncl.h, /usr/local/neuware/include/cnrt.h]
  deb: {enabled: true, default_for_vendor: false}
  rpm: {enabled: false, blocked_by: vendor-ships-deb-only}
  wheel: {enabled: true}

cambricon-neuware4.7.2:
  vendor: cambricon
  make_flag: USE_CAMBRICON
  arch: amd64
  glibc_floor: "2.39"
  apt: []
  make_env:
    DEVICE_HOME: /usr/local/neuware
    CCL_HOME: /usr/local/neuware
    PLATFORM_EXTRA_SRCS: flagcx/adaptor/device_api/default_dev_api_backend.cc
  vendor_libs: [cnrt, cncl]
  assert: [/usr/local/neuware/include/cncl.h, /usr/local/neuware/include/cnrt.h]
  deb: {enabled: true, default_for_vendor: true}
  rpm: {enabled: false, blocked_by: vendor-ships-deb-only}
  wheel: {enabled: true}
  # Self-contained ubuntu:22.04 builder: the wheel must link at most glibc 2.35
  # for the bundle's physical 22.04 hosts, and the 24.04 runtime cannot produce
  # that. The SDK is 4.7.2's own ubuntu22.04 debs (filestore cambricon/u2204),
  # whose libcncl links GLIBC_2.34 — the 24.04 SDK would link GLIBC_2.38.
  builder:
    enabled: true
    containerfile: Containerfile.builder-vendor-cambricon

