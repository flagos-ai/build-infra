# FlagTree build-line facts, one entry per backend that has a Containerfile beside
# this file. flagtree-builder.yml and flagtree-wheel-daily.yml both read it.
#
# Not a second configs.yaml: the image tag, the stack version and the vendor PyPI
# index stay in configs.yaml / build-config.yml and are derived at run time.
#
#   containerfile   file in this directory, also docker build's `-f`.
#   builder_image   image REPOSITORY the `--target builder` stage is published
#                   under.
#   runson          runner labels for the build; JSON string, so fromJSON it.
#                   Here rather than in build-config.yml because these builds
#                   need no device -- that file's overrides label the runtime and
#                   app builds, which do.
#   disk_min_gb     free space checked before the build starts.
#   builder         the publishable build environment. Its PRESENCE is what says
#                   the Containerfile has a `--target builder` stage.
#     verify_stage  which stage assertions to run, by name -- each backend stages
#                   different things. The names are flagtree-builder.yml's step
#                   names, not a second registry. Omitted = the build is the
#                   proof.
#     verify        the same idea, as data: the interpreter, the executables and
#                   the paths the stage must carry. Rendered by the one generic
#                   step in flagtree-builder.yml, so a backend staged like the
#                   ones that came before it needs no new step there.
#   daily.enabled   whether the daily line builds this backend. False until a
#                   build here has been verified on the backend's own nodes.
#   daily.dist_name one project per backend, so `pip install --pre <name>` ranks
#                   without a backend token in the version. Declared as the name
#                   setup.py is handed; the index path is its PEP 503 canonical
#                   form (see README "three spellings of its name").
#   daily.version_base
#                   the release the daily leads: `<version_base>.dev<UTC date>`.
#                   Bump it with configs.yaml's flagtree pin.
#   daily.ref       the FlagTree ref the daily tracks. Declared rather than taken
#                   from the Containerfile's own default, which is the VENDOR
#                   release a local build reproduces: the daily tracks the line
#                   the backend is being fixed on, which for nvidia is upstream's
#                   main. Overridable per dispatch.
#   daily.wheel_tag the interpreter + platform tag the wheel wears; a container
#                   change that moves the interpreter fails the run rather than
#                   publishing an uninstallable wheel.

backends:
  nvidia:
    containerfile: nvidia-cuda
    builder_image: flagtree-builder-nvidia-cuda
    runson: ["self-hosted", "h20"]
    disk_min_gb: 15
    builder:
      verify_stage: nvidia
    daily:
      enabled: true
      dist_name: flagtree-nvidia
      version_base: "0.7.1"
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  # FlagTree's other default backend. Same stage shape as nvidia's (bare
  # ubuntu:22.04, deadsnakes 3.12, LLVM through LLVM_SYSPATH, the shared triton
  # deps), which is why the two sit together -- but it needs its own verify step:
  # third_party/amd/CMakeLists.txt find_package()s LLD against
  # ${LLVM_LIBRARY_DIR}/cmake/lld, and the nvidia step has no reason to assert
  # that. No vendor SDK is staged: the backend vendors its hip/hsa/roctracer
  # headers and opens libamdhip64 at run time.
  amd:
    containerfile: amd
    builder_image: flagtree-builder-amd
    runson: ["self-hosted", "amd"]
    # Measured on the amd node: the two images this line produces are 8.43 GB and
    # 27.1 GB raw (1.88 GB and 20.6 GB unique). The 27.1 GB is the largest wheel
    # image of any row -- the default build type keeps an 890 MB libtriton.so
    # with debug sections -- and both are resident at once.
    disk_min_gb: 60
    builder:
      verify_stage: amd
    daily:
      enabled: true
      dist_name: flagtree-amd
      version_base: "0.7.1"
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  iluvatar:
    containerfile: iluvatar
    builder_image: flagtree-builder-iluvatar-corex4.5.0
    # The backend's own nodes, the label its runtime/app builds use -- same
    # reason as metax: a refresh of every backend must not queue on one runner.
    # The build touches no CoreX hardware; device checks belong to the iluvatar
    # verify line, which already runs here.
    runson: ["self-hosted", "corex450"]
    disk_min_gb: 60
    builder:
      verify_stage: iluvatar
    daily:
      enabled: true
      dist_name: flagtree-iluvatar
      version_base: "0.7.1"
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  metax:
    containerfile: metax
    builder_image: flagtree-builder-metax
    # The backend's own nodes, though the build touches no metax hardware: the
    # daily is meant to be dispatched for every backend at once, and one shared
    # runner would serialize that.
    runson: ["self-hosted", "maca381"]
    disk_min_gb: 60
    builder:
      verify_stage: metax
    daily:
      enabled: true
      dist_name: flagtree-metax
      version_base: "0.7.1"
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  sunrise:
    containerfile: sunrise
    builder_image: flagtree-builder-sunrise
    # The backend's own nodes, the label its runtime/app builds use -- same
    # reason as metax and iluvatar. The build touches no PTPU hardware.
    runson: ["self-hosted", "sunrise"]
    disk_min_gb: 60
    builder:
      verify_stage: sunrise
    daily:
      enabled: true
      dist_name: flagtree-sunrise
      version_base: "0.7.1"
      ref: main
      # cp310: this backend builds with the 22.04 system interpreter, not a
      # deadsnakes 3.12 -- see the Containerfile's builder stage.
      wheel_tag: cp310-cp310-linux_x86_64

  # The first row that uses `verify` instead of a `verify_stage`: its stage is
  # the same shape as metax's (apt toolchain, deadsnakes 3.12, prebuilt inputs
  # into FlagTree's cache) and its own nodes carry the label.
  enflame:
    containerfile: enflame
    builder_image: flagtree-builder-enflame
    runson: ["self-hosted", "tops1106"]
    disk_min_gb: 60
    builder:
      verify:
        python: "3.12"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # The vendor toolkit deb's payload: toolkit.py raises at import without
          # it, which is what the wheel stage's smoke test imports the backend for.
          - /opt/triton_gcu/bin/gcu-compiler-opt
        dirs:
          # Where find_package(MLIR REQUIRED CONFIG) is pointed, and what
          # install_extension copies into the wheel for the TLE raw path.
          - /root/.flagtree/enflame/llvm-fc83c68-gcc9-x64/lib/cmake/mlir
          - /root/.flagtree/enflame/llvm-fc83c68-gcc9-x64/python_packages/mlir_core/mlir
    daily:
      enabled: true
      dist_name: flagtree-enflame
      version_base: "0.7.1"
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  # Like enflame: the same shape as metax's stage (apt toolchain, the backend's
  # prebuilt LLVM trees and the shared triton deps into FlagTree's cache), with
  # the 22.04 system python 3.10 rather than deadsnakes, which is the
  # interpreter hygon's runtime pins. Two trees, because hcu.py keys one by the
  # LLVM commit and this row serves refs on either side of that move.
  hcu:
    containerfile: hcu
    builder_image: flagtree-builder-hcu
    runson: ["self-hosted", "hygon"]
    disk_min_gb: 60
    builder:
      verify:
        python: "3.10"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # What the 188a510 tree's CMake exports resolve their zstd link
          # interface against: an absent libzstd-dev leaves this stage passing
          # and the wheel build's configure failing.
          - /usr/include/zstd.h
          # CMakeLists copies this into the wheel; the build fails without it.
          # Both trees: the cache key carries hcu.py's revision, so the stage
          # holds one per ref this file serves (see the Containerfile).
          - /root/.flagtree/hcu/hcu-llvm22-188a510-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/bin/FileCheck
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/bin/FileCheck
          # hcu.py's second cache entry: a file, keyed by md5 rather than by
          # name, copied to /opt/dtk/dushmem/lib/ when the ref has that dir.
          - /root/.flagtree/hcu/libdushmem_device_gfx936.bc
        dirs:
          # The two find_package() contracts in this backend's CMakeLists:
          # MLIR via the default MLIR_DIR, LLD via hcu's explicit find_package.
          # Neither is an apt package, so both have to come from the staged LLVM.
          - /root/.flagtree/hcu/hcu-llvm22-188a510-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/mlir
          - /root/.flagtree/hcu/hcu-llvm22-188a510-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/lld
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/mlir
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/lld
          # hcu's CMakeLists adds third_party/nvidia and setup.py copies the
          # CUDA redists into it from these caches, so both must be staged.
          - /root/.triton/nvidia/cudart
          - /root/.triton/nvidia/cupti
    daily:
      enabled: true
      dist_name: flagtree-hcu
      version_base: "0.7.1"
      ref: main
      # cp310: the 22.04 system interpreter, same as sunrise.
      wheel_tag: cp310-cp310-linux_x86_64

  # The 26.10 twin of hcu: same staged LLVM tree + triton deps, same
  # FLAGTREE_BACKEND, but the interpreter is a deadsnakes 3.12 (torch 2.13.0 is
  # cp312-only, so the wheel has to wear cp312 for the dtk26.10 runtime to
  # resolve it) and the stage installs the DTK 26.10 Ubuntu22.04 SDK. A distinct
  # dist_name keeps the two lines' daily wheels from colliding on
  # flagos-pypi-daily.
  hcu-dtk2610:
    containerfile: hcu-dtk2610
    builder_image: flagtree-builder-hcu-dtk2610
    runson: ["self-hosted", "hygon"]
    disk_min_gb: 60
    builder:
      verify:
        python: "3.12"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # CMakeLists copies this into the wheel; the build fails without it.
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/bin/FileCheck
          # The DTK 26.10 Ubuntu22.04 SDK this stage installs: the runtime image
          # carries it, so the build machine does too.
          - /opt/dtk/env.sh
        dirs:
          # The two find_package() contracts in this backend's CMakeLists:
          # MLIR via the default MLIR_DIR, LLD via hcu's explicit find_package.
          # Neither is an apt package, so both have to come from the staged LLVM.
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/mlir
          - /root/.flagtree/hcu/hcu-llvm22-b0ca808-glibc2.35-glibcxx3.4.30-ubuntu-x86_64/lib/cmake/lld
          # hcu's CMakeLists adds third_party/nvidia and setup.py copies the
          # CUDA redists into it from these caches, so both must be staged.
          - /root/.triton/nvidia/cudart
          - /root/.triton/nvidia/cupti
    daily:
      enabled: false
      dist_name: flagtree-hcu-dtk2610
      version_base: "0.7.0"
      ref: main
      # cp312: the 26.10 line's interpreter (deps python 3.12).
      wheel_tag: cp312-cp312-linux_x86_64

  # Like hcu: the same shape as metax's stage (apt toolchain, the backend's
  # prebuilt LLVM plus the vendor's tx8 headers, and the shared triton deps into
  # FlagTree's cache), with the 22.04 system python 3.10 rather than deadsnakes.
  tsingmicro:
    containerfile: tsingmicro
    builder_image: flagtree-builder-tsingmicro
    runson: ["self-hosted", "tsingmicro"]
    disk_min_gb: 60
    builder:
      verify:
        python: "3.10"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # The compiler FlagTree selects for this backend by bare name, so it has
          # to be on PATH; CMakeLists also copies this FileCheck into the wheel.
          - /root/.flagtree/tsingmicro/tsingmicro-llvm22/bin/clang
          - /root/.flagtree/tsingmicro/tsingmicro-llvm22/bin/FileCheck
        dirs:
          # The two find_package() contracts: MLIR via the default MLIR_DIR, and
          # LLD, which third_party/amd asks for against ${LLVM_LIBRARY_DIR}/cmake/lld.
          - /root/.flagtree/tsingmicro/tsingmicro-llvm22/lib/cmake/mlir
          - /root/.flagtree/tsingmicro/tsingmicro-llvm22/lib/cmake/lld
          # third_party/tsingmicro/CMakeLists include()s this file, and the crt
          # builds its RISC-V runtime with the Xuantie toolchain under it.
          - /root/.flagtree/tsingmicro/tx8_deps/rcs1fw-rtt
          # third_party/nvidia is in the codegen backend list, and setup.py copies
          # the CUDA redists into it from these two caches.
          - /root/.triton/nvidia/cudart
          - /root/.triton/nvidia/cupti
    daily:
      enabled: true
      dist_name: flagtree-tsingmicro
      version_base: "0.7.1"
      ref: main
      # cp310: the 22.04 system interpreter, same as sunrise and hcu.
      wheel_tag: cp310-cp310-linux_x86_64

  # Like tsingmicro: the same shape as metax's stage (apt toolchain, the
  # backend's prebuilt LLVM and the shared triton deps into FlagTree's cache),
  # with the 22.04 system python 3.10 rather than deadsnakes. Its second staged
  # cache is the vendor's local `llc`/`ld.lld`, which the backend resolves by
  # bare name and setup.py copies into `backend/bin` -- hence the two extra
  # files below.
  mthreads:
    containerfile: mthreads
    builder_image: flagtree-builder-mthreads
    runson: ["self-hosted", "musa520"]
    disk_min_gb: 60
    builder:
      verify:
        python: "3.10"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # FlagTreeOptions.cmake names the staged LLVM's clang/clang++ as this
          # backend's compilers and puts its bin on PATH, so no apt clang is
          # installed and this one is the only compiler the build may resolve.
          # CMakeLists also copies this FileCheck into the wheel.
          - /root/.flagtree/mthreads/mthreads-llvm22/bin/clang
          - /root/.flagtree/mthreads/mthreads-llvm22/bin/FileCheck
          # The vendor's local backend tools: compiler.py resolves `llc` and
          # `ld.lld` by bare name through the cache's copy_dst_path.
          - /root/.flagtree/mthreads/mthreads_local_binary/llc
          - /root/.flagtree/mthreads/mthreads_local_binary/ld.lld
        dirs:
          # The two find_package() contracts: MLIR via the default MLIR_DIR and
          # LLD via the sibling LLD_DIR, neither of which is an apt package.
          - /root/.flagtree/mthreads/mthreads-llvm22/lib/cmake/mlir
          - /root/.flagtree/mthreads/mthreads-llvm22/lib/cmake/lld
    daily:
      enabled: true
      dist_name: flagtree-mthreads
      version_base: "0.7.1"
      ref: main
      # cp310: the 22.04 system interpreter, same as sunrise, hcu and tsingmicro.
      wheel_tag: cp310-cp310-linux_x86_64

  kunlunxin:
    containerfile: kunlunxin
    builder_image: flagtree-builder-kunlunxin
    # The backend's own nodes, same reason as metax, iluvatar and the rest: the
    # daily is dispatched for every backend at once and one shared runner would
    # serialize that. This build touches no XPU hardware.
    runson: ["self-hosted", "kunlunxin"]
    # Ten staged tarballs, ~13 GiB uncompressed, plus the compile.
    disk_min_gb: 60
    builder:
      verify:
        python: "3.10"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /root/.triton/json/include/nlohmann/json.hpp
          # The default (public-LLVM) frontend, and the source of `llc19`'s
          # find_package(MLIR)/find_package(LLD) contracts. The bundled patchelf
          # is load-bearing too: without one the LLVM 19 tools keep their
          # DT_RUNPATH and an older ambient libLLVM can win.
          - /root/.flagtree/xpu/llvm-pub22/lib/cmake/mlir/MLIRConfig.cmake
          - /root/.flagtree/xpu/llvm-pub22/lib/cmake/lld/LLDConfig.cmake
          - /root/.flagtree/xpu/llvm-pub22/bin/patchelf
          # The fallback (XTDK) frontend. Its only unconditionally-staged file is
          # the elfconv wrapper: no other package carries it.
          - /root/.flagtree/xpu/llvm_trust/bin/xpu3-elfconv-triton
          # The `llc19` toolchain. Every LLVM 19 tool in this staging has to come
          # from this one package -- `llc` produces the kernel object and `clang`
          # the CRT object, and the two agree on the `.XPU.attributes` section
          # type only within one package.
          - /root/.flagtree/xpu/xtdk-llvm19/bin/llc
          - /root/.flagtree/xpu/xtdk-llvm19/lib/libLLVM.so.19.1
          # The device printf runtime, pinned to its own release: the toolchain
          # snapshot carries the old protocol, which fails `test_print` wholesale.
          - /root/.flagtree/xpu/xtdk-llvm19-printf/lib/linux/libclang_rt.xpuprintf-xpu3.a
          # The two prebuilt-object caches the backend compiles against, and the
          # runtime .so overlay that replaces what cmake copies into xpu3/so.
          - /root/.flagtree/xpu/xpu-sdnn-objects/lib/Dialect/TritonSDNN/Transforms/DSACopy.cpp.o
          - /root/.flagtree/xpu/xpu-python-impl-so/python/triton/backends/intrinsic_tables.abi3.so
          - /root/.flagtree/xpu/xpu-runtime-so/libxpurt.so.12.9.1.kunlun
        dirs:
          # `xre-Linux-x86_64` is reached through a HARDCODED `/xpu/` path in
          # xpu.py, not through the backend key, so the directory has to be there
          # under exactly this name.
          - /root/.flagtree/xpu/xre-Linux-x86_64
    daily:
      enabled: true
      dist_name: flagtree-kunlunxin
      version_base: "0.7.1"
      ref: main
      # cp310: the 22.04 system interpreter, like sunrise, hcu, mthreads and
      # tsingmicro.
      wheel_tag: cp310-cp310-linux_x86_64

  ppu:
    containerfile: ppu
    builder_image: flagtree-builder-ppu
    # The backend's own node, same as every other row: these builds touch no
    # device, but a refresh of every backend must not queue on one runner.
    runson: ["self-hosted", "thead"]
    disk_min_gb: 60
    builder:
      # Declared as data rather than as a second copy of amd's step: the stage is
      # amd's -- bare ubuntu, LLVM through LLVM_SYSPATH, the shared triton deps.
      # ppu is in FlagTree's default+extend codegen group, so the build compiles
      # third_party/amd too and inherits its find_package(LLD), which is why the
      # LLD files are asserted here. It does not inherit amd's 22.04 base: the
      # vendor wheel is a 24.04 build already, so there is no older glibc floor
      # to buy and no interpreter PPA to stage.
      verify:
        python: "3.12"
        commands: [git, cmake, ninja, make, wget, curl]
        files:
          - /usr/local/bin/patch-flagtree-version.py
          # The find_package() contract third_party/amd makes and the header
          # triton_amd.cc includes. Spelled out, not ${LLVM_SYSPATH}: the generic
          # step quotes every path, so a variable would be asserted literally.
          - /opt/llvm-f6ded0be-ubuntu-x64/include/lld/Common/Driver.h
          - /opt/llvm-f6ded0be-ubuntu-x64/lib/cmake/lld/LLDConfig.cmake
          - /opt/llvm-f6ded0be-ubuntu-x64/lib/cmake/mlir/MLIRConfig.cmake
          # nvidia and amd are compiled alongside ppu, so setup.py copies their
          # CUDA redists out of these caches; json is what proton and the PPU
          # headers include.
          - /root/.triton/json/include/nlohmann/json.hpp
          - /opt/build-venv/bin/python3.12
        dirs:
          - /root/.triton/nvidia/cudart
          - /root/.triton/nvidia/cupti
    daily:
      # The first main wheel was A/B'd against the vendor 0.7.0+ppu3.6 in the
      # thead-ppu2.1.0 runtime: identical maxdiff on the nine-op sweep and on
      # torch.compile.
      enabled: true
      dist_name: flagtree-ppu
      version_base: "0.7.1"
      # Upstream's main, which is where the ppu backend lives: there is no
      # vendor-named branch for it, and no ppu tag on the 0.7.1 line yet.
      ref: main
      wheel_tag: cp312-cp312-linux_x86_64

  ascend-cann9.0.0:
    containerfile: ascend-cann9.0.0
    builder_image: flagtree-builder-ascend-cann9.0.0
    # The CANN nodes: this one is aarch64, and the build machine is the backend's
    # own runtime image, so the runner has to be one that can pull it.
    runson: ["self-hosted", "cann900", "910b"]
    disk_min_gb: 60
    builder:
      verify_stage: ascend
      # The one row family whose cold build is NOT a bare ubuntu: the ascend build
      # machine IS the backend's runtime image (FlagTree pins AscendNPU-IR by the
      # CANN it finds there). `runtime` tells the builder line to resolve that tag
      # from configs.yaml rather than take the Containerfile's default.
      base_image: runtime
    daily:
      enabled: true
      dist_name: flagtree-ascend-cann9.0.0
      version_base: "0.7.0"
      # The triton 3.5 line, which is where this CANN line's fixes land: ascend has
      # not moved to triton 3.6, so upstream's main is not this backend's tree.
      ref: triton_v3.5.x
      # cp311 + aarch64: the build machine is the CANN runtime image, so this is
      # neither the deadsnakes 3.12 nor the x86_64 the ubuntu:22.04 stages wear.
      wheel_tag: cp311-cp311-linux_aarch64

  # The cp312 ascend row -- the 9.2.1 runtime pins python 3.12, so this is the
  # only ascend line whose wheel is cp312, not cp311. Same shape as 9.0.0 (3.5
  # FlagTree line, build machine IS the backend's runtime image), differing only
  # in the python312-compat LLVM the cp312 build needs and the cann921 runner.
  ascend-cann9.2.1:
    containerfile: ascend-cann9.2.1
    builder_image: flagtree-builder-ascend-cann9.2.1
    runson: ["self-hosted", "cann921"]
    disk_min_gb: 60
    builder:
      verify_stage: ascend
      base_image: runtime
    daily:
      # On: the builder stage is published and the 9.2.1 wheel builds green end
      # to end on the cann921 node (2026-11-10), including the pybind11 internals
      # check against the runtime's 3.12 venv.
      enabled: true
      dist_name: flagtree-ascend-cann9.2.1
      # The 0.7.1-era line, same as the other current backends; dist_name carries
      # the ascend identity, so the daily version is the date alone.
      version_base: "0.7.1"
      # The triton 3.5 line, same reason as the 9.0.0 row above: FlagTree's ascend
      # backend lives on triton_v3.5.x, not upstream's tip.
      ref: triton_v3.5.x
      wheel_tag: cp312-cp312-linux_aarch64

  ascend-cann8.5.0:
    containerfile: ascend-cann8.5.0
    builder_image: flagtree-builder-ascend-cann8.5.0
    runson: ["self-hosted", "cann850", "910b"]
    disk_min_gb: 60
    builder:
      verify_stage: ascend
      base_image: runtime
    daily:
