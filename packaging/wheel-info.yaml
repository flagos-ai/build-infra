# Wheel package catalog — flagos-ai core components
#
# Apache License 2.0 — Copyright 2026 FlagOS Contributors
#
# Source of truth:
# - Each package's actual publish index (pypi_index) and versions come from the
#   corresponding packaging/ subdirectory, configs.yaml, release-2.2.yaml
#   (flagos-ai/community) and the flagos-ai repositories.
# - This file is an external-facing summary; when a field's meaning changes,
#   update the source and revise this file together.
# - versions is a list of objects, each with version / pypi_index / desc_zh /
#   desc_en / notes. Single-version packages list one; multi-backend or
#   multi-version packages list all.
# - desc_zh / desc_en are one-sentence package intros to help users quickly
#   understand the purpose of that version; notes holds install contracts and
#   other supplementary details (may be empty).
# - Only release versions are listed; candidate (rc) wheels are not
#   catalogued.
# - flagtree versions use local segments: 0.7.0+<triton-line> is the NVIDIA
#   line, 0.7.0+<backend> the per-backend line; each version lists its exact
#   upload index.

