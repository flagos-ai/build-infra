# Excluded packages
# - sglang / sglang-plugin-FL: sglang ships via repack + sdist app-image paths,
#   with no standalone wheel delivery (sglang-plugin-FL is an OOT plugin whose
#   sglang-fl wheel is built inside the app image, tagged per-backend exp branch
#   as 0.1.dev1+g<sha>; tag v0.2.0). Not listed for now.
# - verl: wheel packaging is still planned (packaging/verl/), not yet landed.

# Pypi index quick reference
#   flagos-pypi-hosted   — release packages (the 6 flaglibs libraries, flag_gems
#                          release, megatron-core, flagtree releases)
#   flagos-pypi-{vendor} — per-vendor indexes (flagtree per-backend wheels,
#                          flagcx / torch-fl / vllm and other backend-bound wheels)
