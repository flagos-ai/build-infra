# Facts only, no logic (agent-protocol layer 2): the six pure-Python operator
# libraries published by this line. The version each wheel carries is a pure
# function of the ref it is built from — default_ref is the RELEASE TAG (the
# rc2-branch head; see docs/decisions.md).
#
# scm: true -> setuptools_scm (git tags, needs full clone + tags)
# scm: false -> static version in pyproject/setup.py (shallow tag clone enough)

flag_attn:      {repo: FlagAttention,  default_ref: v0.4.0,  scm: true}
flagsparse:     {repo: FlagSparse,     default_ref: v0.3.0,  scm: false}
flag_blas:      {repo: FlagBLAS,       default_ref: v0.3.0,  scm: false}
flag_audio:     {repo: FlagAudio,      default_ref: v0.3.0,  scm: false}
flagfft-codegen: {repo: FlagFFT,        default_ref: v0.2.0,  scm: false}
flaggems_vllm:  {repo: FlagGems-vllm,  default_ref: v0.2.0,  scm: false}
