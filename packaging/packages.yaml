  versions:
  - 0.14.0
  notes: 各平台的 wheel 由同一份源码构建，因此只有一个源码版本。
  notes_en: Wheels for all platforms are built from this single source, so there is
    one source version.
- name: vllm
  short_name: vLLM (repacked)
  desc_zh: vLLM 推理部署框架的上游源代码。
  desc_en: Upstream source for the vLLM inference and serving framework.
  url: https://github.com/vllm-project/vllm/archive/refs/tags/v{version}.tar.gz
  versions:
  - 0.20.2
  - 0.24.0
  notes: 本站分发的 wheel 由该源码加本地补丁 repack 而成。
  notes_en: The wheels distributed here are repacked from this source with local patches.
- name: vllm-plugin-fl
  short_name: vllm-plugin-FL
  desc_zh: vllm-plugin-FL 插件源代码，为多后端推理补齐 vLLM 算子与服务能力。
  desc_en: Source for the vllm-plugin-FL plugin, which adds multi-backend vLLM operators
    and serving support.
  url: https://github.com/flagos-ai/vllm-plugin-FL/archive/refs/tags/v{version}.tar.gz
  versions:
  - 0.2.2
  - 0.3.0
- name: megatron-core
  short_name: Megatron-LM-FL
  desc_zh: megatron-core 训练框架源代码。
  desc_en: Source for the megatron-core training framework.
  url: https://github.com/flagos-ai/Megatron-LM-FL/archive/refs/tags/v{version}.tar.gz
  versions:
  - 0.2.3
  - 0.3.0
  notes: 取自 FlagOS 维护的 Megatron-LM fork；这里的版本号是 fork 分支号，与 wheel 版本号不同。
  notes_en: Taken from the Megatron-LM fork maintained by FlagOS; the version here
    is the fork branch number and differs from the wheel version.
