  desc_en: FlagTree compiler source. Upstream tags carry the backend segment, so each
    backend has its own source.
  url: https://github.com/flagos-ai/FlagTree/archive/refs/tags/{version}.tar.gz
  versions:
  - 0.7.0+triton3.6
  - 0.7.0+triton3.5
  - 0.6.0+ascend3.2
  - 0.7.0+ascend3.5
  - 0.7.0+enflame3.6
  - 0.7.0+hcu3.6
  - 0.6.1+iluvatar3.6
  - 0.7.0+iluvatar3.6
  - 0.7.0+metax3.6
  - 0.7.0+mthreads3.6
  - 0.7.0+ppu3.6
  - 0.7.0+sunrise3.6
  - 0.7.0+tsingmicro3.6
  - 0.7.0+xpu3.6
- name: flag_gems
  short_name: FlagGems
  desc_zh: FlagGems 高性能算子库源代码，纯 Python、跨后端通用。
  desc_en: Source for the FlagGems operator library; pure Python, shared across backends.
  url: https://github.com/flagos-ai/FlagGems/archive/refs/tags/v{version}.tar.gz
  versions:
  - 5.4.0
- name: flagcx
  short_name: FlagCX
  desc_zh: FlagCX 集合通信库源代码。
  desc_en: Source for the FlagCX collective-communication library.
