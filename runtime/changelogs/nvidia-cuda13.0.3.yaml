# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-nvidia-cuda13.0.3
tags:
- tag: 2.3.0
  entries:
  - reason: >-
      First delivery for this backend: the same torch 2.13 closure the cuda13.3
      line carries (torch 2.13.0+cu130, torchvision 0.28.0+cu130, torchaudio
      2.11.0+cu130, triton 3.7.1 on the T path) on a CUDA 13.0.3 base, so the
      toolkit minor matches the wheels' compile target. flagcx stays at
      0.14.1+cuda13.3 — it is the wheel carrying a libflagcx.so linked against
      libcudart.so.13.
    reason_zh: |-
      本后端首次交付：与 cuda13.3 线相同的 torch 2.13 闭包（torch 2.13.0+cu130、
      torchvision 0.28.0+cu130、torchaudio 2.11.0+cu130，T 路径为 triton 3.7.1），
      基于 CUDA 13.0.3，使工具链小版本与 wheel 的编译目标一致。flagcx 仍为
      0.14.1+cuda13.3 —— 它是唯一携带链接 libcudart.so.13 的 libflagcx.so 的 wheel。
    upstream_prs: []
    date: '2026-11-25T11:54:52.900Z'
