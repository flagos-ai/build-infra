# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-ascend-cann9.2.1-910c
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - First delivery of this backend's runtime image. It layers the python 3.12
        torch closure — torch 2.13.0+cpu, torch-npu 2.13.0, torchvision 0.28.0
        and torchaudio 2.11.0 — plus numpy 1.26.4, cann-shmem 1.6.0 and
        flagcx 0.14.1+cann9.2.1, with FlagGems 5.4.0, on the CANN 9.2.1 910C
        base image.
      - FlagTree is the default compiler, at 0.7.1a1+ascend3.5 — the published
        ascend build that matches python 3.12; triton 3.6.0 with its
        triton_ascend 3.6.0 overlay sits beside it in /opt/triton as the vendor
        fallback, switched with `compiler triton`.
    reason_zh: |-
      - 该后端 runtime 镜像的首次发布。它在 CANN 9.2.1 910C 基础镜像之上叠加了 python 3.12 的
        torch 闭包 —— torch 2.13.0+cpu、torch-npu 2.13.0、torchvision 0.28.0、
        torchaudio 2.11.0 —— 以及 numpy 1.26.4、cann-shmem 1.6.0 与
        flagcx 0.14.1+cann9.2.1，并加入 FlagGems 5.4.0。
      - FlagTree 是默认编译器，版本 0.7.1a1+ascend3.5 —— 与 python 3.12 匹配的已发布
        ascend 构建；triton 3.6.0 及其 triton_ascend 3.6.0 覆盖层安装在 /opt/triton，
        作为厂商侧回退，用 `compiler triton` 切换。
    upstream_prs: []
