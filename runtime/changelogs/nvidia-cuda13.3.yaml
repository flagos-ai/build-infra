# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.

image: flagos-runtime-nvidia-cuda13.3
tags:
- tag: 2.3.0
  entries:
  - date: '2026-10-23T03:45:50.805Z'
    reason: >-
      The flagcx wheel this image carries has been replaced since it was pushed
      (2026-10-17 00:31 UTC): the wheel build that ran before it failed on
      exactly these two nvidia rows and was re-dispatched, and the re-upload
      differs in size from the artifact this build downloaded. Rebuilt with
      no_cache=true so the DEPS layer re-downloads flagcx==0.14.0+cuda13.3
      instead of reusing the cached layer -- an unchanged pin at the same
      version is exactly what the build cache hides.
    upstream_prs: []
