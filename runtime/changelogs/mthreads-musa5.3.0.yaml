# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-mthreads-musa5.3.0
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - First mthreads 5.3.0 runtime image: the MUSA 5.3.0 base plus the python
        3.12 venv, torch 2.13.0.post1+musa20261110, torch_musa, torchaudio
        2.11.0.post2, torchvision 0.28.0.post1+musa5.3.0, mkl 2024.0.0 and
        numpy 1.26.4, with FlagGems 5.4.0.
      - FlagTree and the vendor triton are both installed: `flagtree
        0.7.0+mthreads3.6` at /opt/flagtree is the default compiler (F path),
        `triton-musa 3.6.0+musa5.3.0` at /opt/triton the switchable one (T
        path). The FlagTree wheel is the cp312 build of the version the cp310
        mthreads rows already carry — one version, two wheels, selected by
        interpreter.
      - `flagcx 0.14.1+musa5.3.0` becomes a runtime dependency: configs.yaml
        deps: pins it, so the DEPS install pulls it from the vendor index and
        the libflagcx.so FlagTree resolves is the package's copy rather than
        the one triton/_C bundles.
      - `flagtree_daily: flagtree-mthreads-musa5.3.0` names this line's own
        daily distribution, so `-e FLAGTREE_VERSION=latest` resolves against
        it rather than against the cp310 `flagtree-mthreads` project.
    reason_zh: |-
      - 首个 mthreads 5.3.0 runtime 镜像：MUSA 5.3.0 base 之上加 python 3.12 venv、
        torch 2.13.0.post1+musa20261110、torch_musa、torchaudio 2.11.0.post2、
        torchvision 0.28.0.post1+musa5.3.0、mkl 2024.0.0 与 numpy 1.26.4，
        并加入 FlagGems 5.4.0。
      - 同时装入 FlagTree 与厂商 triton：`flagtree 0.7.0+mthreads3.6` 装在
        /opt/flagtree 并作为默认编译器（F 路径），`triton-musa 3.6.0+musa5.3.0`
        装在 /opt/triton 供切换（T 路径）。所用 FlagTree wheel 是 cp310 的
        mthreads 行已携带的那个版本的 cp312 构建 —— 一个版本、两个 wheel，
        由解释器选择。
      - `flagcx 0.14.1+musa5.3.0` 成为运行时依赖：configs.yaml deps: 固定它，
        因此 DEPS 安装会从厂商索引拉取，FlagTree 解析到的 libflagcx.so 是该
        包中的副本，而不是 triton/_C 自带的那份。
      - 声明 `flagtree_daily: flagtree-mthreads-musa5.3.0`，使
        `-e FLAGTREE_VERSION=latest` 能解析到本条线自己的 daily 项目。
    upstream_prs: []
