# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-mthreads-musa5.3.0
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - First mthreads 5.3.0 runtime image: the MUSA 5.3.0 base plus the python
        3.12 venv, torch 2.13.0.post1+musa20261110, torch_musa, torchaudio
        2.11.0.post2, torchvision 0.28.0.post1+musa5.3.0, mkl 2024.0.0 and
        numpy 1.26.4, with FlagGems 5.4.0.
      - The only compiler is the vendor triton, `triton-musa 3.6.0+musa5.3.0`:
        no FlagTree build for this line exists on python 3.12 yet, so the image
        is T path only.
    reason_zh: |-
      - 首个 mthreads 5.3.0 runtime 镜像：MUSA 5.3.0 base 之上加 python 3.12 venv、
        torch 2.13.0.post1+musa20261110、torch_musa、torchaudio 2.11.0.post2、
        torchvision 0.28.0.post1+musa5.3.0、mkl 2024.0.0 与 numpy 1.26.4，
        并加入 FlagGems 5.4.0。
      - 唯一编译器是厂商 triton —— `triton-musa 3.6.0+musa5.3.0`：本条线尚无
        python 3.12 的 FlagTree 构建，因此镜像只有 T 路径。
    upstream_prs: []
