# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-amd-rocm7.2.4
tags:
- tag: 2.3.0
  entries:
  - reason: >-
      The image carries this backend's daily-line distribution name, so
      `-e FLAGTREE_VERSION=latest` resolves on it: the container starts on the
      newest `flagtree-amd` wheel from the daily index, which leads the next
      release.
    reason_zh: >-
      镜像带有该后端的 daily 线发布名，因此
      `-e FLAGTREE_VERSION=latest` 可在其上解析：容器以 daily 索引上最新的
      `flagtree-amd` wheel 启动，该版本领跑下一个 release。
    upstream_prs: []
    date: '2026-11-13T07:28:41.095Z'
  - reason: >-
      Rebuild to ship the current in-image helper script: the `compiler`
      script's pip installs now honour a pip cache mounted at `PIP_CACHE_DIR`
      instead of re-downloading the wheel every time (#1709). The FlagTree
      version request also accepts an explicit `--index-url`, which selects
      the one index the wheel is fetched from (#1613). Nothing else about the
      image changes.
    reason_zh: |-
      重建以带上当前版本镜像内的辅助脚本：`compiler` 脚本的 pip 安装现在会使用挂载在 `PIP_CACHE_DIR` 的 pip
      缓存，而不再每次都重新下载 wheel（#1709）。FlagTree 版本请求同时支持显式 `--index-url`，用于指定唯一取 w
      heel 的索引（#1613）。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-10T09:01:05.011Z'
  - reason: >-
      Moves this backend's torch closure to the versions vLLM 0.32 pins:
      torch 2.13.0+rocm7.2, torchvision 0.28.0+rocm7.2, and the ROCm triton
      that torch 2.13 declares — triton-rocm 3.7.1 instead of 3.6.0.
      torchaudio stays at 2.11.0+rocm7.2, which is what 0.32 pins too.
      FlagTree stays at 0.7.0+amd3.6: no amd3.7 tag exists yet, and torch
      2.13's own floor is triton 3.6, so the default compiler keeps working
      against the newer vendor triton.
    reason_zh: |-
      该后端的 torch 闭包升到 vLLM 0.32 所钉的版本：torch 2.13.0+rocm7.2、
      torchvision 0.28.0+rocm7.2，以及 torch 2.13 声明的 ROCm triton
      —— triton-rocm 3.7.1（不再是 3.6.0）。torchaudio 保持 2.11.0+rocm7.2，
      这也是 0.32 所钉的版本。FlagTree 保持 0.7.0+amd3.6：目前没有 amd3.7 tag，
      而 torch 2.13 自身的下限是 triton 3.6，因此默认编译器仍可与较新的 vendor
      triton 共存。
    upstream_prs: []
    date: '2026-11-02T12:16:13.085Z'
  - reason: >-
      Adds amdsmi 7.0.2 to this backend's runtime dependencies. vLLM's ROCm
      platform probe is amdsmi-only — it no longer falls back to `torch.version.hip`.
      The base image ships ROCm's amdsmi source tree under /opt/rocm/share/amd_smi
      but never installs it, and the amd-smi CLI does not expose the Python API.
    reason_zh: |-
      为该后端的 runtime 依赖新增 amdsmi 7.0.2。vLLM 的 ROCm 平台探测只认 amdsmi，
      不再回退到 `torch.version.hip`。基础镜像自带 ROCm 的 amdsmi 源码树
      （/opt/rocm/share/amd_smi）但从未安装，而 amd-smi 命令行工具并不暴露 Python API。
    upstream_prs: []
    date: '2026-11-01T10:52:01.222Z'
  - reason: >-
      Rebuilt on the corrected base image: the `HIP_VISIBLE_DEVICES=all` ENV is
      gone, so this image now enumerates every GPU out of the box instead of
      zero. HIP 7.2 takes ordinals or GPU-UUIDs only, and the base image had
      been setting the NVIDIA-style `all`, which parsed to an empty device
      list: `torch.cuda.device_count()` returned 0 while `rocm-smi` listed
      every card. No package, compiler or version changes — the venv and the
      flagcx dependency are the same as the previous push.
    reason_zh: |-
      基于修正后的基础镜像重建：`HIP_VISIBLE_DEVICES=all` 这个 ENV 已移除，因此该镜像现在
      开箱即可枚举全部 GPU，而不再枚举到 0 张卡。HIP 7.2 只接受设备序号或 GPU UUID，
      而基础镜像此前设置的是 NVIDIA 习惯的 `all`，被解析成空设备列表：
      `torch.cuda.device_count()` 返回 0，而 `rocm-smi` 却能列出全部卡。
      包、编译器与版本均无变化 —— venv 和 flagcx 依赖与上一次推送完全相同。
    upstream_prs: []
    date: '2026-10-31T13:13:04.914Z'
  - reason: >-
      flagcx 0.14.1 becomes a runtime dependency on this backend: configs.yaml
      deps: now pins flagcx==0.14.1+rocm7.2.4, so the DEPS install pulls it from
      the vendor index and FlagTree resolves libflagcx.so to the package's copy
      instead of the one triton/_C bundles. Nothing else about the image changes.
    reason_zh: |-
      flagcx 0.14.1 成为该后端的运行时依赖：configs.yaml deps: 现在固定 flagcx==0.14.1+rocm7.2.4，
      因此 DEPS 安装会从厂商索引拉取它，FlagTree 会把 libflagcx.so 解析到该包中的副本，
      而不是 triton/_C 自带的那份。镜像其余内容不变。
    upstream_prs: []
    date: '2026-10-31T09:25:08.639Z'
  - date: '2026-10-27T10:04:40.825Z'
    reason: >-
      This image's base gains the hipsolver, hipfft and miopen-hip development
      packages. torch's headers include theirs under USE_ROCM, and the flagcx
      torch wheel compiles against them in this image, so the three are
      required for the wheel build to succeed.
    reason_zh: |-
      该镜像的基础镜像新增 hipsolver、hipfft 与 miopen-hip 开发包。torch 的头文件在 USE_ROCM
      下会引入这些包，而 flagcx 的 torch wheel 在本镜像内针对它们编译，因此 wheel 构建成功需要这三个包。
    upstream_prs: []
  - date: '2026-10-27T06:29:51.924Z'
    reason: >-
      First release of this backend's runtime image. It layers the ROCm torch
      closure — torch 2.11.0+rocm7.2, torchvision 0.26.0+rocm7.2, torchaudio
      2.11.0+rocm7.2, numpy 1.26.4 — and the ROCm triton 3.6.0 that ships the
      amd backend, alongside FlagTree 0.7.0+amd3.6 and FlagGems 5.4.0 on the
      base image (ROCm 7.2.4, gfx1100).
    reason_zh: |-
      该后端 runtime 镜像的首次发布。它在基础镜像（ROCm 7.2.4，gfx1100）之上叠加了 ROCm torch 闭包
      —— torch 2.11.0+rocm7.2、torchvision 0.26.0+rocm7.2、torchaudio 2.11.0+rocm7.2、
      numpy 1.26.4 —— 以及 amd 后端随附的 ROCm triton 3.6.0，并加入 FlagTree 0.7.0+amd3.6
      与 FlagGems 5.4.0。
    upstream_prs: []
