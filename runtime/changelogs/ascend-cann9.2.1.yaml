# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-ascend-cann9.2.1
tags:
- tag: 2.3.0
  entries:
  - reason: >-
      flagcx 0.14.1+cann9.2.1 becomes a runtime dependency on this backend:
      configs.yaml deps: now pins flagcx==0.14.1+cann9.2.1, so the DEPS install
      pulls it from the vendor index and FlagTree resolves libflagcx.so to the
      package's copy instead of the one triton/_C bundles. Nothing else about
      the image changes.
    reason_zh: >-
      flagcx 0.14.1+cann9.2.1 成为该后端的运行时依赖：configs.yaml deps: 现在固定
      flagcx==0.14.1+cann9.2.1，因此 DEPS 安装会从厂商索引拉取它，FlagTree 会把
      libflagcx.so 解析到该包中的副本，而不是 triton/_C 自带的那份。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-04T07:42:15.915Z'
  - reason: |-
      - First delivery of this backend's runtime image. It layers the python 3.12
        torch closure — torch 2.13.0+cpu, torch-npu 2.13.0, torchvision 0.28.0
        and torchaudio 2.11.0 — plus numpy 1.26.4 and cann-shmem 1.6.0, with
        FlagGems 5.4.0, on the CANN 9.2.1 base image.
      - FlagTree is the default compiler, at 0.7.1a1+ascend3.5 — the published
        ascend build that matches python 3.12. It carries the AscendNPU-IR
        v1.2.x pin rather than one matched to this CANN's bishengir 2.0.0, a
        mismatch measured as no regression across the vllm-critical op set.
      - triton 3.6.0 with its triton_ascend 3.6.0 overlay installs beside it in
        /opt/triton as the vendor fallback, switched with `compiler triton`.
    reason_zh: |-
      - 该后端 runtime 镜像的首次发布。它在 CANN 9.2.1 基础镜像之上叠加了 python 3.12 的
        torch 闭包 —— torch 2.13.0+cpu、torch-npu 2.13.0、torchvision 0.28.0、
        torchaudio 2.11.0 —— 以及 numpy 1.26.4 与 cann-shmem 1.6.0，并加入 FlagGems 5.4.0。
      - FlagTree 是默认编译器，版本 0.7.1a1+ascend3.5 —— 与 python 3.12 匹配的已发布
        ascend 构建。它携带的是 AscendNPU-IR v1.2.x 的 pin，而非与本 CANN 的
        bishengir 2.0.0 相匹配的 pin；该错配在 vllm 关键算子集上实测无回退。
      - triton 3.6.0 及其 triton_ascend 3.6.0 覆盖层安装在 /opt/triton，作为厂商侧回退，
        用 `compiler triton` 切换。
    upstream_prs: []
    date: '2026-11-04T06:08:40.121Z'
