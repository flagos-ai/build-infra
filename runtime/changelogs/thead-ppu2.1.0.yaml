# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-thead-ppu2.1.0
tags:
- tag: 2.3.0
  entries:
  - reason: >-
      The image carries this backend's daily-line distribution name, so
      `-e FLAGTREE_VERSION=latest` resolves on it: the container starts on the
      newest `flagtree-ppu` wheel from the daily index, which leads the next
      release.
    reason_zh: >-
      镜像带有该后端的 daily 线发布名，因此
      `-e FLAGTREE_VERSION=latest` 可在其上解析：容器以 daily 索引上最新的
      `flagtree-ppu` wheel 启动，该版本领跑下一个 release。
    upstream_prs: []
  - reason: |-
      - Adds torchvision 0.25.0+v0.1.0.ppu2.1.1 and torchaudio
        2.10.0+v0.1.0.ppu2.1.1 to the python 3.12 closure, so the PPU runtime
        carries the same torch-ecosystem triplet the other vendor runtimes do.
      - Both are T-Head's real cp312 vendor wheels, transloaded onto
        flagos-pypi-thead the same way torch is.
    reason_zh: |-
      - python 3.12 闭包中加入 torchvision 0.25.0+v0.1.0.ppu2.1.1 与 torchaudio
        2.10.0+v0.1.0.ppu2.1.1，使 PPU runtime 与其他厂商 runtime 一样带齐
        torch 生态三件套。
      - 两者均为平头哥真实的 cp312 厂商 wheel，与 torch 一样转存到
        flagos-pypi-thead。
    upstream_prs: []
    date: '2026-11-11T12:06:55.060Z'
  - reason: >-
      Rebuild to ship the current in-image helper script: the `compiler`
      script's pip installs now honour a pip cache mounted at `PIP_CACHE_DIR`
      instead of re-downloading the wheel every time (#1709). Nothing else
      about the image changes.
    reason_zh: |-
      重建以带上当前版本镜像内的辅助脚本：`compiler` 脚本的 pip 安装现在会使用挂载在 `PIP_CACHE_DIR` 的 pip
      缓存，而不再每次都重新下载 wheel（#1709）。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-10T09:01:19.356Z'
  - reason: |-
      - First delivery of this backend's runtime image, layered on the PPU
        2.1.0 base. It installs the python 3.12 closure into the uv venv: torch
        2.10.0+v0.1.0.ppu2.1.1 and numpy 1.26.4, with FlagGems 5.4.0.
      - torch and triton are T-Head's real vendor wheels (build-line tag
        ppu2.1.1) pulled from flagos-pypi-thead, not the vendor's sdist stubs.
      - FlagTree is the default compiler at 0.7.0+ppu3.6; triton
        3.5.0+v0.2.0.ppu2.1.1 installs beside it in /opt/triton as the vendor
        fallback, switched with `compiler triton`. No cpp FlagGems wheel: the
        FlagGems release map has no PPU backend.
    reason_zh: |-
      - 该后端 runtime 镜像的首次发布，叠加在 PPU 2.1.0 基础镜像之上。它把 python 3.12
        闭包装进 uv venv：torch 2.10.0+v0.1.0.ppu2.1.1 与 numpy 1.26.4，并加入
        FlagGems 5.4.0。
      - torch 与 triton 是平头哥的真实厂商 wheel（构建线标签 ppu2.1.1），从
        flagos-pypi-thead 拉取，而非厂商的 sdist 存根。
      - FlagTree 是默认编译器，版本 0.7.0+ppu3.6；triton 3.5.0+v0.2.0.ppu2.1.1
        安装在 /opt/triton 作为厂商侧回退，用 `compiler triton` 切换。无 cpp FlagGems
        wheel：FlagGems 发布映射中没有 PPU 后端。
    upstream_prs: []
    date: '2026-11-07T03:18:12.809Z'
