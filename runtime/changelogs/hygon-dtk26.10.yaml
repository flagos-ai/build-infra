# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-hygon-dtk26.10
tags:
- tag: 2.3.0
  entries:
  - reason: >-
      Rebuild to ship the current in-image helper script: the `compiler`
      script's pip installs now honour a pip cache mounted at `PIP_CACHE_DIR`
      instead of re-downloading the wheel every time (#1709). Nothing else
      about the image changes.
    reason_zh: |-
      重建以带上当前版本镜像内的辅助脚本：`compiler` 脚本的 pip 安装现在会使用挂载在 `PIP_CACHE_DIR` 的 pip
      缓存，而不再每次都重新下载 wheel（#1709）。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-10T09:27:16.760Z'
  - reason: |-
      - Vendor triton moves to `3.7.0+dtk2610.torch2120.2611032029.g56f888`: its
        `nvidia` driver no longer claims the device, so `hcu` is the only active
        driver and Triton is no longer disabled at startup. Under the previous
        `torch2130` build both `amd`/`nvidia` probing and the DTK CUDA stub left
        two drivers active, so every serve fell back to the V1 model runner.
      - The wheel declares no `torch` requirement, so it installs without
        dragging a second torch into the DEPS step.
    reason_zh: |-
      - vendor triton 升级到 `3.7.0+dtk2610.torch2120.2611032029.g56f888`：其 `nvidia`
        驱动不再抢占设备，只有 `hcu` 处于 active，启动时 Triton 不再被整体禁用。此前的
        `torch2130` 版本下 DTK 的 CUDA stub 使两个驱动同时 active，每次 serve 都退回
        V1 model runner。
      - 该 wheel 不再声明 `torch` 依赖，安装时不会在 DEPS 阶段拉入第二个 torch。
    upstream_prs: []
    date: '2026-11-04T11:53:19.657Z'
  - reason: |-
      - First release of this backend's runtime image: python 3.12 with the DTK
        26.10 torch closure (torch 2.13.0, torchvision 0.28.0, torchaudio 2.11.0,
        apex 1.7.0, flash_attn 2.8.4, numpy 1.26.4), FlagTree 0.7.0+hcu3.6 and
        FlagGems 5.4.0, above the 26.10 base image.
      - flagcx==0.14.1+dtk2610 is now a runtime dependency: FlagTree resolves
        libflagcx.so to the package's copy instead of the one triton/_C bundles.
    reason_zh: |-
      - 该后端 runtime 镜像的首次发布：python 3.12 加 DTK 26.10 的 torch 闭包（torch 2.13.0、
        torchvision 0.28.0、torchaudio 2.11.0、apex 1.7.0、flash_attn 2.8.4、numpy 1.26.4），
        以及 FlagTree 0.7.0+hcu3.6 与 FlagGems 5.4.0，构建于 26.10 基础镜像之上。
      - flagcx==0.14.1+dtk2610 成为运行时依赖：FlagTree 会把 libflagcx.so 解析到该包中的
        副本，而不是 triton/_C 自带的那份。
    upstream_prs: []
    date: '2026-11-01T02:02:26.616Z'
