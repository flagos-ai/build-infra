# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.

image: flagos-runtime-kunlunxin-xre5.37.1
tags:
- tag: 2.3.0
  entries:
  - date: '2026-10-23T03:58:31.975Z'
    reason: >-
      flagcx 0.14.0 becomes a runtime dependency on this backend: configs.yaml
      deps: now pins flagcx==0.14.0+xre5.37.1, so the DEPS install pulls it from
      the vendor index and FlagTree resolves libflagcx.so to the package's copy
      instead of the one triton/_C bundles. Nothing else about the image
      changes.
    upstream_prs: []
  - date: '2026-10-17T00:39:20.900Z'
    reason: >-
      This image first carried the FlagTree version override (build-infra
      #1342, merged 2026-10-14): zz-flagos.sh now honours a FlagTree version
      requested at container start (`docker run -e FLAGTREE_VERSION=<ver>`),
      and `compiler flagtree <ver>` does the same in a running container. The
      requested wheel is installed into /opt/flagtree in place -- fetched from
      this image's own vendor index (/etc/flagos/flagtree-index, written at
      build time), with the shared lane as a sequential second attempt -- so a
      FlagTree bump no longer forces a rebuild of this image and of every app
      image above it. A failed install warns and leaves the baked compiler
      active. Recorded late: this push is older than the entry above it, and
      its date is the push that first carried the override.
    upstream_prs: []
