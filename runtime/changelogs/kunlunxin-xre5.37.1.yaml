# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-kunlunxin-xre5.37.1
tags:
- tag: 2.3.0
  entries:
  - date: '2026-10-25T10:02:11.720Z'
    reason: >-
      This image gains the container-start version request: `-e
      FLAGTREE_VERSION=<ver|latest>` and `-e FLAGGEMS_VERSION=<ver|latest>`
      override the versions baked in, resolved from the image's own indexes
      before the application starts. `latest` takes the newest wheel on the
      daily line. A request that cannot be honoured stops the container with
      a non-zero exit rather than letting it run on a different version. The
      image bakes the files those requests read, among them the constraints
      file that holds an in-container FlagGems install to this image's own
      pins.
    reason_zh: |-
      该镜像新增容器启动时的版本请求：`-e FLAGTREE_VERSION=<ver|latest>` 与 `-e FLAGGEMS_VERSION=<ver|latest>` 可覆盖镜像内烘焙的版本，在应用启动前从镜像自带的索引解析。`latest` 取 daily 线上最新的 wheel。无法满足的请求会以非零退出码终止容器，而不是让它以另一个版本运行。镜像烘焙了这些请求所读取的文件，其中包含把容器内的 FlagGems 安装约束到本镜像自身 pin 的 constraints 文件。
    upstream_prs: []
  - date: '2026-10-23T03:58:31.975Z'
    reason: >-
      flagcx 0.14.0 becomes a runtime dependency on this backend: configs.yaml
      deps: now pins flagcx==0.14.0+xre5.37.1, so the DEPS install pulls it from
      the vendor index and FlagTree resolves libflagcx.so to the package's copy
      instead of the one triton/_C bundles. Nothing else about the image
      changes.
    reason_zh: |-
      flagcx 0.14.0 成为该后端的运行时依赖：configs.yaml deps: 现在固定 flagcx==0.14.0+xre5.37.1，因此 DEPS 安装会从厂商索引拉取它，FlagTree 会把 libflagcx.so 解析到该包中的副本，而不是 triton/_C 自带的那份。镜像其余内容不变。
    upstream_prs: []
  - date: '2026-10-17T00:39:20.900Z'
    reason: >-
      This image first carried the FlagTree version override (build-infra
      #1342, merged 2026-10-14): zz-flagos.sh now honours a FlagTree version
      requested at container start (`docker run -e FLAGTREE_VERSION=<ver>`),
      and `compiler flagtree <ver>` does the same in a running container. The
      requested wheel is installed into /opt/flagtree in place -- fetched from
      this image's own vendor index (/etc/flagos/vendor-index, written at
      build time), with the shared lane as a sequential second attempt -- so a
      FlagTree bump no longer forces a rebuild of this image and of every app
      image above it. A failed install warns and leaves the baked compiler
      active. Recorded late: this push is older than the entry above it, and
      its date is the push that first carried the override.
    reason_zh: |-
      该镜像首次携带 FlagTree 版本覆盖（build-infra #1342，2026-10-14 合并）：zz-flagos.sh 现在支持在容器启动时请求 FlagTree 版本（`docker run -e FLAGTREE_VERSION=<ver>`），`compiler flagtree <ver>` 在运行中的容器里做同样的事。所请求的 wheel 会就地安装到 /opt/flagtree —— 从本镜像自带的厂商索引（/etc/flagos/vendor-index，构建时写入）获取，并以共享 lane 作为按顺序的第二次尝试 —— 因此 FlagTree 升级不再强制重建本镜像及其上层的每一个 app 镜像。安装失败会告警并保留已烘焙的编译器生效。补记：本次推送早于其上一条记录，其日期即首次携带该覆盖的那次推送。
    upstream_prs: []
