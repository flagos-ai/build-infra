# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.

image: flagos-runtime-iluvatar-corex5.0.1
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - Installs the newly published `flagcx==0.14.1+corex5.0.1`, so FlagTree
        links the package's `libflagcx.so` instead of the copy `triton/_C`
        bundles. Nothing else about the image changes.
    reason_zh: |-
      - 装上新发布的 `flagcx==0.14.1+corex5.0.1`，FlagTree 因而链接该包的
        `libflagcx.so`，而不是 `triton/_C` 内置的那份。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-12T14:54:16.328Z'
  - reason: |-
      - Rebuilt on the base that now installs `libopenmpi3t64`, so `import torch`
        finds `libmpi.so.40` (through `torch_nvshmem`) and the flagcx wheel can
        be imported in this runtime. Nothing else about the image changes.
    reason_zh: |-
      - 基于补装 `libopenmpi3t64` 的 base 重建，使 `import torch` 能找到
        `libmpi.so.40`（经 `torch_nvshmem`），flagcx wheel 因而可在本 runtime
        中导入。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-12T14:27:06.040Z'
  - reason: |-
      - Rebuilt on the base that now carries the CoreX driver userspace
        (libcuda.so.1, libixml.so, ixsmi), so `import torch` works in this
        runtime. Nothing else about the image changes.
    reason_zh: |-
      - 基于补上 CoreX 驱动用户态（libcuda.so.1、libixml.so、ixsmi）的 base
        重建，使本 runtime 中 `import torch` 可用。镜像其余内容不变。
    upstream_prs: []
    date: '2026-11-12T09:48:29.403Z'
  - reason: |-
      - First corex5.0.1 runtime image: the corex5.0.1 base plus the python 3.12
        venv, torch 2.13.0 / torchvision 0.28.0 / torchaudio 2.11.0 / triton
        3.6.0 (all +corex.5.0.1), FlagTree and FlagGems.
    reason_zh: |-
      - 首个 corex5.0.1 runtime 镜像：corex5.0.1 base 之上加 python 3.12 venv、
        torch 2.13.0 / torchvision 0.28.0 / torchaudio 2.11.0 / triton 3.6.0
        （均 +corex.5.0.1）、FlagTree 与 FlagGems。
    upstream_prs: []
    date: '2026-11-12T07:50:26.999Z'
