# Per-image changelog; schema and rules: docs/changelog.md.
# `date` is backfilled by runtime-image.yml after the push -- never hand-typed.
# `reason` is written in English and Chinese (`reason_zh`); both are
# required on a new entry and both are published beside the image.

image: flagos-runtime-metax-maca3.10.1.11
tags:
- tag: 2.3.0
  entries:
  - reason: |-
      - First delivery: the runtime for MetaX MACA 3.10.1.11 (C550), built on
        the flagos-base-metax-maca3.10.1.11:2.3.0 base. Deps pin torch 2.13.0,
        apex, torchcodec, torchaudio, torchvision, flash_attn, flashinfer,
        flash_linear_attention and flash_mla from the vendor's 3.10.1.3 wheel
        line, plus flagcx 0.14.1+maca3.10.1.11.
      - Ships FlagTree 0.7.0 with Triton 3.6.0 as the side install. The FlagTune
        cost model is off: a partial flagtune puts its errors outside the
        fallback set, aborting the operator instead of degrading.
      - mcoplib is deliberately absent: its `_C` extension registers
        TORCH_LIBRARY(_C) exactly as vllm_fl._C does, so a process importing
        both aborts at plugin load.
    reason_zh: |-
      - 首次交付：MetaX MACA 3.10.1.11（C550）的 runtime，基于 flagos-base-metax-maca3.10.1.11:2.3.0 base 构建。deps 固定厂商 3.10.1.3 wheel 线的 torch 2.13.0、apex、torchcodec、torchaudio、torchvision、flash_attn、flashinfer、flash_linear_attention 与 flash_mla，以及 flagcx 0.14.1+maca3.10.1.11。
      - 带 FlagTree 0.7.0，Triton 3.6.0 作为侧装。FlagTune cost model 关闭：不完整的 flagtune 会把自己的异常排除在回退集之外，直接中止算子而不是降级。
      - 有意不装 mcoplib：它的 `_C` 扩展与 vllm_fl._C 一样注册 TORCH_LIBRARY(_C)，同一进程同时导入会在插件加载时中止。
    upstream_prs: []
