name: Native Deb Package

# Build .deb packages containing compiled code from a component repository's
# own packaging definition, and publish them to the FlagOS apt repositories.
# The native sibling of noarch-deb.yml, and the deb sibling of native-rpm.yml.
#
# One build per distribution suite rather than one shared build: each suite
# links against its own system Python and C++ runtime with no external PPA, and
# stamps +<id><version_id> onto the package revision so each repository serves
# an ABI-matched build.
#
# Dispatch-only: a .deb is a release artifact, nothing here is worth running on
# a push.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'component and package class to build'
        type: choice
        required: true
        options:
          - libtriton_jit
          - FlagTree
          - FlagTree-metax
          - FlagTree-amd
          - FlagTree-enflame
          - FlagTree-ppu
          - FlagTree-tileir
          - FlagTree-hcu
          - FlagTree-mthreads
          - FlagTree-tsingmicro
          - FlagTree-xpu
          - FlagDNN
          - FlagTensor
          - FlagFFT
          - flagtree-cpu
      ref:
        description: >-
          git ref to build. Leave empty to use the ref this target is pinned to.
          A tag is preferred: a branch head moves under later cherry-picks, so
          the same dispatch would not build the same source twice. Or
          `pull/<N>`: the head of that pull request, to run a packaging change
          through this workflow before it is merged (verify only; such a build
          can not be published).
        type: string
        default: ''
      version:
        description: >-
          release version to stamp, as the manifest spells it
          (e.g. v0.2.0-rc0.1). Leave empty to derive it from the ref when the
          ref is a version tag, and to leave the changelog alone otherwise.
        type: string
        default: ''
      suites:
        description: >-
          apt suites to publish into, space-separated (ubuntu22.04 ubuntu24.04).
          Leave empty to publish into every suite this target was built and
          verified for.
        type: string
        default: ''
      arches:
        description: >-
          Debian architectures to build, space-separated (amd64 arm64). Leave
          empty to build every architecture this target is valid for.
        type: string
        default: ''
      verify:
        description: 'install the .deb in a clean container before uploading'
        type: boolean
        default: true
      publish:
        description: 'push the verified .deb to the apt repositories (requires verify)'
        type: boolean
        default: false

env:
  NEXUS_REPO_BASE: https://resource.flagos.net/repository

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    outputs:
      built_sha: ${{ steps.clone.outputs.sha }}
      deps: ${{ steps.cfg.outputs.deps }}
      publish_runs_on: ${{ steps.cfg.outputs.publish_runs_on }}
    strategy:
      fail-fast: false
      matrix:
        suite: [ubuntu22.04, ubuntu24.04]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            packaging/syspkg-targets.yaml
            scripts/clone-ref.sh
            scripts/resolve_pkg_target.py
            scripts/stamp_pkg_version.py
          sparse-checkout-cone-mode: false

      - name: Resolve the target
        id: cfg
        env:
          TARGET: ${{ inputs.target }}
          SUITE: ${{ matrix.suite }}
          SUITES_REQ: ${{ inputs.suites }}
          ARCH: ${{ matrix.arch }}
          ARCHES: ${{ inputs.arches }}
          REF_REQ: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_pkg_target.py native deb \
            --target "${TARGET}" \
            --suite "${SUITE}" \
            --arch "${ARCH}" \
            --suites-req "${SUITES_REQ}" \
            --arches-req "${ARCHES}" \
            --ref "${REF_REQ}"

      - name: Refuse to publish what was not verified
        if: ${{ inputs.publish }}
        env:
          SUITES: ${{ inputs.suites }}
          VALID_SUITES: ${{ steps.cfg.outputs.valid_suites }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.verify }}" != "true" ]; then
            echo "::error::publish requires verify - an unverified package must not reach the repository"
            exit 1
          fi
          echo "Publish targets: ${SUITES:-${VALID_SUITES}}"

      - name: Clone ${{ inputs.target }}
        id: clone
        env:
          REF: ${{ steps.cfg.outputs.effective_ref }}
          PUBLISH: ${{ inputs.publish }}
          REQUIRE_TAG_PUBLISH: ${{ steps.cfg.outputs.require_tag_publish }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == pull/* && "${PUBLISH}" == "true" ]]; then
            echo "::error::${REF} is a pull request head; it can be built and verified but not published"
            exit 1
          fi
          scripts/clone-ref.sh --submodules "${{ steps.cfg.outputs.repo_url }}" "${REF}" src
          cd src
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          tag_sha=$(git rev-parse -q --verify "refs/tags/${REF}^{commit}" || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" = "$sha" ]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            if [ "${PUBLISH}" = "true" ] && [ "${REQUIRE_TAG_PUBLISH}" = "true" ]; then
              echo "::error::${{ inputs.target }} requires a release tag when publish=true (got non-tag ref '${REF}'); cut and pass a tag first"
              exit 1
            fi
            echo "::warning::${REF} is a branch, not a tag - this build is not reproducible by ref name alone"
          fi
          echo "Built ${REF} = ${sha}"
          test -f "${{ steps.cfg.outputs.script }}" \
            || { echo "::error::ref '${REF}' has no Debian packaging definition"; exit 1; }

      - name: Stamp the release version
        working-directory: src
        env:
          REF: ${{ steps.clone.outputs.ref }}
          REF_IS_TAG: ${{ steps.clone.outputs.is_tag }}
          REQUESTED: ${{ inputs.version }}
          PINNED: ${{ inputs.ref == '' && steps.cfg.outputs.default_version || '' }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/stamp_pkg_version.py" deb packaging/debian/changelog \
            --ref "${REF}" \
            --is-tag "${REF_IS_TAG}" \
            --requested "${REQUESTED}" \
            --pinned "${PINNED}"
          head -1 packaging/debian/changelog

      - name: Skip a row this target is not built for
        if: ${{ steps.cfg.outputs.base_image == '' || steps.cfg.outputs.build_arch != 'true' }}
        run: |
          if [ -z "${{ steps.cfg.outputs.base_image }}" ]; then
            echo "::notice::${{ inputs.target }} is not built for ${{ matrix.suite }}; skipping"
          else
            echo "::notice::${{ inputs.target }} is not built for ${{ matrix.arch }} (valid: ${{ steps.cfg.outputs.arches }})"
          fi

      - name: Fetch FlagOS build dependencies for ${{ matrix.suite }}
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' && steps.cfg.outputs.deps != '' }}
        working-directory: src
        env:
          DEPS: ${{ steps.cfg.outputs.deps }}
          SUITE: ${{ matrix.suite }}
          CODENAME: ${{ steps.cfg.outputs.codename }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          base="${NEXUS_REPO_BASE}/flagos-apt-${SUITE}"
          curl -fsSL "${base}/dists/${CODENAME}/main/binary-${ARCH}/Packages" -o Packages
          mkdir -p packaging/debian/local-deps
          for dep in ${DEPS}; do
            best=''; bestver=''
            while IFS='|' read -r ver file; do
              if [ -z "$bestver" ] || dpkg --compare-versions "$ver" gt "$bestver"; then
                best="$file"; bestver="$ver"
              fi
            done < <(awk -v p="$dep" 'BEGIN{RS="";FS="\n"} {n=v=f=""; for(i=1;i<=NF;i++){
                       if($i~/^Package: /)n=substr($i,10); if($i~/^Version: /)v=substr($i,10);
                       if($i~/^Filename: /)f=substr($i,11)} if(n==p)print v"|"f}' Packages)
            [ -n "$best" ] || { echo "::error::${dep} is not in flagos-apt-${SUITE}"; exit 1; }
            echo ">>> ${dep} ${bestver}"
            curl -fsSL "${base}/${best}" -o "packaging/debian/local-deps/$(basename "$best")"
          done
          rm Packages

      - name: Build the .deb packages for ${{ matrix.suite }} on ${{ matrix.arch }}
        id: build
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        working-directory: src
        env:
          BASE_IMAGE: ${{ steps.cfg.outputs.base_image }}
          SCRIPT_ARG: ${{ steps.cfg.outputs.script_arg }}
        run: |
          set -euo pipefail
          case "${{ steps.cfg.outputs.base_arg }}" in
            flag) bash "${{ steps.cfg.outputs.script }}" --base-image "${BASE_IMAGE}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            env)  DEB_BASE_IMAGE="${BASE_IMAGE}" bash "${{ steps.cfg.outputs.script }}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            arg)  bash "${{ steps.cfg.outputs.script }}" "${BASE_IMAGE}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            *)    echo "::error::unknown base_arg"; exit 1 ;;
          esac
          mapfile -t debs < <(find "${{ steps.cfg.outputs.outdir }}" -name '*.deb' | sort)
          [ "${#debs[@]}" -gt 0 ] || { echo "::error::the build produced no .deb"; exit 1; }
          mkdir -p out && cp "${debs[@]}" out/
          echo "${{ matrix.suite }}" > out/SUITE
          echo "Built ${#debs[@]} package(s):"
          for d in "${debs[@]}"; do
            echo ">>> $(basename "$d")"
            dpkg-deb -f "$d" Package Version Architecture Depends
          done

      - name: Record built row manifest
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        run: |
          mkdir -p built-manifest
          echo "${{ matrix.suite }} ${{ matrix.arch }} ${{ steps.clone.outputs.sha }}" > "built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}"

      - name: Upload built row manifest
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.target }}-deb-built-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}
          retention-days: 7

      - name: Upload the .deb packages
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.target }}-deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            src/out/*.deb
            src/out/SUITE
          retention-days: 7

  verify:
    needs: build
    if: ${{ inputs.verify }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [ubuntu22.04, ubuntu24.04]
        arch: [amd64, arm64]
        include:
          - suite: ubuntu22.04
            image: ubuntu:22.04
            codename: jammy
          - suite: ubuntu24.04
            image: ubuntu:24.04
            codename: noble
    steps:
      - name: Clean workspace artifacts
        run: rm -rf pkg built-manifest

      - name: Download built row manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.target }}-deb-built-*
          path: built-manifest
          merge-multiple: true

      - name: Check whether ${{ matrix.suite }} ${{ matrix.arch }} was built
        id: expect
        run: |
          set -euo pipefail
          compgen -G "built-manifest/BUILT_*" > /dev/null \
            || { echo "::error::no suite produced a package - nothing was verified"; exit 1; }
          if [ -f "built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing was built for ${{ matrix.suite }} ${{ matrix.arch }}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: ${{ steps.expect.outputs.built == 'true' }}
        with:
          sparse-checkout: scripts/verify-elf-links.sh
          sparse-checkout-cone-mode: false

      - name: Download the .deb packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.target }}-deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: pkg

      - name: Install and check in a clean ${{ matrix.image }}
        if: ${{ steps.expect.outputs.built == 'true' }}
        env:
          FLAGOS_APT: ${{ needs.build.outputs.deps != '' && format('{0}/flagos-apt-{1} {2} main', env.NEXUS_REPO_BASE, matrix.suite, matrix.codename) || '' }}
          FLAGOS_APT_KEY: https://resource.flagos.net/repository/apt-keys/pub/flagos-apt-public-key.asc
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/scripts/verify-elf-links.sh:/verify-elf-links.sh:ro" -e FLAGOS_APT -e FLAGOS_APT_KEY -e DEBIAN_FRONTEND=noninteractive ${{ matrix.image }} bash -c '
            set -e
            if [ -n "${FLAGOS_APT:-}" ]; then
              apt-get update -qq && apt-get install -y -qq ca-certificates curl > /dev/null
              install -d -m 0755 /etc/apt/keyrings
              curl -fsSL "${FLAGOS_APT_KEY}" -o /etc/apt/keyrings/flagos.asc
              echo "deb [signed-by=/etc/apt/keyrings/flagos.asc] ${FLAGOS_APT}" > /etc/apt/sources.list.d/flagos.list
            fi
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            apt-get install -y -qq binutils > /dev/null
            bash /verify-elf-links.sh --format deb /pkg
          '

      - name: Attest verified .deb packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        run: echo "${{ matrix.suite }} ${{ matrix.arch }}" > "pkg/VERIFIED_${{ matrix.suite }}_${{ matrix.arch }}"

      - name: Upload verified .deb packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-${{ inputs.target }}-deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            pkg/*.deb
            pkg/SUITE
            pkg/VERIFIED_${{ matrix.suite }}_${{ matrix.arch }}
          retention-days: 7

  publish:
    needs: [build, verify]
    if: ${{ inputs.publish }}
    runs-on: ${{ fromJSON(needs.build.outputs.publish_runs_on) }}
    steps:
      - name: Clean workspace artifacts
        run: rm -rf pkg built-manifest

      - name: Download built row manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.target }}-deb-built-*
          path: built-manifest
          merge-multiple: true

      - name: Download verified .deb packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: verified-${{ inputs.target }}-deb-*
          path: pkg
          merge-multiple: false

      - name: Verify every built row passed verification
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          compgen -G "built-manifest/BUILT_*" > /dev/null \
            || { echo "::error::no built manifest found"; exit 1; }
          expected_sha=""
          for f in built-manifest/BUILT_*; do
            read -r bsuite barch bsha < "$f"
            if [ -n "${SUITES:-}" ]; then
              case " ${SUITES} " in *" ${bsuite} "*) ;; *) continue ;; esac
            fi
            if [ -n "$expected_sha" ] && [ "$bsha" != "$expected_sha" ]; then
              echo "::error::built rows resolved to different commits ($expected_sha vs $bsha)"
              exit 1
            fi
            expected_sha="$bsha"
            found=$(find pkg -name "VERIFIED_${bsuite}_${barch}" -print -quit)
            [ -n "$found" ] || { echo "::error::${bsuite} ${barch} was built but has no verification attestation"; exit 1; }
          done

      - name: Publish to the apt repositories
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "::error::NEXUS_TOKEN secret is empty or unset"
            exit 1
          fi
          echo "Publishing packages built from ${{ needs.build.outputs.built_sha }}"
          uploaded=0
          attempted=0
          mapfile -t markers < <(find pkg -name SUITE | sort)
          [ "${#markers[@]}" -gt 0 ] || { echo "::error::no package directory under pkg/"; exit 1; }
          if [ -z "${SUITES:-}" ]; then
            SUITES=$(cat "${markers[@]}" | sort -u | tr '\n' ' ')
          fi
          for suite in ${SUITES}; do
            debs=()
            for m in "${markers[@]}"; do
              [ "$(cat "$m")" = "${suite}" ] || continue
              mapfile -t -O "${#debs[@]}" debs < <(find "$(dirname "$m")" -name '*.deb' | sort)
            done
            if [ "${#debs[@]}" -eq 0 ]; then
              echo "::error::nothing was built for '${suite}' - it failed or was skipped"
              exit 1
            fi
            repo="${NEXUS_REPO_BASE}/flagos-apt-${suite}/"
            for deb in "${debs[@]}"; do
              attempted=$((attempted + 1))
              echo ">>> ${suite}: $(basename "$deb")"
              if curl -f -u "${NEXUS_TOKEN}" \
                   -H 'Content-Type: multipart/form-data' \
                   --data-binary "@${deb}" "${repo}"; then
                echo "  -> OK"
                uploaded=$((uploaded + 1))
              else
                echo "  -> FAILED"
              fi
            done
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no suite accepted the upload"
            exit 1
          fi
          if [ "$uploaded" -ne "$attempted" ]; then
            echo "::error::published ${uploaded} of ${attempted} upload(s)"
            exit 1
          fi
          echo "Published all ${uploaded} upload(s)"
