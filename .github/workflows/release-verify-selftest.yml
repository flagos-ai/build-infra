name: release verify self-test

# The release workflows are dispatch-only, so a change to their verify step
# otherwise reaches main without ever having run. This runs that step against
# fixture packages with known outcomes. See scripts/release_verify_selftest.py.

on:
  pull_request:
    paths:
      - '.github/workflows/native-deb.yml'
      - '.github/workflows/native-rpm.yml'
      - '.github/workflows/flagcx-rpm.yml'
      - '.github/workflows/release-verify-selftest.yml'
      - 'scripts/release_verify_selftest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workflow: [native-deb, native-rpm, flagcx-rpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify step of ${{ matrix.workflow }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install -q pyyaml
          python3 scripts/release_verify_selftest.py ${{ matrix.workflow }}
