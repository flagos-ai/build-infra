# CI backstop for the generated-output refresh mechanism: when a push changes a
# status_matrix.*.yaml, an app changelog or an app page, re-render the
# verification-matrix markdown and the app pages, and open a review-gated fix PR
# (flagos-ci identity, auto/status-matrix-fix branch) if the committed output
# drifted. Local guard: .githooks/pre-commit.

name: Status Matrix Consistency

on:
  push:
    paths:
      - 'packaging/**/status_matrix.*.yaml'
      - 'app/*/changelogs/*.yaml'
      - 'app/*/*.md'
      - 'docs/content/*/application/*.md'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null || \
            python3 -m pip install --user --break-system-packages pyyaml

      - name: Render verification matrix from YAML
        # gh pr view resolves PR states fresh on every render; without a token
        # the unauthenticated lookups all fail and every 状态 cell falls back
        # to "—", which reads as drift and opens a fix PR that wipes real
        # statuses. GH_TOKEN must be set on this step, not only on the fix-PR
        # step below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/render_status_matrix.py

      - name: Render the app pages
        # gen_data.py first: images.yaml is git-ignored, and render_app reads the
        # status matrix's image_tag through it. --changelog-only last, because
        # --app-only re-renders whole pages and drops the Changelog section.
        run: |
          python3 scripts/docs/gen_data.py
          python3 scripts/docs/gen_descriptions.py --app-only
          python3 scripts/docs/gen_descriptions.py --changelog-only --layer app

      - name: Detect drift
        id: drift
        run: |
          if ! git diff --quiet -- 'packaging/*/docs/*-verification-matrix.md'; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
          # Porcelain, not diff, for the app output: a page or readme the
          # sources call for but that was never committed is untracked, and
          # `git diff` does not see it — which is exactly the drift worth
          # catching here.
          if [ -n "$(git status --porcelain -- 'docs/content/*/application/*.md' 'app/*/*.md')" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open fix PR when the rendered output drifted
        if: steps.drift.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GIT_AUTHOR_NAME: flagos-ci
          GIT_AUTHOR_EMAIL: noreply@flagos.net
          GIT_COMMITTER_NAME: flagos-ci
          GIT_COMMITTER_EMAIL: noreply@flagos.net
        run: |
          git add -A -- 'packaging/*/docs/*-verification-matrix.md' \
            'docs/content/*/application/*.md' 'app/*/*.md'
          git commit -m "chore(status-matrix): refresh generated output from its sources"
          branch="auto/status-matrix-fix"
          git branch -f "$branch" HEAD
          git push --force origin "$branch"
          if gh pr list --head "$branch" --json number -q '.[0].number' | grep -q .; then
            echo "PR already open for $branch; force-pushed updated content"
          else
            body="Refresh the generated output rendered from the status matrices and the
            app changelogs.

            A source changed on this branch but the committed output was stale. This PR
            brings the verification-matrix markdown and the app pages back in sync. No
            functional changes. Schema and refresh mechanism: docs/status-matrix.md."
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
              --title "chore(status-matrix): refresh generated output from its sources" \
              --body "$body"
          fi
