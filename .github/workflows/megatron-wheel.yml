name: Megatron wheel

# Build megatron-core wheels from the Megatron-LM-FL fork, and (optionally)
# upload them to the internal PyPI.
#
# megatron-core ships a compiled extension (megatron.core.datasets.helpers_cpp),
# so wheels are CPython-ABI-specific: cp310 / cp311 / cp312. Which one comes out
# depends on the runtime image's Python version — all three must be uploaded
# because the runtime matrix uses 3.10 (kunlunxin, hygon, ...), 3.11 (ascend)
# and 3.12 (nvidia, metax, enflame, ...).
#
# THE BUILD ENVIRONMENT IS THE BACKEND'S RUNTIME IMAGE: BASE_IMAGE =
# flagos-runtime-{vendor}-{backend}:{version} (from generate_matrix --runtime).
# No separate builder/toolchain image exists — the megatron-builder-* concept
# image was never built, and the runtime image provides the exact Python
# version + runtime packages the wheel will run on (build env == delivery env).
# The Containerfile's own gates (requires-python patch, .so-in-wheel, smoke
# install with deps resolved) fail `docker build` on a broken wheel, so a bad
# wheel never reaches the extract/upload steps.
#
# Upload target defaults to flagos-pypi-hosted (the release repo;
# flagos-pypi-daily is the dev repo). There is no schedule: uploads are manual.
#
# NOTE (decision 6, not yet validated): one cpXXX wheel is assumed shareable
# across all backends running that Python version. A wheel built on the hygon
# runtime (ubuntu 22.04, glibc 2.35) is usable on every newer-glibc backend,
# but the reverse is NOT true — so prefer the oldest-glibc runtime when the
# same wheel is meant to be shared. Final call pending per-backend verification.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend whose runtime image builds the wheel (e.g. hygon-dtk26.04, or "all")'
        type: string
        default: hygon-dtk26.04
      mlf_ref:
        description: 'Megatron-LM-FL git ref to build (branch/tag)'
        type: string
        default: main
      mlf_version:
        description: 'Wheel version override (blank = repo version, e.g. 0.17.1.post20260812)'
        type: string
        default: ''
      upload:
        description: 'upload the wheel to the internal PyPI'
        type: boolean
        default: false
      pypi_repo:
        description: 'Nexus PyPI repo (default flagos-pypi-hosted)'
        type: string
        default: flagos-pypi-hosted

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml
      - id: set-matrix
        shell: bash
        run: |
          if [[ "${{ inputs.backend }}" == "all" ]]; then
            python3 scripts/generate_matrix.py --runtime > matrix.json
          else
            python3 scripts/generate_matrix.py --runtime ${{ inputs.backend }} > matrix.json
          fi
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    if: ${{ fromJSON(needs.set-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    env:
      IMAGE: megatron-wheel-${{ matrix.name }}:${{ github.run_id }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@v7

      - name: Build the wheel image
        working-directory: packaging/megatron/builder
        env:
          BASE_IMAGE: ${{ matrix.image_tag }}
          EXTRA_PYPI: ${{ matrix.extra_pypi }}
          MLF_REF: ${{ inputs.mlf_ref }}
          MLF_VERSION: ${{ inputs.mlf_version }}
        run: |
          set -euo pipefail
          # Requires-python patch, .so-in-wheel gate and the smoke install run
          # inside this build; a failure here means the wheel is broken and
          # must not be published.
          docker build \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg EXTRA_PYPI="${EXTRA_PYPI}" \
            --build-arg MLF_REF="${MLF_REF}" \
            --build-arg MLF_VERSION="${MLF_VERSION}" \
            -t "$IMAGE" \
            -f Containerfile .

      - name: Extract the wheel
        working-directory: packaging/megatron/builder
        run: |
          set -euo pipefail
          rm -rf wheels && mkdir -p wheels
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/wheels/." wheels/
          docker rm "$cid" >/dev/null
          ls -la wheels/*.whl

      # Upload only when explicitly requested (default false so a manual build
      # from a branch is safe). The wheel is published as-is — the build gates
      # already vetted it.
      - name: Upload to internal PyPI
        if: ${{ inputs.upload }}
        working-directory: packaging/megatron/builder
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "ERROR: NEXUS_TOKEN secret is empty or unset" >&2
            exit 1
          fi
          pypi_repo="${{ inputs.pypi_repo }}"
          pypi_repo="${pypi_repo:-flagos-pypi-hosted}"
          echo ">>> uploading $(ls wheels/*.whl) to ${pypi_repo}"
          # Self-hosted Python is PEP 668 externally-managed; install to the user
          # site with the override (matches imagebuild.yml). Upgrade pkginfo too:
          # setuptools >=77 (PEP 639) stamps Metadata-Version 2.4 into the wheel,
          # which older pkginfo can't parse ("Metadata is missing required fields:
          # Name, Version") -> twine aborts before upload. pkginfo >=1.11 reads 2.4.
          python3 -m pip install --user --break-system-packages --quiet --upgrade twine pkginfo \
            || python3 -m pip install --quiet --upgrade twine pkginfo
          export TWINE_USERNAME="${NEXUS_TOKEN%%:*}"
          export TWINE_PASSWORD="${NEXUS_TOKEN#*:}"
          python3 -m twine upload \
            --repository-url "https://resource.flagos.net/repository/${pypi_repo}/" \
            --non-interactive \
            wheels/*.whl

      - name: Clean up the build image
        if: ${{ always() }}
        run: docker rmi "$IMAGE" 2>/dev/null || true
