name: FlagCX RPM Package

# Build FlagCX .rpm packages and publish them to the FlagOS yum repositories.
#
# This drives the FlagCX repository's *own* rpm flow (packaging/rpm/), not the
# deb line's overlay under packaging/flagcx/. The deb line exists because
# FlagCX shipped packaging for two backends where build-infra can build images
# for twenty, and it reaches that width by building on the Ubuntu base images
# build-infra already has. An rpm has to be built on an RPM-family
# distribution, and whether a vendor SDK installs on one is a fact about that
# vendor, not about our tooling -- so rpm coverage is what FlagCX's own flow
# supports, and it grows when a vendor makes it possible.
#
# Six rows today, which are the combinations that have a repository to land
# in:
#
#   nvidia  x openeuler2403  ->  flagos-yum-openeuler24.03
#   nvidia  x fedora43       ->  flagos-yum-fedora43
#   ascend  x openeuler2403  ->  flagos-yum-openeuler24.03
#   tsm     x openeuler2403  ->  flagos-yum-openeuler24.03
#   sunrise x openeuler2403  ->  flagos-yum-openeuler24.03
#   du      x openeuler2403  ->  flagos-yum-openeuler24.03
#
# The last three need no vendor base image at all: their SDKs install into
# /opt or /usr/local from the file store without calling a package manager, so
# the row builds in a plain openEuler image. That is what
# `packaging/flagcx/backends.yaml` records as rpm.sdk: filestore, and why
# these rows arrived without a vendor machine behind them. The packaging they
# build reaches FlagCX through flagos-ai/FlagCX#673. A backend named
# after its adaptor, not its vendor: hygon builds through du.mk, so the
# package is libflagcx-du, as on the deb side.
# Two combinations the upstream flow supports are deliberately absent: its
# default nvidia x rocky8, and metax x rocky8. Both produce .el8 packages and
# there is no el8 repository -- the yum side has fedora43, openeuler24.03 and
# rhel9 (el9). Building them here would produce packages with nowhere to go,
# so they wait on either an el8 repository or an el9 build from the vendor.
#
# Dispatch-only: an .rpm is a release artifact, nothing here is worth running
# on a push.

on:
  workflow_dispatch:
    inputs:
      row:
        description: 'backend and distribution to build'
        type: choice
        required: true
        options:
          - all
          - nvidia-openeuler2403
          - nvidia-fedora43
          - ascend-openeuler2403
          - tsm-openeuler2403
          - sunrise-openeuler2403
          - du-openeuler2403
      ref:
        description: >-
          FlagCX git ref to build. A tag is preferred: a branch head moves, so
          the same dispatch would not build the same source twice. Or
          `pull/<N>`: the head of that pull request, to run a packaging change
          through this workflow before it is merged (verify only; such a build
          can not be published).
        type: string
        default: v0.14.0
      version:
        description: >-
          release version to stamp into the spec (e.g. v0.14.0-rc2.post2).
          Leave empty to derive it from the ref when the ref is a version tag,
          and to keep the spec's own Version otherwise.
        type: string
        default: ''
      verify:
        description: 'install the .rpm in a clean container before uploading'
        type: boolean
        default: true
      publish:
        description: 'push the verified .rpm to the yum repositories (requires verify)'
        type: boolean
        default: false

env:
  NEXUS_REPO_BASE: https://resource.flagos.net/repository
  FLAGCX_REPO: https://github.com/flagos-ai/FlagCX.git

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.rows.outputs.matrix }}
    steps:
      - id: rows
        env:
          ROW: ${{ inputs.row }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ inputs.verify }}" != "true" ]; then
            echo "::error::publish requires verify - an unverified package must not reach the repository"
            exit 1
          fi
          # backend, the flow's RPM_DISTRO, the suite the result belongs in,
          # the image to verify in, and the vendor repository that image needs.
          # suite is not derived from distro: they are spelled differently
          # (openeuler2403 vs openeuler24.03) and the mapping is what decides
          # where a package lands.
          #
          # verify_repo is set only where the spec keeps the vendor SONAMEs in
          # Requires. fedora43 filters NCCL alone, because NVIDIA publishes a
          # Fedora repository providing libcuda and libcudart.
          all='[
            {"name":"nvidia-openeuler2403","backend":"nvidia","distro":"openeuler2403",
             "suite":"openeuler24.03","verify_image":"openeuler/openeuler:24.03-lts",
             "verify_repo":""},
            {"name":"nvidia-fedora43","backend":"nvidia","distro":"fedora43",
             "suite":"fedora43","verify_image":"fedora:43",
             "verify_repo":"https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/cuda-fedora43.repo"},
            {"name":"ascend-openeuler2403","backend":"ascend","distro":"openeuler2403",
             "suite":"openeuler24.03","verify_image":"openeuler/openeuler:24.03-lts",
             "verify_repo":""},
            {"name":"tsm-openeuler2403","backend":"tsm","distro":"openeuler2403",
             "suite":"openeuler24.03","verify_image":"openeuler/openeuler:24.03-lts",
             "verify_repo":""},
            {"name":"sunrise-openeuler2403","backend":"sunrise","distro":"openeuler2403",
             "suite":"openeuler24.03","verify_image":"openeuler/openeuler:24.03-lts",
             "verify_repo":""},
            {"name":"du-openeuler2403","backend":"du","distro":"openeuler2403",
             "suite":"openeuler24.03","verify_image":"openeuler/openeuler:24.03-lts",
             "verify_repo":""}
          ]'
          if [ "${ROW}" = "all" ]; then
            echo "matrix=$(echo "$all" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$(echo "$all" | jq -c --arg n "${ROW}" '{include: [.[] | select(.name == $n)]}')" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      # Only for scripts/clone-ref.sh; the FlagCX source goes under src/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/clone-ref.sh
            scripts/stamp_pkg_version.py
          sparse-checkout-cone-mode: false

      - name: Clone FlagCX at ${{ inputs.ref }}
        id: clone
        env:
          REF: ${{ inputs.ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == pull/* && "${PUBLISH}" == "true" ]]; then
            echo "::error::${REF} is a pull request head; it can be built and verified but not published"
            exit 1
          fi
          scripts/clone-ref.sh "${FLAGCX_REPO}" "${REF}" src
          cd src
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          tag_sha=$(git rev-parse -q --verify "refs/tags/${REF}^{commit}" || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" = "$sha" ]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ inputs.ref }} is a branch, not a tag - this build is not reproducible by ref name alone"
          fi
          echo "Built ${{ inputs.ref }} = ${sha}"
          test -f packaging/rpm/build-flagcx-rpm.sh \
            || { echo "::error::this ref has no rpm packaging definition"; exit 1; }

      - name: Stamp the release version
        working-directory: src
        env:
          SPEC: packaging/rpm/specs/flagcx.spec
          REF: ${{ steps.clone.outputs.ref }}
          REF_IS_TAG: ${{ steps.clone.outputs.is_tag }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/stamp_pkg_version.py" rpm "${SPEC}" \
            --ref "${REF}" \
            --is-tag "${REF_IS_TAG}" \
            --requested "${REQUESTED}"
          grep -E '^(Version|Release):' "${SPEC}"

      - name: Build ${{ matrix.name }}
        working-directory: src
        env:
          RPM_DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          bash packaging/rpm/build-flagcx-rpm.sh "${{ matrix.backend }}"
          # Every binary package: this flow emits a runtime and a -devel, and
          # taking one would leave the other unpublished. Source rpms are build
          # inputs, not something a user installs.
          mapfile -t rpms < <(find . -name '*.rpm' ! -name '*.src.rpm' | sort)
          [ "${#rpms[@]}" -gt 0 ] || { echo "::error::the build produced no binary rpm"; exit 1; }
          mkdir -p out && cp "${rpms[@]}" out/
          for r in "${rpms[@]}"; do
            echo ">>> $(basename "$r")"
            rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$r" 2>/dev/null || true
          done

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: flagcx-rpm-${{ matrix.name }}
          path: src/out/*.rpm
          retention-days: 7

  verify:
    needs: [set-matrix, build]
    if: ${{ inputs.verify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Download ${{ matrix.name }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flagcx-rpm-${{ matrix.name }}
          path: pkg

      - name: Install and check in a clean ${{ matrix.verify_image }}
        env:
          VERIFY_REPO: ${{ matrix.verify_repo }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/pkg:/pkg:ro" -e VERIFY_REPO ${{ matrix.verify_image }} bash -c '
            set -e
            # The package declares these libraries; the check is whether they
            # resolve where it says they will.
            if [ -n "${VERIFY_REPO:-}" ]; then
              dnf install -y -q curl > /dev/null 2>&1 || true
              curl -fsSL -o /etc/yum.repos.d/vendor.repo "${VERIFY_REPO}"
              echo "added $(basename "${VERIFY_REPO}")"
            fi

            # Installing the files themselves is the test: dnf has to satisfy
            # their Requires from the distribution and that repository alone.
            dnf install -y -q --setopt=install_weak_deps=False /pkg/*.rpm
            dnf install -y -q binutils > /dev/null 2>&1 || true

            checked=0
            is_public_dir() {
              case "$1" in
                /lib|/lib64|/usr/lib|/usr/lib64) return 0 ;;
                /lib/*-linux-gnu*|/usr/lib/*-linux-gnu*)
                  _sub=${1#/usr}; _sub=${_sub#/lib/}
                  case "$_sub" in */*) return 1 ;; *) return 0 ;; esac ;;
                *) return 1 ;;
              esac
            }
            host_governs_plugin() {
              if is_public_dir "$1"; then return 0; fi
              case "$2/" in "$1/"*) return 0 ;; esac
              _hp=$(dirname "$1"); _hb=$(basename "$1")
              case "$_hb:$2/" in _C:"$_hp/"*|lib:"$_hp/"*) return 0 ;; esac
              return 1
            }
            needed_dirs_for() {
              _queue="$1"; _seen=""; _dirs=""
              while [ -n "$_queue" ]; do
                _cur=${_queue%% *}
                if [ "$_cur" = "$_queue" ]; then _queue=""; else _queue=${_queue#* }; fi
                case " $_seen " in *" $_cur "*) continue ;; esac
                _seen="$_seen $_cur"
                for _soname in $(readelf -d "$_cur" 2>/dev/null | grep "(NEEDED)" | sed -E "s/.*\[([^]]+)\].*/\1/"); do
                  for _cand in $pkg_sos; do
                    if [ "$(basename "$_cand")" = "$_soname" ]; then
                      _cdir=$(dirname "$(readlink -f "$_cand")")
                      _dirs="${_dirs:+$_dirs:}$_cdir"
                      _queue="${_queue:+$_queue }$_cand"
                    fi
                  done
                done
              done
              printf "%s" "$_dirs"
            }
            for pkg in $(rpm -qp --qf "%{NAME}\n" /pkg/*.rpm | sort -u); do
              pkg_sos=$(rpm -ql "$pkg" | grep -E "\.so($|\.)" | while read -r s; do [ -f "$s" ] && echo "$s"; done || true)
              pkg_dirs=$(printf "%s\n" "$pkg_sos" | sed -E "s|/[^/]+$||" | sort -u | paste -sd: -)
              loadable_hosts=""
              unpreload_hosts=""
              for h in $pkg_sos; do
                case "$(basename "$h")" in *.cpython-*.so) continue ;; esac
                nm -D -u "$h" 2>/dev/null | awk "{print \$NF}" | sed "s/@.*//" | grep -qx "dlopen" || continue
                h_dirs=$(needed_dirs_for "$h")
                if ! LD_LIBRARY_PATH="$h_dirs" ldd "$h" 2>&1 | grep -q "not found" \
                   && ! LD_LIBRARY_PATH="$h_dirs" ldd -r "$h" 2>&1 | grep -vE "undefined symbol: _?Py" | grep -q "undefined symbol"; then
                  loadable_hosts="${loadable_hosts:+$loadable_hosts }$h"
                else
                  unpreload_hosts="${unpreload_hosts:+$unpreload_hosts }$h"
                fi
              done

              for so in $pkg_sos; do
                checked=$((checked + 1))
                real_so=$(readlink -f "$so")
                so_dir=$(dirname "$real_so")
                if is_public_dir "$so_dir"; then is_public=1; else is_public=0; fi
                owner=$(rpm -qf "$real_so" --qf "%{NAME}\n" | head -1)
                env_missing=0
                for lib in $(ldd "$so" 2>&1 | grep "not found" | awk "{print \$1}"); do
                  provider=$(rpm -q --whatprovides "${lib}()(64bit)" --qf "%{NAME}\n" 2>/dev/null | head -1 || true)
                  if [ -z "$provider" ] || echo "$provider" | grep -q "no package provides"; then
                    cand_files=$(for d in $(echo "$pkg_dirs" | tr : " "); do [ -e "$d/$lib" ] && echo "$d/$lib"; done || true)
                    if [ -n "$cand_files" ]; then
                      provider=$(rpm -qf $cand_files --qf "%{NAME}\n" 2>/dev/null | head -1 || true)
                    fi
                  fi
                  if [ "$provider" = "$owner" ]; then
                    if [ "$is_public" -eq 1 ]; then
                      echo "$(basename "$so"): $lib is shipped by $owner outside the loader path, and $(basename "$so") has no RUNPATH to reach it"
                      exit 1
                    fi
                    echo "  $(basename "$so"): $lib shipped by the package itself"
                  elif [ -n "$provider" ] && ! echo "$provider" | grep -q "no package provides" \
                       && ! rpm -q --requires "$owner" | grep -Eq "^(${provider}($|[ (])|${lib}[(][)])"; then
                    echo "$(basename "$so"): $lib is provided by an installed package ($provider) but not declared"
                    exit 1
                  else
                    echo "  $(basename "$so"): $lib left to the environment"
                    env_missing=$((env_missing + 1))
                  fi
                done

                if [ "$env_missing" -gt 0 ]; then
                  echo "  $(basename "$so"): $env_missing left to the environment, symbols not checked"
                elif [ "$is_public" -eq 1 ]; then
                  if undefined=$(ldd -r "$so" 2>&1 | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" | awk "{print \$3}"); [ -n "$undefined" ]; then
                    echo "$(basename "$so") has undefined symbols:"
                    printf "%s\n" "$undefined" | head -5
                    exit 1
                  else
                    echo "  $(basename "$so"): links resolve"
                  fi
                else
                  so_dirs=$(needed_dirs_for "$so")
                  defined_unpreload="/tmp/defined-unpreload-$$"
                  : > "$defined_unpreload"
                  for h in $unpreload_hosts; do
                    h_real=$(readlink -f "$h")
                    [ "$h_real" = "$real_so" ] && continue
                    if host_governs_plugin "$(dirname "$h_real")" "$so_dir"; then
                      nm -D --defined-only "$h" 2>/dev/null | awk "{print \$NF}" | sed "s/@.*//" >> "$defined_unpreload"
                    fi
                  done
                  sort -u -o "$defined_unpreload" "$defined_unpreload"
                  gov_hosts=""
                  for h in $loadable_hosts; do
                    h_real=$(readlink -f "$h")
                    [ "$h_real" = "$real_so" ] && continue
                    if host_governs_plugin "$(dirname "$h_real")" "$so_dir"; then
                      gov_hosts="${gov_hosts:+$gov_hosts }$h"
                    fi
                  done
                  resolved=0
                  undefined=""
                  if [ -n "$gov_hosts" ]; then
                    for h in $gov_hosts; do
                      hd=$(needed_dirs_for "$h")
                      try_dirs="${so_dirs}${hd:+:${hd}}"
                      try_dirs="${try_dirs#:}"
                      cand_undef=$(LD_PRELOAD="$h" LD_LIBRARY_PATH="$try_dirs" ldd -r "$so" 2>&1 \
                                   | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" \
                                   | awk "{print \$3}" | grep -vxF -f "$defined_unpreload" || true)
                      if [ -z "$cand_undef" ]; then
                        resolved=1
                        undefined=""
                        break
                      fi
                      undefined="$cand_undef"
                    done
                  else
                    undefined=$(LD_LIBRARY_PATH="$so_dirs" ldd -r "$so" 2>&1 \
                                | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" \
                                | awk "{print \$3}" | grep -vxF -f "$defined_unpreload" || true)
                    [ -z "$undefined" ] && resolved=1
                  fi
                  rm -f "$defined_unpreload"
                  if [ "$resolved" -eq 0 ]; then
                    echo "$(basename "$so") has undefined symbols:"
                    printf "%s\n" "$undefined" | head -5
                    exit 1
                  else
                    echo "  $(basename "$so"): links resolve"
                  fi
                fi
              done
            done
            test "$checked" -gt 0 || { echo "no shared library shipped"; exit 1; }
            echo "OK: $checked shared librar(y|ies) checked, nothing undeclared"
          '

  publish:
    needs: [set-matrix, build, verify]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    steps:
      - name: Download ${{ matrix.name }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: flagcx-rpm-${{ matrix.name }}
          path: pkg

      - name: Publish to flagos-yum-${{ matrix.suite }}
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "::error::NEXUS_TOKEN secret is empty or unset"
            exit 1
          fi
          mapfile -t rpms < <(find pkg -name '*.rpm' ! -name '*.src.rpm' | sort)
          [ "${#rpms[@]}" -gt 0 ] || { echo "::error::no binary rpm to publish"; exit 1; }
          repo="${NEXUS_REPO_BASE}/flagos-yum-${{ matrix.suite }}/"
          uploaded=0
          for r in "${rpms[@]}"; do
            echo ">>> ${{ matrix.suite }}: $(basename "$r")"
            if curl -f -u "${NEXUS_TOKEN}" --upload-file "$r" "${repo}$(basename "$r")"; then
              echo "  -> OK"
              uploaded=$((uploaded + 1))
            else
              echo "  -> FAILED"
            fi
          done
          # A partial success is worse than none: a -devel package can be
          # installable while the runtime it requires is absent.
          if [ "$uploaded" -ne "${#rpms[@]}" ]; then
            echo "::error::published ${uploaded} of ${#rpms[@]}"
            exit 1
          fi
          echo "Published all ${uploaded} package(s)"
