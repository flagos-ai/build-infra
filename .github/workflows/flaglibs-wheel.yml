name: FlagLibs Wheel

# Build the six pure-Python FlagOS operator-library wheels (FlagAttention /
# FlagSparse / FlagBLAS / FlagAudio / FlagFFT / FlagGems-vllm) and optionally
# upload them to the internal PyPI. Each wheel is built from its upstream
# RELEASE TAG (see packaging/flaglibs/docs/decisions.md D2/D3), so the version
# is a pure function of the ref — no build-infra-synthesized version.
#
# The wheels are py3-none-any (vendor-independent): one build, one publish to
# the released repo flagos-pypi-hosted. All builds happen in CI; the build step
# is plain `packaging/flaglibs/build.sh` (venv + `pip wheel --no-deps`), with a
# py3-none-any gate so a silently-compiled C++ wheel fails loudly.
#
# No schedule: these libs publish when their upstream tags move. Manual only.

on:
  workflow_dispatch:
    inputs:
      libs:
        description: 'Libraries to build (space-separated package keys); blank = all six (flag_attn flagsparse flag_blas flag_audio flagfft-codegen flaggems_vllm)'
        type: string
        default: ''
      upload:
        description: 'upload the wheels to the internal PyPI'
        type: boolean
        default: false
      pypi_repo:
        description: 'Nexus PyPI-hosted repo to upload to'
        type: string
        default: flagos-pypi-hosted

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  build:
    needs: authorize
    runs-on: ubuntu-latest
    env:
      FLAGLIBS: ${{ inputs.libs }}
      PYPI_REPO: ${{ inputs.pypi_repo || 'flagos-pypi-hosted' }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Build the wheels
        run: OUTDIR="${GITHUB_WORKSPACE}/wheels" bash packaging/flaglibs/build.sh

      - name: Verify the wheels
        run: |
          set -euo pipefail
          ls -1 wheels/*.whl
          # Every produced wheel must be py3-none-any (the build.sh gate already
          # enforces it per-lib; this re-checks the set is exactly what upload
          # will send).
          for w in wheels/*.whl; do
            case "$w" in
              *-py3-none-any.whl) ;;
              *) echo "ERROR: non-pure wheel would be uploaded: $(basename "$w")" >&2; exit 1 ;;
            esac
          done

      # Upload to the internal PyPI only when manually requested (default
      # upload=false so a trial build is safe). There is no schedule.
      - name: Upload to internal PyPI
        if: ${{ inputs.upload }}
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "ERROR: NEXUS_TOKEN secret is empty or unset" >&2
            exit 1
          fi
          python3 -m pip install --quiet twine
          export TWINE_USERNAME="${NEXUS_TOKEN%%:*}"
          export TWINE_PASSWORD="${NEXUS_TOKEN#*:}"
          python3 -m twine upload \
            --repository-url "https://resource.flagos.net/repository/${PYPI_REPO}/" \
            --non-interactive \
            wheels/*.whl
      - name: Record the publish event in the manifest
        if: ${{ inputs.upload }}
        run: |
          mkdir -p .wheel-info
          # One package per wheel: the distribution name is the wheel's own
          # name field, so it is read off the file rather than listed here
          # (--libs selects any subset). Underscores are already how the
          # catalog spells these six.
          for w in wheels/*.whl; do
            printf '%s\t%s\t%s\t%s\n' "$(basename "$w" | cut -d- -f1)" "" \
              "${PYPI_REPO}" "$(basename "$w")" >> .wheel-info/manifest.tsv
          done
      - name: Upload the wheel-info manifest
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-info-manifest-${{ github.run_id }}
          path: .wheel-info/manifest.tsv
          if-no-files-found: error

  # The publish step above leaves a manifest of what it uploaded; this job turns
  # it into the catalog row(s) and opens the review-gated record PR. The publish
  # step deliberately does not edit packaging/wheel-info.yaml itself — one
  # committer per run is what keeps a fan-out dispatch from racing on it.
  record-wheel-info:
    needs: build
    # always(): a manifest is left whether or not the publish step ran, and a
    # skipped needs-job must not read as success here. The gate then keeps this
    # job off a run that published nothing.
    if: ${{ always() && inputs.upload && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # A run that uploaded nothing publishes no manifest, and that is not a
        # failure of the record — the merge step below says so and skips.
        continue-on-error: true
        with:
          pattern: wheel-info-manifest-*
          path: .wheel-info-dl
      - name: Merge the manifests
        id: merge
        run: |
          set -euo pipefail
          mkdir -p .wheel-info
          if compgen -G ".wheel-info-dl/*/*.tsv" > /dev/null; then
            cat .wheel-info-dl/*/*.tsv >> .wheel-info/manifest.tsv
            echo ">>> publishing rows:"
            cat .wheel-info/manifest.tsv
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo ">>> no publish manifest in this run — nothing to record"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.merge.outputs.have == 'true' }}
        uses: ./.github/actions/record-wheel-info
        with:
          manifest: .wheel-info/manifest.tsv
          workflow: flaglibs
