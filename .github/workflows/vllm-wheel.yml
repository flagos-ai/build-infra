name: VLLM Wheel

# Build + repack the vllm wheel set, then fan it out to the vendor PyPI
# indexes. This is the CI consolidation of the manual
# packaging/vllm/build-and-repack.sh — same build (a runtime
# flagos-runtime-{vendor}-{backend}:{version} image, VLLM_TARGET_DEVICE=empty
# source build), same repack (packaging/script/repack.py + config.yaml).
#
# ONE JOB PER PLATFORM, NOT PER BACKEND. A repacked set is a function of
# (python, arch) alone: the empty build produces no compiled member, the
# repacked top-level wheel is py3-none-any, and the repacked deps come from the
# public indexes at the version the wheel declares. So every backend that
# shares a (python, arch) resolves the same bytes, and the four platform rows
# below replace what used to be a 22-row per-backend matrix — see
# packaging/script/README.md.
#
# Each row builds in ONE backend's runtime image (that platform's first
# backend in configs.yaml) and uploads the whole set to every index that
# platform serves. The set stays whole on each index because the top-level
# wheel pins its deps to `==<version>+flagos`, and under PEP 440 a local
# version is satisfyable only by an index that carries it — so an index that
# received the top-level wheel without its deps would have an unsatisfiable
# pin, and one that received the deps alone would serve nothing.
#
# The platform → index map is stated in set-matrix below, not derived: it is
# four rows, and a reviewer reading them is the check. Adding a backend, or
# moving one to another python, means editing the row it belongs to.
#
# Upload target defaults to the row's pypi_repos list; pypi_repo overrides it
# with a single index. There is no schedule: uploads are manual.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Platform row to build: a backend name (e.g. amd-rocm7.2.4), or "all" for every row'
        type: string
        default: all
      vllm_version:
        description: 'vLLM version to build (e.g. 0.24.0)'
        type: string
        default: 0.24.0
      upload:
        description: 'upload the repacked +flagos wheel set to the vendor PyPI'
        type: boolean
        default: false
      pypi_repo:
        description: 'Upload to this single Nexus PyPI repo instead of the row''s index list'
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml
      # The matrix IS packaging/vllm/wheel-platforms.yaml. This step only reads
      # it, folds in the stack version from configs.yaml, and (for a single-row
      # dispatch) keeps the one row whose name matches. No logic lives here that
      # the table does not already state.
      - id: set-matrix
        run: |
          set -euo pipefail
          python3 - "${{ inputs.backend }}" > matrix.json <<'PY'
          import json, sys, yaml
          sel = sys.argv[1] if len(sys.argv) > 1 else "all"
          rows = yaml.safe_load(open("packaging/vllm/wheel-platforms.yaml"))["include"]
          version = yaml.safe_load(open("configs.yaml"))["version"]
          include = [dict(r, version=version) for r in rows
                     if sel in ("", "all") or r["name"] == sel]
          print(json.dumps({"include": include}))
          PY
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    if: ${{ fromJSON(needs.set-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    env:
      STACK_VERSION: ${{ matrix.version }}
      VLLM_VERSION: ${{ inputs.vllm_version }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Wraps build-and-repack.sh; the runtime image must already exist on the
      # runner (pulled by the script, `|| true`). Wheels land in
      # /tmp/vllm-repack-<vendor>-<backend>/output on the runner host.
      # HTTPS_PROXY is not needed: the build pulls vllm source from the
      # internal filestore / aliyun, never github.com.
      - name: Build + repack the vllm wheel set
        run: |
          set -euo pipefail
          # STACK_VERSION is left to the script, which reads configs.yaml.
          bash packaging/vllm/build-and-repack.sh \
            "${{ matrix.name }}" \
            --vllm-version "${VLLM_VERSION}"

      - name: Audit the wheel dependencies
        run: |
          set -euo pipefail
          # `${{ matrix.name }}` cannot be substituted inside a bash
          # parameter-expansion expression — ${matrix.name%%-*} reaches bash
          # unexpanded and dies with "bad substitution". Expand into a local
          # var first (same fix as vllm-plugin-wheel.yml, run 32138523697).
          matrix_name="${{ matrix.name }}"
          vendor="${matrix_name%%-*}"
          backend="${matrix_name#*-}"
          python3 packaging/script/audit-deps.py \
            --watch torch --watch torch_npu --watch torchvision \
            --watch torchaudio --watch triton --watch flag_gems \
            --watch numpy==1.26.4 --watch vllm \
            "/tmp/vllm-repack-${vendor}-${backend}/output/"*.whl

      # The whole set goes to every index this platform serves — the top-level
      # wheel and the exact xgrammar / opencv-python-headless /
      # compressed-tensors it was repacked against. Runs on the uploader image
      # (packaging/upload/), never the runner's own python.
      - name: Upload to the vendor PyPI indexes
        if: ${{ inputs.upload }}
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "ERROR: NEXUS_TOKEN secret is empty or unset" >&2
            exit 1
          fi
          # `${{ matrix.name }}` cannot be substituted inside a bash
          # parameter-expansion expression — expand into a local var first.
          matrix_name="${{ matrix.name }}"
          vendor="${matrix_name%%-*}"
          backend="${matrix_name#*-}"
          work_dir="/tmp/vllm-repack-${vendor}-${backend}"
          # pypi_repos already carries full flagos-pypi-<vendor> names; a
          # single pypi_repo input overrides the whole fan-out with one index.
          repos="${{ inputs.pypi_repo }}"
          repos="${repos:-${{ matrix.pypi_repos }}}"
          echo ">>> uploading $(ls "${work_dir}/output/"*.whl | xargs -n1 basename) to ${repos}"
          WHEEL_UPLOAD_REPO="${repos}" \
          WHEEL_UPLOAD_PATHS="/wheels/*.whl" \
          WHEEL_UPLOAD_MOUNT="${work_dir}/output:/wheels:ro" \
          bash packaging/upload/upload-wheels.sh

      # The repack line's wheel version (e.g. 0.24.0+flagos) is the catalog
      # version, and the filename spells it, so the version column is left
      # empty and read from the file.
      #
      # Only vllm's own wheel is a catalog entry. output/ also holds the
      # repacked indirect deps (xgrammar, compressed-tensors,
      # opencv-python-headless) — uploaded to the same indexes, but vllm's
      # private matched set: vllm's METADATA pins each to its exact +flagos
      # version, so pip installs them with vllm and nothing addresses them on
      # their own. One line per index, matching what the upload walked.
      - name: Record the publish events in the manifest
        if: ${{ inputs.upload }}
        run: |
          set -euo pipefail
          mkdir -p .wheel-info
          matrix_name="${{ matrix.name }}"
          vendor="${matrix_name%%-*}"
          backend="${matrix_name#*-}"
          repos="${{ inputs.pypi_repo }}"
          repos="${repos:-${{ matrix.pypi_repos }}}"
          w=$(ls /tmp/vllm-repack-${vendor}-${backend}/output/vllm-*.whl)
          for repo in ${repos}; do
            printf '%s\t%s\t%s\t%s\n' "vllm" "" "${repo}" "$(basename "$w")" \
              >> .wheel-info/manifest.tsv
          done

      - name: Upload the wheel-info manifest
        if: ${{ inputs.upload }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wheel-info-manifest-${{ matrix.name }}
          path: .wheel-info/manifest.tsv
          if-no-files-found: error
      - name: Clean up the build container and work dir
        if: ${{ always() }}
        run: |
          # The container (root) writes build files into the host bind mount;
          # under /tmp's sticky bit the runner user cannot delete them, so a
          # plain `rm -rf` fails on every run that reaches file creation.
          # Delete from inside the runtime image (root) first, then remove the
          # empty host dir. `|| true` keeps a failed cleanup from failing the
          # job — the work is already done (same pattern as
          # vllm-plugin-wheel.yml).
          matrix_name="${{ matrix.name }}"
          vendor="${matrix_name%%-*}"
          backend="${matrix_name#*-}"
          img="harbor.baai.ac.cn/flagos-runtime/flagos-runtime-${matrix_name}:${STACK_VERSION}"
          docker rm -f "vllm-build-${vendor}-${backend}" 2>/dev/null || true
          docker run --rm -v "/tmp/vllm-repack-${vendor}-${backend}:/work" "${img}" rm -rf /work 2>/dev/null || true
          rm -rf "/tmp/vllm-repack-${vendor}-${backend}" 2>/dev/null || true

  # Records what the publish steps above uploaded; the job body is shared —
  # see record-wheel-info.yml. One committer per run is what keeps a fan-out
  # dispatch from racing on packaging/packages.yaml.
  record-wheel-info:
    needs: build
    # always(): the manifest left by a publish step that failed mid-way is
    # still the record of what did get uploaded, and a skipped needs-job must
    # not read as success here. The gate keeps this job off a run that
    # published nothing.
    if: ${{ always() && inputs.upload && !cancelled() }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/record-wheel-info.yml
    with:
      workflow: vllm
