name: FlagTree Daily Wheel

# The daily NVIDIA FlagTree build, published to flagos-pypi-daily as the
# distribution `flagtree-nvidia`. The release line (flagtree-wheel.yml, manual)
# keeps publishing plain `flagtree` to the vendor indexes; this file never
# touches those.
#
# The point of the separate distribution name is the consumer's command: with
# the backend in the name, the public version segment can carry the date and
# `pip install --pre flagtree-nvidia` resolves to the newest daily on its own.
# A backend token in the local segment cannot do that — a `==` specifier with a
# local label matches the whole segment exactly, so `flagtree==0.7.1+nvidia3.6`
# would never match `0.7.1.dev<date>+nvidia3.6.git<sha>`. Measured, and written
# up with the rest of the scheme in packaging/flagtree/README.md.
#
# Like the release file, this builds inside docker so the wheel is self-owned
# and reproducible. No GPU is needed: the build compiles LLVM/Triton and only
# the smoke test imports the result.

on:
  workflow_dispatch:
    inputs:
      flagtree_version:
        description: 'FlagTree ref to build (blank = main)'
        type: string
        default: ''
      upload:
        description: 'upload the wheel to flagos-pypi-daily'
        type: boolean
        default: false
  schedule:
    # Daily at 01:37 UTC, after the FlagGems daily at 01:17.
    - cron: '37 1 * * *'

defaults:
  run:
    shell: bash

env:
  # The daily version, declared rather than derived. `flagtree_` is what the
  # wheel filename uses; the dist name is `flagtree-nvidia`.
  #
  # FLAGTREE_VERSION_BASE is the release line this daily leads: bump it when
  # configs.yaml moves to the next FlagTree release, so a daily keeps sorting
  # above the release it precedes and below the next one.
  #
  # FlagTree appends `.git<sha8>` to the version itself (no FLAGTREE_PYPI_KEY
  # exists in this repo), which is what makes a build traceable to a commit.
  FLAGTREE_DIST_NAME: flagtree-nvidia
  FLAGTREE_VERSION_BASE: 0.7.1
  FLAGTREE_BACKEND_TOKEN: nvidia3.6
  PYPI_REPO: flagos-pypi-daily
  NEXUS_BASE: https://resource.flagos.net/repository

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually. checkout lets the local composite action resolve from the
    # workspace; check-trigger-author short-circuits on a schedule, so the
    # cron path is not gated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  build:
    needs: authorize
    # Self-hosted, like every other FlagTree build: the same image build, and
    # the label flagtree-wheel.yml uses for the same Containerfile.
    runs-on: [self-hosted, h20]
    env:
      IMAGE: flagtree-wheel-daily:${{ github.run_id }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          version="${FLAGTREE_VERSION_BASE}.dev$(date -u +%Y%m%d)+${FLAGTREE_BACKEND_TOKEN}"
          # flagtree_<backend> is the filename form of flagtree-<backend>.
          wheel="flagtree_${FLAGTREE_DIST_NAME#flagtree-}-${version}"
          echo ">>> version ${version}  (FlagTree appends .git<sha8>)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "wheel=${wheel}" >> "$GITHUB_OUTPUT"

      - name: Build the FlagTree wheel image
        working-directory: packaging/flagtree
        env:
          FLAGTREE_VERSION: ${{ inputs.flagtree_version || 'main' }}
          FLAGTREE_WHEEL_VERSION: ${{ steps.version.outputs.version }}
          FLAGTREE_WHEEL_NAME: ${{ env.FLAGTREE_DIST_NAME }}
          HTTP_PROXY_SECRET: ${{ secrets.HTTP_PROXY }}
        run: |
          set -euo pipefail
          # Proxy: the runner's own, else the secret. Relay the value and nothing
          # else — a NO_PROXY invented here would bypass the tunnel for hosts the
          # container cannot resolve on its own. (The Containerfile declares only
          # http_proxy/https_proxy, so those are the two that go through.)
          proxy_url="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}"
          proxy_url="${proxy_url:-${HTTP_PROXY_SECRET}}"
          build_args=(
            --build-arg "FLAGTREE_VERSION=${FLAGTREE_VERSION}"
            --build-arg "FLAGTREE_WHEEL_VERSION=${FLAGTREE_WHEEL_VERSION}"
            --build-arg "FLAGTREE_WHEEL_NAME=${FLAGTREE_WHEEL_NAME}"
          )
          if [ -n "${proxy_url}" ]; then
            build_args+=(--build-arg "HTTPS_PROXY=${proxy_url}")
            build_args+=(--build-arg "HTTP_PROXY=${proxy_url}")
          fi
          # --no-cache: the clone layer is keyed on the ref NAME, not its content,
          # so a cached `main` would rebuild an old commit under today's version.
          docker build --no-cache "${build_args[@]}" -t "$IMAGE" -f nvidia-cuda .

      - name: Extract the wheel
        working-directory: packaging/flagtree
        run: |
          set -euo pipefail
          rm -rf wheels && mkdir -p wheels
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/wheels/." wheels/
          docker rm "$cid" >/dev/null
          ls -la wheels/*.whl

      - name: Gate the version
        working-directory: packaging/flagtree
        env:
          EXPECTED: ${{ steps.version.outputs.wheel }}
          DIST: ${{ env.FLAGTREE_DIST_NAME }}
        run: |
          set -euo pipefail
          # FlagTree owns the version rule; this asserts it still produces what
          # this workflow asked for, so a change upstream fails the build instead
          # of publishing an unexpected version.
          whl="$(ls wheels/*.whl)"
          echo ">>> $whl"
          case "$(basename "$whl")" in
            "${EXPECTED}".git*) ;;
            *) echo "ERROR: expected ${EXPECTED}.git<sha8>, got $whl" >&2; exit 1 ;;
          esac
          python3 - "$whl" "$DIST" <<'PY'
          import re
          import sys
          import zipfile

          whl, dist = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(whl) as zf:
              meta = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              lines = zf.read(meta).decode().splitlines()[:10]
          fields = dict(line.split(": ", 1) for line in lines if ": " in line)
          print(">>> Name:", fields.get("Name"), "Version:", fields.get("Version"))
          assert fields.get("Name") == dist, fields
          assert re.fullmatch(r".+\.git[0-9a-f]{8}", fields.get("Version", "")), fields
          PY

      # Publishing as-is: the build gates already vetted the wheel.
      - name: Upload to the daily PyPI
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        working-directory: packaging/flagtree
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
          WHEEL: ${{ steps.version.outputs.wheel }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "ERROR: NEXUS_TOKEN secret is empty or unset" >&2
            exit 1
          fi
          whl="$(ls wheels/*.whl)"
          # The version carries a date and a commit sha, so a day on which
          # `main` has not moved rebuilds a wheel the index already holds and
          # Nexus rejects it — which would turn the cron red for no reason.
          # (flaggems-wheel needs no such guard: its version moves with every
          # commit.) A 404 here just means the project does not exist yet, which
          # is the state before the first upload; Nexus creates it on first push.
          if curl -fsS --max-time 60 "${NEXUS_BASE}/${PYPI_REPO}/simple/${FLAGTREE_DIST_NAME}/" \
               | grep -Fq "$(basename "$whl")"; then
            echo ">>> $(basename "$whl") is already published — nothing to do"
            exit 0
          fi
          echo ">>> uploading $(basename "$whl") to ${PYPI_REPO}"
          # Upgrade pkginfo with twine: setuptools >=77 (PEP 639) stamps
          # Metadata-Version 2.4, which older pkginfo cannot parse and twine then
          # aborts before upload (>=1.11 reads it).
          python3 -m pip install --user --break-system-packages --quiet --upgrade twine pkginfo \
            || python3 -m pip install --quiet --upgrade twine pkginfo
          export TWINE_USERNAME="${NEXUS_TOKEN%%:*}"
          export TWINE_PASSWORD="${NEXUS_TOKEN#*:}"
          python3 -m twine upload \
            --repository-url "${NEXUS_BASE}/${PYPI_REPO}/" \
            --non-interactive \
            "$whl"

      - name: Clean up the build image
        if: ${{ always() }}
        run: docker rmi "$IMAGE" 2>/dev/null || true
