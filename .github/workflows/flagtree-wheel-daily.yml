name: FlagTree Daily Wheel

# The daily FlagTree build, published to flagos-pypi-daily as one distribution
# per backend (`flagtree-nvidia`, `flagtree-iluvatar`, ...). The release line
# (flagtree-wheel.yml, manual) keeps publishing plain `flagtree` to the vendor
# indexes; this file never touches those. One row per backend that has a
# `daily:` block in packaging/flagtree/backends.yaml.
#
# The point of the separate distribution name is the consumer's command: with
# the backend in the name, the public version segment carries the date alone and
# `pip install --pre flagtree-nvidia` resolves to the newest daily on its own.
# A backend token in the local segment cannot do that — a `==` specifier with a
# local label matches the whole segment exactly, so `flagtree==0.7.1+nvidia3.6`
# would never match `0.7.1.dev<date>+nvidia3.6`. Since every backend is already
# its own project, the daily publishes the date alone: `0.7.1.dev20261015`.
# Measured, and written up with the rest of the scheme in
# packaging/flagtree/README.md.
#
# The commit a wheel was built from is not in the version -- it is a
# `Project-URL: Source-Commit` line in the wheel's METADATA, written into the
# clone by the Containerfile. `pip show -v flagtree-nvidia` reads it back.
#
# THE TWO WAYS IT RUNS. The cron publishes the day and skips a day already on
# the index. A manual dispatch is the escape hatch for a fix merged after 01:37:
# it never skips, and it publishes the same version the cron did -- Nexus on this
# server has redeploy enabled, so the file is replaced rather than refused. A
# second manual run that day replaces the first the same way. One consequence to
# know about rather than discover: a consumer on a warm pip cache may keep the
# wheel it already fetched, since neither the version nor the URL changed.
#
# The skip is decided per row, in the plan job, so a backend already published
# today neither occupies its runner nor holds up another backend's row.
#
# Like the release file, this builds inside docker so the wheel is self-owned
# and reproducible. No GPU is needed: the build compiles LLVM/Triton and only
# the smoke test imports the result.

on:
  workflow_dispatch:
    inputs:
      flagtree_version:
        description: 'FlagTree ref to build (blank = each row default)'
        type: string
        default: ''
      upload:
        description: 'upload the wheels to flagos-pypi-daily'
        type: boolean
        default: false
      builder_image:
        description: 'per-backend builder image override, space-separated backend=ref (blank = the published one; backend=ubuntu:22.04 builds that row cold)'
        type: string
        default: ''
      backends:
        description: 'space-separated backend keys to build (blank = every enabled row). The schedule ignores this and always builds every row.'
        type: string
        default: ''
  schedule:
    # Daily at 01:37 UTC, after the FlagGems daily at 01:17.
    - cron: '37 1 * * *'

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  PYPI_REPO: flagos-pypi-daily
  NEXUS_BASE: https://resource.flagos.net/repository

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually. checkout lets the local composite action resolve from the
    # workspace; check-trigger-author short-circuits on a schedule, so the
    # cron path is not gated.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  plan:
    needs: authorize
    # On ubuntu-latest, not a build runner: this job only reads github and the
    # index, and it is what decides whether any build runner is occupied at all.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml

      - name: Plan the rows
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_OVERRIDE: ${{ inputs.flagtree_version }}
          BUILDER_IMAGE_OVERRIDE: ${{ inputs.builder_image }}
          SELECTED: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > matrix.json
          import json, os, re, sys, urllib.request, yaml
          from datetime import datetime, timezone

          # The published builder stage is derived the way every other image ref
          # is: registry host and prefix from build-config.yml, tag from
          # configs.yaml. A backend's own override wins; the literal
          # `ubuntu:22.04` builds that row cold, which is what an unpublished
          # builder falls back to.
          host = yaml.safe_load(open(".github/build-config.yml"))["registry"]["host"]
          prefix = yaml.safe_load(open(".github/build-config.yml"))["registry"]["prefixes"]["builder"]
          stack = yaml.safe_load(open("configs.yaml"))["version"]

          overrides = {}
          for pair in (os.environ.get("BUILDER_IMAGE_OVERRIDE") or "").split():
              name, _, ref = pair.partition("=")
              if not ref:
                  print(f"builder_image: '{pair}' is not backend=ref", file=sys.stderr)
                  sys.exit(1)
              overrides[name] = ref

          backends = yaml.safe_load(open("packaging/flagtree/backends.yaml"))["backends"]
          date = datetime.now(timezone.utc).strftime("%Y%m%d")
          repo = os.environ["PYPI_REPO"]
          nexus = os.environ["NEXUS_BASE"]
          on_schedule = os.environ["EVENT_NAME"] == "schedule"

          # A manual dispatch may name the rows it wants -- which is how one
          # backend is exercised without occupying every other backend's runner.
          # Naming a row asks for that row, so it reaches one whose `enabled` is
          # still false: that flag says whether the SCHEDULE builds it, and a
          # backend is dispatched by hand before it is ever enabled. The schedule
          # takes no selection at all; refreshing every backend is what it is for.
          want = [] if on_schedule else (os.environ.get("SELECTED") or "").split()

          rows = []
          for name, cfg in backends.items():
              if want and name not in want:
                  continue
              d = cfg.get("daily")
              if not d:
                  continue
              if not (d.get("enabled") or want):
                  continue

              version = f"{d['version_base']}.dev{date}"
              # bdist_wheel writes the file as setuptools' safer_name(name):
              # PEP 503-canonicalise first (runs of `-_.` to one `-`) and then
              # every `-` to `_`. `flagtree-nvidia` survives a prefix swap, but a
              # name carrying its own `-` or `.` does not -- on disk
              # `flagtree-ascend-cann9.0.0` is `flagtree_ascend_cann9_0_0`.
              # Composing it here rather than reading the built file back is what
              # lets the schedule skip a day before any build starts, so it has
              # to be the same rule the wheel is written under.
              dist = re.sub(r"[^A-Za-z0-9]+", "_", d["dist_name"]).lower()
              wheel = f"{dist}-{version}"
              filename = f"{wheel}-{d['wheel_tag']}.whl"

              # THE SCHEDULE SKIPS A DAY ALREADY PUBLISHED; A MANUAL RUN NEVER
              # DOES. The version is known without a build, so the cron can stop
              # before a build runner is occupied -- and before Nexus is handed a
              # duplicate to reject. A new UTC day always builds, even when the
              # ref has not moved, because the wheel for a new date is a new
              # wheel; where it was built from is in its METADATA, not its name.
              #
              # The manual dispatch is the escape hatch for a fix merged after
              # 01:37, and skipping it would defeat the only reason it exists. It
              # publishes the same version the cron did; the upload replaces the
              # file.
              #
              # Same 404 tolerance as the upload step: before the first upload
              # the project does not exist, and Nexus creates it on first push.
              skip = False
              if on_schedule:
                  # The index path is the CANONICAL name (PEP 503: lowercase, runs
                  # of `-_.` to one `-`), not the distribution name -- Nexus
                  # stores and serves the canonical spelling only, so a raw
                  # `flagtree-ascend-cann9.0.0` answers 404 and the row would
                  # silently rebuild every day.
                  index_name = re.sub(r"[-_.]+", "-", d["dist_name"]).lower()
                  url = f"{nexus}/{repo}/simple/{index_name}/"
                  try:
                      with urllib.request.urlopen(url, timeout=60) as r:
                          skip = filename.encode() in r.read()
                  except Exception as e:
                      print(f">>> {name}: index not readable ({e}) -- building", file=sys.stderr)
              # Progress to stderr, never stdout: this script is redirected into
              # matrix.json, and one line of prose ahead of the JSON makes jq
              # fail and takes the row's output with it.
              if skip:
                  print(f">>> {name}: {filename} already published -- row skipped", file=sys.stderr)
                  continue

              builder = overrides.get(name) or f"{host}/{prefix}/{cfg['builder_image']}:{stack}"
              print(f">>> {name}: {filename} on {builder}", file=sys.stderr)
              rows.append({
                  "name": name,
                  "containerfile": cfg["containerfile"],
                  "builder_image": builder,
                  # JSON string: a bare `runs-on: matrix.runson` queues forever.
                  "runson": json.dumps(cfg["runson"]),
                  "disk_min_gb": cfg["disk_min_gb"],
                  "dist_name": d["dist_name"],
                  "version": version,
                  "wheel": wheel,
                  "wheel_tag": d["wheel_tag"],
                  "ref": os.environ.get("REF_OVERRIDE") or d.get("ref", "main"),
              })

          unknown_builder = set(overrides) - set(backends)
          if unknown_builder:
              print(f"builder_image names unknown backend(s): {' '.join(sorted(unknown_builder))}", file=sys.stderr)
              sys.exit(1)
          # A typo in a selection must fail loudly rather than plan nothing: an
          # empty matrix skips the build job and still concludes the run green.
          unknown = [w for w in want if w not in backends]
          if unknown:
              print(f"unknown backend(s): {' '.join(unknown)}", file=sys.stderr)
              sys.exit(1)
          # An empty matrix is not a failure here -- every row may be published
          # already -- so the build job is skipped on emptiness instead.
          print(json.dumps({"include": rows}))
          PY
          cat matrix.json
          # Assign before writing: `echo "matrix=$(jq ...)"` discards jq's exit
          # status, so a failed plan would leave a green run with an empty
          # matrix -- and the build job is gated on emptiness, so it is skipped
          # rather than failed.
          matrix="$(jq -c . matrix.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [authorize, plan]
    # Every row may have been skipped as already published.
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] != null }}
    strategy:
      # One backend's failure must not cancel the others. No serialization: each
      # row runs on its own backend's nodes, so a concurrent refresh of every
      # backend does not queue behind one machine.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    env:
      TARGET: ${{ matrix.containerfile }}
      IMAGE: flagtree-daily-${{ matrix.name }}:${{ github.run_id }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check disk space
        run: |
          set -euo pipefail
          FREE_KB=$(df -P . | awk 'NR==2{print $4}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free disk space: ${FREE_GB}G (this row wants ${{ matrix.disk_min_gb }}G)"
          if [ "$FREE_GB" -lt "${{ matrix.disk_min_gb }}" ]; then
            echo "ERROR: insufficient disk space (${FREE_GB}G < ${{ matrix.disk_min_gb }}G). Docker needs cleanup."
            df -h .
            exit 1
          fi

      - name: Harbor login
        # Only to pull the builder stage. A bare docker-hub ref (`ubuntu:22.04`,
        # what the cold path uses) carries no registry host to log in to.
        env:
          BUILDER_IMAGE: ${{ matrix.builder_image }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PW: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          case "$BUILDER_IMAGE" in
            */*) host="${BUILDER_IMAGE%%/*}" ;;
            *)   echo ">>> ${BUILDER_IMAGE} needs no registry login"; exit 0 ;;
          esac
          for i in 1 2 3; do
            if printf '%s' "$HARBOR_PW" | docker login "$host" -u "$HARBOR_USER" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt $i failed, retrying..."
            sleep 30
          done
          echo "::error::Harbor login failed after 3 attempts"
          exit 1

      - name: Build the FlagTree wheel image
        working-directory: packaging/flagtree
        env:
          FLAGTREE_REF: ${{ matrix.ref }}
          FLAGTREE_WHEEL_VERSION: ${{ matrix.version }}
          FLAGTREE_WHEEL_NAME: ${{ matrix.dist_name }}
          BUILDER_IMAGE: ${{ matrix.builder_image }}
        run: |
          set -euo pipefail
          # FLAGTREE_VERSION unconditionally: the daily builds the Containerfile's
          # default (wheel) target, and every backend's wheel stage takes the ref.
          build_args=(
            --build-arg "FLAGTREE_VERSION=${FLAGTREE_REF}"
            --build-arg "FLAGTREE_WHEEL_VERSION=${FLAGTREE_WHEEL_VERSION}"
            --build-arg "FLAGTREE_WHEEL_NAME=${FLAGTREE_WHEEL_NAME}"
            --build-arg "BUILDER_IMAGE=${BUILDER_IMAGE}"
          )
          # The runner's proxy, relayed verbatim: all three, never a value
          # invented here, and never gated on one of the others being set. The
          # Containerfile declares them as ARGs, which is what keeps them to the
          # build -- an ARG is not persisted in the image config. no_proxy matters
          # as much as the other two: a value invented here is what sends an
          # internal fetch through the tunnel.
          http_proxy_val="${http_proxy:-${HTTP_PROXY:-}}"
          https_proxy_val="${https_proxy:-${HTTPS_PROXY:-}}"
          no_proxy_val="${no_proxy:-${NO_PROXY:-}}"
          [ -n "${http_proxy_val}" ] && build_args+=(--build-arg "http_proxy=${http_proxy_val}")
          [ -n "${https_proxy_val}" ] && build_args+=(--build-arg "https_proxy=${https_proxy_val}")
          [ -n "${no_proxy_val}" ] && build_args+=(--build-arg "no_proxy=${no_proxy_val}")
          # --no-cache is kept even with a builder image: the clone layer is keyed
          # on the ref NAME, not its content, so a cached default ref would
          # rebuild an old commit under today's version. It matters more now than
          # it did: the version no longer moves with the commit, so only a real
          # rebuild can change what a given date's wheel contains.
          docker build --no-cache "${build_args[@]}" -t "$IMAGE" -f "$TARGET" .

      - name: Extract the wheel
        working-directory: packaging/flagtree
        run: |
          set -euo pipefail
          rm -rf wheels && mkdir -p wheels
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/wheels/." wheels/
          docker rm "$cid" >/dev/null
          ls -la wheels/*.whl

      - name: Gate the version
        working-directory: packaging/flagtree
        env:
          EXPECTED: ${{ matrix.wheel }}
          EXPECTED_VERSION: ${{ matrix.version }}
          WHEEL_TAG: ${{ matrix.wheel_tag }}
          DIST: ${{ matrix.dist_name }}
        run: |
          set -euo pipefail
          # FlagTree owns the version rule; this asserts it still produces what
          # this workflow asked for, so a change upstream fails the build instead
          # of publishing an unexpected version.
          whl="$(ls wheels/*.whl)"
          echo ">>> $whl"
          case "$(basename "$whl")" in
            "${EXPECTED}-${WHEEL_TAG}.whl") ;;
            *) echo "ERROR: expected ${EXPECTED}-${WHEEL_TAG}.whl, got $whl" >&2; exit 1 ;;
          esac
          python3 - "$whl" "$DIST" "$EXPECTED_VERSION" <<'PY'
          import sys
          import zipfile

          whl, dist, expected = sys.argv[1], sys.argv[2], sys.argv[3]
          with zipfile.ZipFile(whl) as zf:
              meta = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
              lines = zf.read(meta).decode().splitlines()
          fields = dict(line.split(": ", 1) for line in lines if ": " in line)
          version = fields.get("Version", "")
          print(">>> Name:", fields.get("Name"), "Version:", version)
          assert fields.get("Name") == dist, fields
          # The version is the date, and nothing else. The sha and the backend
          # token used to live in the local segment; the distribution name and
          # the Source-Commit below carry them now. `expected` is composed by
          # the plan job, so agreeing with it is the whole assertion.
          assert version == expected, (version, expected)
          source_commits = [l for l in lines if l.startswith("Project-URL: Source-Commit, ")]
          print(">>>", *source_commits)
          assert len(source_commits) == 1, source_commits
          assert source_commits[0].startswith(
              "Project-URL: Source-Commit, https://github.com/flagos-ai/flagtree/commit/"
          ), source_commits
          PY

      # Publishing as-is: the build gates already vetted the wheel.
      #
      # A plain upload, with no skip-if-exists anywhere near it. Nexus on this
      # server has redeploy enabled, so a file already on the index is replaced
      # rather than a 400 answered -- which is what lets a manual run put a fix
      # in front of consumers under the day's own version. A later change that
      # adds `--skip-existing` here would silently turn the manual path back
      # into a no-op.
      - name: Upload to the daily PyPI
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        working-directory: packaging/flagtree
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          # `-v wheels` is the job's packaging/flagtree/wheels, the same directory
          # GITHUB_WORKSPACE would not name inside the container.
          WHEEL_UPLOAD_REPO="$PYPI_REPO" \
          WHEEL_UPLOAD_PATHS="/wheels/*.whl" \
          WHEEL_UPLOAD_MOUNT="wheels:/wheels:ro" \
          bash ../../packaging/upload/upload-wheels.sh

      - name: Clean up the build image
        if: ${{ always() }}
        run: docker rmi "$IMAGE" 2>/dev/null || true
