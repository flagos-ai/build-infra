name: Verify cpp wheel fixes (temp)

# Temporary workflow to verify FlagGems + libtriton_jit fixes before PR merge.
# Delete after verification — the fix will be in the next regular release.

on:
  workflow_dispatch:

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/check-trigger-author

  verify-nvidia-cuda128:
    needs: authorize
    runs-on: [self-hosted, h20]
    steps:
      - uses: actions/checkout@v7

      - name: Pull runtime image + verify
        run: |
          set -euo pipefail
          docker pull harbor.baai.ac.cn/flagos-runtime/flagos-runtime-nvidia-cuda12.8:2.1.1

          docker run --rm --gpus all \
            -e FLAGGEMS_REPO="https://github.com/tengqm/FlagGems.git" \
            -e FLAGGEMS_REF="fix/get-flag-gems-src-path-fallback" \
            -e LIBTRITON_JIT_REPO="https://github.com/flagos-ai/libtriton_jit" \
            -e LIBTRITON_JIT_REF="fix/gen-ssig-relative-path-fallback" \
            -v "$PWD/scripts/verify-cpp-fixes.sh:/tmp/verify-cpp-fixes.sh:ro" \
            -v "$PWD/scripts/verify-cpp-ops.py:/tmp/verify-cpp-ops.py:ro" \
            harbor.baai.ac.cn/flagos-runtime/flagos-runtime-nvidia-cuda12.8:2.1.1 \
            bash /tmp/verify-cpp-fixes.sh
