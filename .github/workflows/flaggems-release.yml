name: FlagGems Release Wheels

# This workflow:
#
# — build the pure-Python flag_gems wheel → push to every vendor PyPI.
# — Build cpp operator wheels inside runtime:v1 (local, from step 4).
# — Write flaggems: into configs.yaml, commit, open a PR.
#
# Prerequisites: runtime:v1 images (built with --no-flaggems, tagged
# {version}-build) must be present on each vendor's self-hosted runner.

on:
  workflow_dispatch:
    inputs:
      flaggems_ref:
        description: 'FlagGems tag/ref to build (e.g. "v5.3.1")'
        type: string
        required: true
      skip_cpp:
        description: 'skip cpp operator wheel build + upload'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  # ── pure-Python wheel, all vendor PyPIs ──────────────────────────────
  python-wheel:
    needs: authorize
    # Self-hosted runner for fast upload.
    # The build itself is pure Python and runs anywhere.
    runs-on: [self-hosted, h20]
    env:
      FLAGGEMS_REF: ${{ inputs.flaggems_ref }}
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Python deps
        run: |
          mirror=$(grep "^mirror:" configs.yaml | sed 's/.*"\(.*\)"/\1/')
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages --index-url "$mirror" pyyaml
          python3 -c "import twine" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages --index-url "$mirror" twine
      - name: Build wheel
        run: python3 scripts/release_flaggems.py build-python --ref "$FLAGGEMS_REF"
      - name: Upload to all vendor PyPIs
        run: |
          wheel=$(ls -t wheels/flag_gems-*.whl 2>/dev/null | head -1)
          python3 scripts/release_flaggems.py upload-python "$wheel"
      - name: Record the publish events in the manifest
        run: |
          set -euo pipefail
          mkdir -p .wheel-info
          # One line per lane the upload above reached. That set is what
          # scripts/release_flaggems.py itself uploads to — every vendor in
          # configs.yaml plus the daily index — so it is asked of that module
          # rather than listed here, and the two cannot drift.
          mapfile -t lanes < <(python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          from release_flaggems import _load_configs, _pypi_urls
          cfg = _load_configs()
          urls = list(_pypi_urls(cfg).values())
          if cfg.get("pypi_daily"):
              urls.append(cfg["pypi_daily"])
          for u in urls:
              print(u.rstrip("/").removesuffix("/simple").rsplit("/", 1)[-1])
          PY
          )
          echo ">>> publish lanes: ${lanes[*]}"
          # The distribution name is the wheel's own, read off the file, and
          # the version is spelled in the filename too — the record reads it.
          for w in wheels/*.whl; do
            for lane in "${lanes[@]}"; do
              printf '%s\t%s\t%s\t%s\n' "$(basename "$w" | cut -d- -f1)" "" \
                "${lane}" "$(basename "$w")" >> .wheel-info/manifest.tsv
            done
          done
      - name: Upload the wheel-info manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-info-manifest-${{ github.run_id }}-python
          path: .wheel-info/manifest.tsv
          if-no-files-found: error

  # ── cpp operator wheels, inside runtime:v1 ───────────────────────────
  cpp-matrix:
    needs: python-wheel
    if: ${{ !inputs.skip_cpp }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - run: python3 -m pip install --user pyyaml
      - id: m
        run: |
          python3 scripts/cpp_matrix.py > matrix.json
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  cpp-wheels:
    needs: [python-wheel, cpp-matrix]
    if: ${{ !inputs.skip_cpp && needs.cpp-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.cpp-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    env:
      FLAGGEMS_REF: ${{ inputs.flaggems_ref }}
      BACKEND: ${{ matrix.name }}
      NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Setup Python deps
        run: |
          mirror=$(grep "^mirror:" configs.yaml | sed 's/.*"\(.*\)"/\1/')
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages --index-url "$mirror" pyyaml
          python3 -c "import twine" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages --index-url "$mirror" twine

      - name: Pull runtime:v1 image
        run: |
          # Tag derives from configs.yaml version: + the -build suffix of the
          # NO_FLAGGEMS platform image — never hardcode either.
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('configs.yaml'))['version'])")
          reg=$(python3 -c "import yaml;c=yaml.safe_load(open('.github/build-config.yml'));print(c['registry']['host']+'/'+c['registry']['prefixes']['runtime'])")
          echo "RUNTIME_IMAGE=${reg}/flagos-runtime-${BACKEND}:${version}-build" >> "$GITHUB_ENV"
          docker pull "$RUNTIME_IMAGE"

      - name: Build cpp wheel inside runtime:v1
        run: |
          python3 scripts/release_flaggems.py build-cpp "$BACKEND" \
            --ref "$FLAGGEMS_REF" --runtime-image "$RUNTIME_IMAGE" --outdir wheels-cpp

      - name: Upload cpp wheel to vendor PyPI
        run: |
          wheel=$(ls -t wheels-cpp/flag_gems_cpp_*.whl 2>/dev/null | head -1)
          python3 scripts/release_flaggems.py upload-cpp "$BACKEND" "$wheel"

      - name: Record the publish event in the manifest
        run: |
          set -euo pipefail
          mkdir -p .wheel-info
          # Same lane derivation as upload-cpp: the vendor is the backend's
          # first segment, and its index is flagos-pypi-<vendor>.
          vendor="${BACKEND%%-*}"
          for w in wheels-cpp/*.whl; do
            # One distribution per cmake backend, suffixed into the wheel name
            # (flag_gems_cpp_cuda / _npu / _musa); the catalog name is the
            # wheel's own stem, as for the other packages here.
            printf '%s\t%s\t%s\t%s\n' "$(basename "$w" | cut -d- -f1)" "" \
              "flagos-pypi-${vendor}" "$(basename "$w")" >> .wheel-info/manifest.tsv
          done
      - name: Upload the wheel-info manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-info-manifest-${{ matrix.name }}
          path: .wheel-info/manifest.tsv
          if-no-files-found: error

  # ── update configs.yaml ──────────────────────────────────────────────
  update-config:
    needs: [python-wheel, cpp-wheels]
    if: always() && needs.python-wheel.result == 'success' && needs.cpp-wheels.result == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml
      - name: Set FlagGems version + open PR
        run: python3 scripts/release_flaggems.py update-config "${{ inputs.flaggems_ref }}"

  # The publish steps above leave a manifest of what they uploaded; this job
  # turns it into the catalog row(s) and opens the review-gated record PR. The
  # publish steps deliberately do not edit packaging/wheel-info.yaml themselves
  # — one committer per run is what keeps a fan-out dispatch from racing on it.
  record-wheel-info:
    needs: [python-wheel, cpp-wheels]
    # always(): a manifest is left whether or not the publish step ran, and a
    # skipped cpp leg (skip_cpp) must not read as success here. The gate then
    # keeps this job off a run that published nothing — the python wheel is
    # always uploaded by this workflow, the cpp legs only when not skipped.
    if: ${{ always() && needs.python-wheel.result == 'success' && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        # A run that uploaded nothing publishes no manifest, and that is not a
        # failure of the record — the merge step below says so and skips.
        continue-on-error: true
        with:
          pattern: wheel-info-manifest-*
          path: .wheel-info-dl
      - name: Merge the manifests
        id: merge
        run: |
          set -euo pipefail
          mkdir -p .wheel-info
          if compgen -G ".wheel-info-dl/*/*.tsv" > /dev/null; then
            cat .wheel-info-dl/*/*.tsv >> .wheel-info/manifest.tsv
            echo ">>> publishing rows:"
            cat .wheel-info/manifest.tsv
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo ">>> no publish manifest in this run — nothing to record"
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.merge.outputs.have == 'true' }}
        uses: ./.github/actions/record-wheel-info
        with:
          manifest: .wheel-info/manifest.tsv
          workflow: flaggems-release
