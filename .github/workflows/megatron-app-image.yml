name: Megatron app image

# Builds flagos-app/{app}{app_version}-{app_name}:{stack_version}-{mlf_version}
# ({app} = megatron_training | megatron_rl, app name + version, no separator; {app_name} =
# the app-layer public name of the backend, matrix.app_name — generic-12.8 for
# nvidia-cuda12.8; the app layer is published vendor-neutral) from the
# runtime image by installing the megatron-core wheel single-step (no
# --no-deps), then
# verifies the built image on the node: the torch/triton/flag_gems/numpy
# matrix must be identical to the runtime's, and megatron.core must import
# with helpers_cpp bound (see packaging/megatron/verify/verify-megatron-backend.sh).
#
# Tag naming follows the app-image convention (same as vllm):
#   <应用名称><应用版本>-<公开厂商>-<后端段>:<堆栈版本>-<fork版本，-替换为下划线>
# The app version is the megatron-core version being installed (0.17.x, the
# wheel's megatron.core.__version__). The fork segment is the Megatron-LM-FL
# fork's own version, generated from its latest release tag and the commit
# distance to it (git describe): 0.2.1 on the tag, 0.2.1_9.g48b97a13f nine
# commits past it — so the version maps to a commit in the fork repo
# (input mlf_version, already in Docker-tag form). Example:
#   flagos-app/megatron_rl0.17.1-generic-12.8:2.1.2-0.2.1_9.g48b97a13f
#
# Facility 2 (app-image automation): installs the megatron-core wheel into a
# flagos-runtime-{vendor}-{backend} image and produces the app image. Each app has its own
# Containerfile (app/megatron/Containerfile.megatron-training for the training
# app, app/megatron/Containerfile.rl for the RL app) that installs the wheel
# with a single-step `pip install` (no --no-deps) selecting the app's extra
# ([training] / [rl]) — the wheel keeps its torch>=2.6.0 Requires-Dist and the
# runtime's vendor torch satisfies it, so the runtime's
# torch/triton/flag_gems matrix cannot be disturbed (the repack facility was
# removed 2026-08-14).
#
# Backend matrix comes from scripts/generate_matrix.py --app {app}{app_version},
# the versioned app key configs.yaml deps_app is keyed by (same
# runtime fields as runtime-image.yaml plus the per-backend app env vars and
# vendor-conditional deps from configs.yaml deps_app.{app}{app_version}).
# Per-vendor PyPI (flagos_pypi) is searched first; aliyun is the fallback.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend to build (e.g. hygon-dtk26.04), or "all"'
        type: string
        default: all
      app:
        description: 'App to build: megatron_training (training + post_training) or megatron_rl (RL loop). The app key is this name + megatron_version (megatron_training0.17.1).'
        type: choice
        options:
          - megatron_training
          - megatron_rl
        default: megatron_training
      megatron_version:
        description: 'megatron-core version to install (e.g. 0.17.1). Names the image tag; the wheel to install is megatron_wheel_version.'
        type: string
        default: 0.17.1
      megatron_wheel_version:
        description: 'Exact megatron-core version to install, local part included (e.g. 0.17.1+fl.0.2.3). Blank = megatron_version, which resolves to whichever wheel the index holds.'
        type: string
        default: ''
      mlf_version:
        description: 'Megatron-LM-FL fork version (git describe from its release tag: 0.2.1, or 0.2.1_9.g48b97a13f)'
        type: string
        default: '0.2.1'
      push:
        description: 'Push image(s) to the registry'
        type: boolean
        default: false
      verify:
        description: 'Run the on-node verification step (matrix + import check)'
        type: boolean
        default: true

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      harbor_host: ${{ steps.harbor-host.outputs.host }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - id: set-matrix
        shell: bash
        run: |
          # --app takes the *versioned* app key (configs.yaml deps_app), which
          # is the app name plus the version being installed.
          app_key="${{ inputs.app }}${{ inputs.megatron_version }}"
          if [[ "${{ inputs.backend }}" == "all" ]]; then
            python3 scripts/generate_matrix.py --app "${app_key}" > matrix.json
          else
            python3 scripts/generate_matrix.py --app "${app_key}" ${{ inputs.backend }} > matrix.json
          fi
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

      - id: harbor-host
        shell: bash
        run: |
          host=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['host'])")
          echo "host=$host" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    if: ${{ fromJSON(needs.set-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    name: app-${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Harbor login (push only)
        if: ${{ inputs.push }}
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PW: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          host="${{ needs.set-matrix.outputs.harbor_host }}"
          for i in 1 2 3; do
            if printf '%s' "$HARBOR_PW" | docker login "$host" -u "$HARBOR_USER" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt $i failed, retrying..."
            sleep 30
          done
          echo "::error::Harbor login failed after 3 attempts"
          exit 1

      - name: Pull runtime image
        run: |
          docker pull "${{ matrix.image_tag }}" || {
            echo "::error::Failed to pull runtime image ${{ matrix.image_tag }}"
            exit 1
          }

      - name: Build megatron app image
        run: |
          set -euo pipefail
          host="${{ needs.set-matrix.outputs.harbor_host }}"
          app_prefix=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['prefixes']['app'])")
          # Tag naming (same as the images already in flagos-app, cf. vllm):
          #   {app}{megatron-core version}-{app_name}:
          #     {stack_version}-{mlf_version}
          # The repo segment is the app-layer public name (matrix.app_name) —
          # the app layer is published vendor-neutral, so the real vendor must
          # not reach the tag.
          # The mlf_version (git describe of the MLF fork, e.g. 0.2.1 or
          # 0.2.1-9-g48b97a13f) may carry '+'/'-', which are not allowed in an
          # image tag — use '_'.
          app_name='${{ inputs.app }}'
          fork_ver=$(printf '%s' '${{ inputs.mlf_version }}' | tr '+' '_' | tr '-' '_')
          app_tag="${host}/${app_prefix}/${app_name}${{ inputs.megatron_version }}-${{ matrix.app_name }}:${{ matrix.version }}-${fork_ver}"
          echo "APP_TAG=${app_tag}" >> "$GITHUB_ENV"
          # Per-app Containerfile (app decision D5): the suffix is the app
          # name, not the image name. megatron_training / megatron_rl.
          containerfile="app/megatron/Containerfile.megatron-training"
          if [[ "${{ inputs.app }}" == "megatron_rl" ]]; then
            containerfile="app/megatron/Containerfile.rl"
          fi
          # The wheel the image installs is pinned to its exact version wherever
          # the operator states one. `==0.17.1` is satisfied by every fork build
          # of that upstream version, so it resolves to whichever local version
          # the index happens to hold — a rebuild can then install a different
          # wheel than the release names, silently, and the tag cannot show it.
          # Same-step consumers must read ${wheel_version}: GITHUB_ENV only
          # reaches later steps, and `set -u` turns a same-step read of it into
          # an immediate unbound-variable failure (the whole matrix failed this
          # way on the first verify run after the pin landed).
          wheel_version='${{ inputs.megatron_wheel_version }}'
          [ -n "${wheel_version}" ] || wheel_version='${{ inputs.megatron_version }}'
          echo "MEGATRON_WHEEL_VERSION=${wheel_version}" >> "$GITHUB_ENV"
          # --no-cache only on verify-only runs (push=false): the pip RUN layer
          # caches by command string, so a re-uploaded wheel under the same
          # ==0.17.1 spec is silently skipped — the verify must resolve the
          # vendor index fresh. A push run reuses the layer the verify run just
          # built (same command + parent image), which is much faster and
          # replicates the verified build verbatim.
          no_cache_arg=""
          [[ "${{ inputs.push }}" != "true" ]] && no_cache_arg="--no-cache"
          # Changelog gate: a push must be authorized by a pending changelog
          # entry for this tag (see vllm-app-image.yml). Debug builds skip it.
          if [[ "${{ inputs.push }}" == "true" ]]; then
            python3 scripts/changelog_gate.py \
              "app/megatron/changelogs/${app_name}${{ inputs.megatron_version }}-${{ matrix.app_name }}.yaml" \
              "${app_tag##*:}"
          fi
          # App's own build provenance (see vllm-app-image.yml).
          commit="$(git rev-parse HEAD)"
          created="$(git show -s --format=%cI HEAD)"
          docker build \
            ${no_cache_arg} \
            --build-arg "RUNTIME_IMAGE=${{ matrix.image_tag }}" \
            --build-arg "MEGATRON_VERSION=${wheel_version}" \
            --build-arg "FLAGOS_PYPI=${{ matrix.flagos_pypi }}" \
            --build-arg "EXTRA_PYPI=${{ matrix.extra_pypi }}" \
            --build-arg "APP_ENV=${{ matrix.app_env }}" \
            --build-arg "APP_DEPS=${{ matrix.app_deps }}" \
            --label "org.opencontainers.image.version=${{ matrix.version }}" \
            --label "org.opencontainers.image.revision=${commit}" \
            --label "org.opencontainers.image.created=${created}" \
            --label "last-updated=${created}" \
            --label "flagos.app=${{ inputs.app }}" \
            -t "${app_tag}" \
            -f "${containerfile}" .
          echo "Built: ${app_tag}"

      # On-node verify of the built artifact. Reuses verify-megatron-backend.sh
      # in --app-image mode: BEFORE snapshot from the runtime image, AFTER from
      # the app image — the torch/triton/flag_gems/numpy matrix must match item
      # by item (proves the single-step install baked into the image was inert),
      # then import megatron.core with helpers_cpp bound on the app container.
      # Runs before push so a failed verify gates the push. Needs hardware
      # access (the script reads run flags from .github/build-config.yml).
      - name: Verify megatron app image
        if: ${{ inputs.verify }}
        run: |
          set -euo pipefail
          bash packaging/megatron/verify/verify-megatron-backend.sh \
            "${{ matrix.name }}" \
            --megatron-version "${MEGATRON_WHEEL_VERSION}" \
            --app-image "${APP_TAG}"

      - name: Push megatron app image
        if: ${{ inputs.push }}
        run: |
          docker push "${APP_TAG}"

      # image_tag in the status matrix is the single source of truth for
      # "this backend is published" (docs/status-matrix.md). Only the
      # workflow knows the exact tag at push time, so it records it itself
      # right after the push — this regenerates the verification matrix and
      # app launch pages and opens a review-gated PR (scripts/
      # record_app_image_tag.py). Idempotent: same tag → no-op.
      - name: Record app image tag
        if: ${{ success() && inputs.push }}
        uses: ./.github/actions/record-app-image-tag
        with:
          matrix: "packaging/megatron/status_matrix.${{ inputs.app }}${{ inputs.megatron_version }}.yaml"
          backend: "${{ matrix.name }}"
          changelog: "app/megatron/changelogs/${{ inputs.app }}${{ inputs.megatron_version }}-${{ matrix.app_name }}.yaml"
          tag: "${APP_TAG}"
