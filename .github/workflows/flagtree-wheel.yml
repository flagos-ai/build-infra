name: FlagTree Wheel

# Builds a packaging/flagtree/<target> wheel and optionally uploads it to the
# vendor PyPI. Two target families: self-contained Containerfiles (metax /
# nvidia-cuda / iluvatar / sunrise / hcu-dtk2610), and the ascend pair, whose
# build machine is
# its backend's runtime image and which is therefore named after that backend —
# the Containerfile, this workflow's target and generate_matrix.py's backend name
# are the same string. `prepare` resolves what that difference implies: the runner
# labels and the vendor index, and — for the ascend pair only — the cold base.
# The Containerfile's gates fail `docker build` on an unusable wheel, so a bad
# wheel never reaches extract/upload.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'packaging/flagtree target (Containerfile name)'
        type: choice
        options:
          - metax
          - nvidia-cuda
          - iluvatar
          - sunrise
          - hcu-dtk2610
          - ascend-cann9.0.0
          - ascend-cann8.5.0
        default: metax
      flagtree_version:
        description: 'FlagTree tag/branch/sha to build (blank = Containerfile default)'
        type: string
        default: ''
      flagtree_wheel_version:
        description: 'wheel version override (blank = Containerfile default = <base>.<UTC date>)'
        type: string
        default: ''
      upload:
        description: 'upload the wheel to the vendor PyPI'
        type: boolean
        default: false
      base_image:
        description: 'cold-base override for the ascend targets, i.e. their builder stage''s base (blank = the backend runtime image from configs.yaml)'
        type: string
        default: ''
      pypi_repo:
        description: 'Nexus PyPI repo (blank = flagos-pypi-<vendor> derived from target)'
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # checkout lets the local composite action resolve from the workspace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  prepare:
    # Runner labels, runtime image, index and upload repo, from the single source
    # of truth.
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      runson: ${{ steps.resolve.outputs.runson }}
      base_image: ${{ steps.resolve.outputs.base_image }}
      extra_pypi: ${{ steps.resolve.outputs.extra_pypi }}
      pypi_repo: ${{ steps.resolve.outputs.pypi_repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml
      - id: resolve
        env:
          TARGET: ${{ inputs.target }}
          BASE_IMAGE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          set -euo pipefail
          # Which configs.yaml backend a target belongs to, when it has one. The
          # ascend targets ARE the backend names, so they need no mapping; the
          # iluvatar target is the plain vendor name, and which CoreX line it
          # means is the runtime image's business, not a guess from the string.
          # hcu-dtk2610 maps explicitly: `hcu` alone would resolve to the 26.04
          # line, whose pin is a cp310 wheel this target does not build.
          #
          # `in_base` marks the targets whose build machine IS that backend's
          # runtime image. They take the same `BUILDER_IMAGE` arg every other
          # backend does -- it is the builder stage's base -- but for them the cold
          # value is a registry ref rather than a bare ubuntu, so it has to be
          # passed rather than left to the Containerfile's default.
          backend=""; in_base=no
          case "$TARGET" in
            ascend-cann*) backend="$TARGET";                in_base=yes ;;
            iluvatar)     backend="iluvatar-corex4.5.0";    in_base=no  ;;
            hcu-dtk2610)  backend="hygon-dtk26.10";         in_base=no  ;;
          esac
          if [ -z "$backend" ]; then
            echo 'runson=["self-hosted","h20"]' >> "$GITHUB_OUTPUT"
            echo "base_image=" >> "$GITHUB_OUTPUT"
            echo "extra_pypi=" >> "$GITHUB_OUTPUT"
            echo "pypi_repo=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/generate_matrix.py --runtime "$backend" > matrix.json
          cat matrix.json
          echo "runson=$(jq -c '.include[0].runson | fromjson' matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$in_base" = yes ]; then
            # A version bump reaches the runtime images later than configs.yaml: until
            # then the build takes a tag of a previous stack version.
            echo "base_image=${BASE_IMAGE_OVERRIDE:-$(jq -r '.include[0].image_tag' matrix.json)}" >> "$GITHUB_OUTPUT"
            echo "extra_pypi=$(jq -r '.include[0].extra_pypi' matrix.json)" >> "$GITHUB_OUTPUT"
          else
            echo "base_image=" >> "$GITHUB_OUTPUT"
            echo "extra_pypi=" >> "$GITHUB_OUTPUT"
          fi
          # Off the matrix's vendor index, not the target name: it is the field the
          # runtime images are built from.
          flagos_pypi=$(jq -r '.include[0].flagos_pypi' matrix.json)
          echo "pypi_repo=$(basename "$(dirname "$flagos_pypi")")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ fromJSON(needs.prepare.outputs.runson) }}
    env:
      TARGET: ${{ inputs.target }}
      IMAGE: flagtree-wheel:${{ inputs.target }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the FlagTree wheel image
        working-directory: packaging/flagtree
        env:
          FLAGTREE_VERSION: ${{ inputs.flagtree_version }}
          FLAGTREE_WHEEL_VERSION: ${{ inputs.flagtree_wheel_version }}
          COLD_BASE: ${{ needs.prepare.outputs.base_image }}
          EXTRA_PYPI: ${{ needs.prepare.outputs.extra_pypi }}
        run: |
          set -euo pipefail
          test -f "$TARGET" || { echo "ERROR: packaging/flagtree/$TARGET not found" >&2; exit 1; }
          build_args=()
          if [ -n "${FLAGTREE_VERSION:-}" ]; then
            build_args+=(--build-arg "FLAGTREE_VERSION=${FLAGTREE_VERSION}")
          fi
          if [ -n "${FLAGTREE_WHEEL_VERSION:-}" ]; then
            build_args+=(--build-arg "FLAGTREE_WHEEL_VERSION=${FLAGTREE_WHEEL_VERSION}")
          fi
          if [ -n "${COLD_BASE:-}" ]; then
            # The ascend pair's build machine IS the backend's runtime image, so
            # their Containerfile's cold base arg is BUILDER_IMAGE -- the same
            # name the daily line points at a published stage.
            build_args+=(--build-arg "BUILDER_IMAGE=${COLD_BASE}")
            build_args+=(--build-arg "EXTRA_PYPI=${EXTRA_PYPI}")
          fi
          # The runner's proxy, relayed verbatim: all three, never a value
          # invented here, and never gated on one of the others being set. The
          # Containerfiles declare them as ARGs, which is what keeps them to the
          # build -- an ARG is not persisted in the image config. no_proxy matters
          # as much as the other two: a value invented here is what sends an
          # internal fetch through the tunnel.
          http_proxy_val="${http_proxy:-${HTTP_PROXY:-}}"
          https_proxy_val="${https_proxy:-${HTTPS_PROXY:-}}"
          no_proxy_val="${no_proxy:-${NO_PROXY:-}}"
          [ -n "${http_proxy_val}" ] && build_args+=(--build-arg "http_proxy=${http_proxy_val}")
          [ -n "${https_proxy_val}" ] && build_args+=(--build-arg "https_proxy=${https_proxy_val}")
          [ -n "${no_proxy_val}" ] && build_args+=(--build-arg "no_proxy=${no_proxy_val}")
          # --no-cache: the clone layer is keyed on the ref NAME, not its content.
          docker build --no-cache "${build_args[@]}" -t "$IMAGE" -f "$TARGET" .

      - name: Extract the wheel
        working-directory: packaging/flagtree
        run: |
          set -euo pipefail
          rm -rf wheels && mkdir -p wheels
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/wheels/." wheels/
          docker rm "$cid" >/dev/null
          ls -la wheels/*.whl

      # Published as-is: the build gates already vetted the wheel.
      - name: Upload to vendor PyPI
        if: ${{ inputs.upload }}
        working-directory: packaging/flagtree
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          # vendor = first segment of the target (nvidia-cuda -> nvidia); the ascend
          # targets get their repo from `prepare` instead.
          vendor="${TARGET%%-*}"
          pypi_repo="${{ inputs.pypi_repo }}"
          pypi_repo="${pypi_repo:-${{ needs.prepare.outputs.pypi_repo }}}"
          pypi_repo="${pypi_repo:-flagos-pypi-${vendor}}"
          # The uploader image carries twine and pkginfo at versions that read
          # PEP 639 metadata (2.4), which the runner's own python is not
          # guaranteed to have; see packaging/upload/.
          WHEEL_UPLOAD_REPO="$pypi_repo" \
          WHEEL_UPLOAD_PATHS="/wheels/*.whl" \
          WHEEL_UPLOAD_MOUNT="wheels:/wheels:ro" \
          bash ../../packaging/upload/upload-wheels.sh

      - name: Clean up the build image
        if: ${{ always() }}
        run: docker rmi "$IMAGE" 2>/dev/null || true
