name: FlagTree Builder

# Publishes the `--target builder` stage of the flagtree Containerfiles that have
# one: the build machine, holding everything that does not depend on the FlagTree
# ref (apt toolchain, interpreter, prebuilt LLVM / plugin / triton toolkits). The
# wheel lines build on top of those images. One entry per backend in
# packaging/flagtree/backends.yaml; a row's fields say which extra proof its stage
# gets (nvidia's and metax's content assertions, iluvatar's flagtree image +
# wheel).
#
# Not a wheel publisher: iluvatar's wheel is kept as a run artifact and uploaded
# by a wheel line, so one version never has two uploaders.

on:
  workflow_dispatch:
    inputs:
      backends:
        description: 'space-separated backend keys to build (blank = every row in backends.yaml)'
        type: string
        default: ''
      flagtree_version:
        description: 'FlagTree ref, for the rows whose stage compiles it (blank = Containerfile default)'
        type: string
        default: ''
      push:
        description: 'push the builder images to Harbor'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this manually.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml

      - name: Build the matrix from backends.yaml
        id: build
        env:
          SELECTED: ${{ inputs.backends }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > matrix.json
          import json, os, sys, yaml

          want = (os.environ.get("SELECTED") or "").split()
          data = yaml.safe_load(open("packaging/flagtree/backends.yaml"))["backends"]

          rows = []
          for name, cfg in data.items():
              if want and name not in want:
                  continue
              # A `builder:` block's presence is what says a publishable stage
              # exists; a backend with only `daily:` has none yet.
              b = cfg.get("builder")
              if not b:
                  continue
              rows.append({
                  "name": name,
                  "containerfile": cfg["containerfile"],
                  "builder_image": cfg["builder_image"],
                  # JSON string: a bare `runs-on: matrix.runson` queues forever.
                  "runson": json.dumps(cfg["runson"]),
                  "disk_min_gb": cfg["disk_min_gb"],
                  # A name, not a flag: each backend stages different things, so
                  # each has its own assertions. "" = the build is the proof.
                  "verify_stage": b.get("verify_stage") or "",
                  "image_target": bool(b.get("image_target")),
                  "image_tag": b.get("image_tag", ""),
                  "ref_arg": bool(b.get("ref_arg")),
              })

          unknown = [w for w in want if w not in data]
          if unknown:
              print(f"unknown backend(s): {' '.join(unknown)}", file=sys.stderr)
              sys.exit(1)
          # An empty matrix is not a no-op -- GitHub rejects it as malformed.
          if not rows:
              selected = " ".join(want) if want else "(every entry)"
              print(f"no publishable builder stage for {selected}", file=sys.stderr)
              sys.exit(1)
          print(json.dumps({"include": rows}))
          PY
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    strategy:
      # One backend's failure must not cancel the others.
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    env:
      TARGET: ${{ matrix.containerfile }}
      BUILDER_IMAGE: ${{ matrix.builder_image }}:ci
      APP_IMAGE: ${{ matrix.image_tag }}:ci
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check disk space
        run: |
          set -euo pipefail
          FREE_KB=$(df -P . | awk 'NR==2{print $4}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free disk space: ${FREE_GB}G (this row wants ${{ matrix.disk_min_gb }}G)"
          if [ "$FREE_GB" -lt "${{ matrix.disk_min_gb }}" ]; then
            echo "ERROR: insufficient disk space (${FREE_GB}G < ${{ matrix.disk_min_gb }}G). Docker needs cleanup."
            df -h .
            exit 1
          fi

      - name: Resolve the published image ref
        id: ref
        run: |
          set -euo pipefail
          # The same ref the wheel lines derive.
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('configs.yaml'))['version'])")
          host=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['host'])")
          prefix=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['prefixes']['builder'])")
          echo "image=${host}/${prefix}/${{ matrix.builder_image }}:${version}" >> "$GITHUB_OUTPUT"

      - name: Harbor login (push only)
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PW: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          host="${IMAGE_REF%%/*}"
          for i in 1 2 3; do
            if printf '%s' "$HARBOR_PW" | docker login "$host" -u "$HARBOR_USER" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt $i failed, retrying..."
            sleep 30
          done
          echo "::error::Harbor login failed after 3 attempts"
          exit 1

      - name: Build the builder stage
        working-directory: packaging/flagtree
        env:
          REF_ARG: ${{ matrix.ref_arg }}
          FLAGTREE_REF: ${{ inputs.flagtree_version }}
        run: |
          set -euo pipefail
          # The runner's proxy, relayed verbatim: all three, never a value
          # invented here, and never gated on one of the others being set. The
          # Containerfiles declare them as ARGs, which is what keeps them to the
          # build -- an ARG is not persisted in the image config. no_proxy matters
          # as much as the other two: the host knows which endpoints are internal,
          # and a value invented here is what sends an internal fetch through the
          # tunnel.
          build_args=()
          http_proxy_val="${http_proxy:-${HTTP_PROXY:-}}"
          https_proxy_val="${https_proxy:-${HTTPS_PROXY:-}}"
          no_proxy_val="${no_proxy:-${NO_PROXY:-}}"
          [ -n "${http_proxy_val}" ] && build_args+=(--build-arg "http_proxy=${http_proxy_val}")
          [ -n "${https_proxy_val}" ] && build_args+=(--build-arg "https_proxy=${https_proxy_val}")
          [ -n "${no_proxy_val}" ] && build_args+=(--build-arg "no_proxy=${no_proxy_val}")
          # Only a stage that compiles the ref itself declares the arg.
          if [ "${REF_ARG}" = "true" ] && [ -n "${FLAGTREE_REF}" ]; then
            build_args+=(--build-arg "FLAGTREE_VERSION=${FLAGTREE_REF}")
          fi
          # No --build-arg BUILDER_IMAGE: the Containerfile's own default base is
          # what makes this a cold build, cached by the apt list and tarball args.
          docker build --target builder "${build_args[@]}" -t "$BUILDER_IMAGE" -f "$TARGET" .
          docker tag "$BUILDER_IMAGE" "${{ steps.ref.outputs.image }}"

      # The wheel build reads from this stage, so assert what it reads.
      # `lib/cmake/mlir` is the contract, not `bin/clang`: this is the oaitriton
      # tree that ships no clang (packaging/flagcx/WHEEL-DESIGN.md) and FlagTree
      # consumes it as an MLIR install tree.
      - name: Verify the stage carries what the wheel build reads (nvidia)
        if: ${{ matrix.verify_stage == 'nvidia' }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" bash -euo pipefail -c '
            test -f /opt/flagtree-build-env.ready
            command -v git cmake ninja make wget curl >/dev/null
            python3.12 -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python3.12 -m pip --version
            test -f /usr/local/bin/patch-flagtree-version.py
            test -d "${LLVM_SYSPATH}/lib/cmake/mlir"
            ls "${LLVM_SYSPATH}"/lib/cmake/mlir/*Config.cmake >/dev/null
            # The staleness gate in the wheel build reads this.
            test -s /opt/flagtree-build-env.llvm
            echo ">>> LLVM_SYSPATH=${LLVM_SYSPATH}, staged $(cat /opt/flagtree-build-env.llvm)"
          '

      # The metax stage's own contract: the three prebuilt inputs are what the
      # wheel build consumes instead of fetching. Their NAMES are the coupling
      # that matters -- FlagTree declares the URLs it wants in
      # python/setup_tools/utils/metax.py and re-downloads anything it does not
      # recognize, so a stage whose plugin version has fallen behind still
      # builds, and does so over the network. Nothing here can decide that
      # offline, so this asserts the cache is wired and reports the plugin's md5
      # prefix, which is the value metax.py's md5_digest is compared against.
      - name: Verify the stage carries what the wheel build reads (metax)
        if: ${{ matrix.verify_stage == 'metax' }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" bash -euo pipefail -c '
            test -f /opt/flagtree-build-env.ready
            command -v git cmake ninja make wget curl >/dev/null
            python3.12 -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python3.12 -m pip --version
            test -d /root/.flagtree/metax/metax-llvm19
            test -f /root/.flagtree/metax/metaxTritonPlugin.so
            test -f /root/.triton/json/include/nlohmann/json.hpp
            # FlagTree compares only the first 8 characters (setup_helper.py).
            echo ">>> staged metax deps; plugin md5 prefix $(md5sum /root/.flagtree/metax/metaxTritonPlugin.so | cut -c1-8)"
          '

      # The default target is an image on top of the stage: building it proves
      # the stage delivers what the image needs, and its wheel is evidence of
      # that. The ref arg IS passed: this rebuilds the stage on the way, so a
      # different ref here would make the wheel below someone else's.
      - name: Build the flagtree image
        if: ${{ matrix.image_target }}
        working-directory: packaging/flagtree
        env:
          REF_ARG: ${{ matrix.ref_arg }}
          FLAGTREE_REF: ${{ inputs.flagtree_version }}
        run: |
          set -euo pipefail
          # Same relay as the builder stage, for the same reason: ARGs do not
          # carry across FROM, so this stage declares its own.
          build_args=()
          http_proxy_val="${http_proxy:-${HTTP_PROXY:-}}"
          https_proxy_val="${https_proxy:-${HTTPS_PROXY:-}}"
          no_proxy_val="${no_proxy:-${NO_PROXY:-}}"
          [ -n "${http_proxy_val}" ] && build_args+=(--build-arg "http_proxy=${http_proxy_val}")
          [ -n "${https_proxy_val}" ] && build_args+=(--build-arg "https_proxy=${https_proxy_val}")
          [ -n "${no_proxy_val}" ] && build_args+=(--build-arg "no_proxy=${no_proxy_val}")
          if [ "${REF_ARG}" = "true" ] && [ -n "${FLAGTREE_REF}" ]; then
            build_args+=(--build-arg "FLAGTREE_VERSION=${FLAGTREE_REF}")
          fi
          docker build "${build_args[@]}" -t "$APP_IMAGE" -f "$TARGET" .

      - name: Extract the wheel
        if: ${{ matrix.image_target }}
        working-directory: packaging/flagtree
        run: |
          set -euo pipefail
          rm -rf wheels && mkdir -p wheels
          cid=$(docker create "$APP_IMAGE")
          docker cp "$cid:/wheels/." wheels/
          docker rm "$cid" >/dev/null
          ls -la wheels/*.whl

      - name: Keep the wheel
        if: ${{ matrix.image_target }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flagtree-wheel-${{ matrix.name }}
          path: packaging/flagtree/wheels/*.whl
          if-no-files-found: error

      - name: Push the builder image
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"

      # A push is accepted, not served: read the tag back as a consumer would.
      - name: Verify the pushed image reads back
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          built="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          docker pull "$IMAGE_REF"
          served="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          if [ "$built" != "$served" ]; then
            echo "::error::$IMAGE_REF: the registry serves $served, this run built $built"
            exit 1
          fi
          echo ">>> $IMAGE_REF reads back as $served"

      - name: Clean up
        if: ${{ always() }}
        run: |
          docker rmi "$BUILDER_IMAGE" 2>/dev/null || true
          # APP_IMAGE only exists where the row has an image target.
          if [ -n "${{ matrix.image_tag }}" ]; then
            docker rmi "$APP_IMAGE" 2>/dev/null || true
          fi
