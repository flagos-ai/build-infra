name: FlagGems Daily Wheel

# Build the pure-Python flag_gems wheel from FlagGems source and (optionally)
# upload it to the internal PyPI. The wheel is versioned by FlagGems'
# setuptools_scm (git tags): a dev build looks like 5.4.0.dev580+gb89e0aeb8.

on:
  workflow_dispatch:
    inputs:
      flaggems_ref:
        description: 'FlagGems git ref to build'
        type: string
        default: master
      upload:
        description: 'upload the wheel to the internal PyPI'
        type: boolean
        default: false
      pypi_repo:
        description: 'Nexus PyPI-hosted repo to upload to'
        type: string
        default: flagos-pypi-daily
  schedule:
    # Daily at 01:17 UTC. Builds + uploads (see the guard in the upload step).
    - cron: '17 1 * * *'

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  build:
    needs: authorize
    runs-on: ubuntu-latest
    env:
      FLAGGEMS_REPO: https://github.com/flagos-ai/FlagGems.git
      FLAGGEMS_REF: ${{ inputs.flaggems_ref || 'master' }}
      PYPI_REPO: ${{ inputs.pypi_repo || 'flagos-pypi-daily' }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: OUTDIR="${GITHUB_WORKSPACE}/wheels" bash packaging/flaggems/build.sh

      # The upload step resolves the uploader image with image-ref.sh, which
      # reads configs.yaml/build-config.yml via python3's yaml module.
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml

      # Upload to the internal PyPI on the schedule, or when manually requested.
      # Manual dispatch defaults upload=false so building from a branch is safe.
      - name: Upload to internal PyPI
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          # The default mount is `wheels:/wheels:ro`, relative to this step's
          # own directory, which is the repo root.
          WHEEL_UPLOAD_REPO="$PYPI_REPO" \
          WHEEL_UPLOAD_PATHS="/wheels/*.whl" \
          bash packaging/upload/upload-wheels.sh
