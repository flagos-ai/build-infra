name: FlagGems-vllm Daily Wheel

# Build the pure-Python flaggems_vllm wheel from FlagGems-vllm source and
# (optionally) upload it to the internal PyPI. Same shape as the FlagGems
# daily (flaggems-wheel.yml): both are py3-none-any wheels that need no vendor
# toolchain, so both build on a hosted runner with a plain venv script.
#
# The one difference is where the version comes from. FlagGems has
# setuptools_scm; FlagGems-vllm carries a static version in pyproject.toml, so
# a dev build off main is dated by packaging/flaggems-vllm/build.sh
# (0.3.0-dev1 -> 0.3.0.dev20261104). A release tag is shipped as the tag.

on:
  workflow_dispatch:
    inputs:
      flaggems_vllm_ref:
        description: 'FlagGems-vllm git ref to build'
        type: string
        default: main
      upload:
        description: 'upload the wheel to the internal PyPI'
        type: boolean
        default: false
      pypi_repo:
        description: 'Nexus PyPI-hosted repo to upload to'
        type: string
        default: flagos-pypi-daily
  schedule:
    # Daily at 01:27 UTC, between the FlagGems (01:17) and FlagTree (01:37)
    # dailies. Builds + uploads (see the guard in the upload step).
    - cron: '27 1 * * *'

defaults:
  run:
    shell: bash

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  build:
    needs: authorize
    runs-on: ubuntu-latest
    env:
      FLAGGEMS_VLLM_REPO: https://github.com/flagos-ai/FlagGems-vllm.git
      FLAGGEMS_VLLM_REF: ${{ inputs.flaggems_vllm_ref || 'main' }}
      PYPI_REPO: ${{ inputs.pypi_repo || 'flagos-pypi-daily' }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Build the wheel
        run: OUTDIR="${GITHUB_WORKSPACE}/wheels" bash packaging/flaggems-vllm/build.sh

      - name: Verify the wheel
        run: |
          set -euo pipefail
          ls -1 wheels/*.whl
          # The build.sh gate already pins the exact filename; this re-checks
          # the set that upload will send, so a wheel that appeared some other
          # way cannot ride along.
          for w in wheels/*.whl; do
            case "$(basename "$w")" in
              flaggems_vllm-*-py3-none-any.whl) ;;
              *) echo "ERROR: unexpected wheel would be uploaded: $(basename "$w")" >&2; exit 1 ;;
            esac
          done

      # The upload step resolves the uploader image with image-ref.sh, which
      # reads configs.yaml/build-config.yml via python3's yaml module.
      - name: Install PyYAML
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml

      # Upload to the internal PyPI on the schedule, or when manually
      # requested. Manual dispatch defaults upload=false so building from a
      # branch is safe.
      - name: Upload to internal PyPI
        if: ${{ github.event_name == 'schedule' || inputs.upload }}
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          # The default mount is `wheels:/wheels:ro`, relative to this step's
          # own directory, which is the repo root.
          WHEEL_UPLOAD_REPO="$PYPI_REPO" \
          WHEEL_UPLOAD_PATHS="/wheels/*.whl" \
          bash packaging/upload/upload-wheels.sh
