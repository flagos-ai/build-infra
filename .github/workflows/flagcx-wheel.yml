name: flagcx wheel

# Build FlagCX wheels in the backend's runtime image, and (optionally) publish
# them to that vendor's PyPI.
#
# THE BUILD ENVIRONMENT IS THE BACKEND'S RUNTIME IMAGE, or the build-toolchain
# image published beside it where the row carries device bitcode: BASE_IMAGE =
# flagcx-config.py's `wheel_base_image`, the vllm-plugin-wheel.yml model.
#
# The FlagCX build imports torch while it configures itself, so one environment
# has to carry torch, setuptools_scm and Python.h at once — only /flagos does.
# Build env == delivery env: a builder is the runtime image plus a toolchain.
#
# The matrix comes from `flagcx-config.py --merge --channel wheel` rather than from
# `generate_matrix.py` directly: the merge is what joins the runtime matrix with
# the FlagCX wheel fields (version suffix, python tag, adaptor, make env), and
# the runtime matrix alone lacks every input the build consumes.
#
# THE REF IS STATED PER DISPATCH and carries no default. It decides the version
# the artifact carries, so an inherited one is the wrong commit with a plausible
# name. Two kinds are meaningful here:
#
#   * a release tag (`v0.14.0-rc2.post2`) for a versioned build. setuptools_scm
#     reads the tag, so the wheel is named `<the tag's version>+<row label>` and
#     the tag is the whole of what names it. The pin is therefore derived per row
#     in set-matrix rather than typed, which is what lets one dispatch publish
#     twenty backends whose pins all differ.
#   * an upstream branch for a verification build. Its wheels carry
#     `.dev<distance>` and a `<date>.<node>` tail — what such a build should say
#     about itself, and a distance nothing outside the build knows. Publishing
#     one therefore requires `wheel_version`, stated by the operator.
#
# Unlike flagcx-deb.yml this line does not refuse a non-tag ref: a build that is
# not a tag is what the verification case is. What it refuses is publishing a
# wheel under a name nothing can derive or state.
#
# `pypi_repo` is derived from the matrix row and is deliberately NOT an input
# (megatron-wheel.yml, sglang-wheel.yml and vllm-plugin-wheel.yml all expose
# one): expanding the row's name into a vendor is the only thing that names an
# index here, so no input can reach another vendor's index, and the read-back
# step reads the same row's `flagos_pypi` — the build row and the read-back
# index cannot diverge.
#
# `verify` is a job and not a step of the build because the wheel has to install
# from the file alone, into a container in the state a user gets: the build tree
# proves nothing about the artifact being self-contained. Publishing is a step
# of `verify` for the same reason flagcx-deb.yml puts it there — the index is the
# only path to a user's `pip install`, so an unverified wheel must not reach it.
# `verify: false` therefore publishes nothing, and set-matrix refuses that
# combination rather than letting it read as a successful dispatch. The read-back
# step after the upload proves the index serves the same bytes (sha256) and not
# merely the same file name.
#
# There is no `twine check`: nothing in this repo uses it, and the version
# assertions the build script makes on the host are strictly stronger — they run
# before the upload, on the file, against the registry row.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend(s) whose runtime image builds the wheel: a space-separated list, or "all"'
        type: string
        default: all
      flagcx_ref:
        description: 'FlagCX git ref to build: a release tag (v0.14.0-rc2.post2) for a versioned build, or an upstream branch name for a verification build. No default — the ref decides the version the artifact carries, so it is stated per run and never inherited.'
        type: string
        default: ''
      wheel_version:
        description: 'Exact version to publish as flagcx==<this>, e.g. 0.14.0.dev14+dtk2604.20260915.g08ab373. Required only for a non-tag ref — a release tag names its own version, and nothing has to be typed.'
        type: string
        default: ''
      verify:
        description: 'install the wheel from the file into its runtime image before publishing'
        type: boolean
        default: true
      publish:
        description: 'push the verified wheel to the vendor PyPI (requires verify and wheel_version)'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install PyYAML and packaging
        run: |
          # flagcx-config.py imports yaml and packaging.version; ubuntu-latest's
          # python ships neither.
          python3 -c "import yaml, packaging" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml packaging
      - id: set-matrix
        shell: bash
        run: |
          set -euo pipefail
          # Publishing is a step of the verify job, so asking for both at once
          # would publish nothing while looking like it did.
          if [[ "${{ inputs.publish }}" == "true" && "${{ inputs.verify }}" != "true" ]]; then
            echo "::error::publish=true requires verify -- publication is a step of the verify job"
            exit 1
          fi
          # The ref decides the version the artifact carries, so an inherited
          # one is the wrong commit with a plausible name. Empty is refused here
          # rather than in each build job, where it would queue the whole matrix
          # and then fail twenty times.
          if [ -z "${{ inputs.flagcx_ref }}" ]; then
            echo "::error::flagcx_ref is required -- the release tag (v0.14.0-rc2.post2) for a versioned build, or the upstream branch for a verification build"
            exit 1
          fi
          # Publishing needs something that names the artifact in the index. A
          # release tag does, and the pin is derived from it below. A branch does
          # not — its version carries a `.dev<distance>` only the build knows —
          # so there the operator states the name.
          #
          # `packaging` answers "is this ref a version?" with the library
          # setuptools_scm parses tags with, so a ref that passes here is one the
          # build can stamp. A 40-hex commit is not a version and is refused. A
          # branch whose name happens to parse (`2.0`) is not caught here, but the
          # derivation below then expects an exact-tag version and the artifact's
          # `.dev` name fails the comparison — refused, not published.
          if [[ "${{ inputs.publish }}" == "true" && -z "${{ inputs.wheel_version }}" ]]; then
            if ! python3 -c 'import sys; from packaging.version import Version; Version(sys.argv[1].lstrip("v"))' \
                "${{ inputs.flagcx_ref }}"; then
              echo "::error::publish=true on '${{ inputs.flagcx_ref }}' requires wheel_version -- the ref is not a version tag, so it names no version to publish under"
              exit 1
            fi
          fi
          if [[ "${{ inputs.backend }}" == all ]]; then
            python3 scripts/generate_matrix.py --runtime > matrix.json
          else
            python3 scripts/generate_matrix.py --runtime ${{ inputs.backend }} > matrix.json
          fi
          # --merge only emits schedulable rows, so drift between backends.yaml
          # and the runtime matrix would be filtered away silently here; --check
          # is what turns it into a named failure.
          python3 packaging/flagcx/flagcx-config.py --check --channel wheel
          python3 packaging/flagcx/flagcx-config.py --merge matrix.json --channel wheel > wheel-matrix.json
          # An empty include list would skip both jobs silently, which reads as a
          # successful run of a backend that does not exist.
          if [[ "$(jq '.include | length' wheel-matrix.json)" == 0 ]]; then
            echo "::error::${{ inputs.backend }} names no backend with a wheel; see packaging/flagcx/flagcx-config.py --list --channel wheel"
            exit 1
          fi
          # The pin each row must carry, derived where the ref is known. A tag
          # build's is `<the tag's version>+<this row's label>` — `wheel_label` is
          # already the spelling the artifact carries, so this is the same string
          # the publish step reads back off the file, not a second derivation of
          # it. A build whose version was typed carries that one for every row.
          if [[ -n "${{ inputs.wheel_version }}" ]]; then
            jq --arg pin "flagcx==${{ inputs.wheel_version }}" \
              '.include |= map(.wheel_pin = $pin)' wheel-matrix.json > wheel-matrix.pin.json
          else
            public="$(python3 -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1].lstrip("v")))' "${{ inputs.flagcx_ref }}")"
            jq --arg public "flagcx==$public" \
              '.include |= map(.wheel_pin = ($public + "+" + .wheel_local_version))' \
              wheel-matrix.json > wheel-matrix.pin.json
          fi
          mv wheel-matrix.pin.json wheel-matrix.json
          cat wheel-matrix.json
          echo "matrix=$(jq -c . wheel-matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    if: ${{ fromJSON(needs.set-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check disk space
        shell: bash
        run: |
          # Check free space on the working-directory filesystem — this is where
          # the checkout, docker build context, and layer cache live.  We avoid
          # /var/lib/docker because some runners don't have it or use a different
          # data-root; checking . is universal.
          FREE_KB=$(df -P . | awk 'NR==2{print $4}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free disk space: ${FREE_GB}G"
          if [ "$FREE_GB" -lt 10 ]; then
            echo "ERROR: insufficient disk space (${FREE_GB}G < 10G). Docker needs cleanup."
            df -h .
            exit 1
          fi
      - name: Pull the runtime image
        run: |
          docker pull "${{ matrix.image_tag }}" \
            || { echo "::error::Failed to pull ${{ matrix.image_tag }}"; exit 1; }
      # Resolve the requested ref to its exact commit on the host, so the build,
      # the container's own `git rev-parse HEAD` check and the commit.txt it
      # writes all describe one commit instead of three readings of a moving ref.
      # Same shape as the vllm-plugin-wheel.yml resolve step; a name that is both
      # a branch and a tag is not a case this line has to arbitrate — its default
      # is already a commit.
      - name: Resolve the FlagCX commit
        env:
          FLAGCX_REF: ${{ inputs.flagcx_ref }}
        run: |
          set -euo pipefail
          # The URL build-flagcx-wheel.sh defaults to. This workflow exposes no
          # repo input, so there is nothing here that can disagree with it.
          repo="https://github.com/flagos-ai/FlagCX.git"
          refs="$(git ls-remote "${repo}")"
          if [[ "${FLAGCX_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            sha="${FLAGCX_REF,,}"
            # GitHub refuses to serve an object it does not advertise, and the
            # clone would report that late and obliquely. Ask the remote first.
            if ! awk -v want="${sha}" '$1 == want { found = 1 } END { exit !found }' <<<"${refs}"; then
              echo "::error::${sha} is not the tip of any branch or tag in ${repo} -- push the commit to a branch, or pass a branch/tag name"
              exit 1
            fi
          else
            sha="$(awk -v head="refs/heads/${FLAGCX_REF}" -v tag="refs/tags/${FLAGCX_REF}" \
              '$2 == head || $2 == tag { print $1; exit }' <<<"${refs}")"
            if [ -z "${sha}" ]; then
              echo "::error::'${FLAGCX_REF}' is not a branch or tag in ${repo}"
              exit 1
            fi
          fi
          echo "FLAGCX_SHA=${sha}" >> "$GITHUB_ENV"
          echo ">>> ${FLAGCX_REF} -> ${sha}"
      - name: Build the wheel
        env:
          MATRIX_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          # Nothing here re-asserts the sha against the checkout: the container
          # does its own `git rev-parse HEAD` comparison and the host-side script
          # compares the commit.txt it copies back, so a second opinion on the
          # host would only be a third place that can disagree.
          packaging/flagcx/build-flagcx-wheel.sh \
            --backend "$MATRIX_NAME" \
            --ref "$FLAGCX_SHA" \
            --out packaging/flagcx/dist
      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flagcx-wheel-${{ matrix.name }}
          path: packaging/flagcx/dist/*.whl
          if-no-files-found: error
      - name: Remove the build image
        if: ${{ always() }}
        # Same tag scheme the deb line's script uses (flagcx-deb:<key>). `|| true`
        # so a differently-named tag cannot turn a finished build into a failure.
        run: docker rmi "flagcx-wheel:${{ matrix.name }}" 2>/dev/null || true

  verify:
    needs: [set-matrix, build]
    # A failed build in one row must not cancel verification of the rows that
    # built; `always()` on the job, and the download below decides per row.
    if: ${{ !cancelled() && inputs.verify && needs.set-matrix.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A row whose build failed has no artifact, and that is the only signal
      # this job gets about which rows built. The failure stays on the build job.
      - name: Download the wheel
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flagcx-wheel-${{ matrix.name }}
          path: packaging/flagcx/dist
      - if: steps.download.outcome == 'failure'
        run: |
          echo "::warning::${{ matrix.name }} built no wheel, so there is nothing to verify"
      - name: Pull the runtime image
        if: steps.download.outcome == 'success'
        run: |
          docker pull "${{ matrix.image_tag }}" \
            || { echo "::error::Failed to pull ${{ matrix.image_tag }}"; exit 1; }
      # Not gated on `publish`: the point of this step is to refuse an artifact
      # that does not stand on its own, and that is worth knowing whether or not
      # anyone intends to publish it. Installing from the FILE (no index) is what
      # makes it the wheel-line counterpart of flagcx-deb.yml's `full` mode.
      - name: Verify the wheel from the file
        if: steps.download.outcome == 'success'
        env:
          MATRIX_NAME: ${{ matrix.name }}
          # The plan's call site carries no image flag, so the image travels in
          # the environment. Both names the repo already uses for this value are
          # exported — MATRIX_<field> after flagcx-deb.yml's MATRIX_UBUNTU,
          # BASE_IMAGE after the wheel/plugin lines — because the script is
          # written against the same plan and one of them is the name it reads.
          MATRIX_IMAGE_TAG: ${{ matrix.image_tag }}
          BASE_IMAGE: ${{ matrix.image_tag }}
        run: |
          set -euo pipefail
          packaging/flagcx/verify/verify-flagcx-wheel.sh \
            --wheel packaging/flagcx/dist/*.whl
      # The same critical list vllm-plugin-wheel.yml audits: these images bake a
      # pinned matrix and the app installs single-step. A flagcx wheel declares
      # no Requires-Dist at all, so a clean run here is nearly vacuous — which is
      # the fact being asserted. The event worth a failure is the day one appears.
      - name: Audit the wheel dependencies
        if: steps.download.outcome == 'success'
        run: |
          set -euo pipefail
          python3 packaging/script/audit-deps.py \
            --watch torch --watch torch_npu --watch torchvision \
            --watch torchaudio --watch triton --watch flag_gems \
            --watch numpy==1.26.4 \
            packaging/flagcx/dist/*.whl
      - name: Publish to the vendor PyPI
        if: ${{ inputs.publish && steps.download.outcome == 'success' }}
        env:
          MATRIX_NAME: ${{ matrix.name }}
          # Derived in set-matrix, where the ref is known. For a tag build it is
          # `<the tag's version>+<this row's label>`, so twenty rows publishing
          # under twenty names is one dispatch rather than twenty.
          EXPECTED_PIN: ${{ matrix.wheel_pin }}
          EXTRA_PYPI: ${{ matrix.extra_pypi }}
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "::error::NEXUS_TOKEN secret is empty or unset"
            exit 1
          fi
          : "${EXPECTED_PIN:?set-matrix derives the pin a publish names}"
          # The index is derived from the matrix row, never from an input: no
          # input can reach another vendor's index, and the read-back step reads
          # the same row's flagos_pypi. The matrix placeholder cannot be
          # substituted inside a bash parameter expansion: a bare
          # "${matrix.name%%-*}" reaches bash unexpanded and dies with "bad
          # substitution" (megatron-wheel.yml had exactly that). Expand into a
          # local var first. (Spelled without the placeholder syntax here on
          # purpose: a run block is a YAML block scalar, so this line is
          # content, and the expression scanner reads it.)
          matrix_name="${{ matrix.name }}"
          vendor="${matrix_name%%-*}"
          case "$vendor" in
            nvidia|hygon|metax|mthreads|enflame|cambricon|ascend|iluvatar|sunrise|tsingmicro|kunlunxin) ;;
            *)
              echo "::error::no vendor PyPI for '${vendor}' (the build-infra vendor of ${matrix_name})"
              exit 1
              ;;
          esac
          pypi_repo="flagos-pypi-${vendor}"
          wheel=(packaging/flagcx/dist/*.whl)
          if [ "${#wheel[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel, found ${#wheel[@]}"
            exit 1
          fi
          # The pin is read off the artifact, not constructed here, so a mismatch
          # means the wheel is not the version the ref names: a tag that the clone
          # did not see as exact leaves a `.dev<distance>` in the name, and that
          # is the case this refuses.
          pin="$(packaging/flagcx/build-flagcx-wheel.sh --print-pin "${wheel[@]}")"
          if [ "$pin" != "${EXPECTED_PIN}" ]; then
            echo "::error::artifact is $pin, the ref names ${EXPECTED_PIN}"
            exit 1
          fi
          # The sha256 of exactly the file about to be uploaded, recorded for the
          # read-back step: same name + same bytes is the only thing that says the
          # index serves *this* artifact.
          sha="$(sha256sum "${wheel[@]}")"
          echo "WHEEL_PIN=${pin}" >> "$GITHUB_ENV"
          echo "WHEEL_SHA256=${sha%% *}" >> "$GITHUB_ENV"
          echo ">>> ${pypi_repo}: $(basename "${wheel[0]}")"
          # Upload FROM INSIDE the runtime image, not the runner host: the hygon
          # runner's /usr/bin/python3 has no pip (run 31795636072). The secret
          # travels via `-e NEXUS_TOKEN` (inherits the step env) so it never
          # appears in a process list or an image layer. Read-only mount: this
          # container writes nothing into the workspace.
          #
          # The 910C nodes have no egress of their own: they reach the outside
          # only through the proxy their runner's systemd unit sets, so the
          # container inherits it or the twine install below resolves nothing.
          # Named without a value, so no proxy value (and no credential in it)
          # reaches an argument list, a log or an image layer.
          docker run --rm \
            -e NEXUS_TOKEN \
            -e HTTP_PROXY -e HTTPS_PROXY -e NO_PROXY \
            -e pypi_repo="${pypi_repo}" \
            -e EXTRA_PYPI="${EXTRA_PYPI}" \
            -v "$PWD/packaging/flagcx/dist:/wheels:ro" \
            "${{ matrix.image_tag }}" \
            bash -euo pipefail -c '
              # Upgrade pkginfo too: setuptools >=77 (PEP 639) stamps
              # Metadata-Version 2.4 into the wheel, which older pkginfo cannot
              # parse -> twine aborts before upload. pkginfo >=1.11 reads 2.4.
              /flagos/bin/pip install --quiet --index-url "${EXTRA_PYPI}" --upgrade twine pkginfo
              export TWINE_USERNAME="${NEXUS_TOKEN%%:*}"
              export TWINE_PASSWORD="${NEXUS_TOKEN#*:}"
              # No /simple: that suffix is the path pip reads, not the one twine
              # posts to.
              /flagos/bin/twine upload \
                --repository-url "https://resource.flagos.net/repository/${pypi_repo}/" \
                --non-interactive \
                /wheels/*.whl
            '
      # The upload's 2xx only says it was accepted. This reads the index the way a
      # user's pip does: download by pin, compare bytes, install, import.
      - name: Verify the wheel installs from the index
        if: ${{ inputs.publish && steps.download.outcome == 'success' }}
        env:
          MATRIX_NAME: ${{ matrix.name }}
          MATRIX_IMAGE_TAG: ${{ matrix.image_tag }}
          BASE_IMAGE: ${{ matrix.image_tag }}
          # The row's own index, not a second spelling of it.
          FLAGOS_PYPI: ${{ matrix.flagos_pypi }}
        run: |
          set -euo pipefail
          : "${WHEEL_PIN:?the publish step recorded no pin}"
          : "${WHEEL_SHA256:?the publish step recorded no sha256}"
          packaging/flagcx/verify/verify-flagcx-wheel.sh \
            --index-url "${FLAGOS_PYPI}" \
            --pin "${WHEEL_PIN}" \
            --expect-sha256 "${WHEEL_SHA256}"
