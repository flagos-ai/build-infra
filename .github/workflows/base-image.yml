name: Build Base Image (manual)

# Base images are built on demand, not on every push/PR. Vendor SDKs change
# rarely, so with 10+ backends auto-building on each change is more noise than
# value at the current maturity. Trigger this manually to build a backend (or
# all). A future job may detect configs.yaml drift and remind maintainers.

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'Backend(s) to build (e.g. nvidia-cuda12.8), or "all"'
        type: string
        default: all
      push:
        description: 'Push image(s) to the registry'
        type: boolean
        default: false

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually; see .github/actions/check-trigger-author for the check.
    # actions/checkout is required: local composite actions are resolved from
    # the workspace, so the repo must exist before the action step runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  set-matrix:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install PyYAML
        run: python3 -m pip install --user pyyaml

      - id: set-matrix
        shell: bash
        run: |
          if [[ "${{ inputs.backend }}" == "all" ]]; then
            python3 scripts/generate_matrix.py > matrix.json
          else
            python3 scripts/generate_matrix.py ${{ inputs.backend }} > matrix.json
          fi
          cat matrix.json
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build-matrix:
    needs: set-matrix
    if: ${{ fromJSON(needs.set-matrix.outputs.matrix).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    name: build-${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags needed for version computation (git rev-list)

      - name: Install PyYAML
        # Self-hosted runners (h20) have an externally-managed system Python
        # (PEP 668) that rejects `pip install`. Skip if PyYAML is already
        # importable; otherwise install to the user site with the override.
        run: |
          python3 -c "import yaml" 2>/dev/null \
            || python3 -m pip install --user --break-system-packages pyyaml

      - name: Log in to the Container registry
        if: ${{ inputs.push }}
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PW: ${{ secrets.HARBOR_PASSWORD }}
          # Harbor is internal — bypass any HTTP_PROXY/HTTPS_PROXY the runner
          # may have set for GitHub access.
          # Only uppercase HTTP_PROXY/HTTPS_PROXY (lowercase clash with runner
          # env vars set by the GitHub Actions runner config).
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          no_proxy: "harbor.baai.ac.cn,.baai.ac.cn"
        run: |
          if [ -z "${HARBOR_PW:-}" ]; then
            echo "ERROR: secret HARBOR_PASSWORD is empty or unset" >&2
            exit 1
          fi
          # registry host = build-config.yml registry.host
          host=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['host'])")
          for i in 1 2 3; do
            if printf '%s' "${HARBOR_PW}" | docker login "${host}" -u "${HARBOR_USER}" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt $i failed, retrying in 30s..."
            sleep 30
          done
          echo "::error::Harbor login failed after 3 attempts"
          exit 1

      # Runner guard: base-image builds run on self-hosted hardware runners,
      # which can be left with a nearly-full disk by a previous job. Fail fast
      # here rather than silently dying mid-build. (Candidate for extraction to
      # a composite action once the runtime/app image builds share it.)
      - name: Check disk space
        shell: bash
        run: |
          # Check free space on the working-directory filesystem — this is where
          # the checkout, docker build context, and layer cache live.  We avoid
          # /var/lib/docker because some runners don't have it or use a different
          # data-root; checking . is universal.
          FREE_KB=$(df -P . | awk 'NR==2{print $4}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free disk space: ${FREE_GB}G"
          if [ "$FREE_GB" -lt 10 ]; then
            echo "ERROR: insufficient disk space (${FREE_GB}G < 10G). Docker needs cleanup."
            df -h .
            exit 1
          fi

      - name: Build base image
        run: |
          python3 scripts/build_base.py "${{ matrix.name }}" ${{ inputs.push && '--push' || '' }}
