name: verify-driver

# Verify orchestrator driver. One trigger advances every pending (⬜) cell one
# round: plan -> verify (matrix, parallel) -> build (passed) + record (PR) ->
# terminate (re-trigger while ⬜ remain and progress was made). See
# docs/verify-orchestrator.md §4.1.
#
# Each cell is verified at its app's *primary* scenario (inference for vllm,
# training for megatron_training) on every pending compiler column (F and T) —
# the driver passes --compiler flagtree|triton so each installed compiler path
# is exercised explicitly. A cell earns ✅ only by its verify
# script running the workload end-to-end and exiting 0 (vllm: serve returns a
# real completion; megatron_training: mock-data pretrain_gpt 5-iter exit 0) —
# "install is inert + import succeeds" is NOT enough. megatron_rl cells are
# marked ⛔ (upstream-blocked: MLF #116 + flash-attn wheel), so the collector
# emits none of them.
#
# Self-triggers via workflow_dispatch only; the terminate job re-dispatches the
# same scope while pending cells remain and the round made progress.

on:
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app keys to verify (empty = all): vllm0.20.2,vllm0.24.0,megatron_training,megatron_rl'
        required: false
        default: ''
      backends:
        description: 'Space-separated backend keys to verify (empty = all pending): nvidia-cuda12.8 metax-maca3.8.1.3'
        required: false
        default: ''

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: verify-driver-${{ inputs.apps }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      has_cells: ${{ steps.collect.outputs.has_cells }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Collect pending cells
        id: collect
        env:
          APPS_INPUT: ${{ github.event.inputs.apps }}
          BACKENDS_INPUT: ${{ github.event.inputs.backends }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$APPS_INPUT" ]; then
            IFS=',' read -ra apps <<< "$APPS_INPUT"
            for a in "${apps[@]}"; do [ -n "$a" ] && args+=(--app "$a"); done
          fi
          for b in $BACKENDS_INPUT; do args+=(--backend "$b"); done
          matrix=$(python3 scripts/verify_collect_cells.py "${args[@]}" --json)
          n=$(python3 -c "import json,sys; print(len(json.loads(sys.stdin.read())['include']))" <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$n" -gt 0 ]; then echo "has_cells=true" >> "$GITHUB_OUTPUT"; else echo "has_cells=false" >> "$GITHUB_OUTPUT"; fi
          echo "plan: $n pending cell(s)"

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.has_cells == 'true' }}
    runs-on: ${{ fromJSON(matrix.runson) }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify cell
        id: verify
        env:
          CELL_APP: ${{ matrix.app }}
          CELL_BACKEND: ${{ matrix.backend }}
          CELL_COMPILER: ${{ matrix.compiler }}
          CELL_COMPILER_PATH: ${{ matrix.compiler_path }}
          CELL_SCENARIO: ${{ matrix.scenario }}
          CELL_IMAGE: ${{ matrix.image }}
          CELL_SCRIPT: ${{ matrix.verify_script }}
          CELL_ARGS: ${{ matrix.verify_args }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/verify-result
          bash "$CELL_SCRIPT" "$CELL_BACKEND" $CELL_ARGS --compiler "$CELL_COMPILER_PATH" > /tmp/verify.log 2>&1
          rc=$?
          # run_id suffix keeps the result filename unique per run: self-hosted
          # runners keep /tmp/verify-result between jobs, and the old deterministic
          # name let a stale prior-run result be globbed into this run's artifact.
          RESULT="/tmp/verify-result/result-$CELL_APP-$CELL_BACKEND-$CELL_COMPILER-$RUN_ID.json"
          python3 - "$rc" "$RESULT" <<'PY'
          import json, os, sys
          rc = int(sys.argv[1])
          out = sys.argv[2]
          log = open("/tmp/verify.log", errors="replace").read().splitlines()
          status = "passed" if rc == 0 else "failed"
          failure = None
          if rc != 0:
              import re
              ansi = re.compile(r"\x1b\[[0-9;]*m")
              # Last "Step N:" line before the abort = the failing step
              # (set -e exits at the failing command, so no later step prints).
              steps = [ansi.sub("", ln).strip() for ln in log
                       if re.match(r"^\[STEP\] Step \d+:", ansi.sub("", ln).strip())]
              # §5.2 zero-inflation summary: the error region (last 40 lines)
              # split into head(20) + tail(20), so the debug worker sees the
              # error's start and end without the full log (kept on the runner).
              err = log[-40:]
              failure = {
                  "step": steps[-1] if steps else None,
                  "exit_code": rc,
                  "error_head": "\n".join(err[:20]),
                  "error_tail": "\n".join(err[20:]),
                  "log_path": "/tmp/verify.log",
              }
          result = {
              "app": os.environ["CELL_APP"],
              "backend": os.environ["CELL_BACKEND"],
              "compiler": os.environ["CELL_COMPILER"],
              "scenario": os.environ["CELL_SCENARIO"],
              "image": os.environ["CELL_IMAGE"],
              "verify_script": os.environ["CELL_SCRIPT"],
              "verify_args": os.environ["CELL_ARGS"],
              "status": status,
              "failure": failure,
          }
          open(out, "w").write(json.dumps(result, ensure_ascii=False))
          print(f"verify {result['app']} {result['backend']} {result['compiler']} -> {status} (rc={rc})")
          PY
          exit "$rc"
        # A non-zero rc must fail the job so the cell's failure is visible. The result
        # JSON (status=passed|failed) is still uploaded below (if: always()) and
        # consumed by record/build.
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-${{ matrix.backend }}-${{ matrix.compiler }}
          # Scoped to this run's exact file — never glob *.json, or a stale
          # prior-run result on a shared self-hosted runner gets re-uploaded.
          path: /tmp/verify-result/result-${{ matrix.app }}-${{ matrix.backend }}-${{ matrix.compiler }}-${{ github.run_id }}.json
          if-no-files-found: ignore

  record:
    needs: [plan, verify]
    if: ${{ always() && needs.plan.outputs.has_cells == 'true' }}
    runs-on: ubuntu-latest
    # Serialize record jobs within one app line: two runs of the same app (the
    # terminate self-trigger loop) would otherwise both force-push the same
    # per-component branch and clobber. Different app lines (vllm vs megatron)
    # push different branches (auto/verify-results-<component>) and run in
    # parallel.
    concurrency:
      group: verify-driver-record-${{ inputs.apps }}
      cancel-in-progress: false
    outputs:
      remaining: ${{ steps.summarize.outputs.remaining }}
      progress: ${{ steps.summarize.outputs.progress }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Download verify results
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Merge results
        run: |
          python3 - <<'PY'
          import glob, json
          results = [json.load(open(f)) for f in sorted(glob.glob("results/result-*.json"))]
          json.dump(results, open("results.json", "w"), ensure_ascii=False)
          print(f"merged {len(results)} result(s)")
          PY
      - name: Apply results
        run: python3 scripts/verify_record_results.py --results results.json
      - name: Summarize
        id: summarize
        run: |
          python3 - <<'PY'
          import json, os
          d = json.load(open(".github/verify-remaining.json"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"remaining={d['remaining']}\n")
              fh.write(f"progress={len(d['changed'])}\n")
          print(f"record: remaining={d['remaining']} progress={len(d['changed'])}")
          PY
      - name: Open/update results PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verify_open_pr.py

  build:
    needs: [plan, verify]
    if: ${{ always() && needs.plan.outputs.has_cells == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download verify results
        uses: actions/download-artifact@v4
        with:
          path: results
          merge-multiple: true
      - name: Dispatch app-image builds
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/verify_dispatch_build.py --results-dir results

  terminate:
    needs: [plan, record]
    if: ${{ always() && needs.plan.outputs.has_cells == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install pyyaml
      - name: Decide re-trigger
        id: decide
        env:
          APPS_INPUT: ${{ github.event.inputs.apps }}
          BACKENDS_INPUT: ${{ github.event.inputs.backends }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$APPS_INPUT" ]; then
            IFS=',' read -ra apps <<< "$APPS_INPUT"
            for a in "${apps[@]}"; do [ -n "$a" ] && args+=(--app "$a"); done
          fi
          for b in $BACKENDS_INPUT; do args+=(--backend "$b"); done
          left=$(python3 scripts/verify_collect_cells.py "${args[@]}" --json | python3 -c "import sys,json; print(len(json.load(sys.stdin)['include']))")
          echo "left=$left" >> "$GITHUB_OUTPUT"
          echo "terminate: left=$left progress=${{ needs.record.outputs.progress }}"
      - name: Re-trigger
        if: ${{ steps.decide.outputs.left != '0' && needs.record.outputs.progress != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
          APPS_INPUT: ${{ github.event.inputs.apps }}
          BACKENDS_INPUT: ${{ github.event.inputs.backends }}
        run: |
          set -euo pipefail
          args=(workflow run verify-driver.yml)
          if [ -n "$APPS_INPUT" ]; then args+=(-f "apps=$APPS_INPUT"); fi
          if [ -n "$BACKENDS_INPUT" ]; then args+=(-f "backends=$BACKENDS_INPUT"); fi
          gh "${args[@]}"
          echo "re-triggered verify-driver.yml"
