name: native rpm package

# Build .rpm packages containing compiled code from a component repository's
# own packaging definition, and publish them to the FlagOS yum repositories.
# The rpm sibling of native-deb.yml, and the native sibling of noarch-rpm.yml.
#
# Keyed by package class, not by repository -- see native-deb.yml for why, for
# what native verification asks that the noarch one does not, and for why
# FlagGems' per-vendor C++ operators stay with flaggems-deb.yml rather than
# coming here.
#
# One build per target distribution rather than one shared build: an rpm
# carries the distribution in its Release field (.fc43, .oe2403), so a package
# built for one does not belong in another's repository. Unlike the noarch
# pair, that is doubly true here -- these link against the distribution's own
# libraries, so the package is not merely mislabelled elsewhere, it is wrong.
#
# Dispatch-only: an .rpm is a release artifact, nothing here is worth running
# on a push.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'component and package class to build'
        type: choice
        required: true
        options: [libtriton_jit, FlagTree, FlagDNN, FlagTensor, FlagFFT]
      ref:
        description: >-
          git ref to build. Leave empty to use the ref this target is pinned to
          below. A tag is preferred: a branch head moves under later
          cherry-picks, so the same dispatch would not build the same source
          twice.
        type: string
        default: ''
      version:
        description: >-
          release version to stamp, as the manifest spells it
          (e.g. v0.2.0-rc0.1). A pre-release qualifier goes in Release, not
          Version -- see the stamping step. Leave empty to derive it from the
          ref when the ref is a version tag, and to leave the spec alone
          otherwise.
        type: string
        default: ''
      suites:
        description: >-
          yum suites to publish into, space-separated. Leave empty to publish
          into every suite this target was built and verified for.
        type: string
        default: ''
      verify:
        description: 'install the .rpm in a clean container before uploading'
        type: boolean
        default: true
      publish:
        description: 'push the verified .rpm to the yum repositories (requires verify)'
        type: boolean
        default: false

env:
  NEXUS_REPO_BASE: https://resource.flagos.net/repository

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built_sha: ${{ steps.clone.outputs.sha }}
      # Set by any matrix row that actually built. Empty means every row
      # skipped, which is a configuration error rather than a clean run.
      any_built: ${{ steps.build.outputs.built }}
      deps: ${{ steps.cfg.outputs.deps }}
    strategy:
      fail-fast: false
      matrix:
        # Only the suite here. The base image cannot live in this matrix: a
        # component whose build needs a vendor SDK builds on that vendor's
        # image for the distribution, not on the plain one -- FlagDNN needs a
        # CUDA-on-RockyLinux image where FlagTree needs bare Fedora. The
        # target table below names the image per suite, and a target that has
        # none for a suite is skipped rather than built on the wrong base.
        suite: [fedora43, openeuler24.03, rhel9]
    steps:
      - name: Resolve the target
        id: cfg
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          # Per target: repository, build script, how that script takes its
          # base image, the spec to stamp, and the ref the release manifest
          # pins it to.
          #
          # `base_arg` exists because these scripts do not agree on how to be
          # told which distribution to build for: libtriton_jit takes
          # --base-image, FlagTree reads RPM_BASE_IMAGE from the environment.
          # Recording the difference here is cheaper than an upstream PR to
          # each of them for the sake of uniformity.
          deps=''
          case "${TARGET}" in
            libtriton_jit)
              repo=libtriton_jit
              script=packaging/rpm/build-rpm.sh
              base_arg=flag
              spec=packaging/rpm/libtriton-jit.spec
              outdir=rpm-packages
              ref=master
              ver=''
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagTree)
              repo=FlagTree
              script=packaging/rpm/helpers/build-flagtree-rpm.sh
              base_arg=env
              spec=packaging/rpm/specs/flagtree.spec
              outdir=dist-rpm/output
              # No FlagTree tag carries packaging/; the branch is
              # 0.7.0rc2.post2 plus two XPU-only commits.
              ref=0.7.0-rc2-triton3.6
              ver=0.7.0rc2.post2
              image_fedora43=fedora:43
              image_openeuler2403=openeuler/openeuler:24.03-lts
              image_rhel9= ;;
            FlagDNN)
              repo=FlagDNN
              script=packaging/rpm/build-flag-dnn-rpm.sh
              base_arg=arg
              spec=packaging/rpm/specs/flag-dnn.spec
              outdir=rpm-packages
              # Same ref as native-deb, which needs the branch for FlagDNN#17.
              ref=0.3.0-rc2
              ver=v0.3.0-rc2.post2
              deps='libtriton-jit-nvidia libtriton-jit-nvidia-devel'
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagTensor)
              repo=FlagTensor
              script=packaging/rpm/build-flagtensor-rpm.sh
              base_arg=arg
              spec=packaging/rpm/specs/flagtensor.spec
              outdir=rpm-packages
              ref=0.3.0-rc2
              ver=v0.3.0-rc2.post2
              deps='libtriton-jit-nvidia libtriton-jit-nvidia-devel'
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagFFT)
              repo=FlagFFT
              script=packaging/rpm/build-flagfft-rpm.sh
              base_arg=env
              spec=packaging/rpm/specs/flagfft.spec
              outdir=rpm-packages
              ref=v0.2.0-rc2.post2
              ver=''
              image_fedora43=
              image_openeuler2403=openeuler/cuda:13.0.0-oe2403lts
              image_rhel9= ;;
            *)
              echo "::error::unknown target '${TARGET}'"; exit 1 ;;
          esac
          {
            echo "repo_url=https://github.com/flagos-ai/${repo}.git"
            echo "script=${script}"
            echo "base_arg=${base_arg}"
            echo "deps=${deps}"
            echo "spec=${spec}"
            echo "outdir=${outdir}"
            echo "default_ref=${ref}"
            echo "default_version=${ver}"
          } >> "$GITHUB_OUTPUT"
          # The base image for the suite this matrix row builds. Empty means the
          # target has no image for that distribution and the row is skipped --
          # so this has to be emitted, or every row skips and the run reports
          # success having built nothing.
          case "${{ matrix.suite }}" in
            fedora43)       echo "base_image=${image_fedora43}" >> "$GITHUB_OUTPUT" ;;
            openeuler24.03) echo "base_image=${image_openeuler2403}" >> "$GITHUB_OUTPUT" ;;
            rhel9)          echo "base_image=${image_rhel9}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Refuse to publish what was not verified
        if: ${{ inputs.publish }}
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.verify }}" != "true" ]; then
            echo "::error::publish requires verify - an unverified package must not reach the repository"
            exit 1
          fi
          # The matrix above is what gets built and verified; a suite outside
          # it has no package to publish, and asking for one is a mistake worth
          # naming rather than a silent no-op.
          BUILT="fedora43 openeuler24.03 rhel9"
          for suite in ${SUITES:-}; do
            case " ${BUILT} " in
              *" ${suite} "*) ;;
              *)
                echo "::error::'${suite}' is not built by this workflow (${BUILT})"
                exit 1 ;;
            esac
          done
          echo "Publish targets: ${SUITES:-${BUILT}}"

      - name: Clone ${{ inputs.target }}
        id: clone
        env:
          REF: ${{ inputs.ref || steps.cfg.outputs.default_ref }}
        run: |
          set -euo pipefail
          git clone --depth 50 --recurse-submodules --shallow-submodules --branch "${REF}" "${{ steps.cfg.outputs.repo_url }}" src
          cd src
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${REF}" >/dev/null; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${REF} is a branch, not a tag - this build is not reproducible by ref name alone"
          fi
          echo "Built ${REF} = ${sha}"
          for f in "${{ steps.cfg.outputs.script }}" "${{ steps.cfg.outputs.spec }}"; do
            test -f "$f" \
              || { echo "::error::ref '${REF}' has no RPM packaging definition ($f is missing)"; exit 1; }
          done

      - name: Stamp the release version
        working-directory: src
        env:
          SPEC: ${{ steps.cfg.outputs.spec }}
          REF: ${{ steps.clone.outputs.ref }}
          REF_IS_TAG: ${{ steps.clone.outputs.is_tag }}
          REQUESTED: ${{ inputs.version }}
          PINNED: ${{ inputs.ref == '' && steps.cfg.outputs.default_version || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          path = os.environ["SPEC"]
          body = open(path, encoding="utf-8").read()
          mv = re.search(r"^Version:(\s+)(\S+)\s*$", body, re.M)
          mr = re.search(r"^Release:(\s+)(\S+)\s*$", body, re.M)
          if not mv or not mr:
              sys.exit(f"::error::{path} needs both a Version: and a Release: line")

          ref = os.environ["REF"]
          requested = os.environ["REQUESTED"].strip()
          pinned = os.environ["PINNED"].strip()
          if requested:
              release, why = requested, "requested by this dispatch"
          elif pinned:
              release, why = pinned, "pinned for this target"
          elif (os.environ["REF_IS_TAG"] == "true"
                and re.match(r"^v?\d+(\.\d+)*(-?rc\d+(\.\d+)?)?(\.post\d+)?$", ref)):
              release, why = ref, f"derived from tag {ref}"
          else:
              print(f"Keeping the spec at {mv.group(2)}-{mr.group(2)}:"
                    f" {ref} is not a version tag."
                    " Pass `version` to stamp a release version explicitly.")
              sys.exit(0)

          m = re.match(r"^v?(\d+(?:\.\d+)*)(?:[-.]?(rc\d+(?:\.\d+)?))?(?:[-.]?(post\d+))?$",
                       release)
          if not m:
              sys.exit(f"::error::cannot parse a release version out of '{release}'")
          upstream, rc, post = m.group(1), m.group(2), m.group(3)

          # A pre-release qualifier cannot go in Version: "~" orders correctly
          # for rpm but breaks any consumer that reads the field as a Python
          # version, and the Python spelling ("0.2.0rc0") orders *above* the
          # release in rpm, so the pre-release would shadow what it precedes.
          # The packaging guidelines' answer is to keep Version at the upstream
          # number and put the qualifier in Release: behind a leading 0 for a
          # pre-release, which sorts below the 1 a final release carries, and
          # behind that 1 for a post-release, which must sort above it.
          version = upstream
          qualifier = ".".join(x for x in (rc, post) if x)
          if rc:
              relval = f"0.{qualifier}%{{?dist}}"
          elif post:
              relval = f"1.{post}%{{?dist}}"
          else:
              relval = "1%{?dist}"

          if (version, relval) == (mv.group(2), mr.group(2)):
              print(f"Spec already at {version}-{relval}; nothing to stamp")
              sys.exit(0)

          print(f"::notice::stamping {path} "
                f"{mv.group(2)}-{mr.group(2)} -> {version}-{relval} ({why})")
          # Release first: editing Version first moves the offsets the Release
          # match was found at.
          body = body[:mr.start(2)] + relval + body[mr.end(2):]
          body = body[:mv.start(2)] + version + body[mv.end(2):]
          open(path, "w", encoding="utf-8").write(body)
          PY
          grep -E '^(Version|Release):' "${SPEC}"

      - name: Skip a suite this target has no image for
        if: ${{ steps.cfg.outputs.base_image == '' }}
        run: echo "::notice::${{ inputs.target }} has no ${{ matrix.suite }} base image; skipping"

      - name: Fetch FlagOS build dependencies for ${{ matrix.suite }}
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.deps != '' }}
        working-directory: src
        env:
          DEPS: ${{ steps.cfg.outputs.deps }}
          BASE: ${{ env.NEXUS_REPO_BASE }}/flagos-yum-${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p packaging/rpm/local-deps
          python3 - <<'PY'
          import gzip, os, re, sys, urllib.request, xml.etree.ElementTree as ET
          base, out = os.environ["BASE"], "packaging/rpm/local-deps"
          ns = {"r": "http://linux.duke.edu/metadata/repo", "c": "http://linux.duke.edu/metadata/common"}
          get = lambda u: urllib.request.urlopen(u).read()
          href = ET.fromstring(get(f"{base}/repodata/repomd.xml")).find(
              "r:data[@type='primary']/r:location", ns).get("href")
          primary = ET.fromstring(gzip.decompress(get(f"{base}/{href}")))
          key = lambda v: [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", v)]
          for dep in os.environ["DEPS"].split():
              found = [(p.find("c:version", ns), p.find("c:location", ns).get("href"))
                       for p in primary.findall("c:package", ns)
                       if p.find("c:name", ns).text == dep and p.find("c:arch", ns).text != "src"]
              if not found:
                  sys.exit(f"::error::{dep} is not in {base}")
              v, loc = max(found, key=lambda f: (key(f[0].get("ver")), key(f[0].get("rel"))))
              print(f">>> {dep} {v.get('ver')}-{v.get('rel')}")
              urllib.request.urlretrieve(f"{base}/{loc}", os.path.join(out, os.path.basename(loc)))
          PY

      - name: Build the .rpm packages for ${{ matrix.suite }}
        id: build
        if: ${{ steps.cfg.outputs.base_image != '' }}
        working-directory: src
        env:
          BASE_IMAGE: ${{ steps.cfg.outputs.base_image }}
        run: |
          set -euo pipefail
          case "${{ steps.cfg.outputs.base_arg }}" in
            flag) bash "${{ steps.cfg.outputs.script }}" --base-image "${BASE_IMAGE}" ;;
            env)  RPM_BASE_IMAGE="${BASE_IMAGE}" bash "${{ steps.cfg.outputs.script }}" ;;
            arg)  bash "${{ steps.cfg.outputs.script }}" "${BASE_IMAGE}" ;;
            *)    echo "::error::unknown base_arg"; exit 1 ;;
          esac
          # Every binary package, not the first: these builds emit a runtime
          # and a -devel package, and taking one would silently drop the other.
          # Source rpms are build inputs, not something a user installs.
          mapfile -t rpms < <(find "${{ steps.cfg.outputs.outdir }}" -name '*.rpm' ! -name '*.src.rpm' | sort)
          [ "${#rpms[@]}" -gt 0 ] || { echo "::error::the build produced no binary rpm"; exit 1; }
          mkdir -p out && cp "${rpms[@]}" out/
          echo "built=yes" >> "$GITHUB_OUTPUT"
          echo "Built ${#rpms[@]} package(s):"
          for r in "${rpms[@]}"; do
            echo ">>> $(basename "$r")"
            rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$r" 2>/dev/null || true
          done

      - name: Upload the .rpm packages
        if: ${{ steps.cfg.outputs.base_image != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.target }}-rpm-${{ matrix.suite }}
          path: src/out/*.rpm
          retention-days: 7

  verify:
    needs: build
    if: ${{ inputs.verify }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fedora43
            image: fedora:43
          - suite: openeuler24.03
            image: openeuler/openeuler:24.03-lts
          - suite: rhel9
            image: rockylinux:9
            # fmt lives in EPEL on el9, as it does for any RHEL 9 user.
            repos: epel-release
    steps:
      - name: Download the .rpm packages
        id: fetch
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.target }}-rpm-${{ matrix.suite }}
          path: pkg

      - name: Note a suite with no package
        if: ${{ steps.fetch.outcome == 'failure' }}
        run: |
          # A suite with no package is expected only when the target has no
          # base image for it. Any other cause -- a build that failed, or a
          # configuration that emits no image at all -- must not read as a
          # verified run, which is how a bug that skipped every suite once
          # reported success having built nothing.
          if [ -n "${{ needs.build.outputs.any_built }}" ]; then
            echo "::notice::nothing was built for ${{ matrix.suite }}"
          else
            echo "::error::no suite produced a package - nothing was verified"
            exit 1
          fi

      - name: Install and check in a clean ${{ matrix.image }}
        if: ${{ steps.fetch.outcome == 'success' }}
        env:
          REPOS: ${{ matrix.repos }}
          # A package that depends on another FlagOS package gets the FlagOS
          # repository it will be published to.
          FLAGOS_YUM: ${{ needs.build.outputs.deps != '' && format('{0}/flagos-yum-{1}', env.NEXUS_REPO_BASE, matrix.suite) || '' }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/pkg:/pkg:ro" -e REPOS -e FLAGOS_YUM ${{ matrix.image }} bash -c '
            set -e
            if [ -n "${REPOS:-}" ]; then
              dnf install -y -q ${REPOS}
              # EPEL packages assume CRB is enabled alongside.
              case " ${REPOS} " in *" epel-release "*) dnf config-manager --set-enabled crb 2>/dev/null || true ;; esac
            fi
            if [ -n "${FLAGOS_YUM:-}" ]; then
              printf "[flagos]\nname=FlagOS\nbaseurl=%s\nenabled=1\ngpgcheck=0\n" "${FLAGOS_YUM}" > /etc/yum.repos.d/flagos.repo
            fi
            # Installing the files themselves is the test: dnf has to satisfy
            # their own Requires from the distribution and the repositories its
            # row names, nothing else. All of them, so a -devel package whose
            # runtime is unsatisfiable fails here rather than in a user'"'"'s
            # terminal.
            dnf install -y -q --setopt=install_weak_deps=False /pkg/*.rpm
            dnf install -y -q binutils > /dev/null 2>&1 || true

            checked=0
            for pkg in $(rpm -qp --qf "%{NAME}\n" /pkg/*.rpm | sort -u); do
              for so in $(rpm -ql "$pkg" | grep -E "\.so($|\.)" || true); do
                [ -f "$so" ] || continue
                checked=$((checked + 1))
                # A library the package deliberately leaves to the environment
                # -- the GPU driver from the host, torch from pip -- cannot be
                # present in a clean container and is not a defect. A library
                # that some installed package does provide, and this one did
                # not declare, is: it works where it happens to be present and
                # fails elsewhere.
                missing=0
                # Declared by the package that ships the ELF, not by a -devel
                # package whose .so is only a symlink to it.
                owner=$(rpm -qf "$(readlink -f "$so")")
                for lib in $(ldd -r "$so" 2>&1 | grep "not found" | awk "{print \$1}"); do
                  if rpm -q --whatprovides "${lib}()(64bit)" > /dev/null 2>&1 \
                     && ! rpm -q --requires "$owner" | grep -qF "${lib}()"; then
                    echo "$(basename "$so"): $lib is provided by an installed package but not declared"
                    exit 1
                  fi
                  echo "  $(basename "$so"): $lib left to the environment"
                  missing=$((missing + 1))
                done
                # A missing library takes every symbol it defines with it, so this
                # only means anything once they are all present.
                if [ "$missing" -gt 0 ]; then
                  echo "  $(basename "$so"): $missing left to the environment, symbols not checked"
                elif ldd -r "$so" 2>&1 | grep -q "undefined symbol"; then
                  echo "$(basename "$so") has undefined symbols:"
                  ldd -r "$so" 2>&1 | grep "undefined symbol" | head -5
                  exit 1
                else
                  echo "  $(basename "$so"): links resolve"
                fi
              done
            done
            test "$checked" -gt 0 || { echo "no shared library shipped - is this a native package?"; exit 1; }
            echo "OK: $checked shared librar(y|ies) checked, nothing undeclared"
          '

  publish:
    needs: [build, verify]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Publish to the yum repositories
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SUITES: ${{ inputs.suites }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "::error::NEXUS_TOKEN secret is empty or unset"
            exit 1
          fi
          echo "Publishing packages built from ${{ needs.build.outputs.built_sha }}"
          uploaded=0
          attempted=0
          # Empty means every suite this target was built for, not every
          # suite there is: most targets have no image for some of them.
          if [ -z "${SUITES:-}" ]; then
            SUITES=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              -q ".artifacts[].name | select(startswith(\"${TARGET}-rpm-\")) | ltrimstr(\"${TARGET}-rpm-\")" | tr '\n' ' ')
          fi
          for suite in ${SUITES}; do
            # Each suite gets the rpm built for that distribution and no other:
            # the Release field carries the distribution tag, and a native
            # package links against that distribution's libraries.
            # By name, one suite at a time: download-artifact unpacks a lone
            # match straight into its path, so the layout depended on how many
            # suites had built.
            dir="pkg/${suite}"
            if ! gh run download "${GITHUB_RUN_ID}" -R "${GITHUB_REPOSITORY}" \
                   -n "${TARGET}-rpm-${suite}" -D "${dir}"; then
              echo "::error::nothing was built for '${suite}' - it failed or was skipped"
              exit 1
            fi
            mapfile -t rpms < <(find "${dir}" -name '*.rpm' ! -name '*.src.rpm' | sort)
            [ "${#rpms[@]}" -gt 0 ] || { echo "::error::no binary rpm for '${suite}'"; exit 1; }
            repo="${NEXUS_REPO_BASE}/flagos-yum-${suite}/"
            for r in "${rpms[@]}"; do
              attempted=$((attempted + 1))
              echo ">>> ${suite}: $(basename "$r")"
              if curl -f -u "${NEXUS_TOKEN}" --upload-file "$r" \
                   "${repo}$(basename "$r")"; then
                echo "  -> OK"
                uploaded=$((uploaded + 1))
              else
                echo "  -> FAILED"
              fi
            done
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no suite accepted the upload"
            exit 1
          fi
          # A partial success is worse than none: a -devel package can be
          # installable while the runtime it needs is absent.
          if [ "$uploaded" -ne "$attempted" ]; then
            echo "::error::published ${uploaded} of ${attempted} upload(s)"
            exit 1
          fi
          echo "Published all ${uploaded} upload(s)"
