name: Native RPM Package

# Build .rpm packages containing compiled code from a component repository's
# own packaging definition, and publish them to the FlagOS yum repositories.
# The rpm sibling of native-deb.yml, and the native sibling of noarch-rpm.yml.
#
# Keyed by package class, not by repository -- see native-deb.yml for why, for
# what native verification asks that the noarch one does not, and for why
# FlagGems' per-vendor C++ operators stay with flaggems-deb.yml rather than
# coming here.
#
# One build per target distribution rather than one shared build: an rpm
# carries the distribution in its Release field (.fc43, .oe2403), so a package
# built for one does not belong in another's repository. Unlike the noarch
# pair, that is doubly true here -- these link against the distribution's own
# libraries, so the package is not merely mislabelled elsewhere, it is wrong.
#
# Dispatch-only: an .rpm is a release artifact, nothing here is worth running
# on a push.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'component and package class to build'
        type: choice
        required: true
        options: [libtriton_jit, FlagTree, FlagTree-ascend, FlagDNN, FlagTensor, FlagFFT, flagtree-cpu]
      ref:
        description: >-
          git ref to build. Leave empty to use the ref this target is pinned to
          below. A tag is preferred: a branch head moves under later
          cherry-picks, so the same dispatch would not build the same source
          twice. Or `pull/<N>`: the head of that pull request, to run a
          packaging change through this workflow before it is merged (verify
          only; such a build can not be published).
        type: string
        default: ''
      version:
        description: >-
          release version to stamp, as the manifest spells it
          (e.g. v0.2.0-rc0.1). A pre-release qualifier goes in Release, not
          Version -- see the stamping step. Leave empty to derive it from the
          ref when the ref is a version tag, and to leave the spec alone
          otherwise.
        type: string
        default: ''
      suites:
        description: >-
          yum suites to publish into, space-separated. Leave empty to publish
          into every suite this target was built and verified for.
        type: string
        default: ''
      arches:
        description: >-
          architectures to build, space-separated (x86_64 aarch64). Leave empty
          to build every architecture this target is valid for -- which is not
          every architecture: a compiled package can only be built where its
          build inputs are published for that one.
        type: string
        default: ''
      verify:
        description: 'install the .rpm in a clean container before uploading'
        type: boolean
        default: true
      publish:
        description: 'push the verified .rpm to the yum repositories (requires verify)'
        type: boolean
        default: false

env:
  NEXUS_REPO_BASE: https://resource.flagos.net/repository

jobs:
  build:
    # GitHub-hosted arm64 runners. This repository is public, so they are free
    # and need no addition to the self-hosted pool. An rpm for aarch64 has to
    # be built on aarch64: rpmbuild stamps the architecture of the host it runs
    # on into the package.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    outputs:
      built_sha: ${{ steps.clone.outputs.sha }}
      # Set by any matrix row that actually built. Empty means every row
      # skipped, which is a configuration error rather than a clean run.
      any_built: ${{ steps.build.outputs.built }}
      deps: ${{ steps.cfg.outputs.deps }}
      publish_runs_on: ${{ steps.cfg.outputs.publish_runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # The suite and the architecture. The base image cannot live in this
        # matrix: a component whose build needs a vendor SDK builds on that
        # vendor's image for the distribution, not on the plain one -- FlagDNN
        # needs a CUDA-on-RockyLinux image where FlagTree needs bare Fedora.
        # The target table below names the image per suite, and a target that
        # has none for a suite, or is not valid for an architecture, is skipped
        # rather than built on the wrong base or the wrong machine.
        suite: [fedora43, openeuler24.03, rhel9]
        arch: [x86_64, aarch64]
    steps:
      - name: Resolve the target
        id: cfg
        env:
          TARGET: ${{ inputs.target }}
          SUITE: ${{ matrix.suite }}
          SUITES_REQ: ${{ inputs.suites }}
          ARCH: ${{ matrix.arch }}
          ARCHES: ${{ inputs.arches }}
        run: |
          set -euo pipefail
          # Per target: repository, build script, how that script takes its
          # base image, the spec to stamp, and the ref the release manifest
          # pins it to.
          #
          # `base_arg` exists because these scripts do not agree on how to be
          # told which distribution to build for: libtriton_jit takes
          # --base-image, FlagTree reads RPM_BASE_IMAGE from the environment.
          # Recording the difference here is cheaper than an upstream PR to
          # each of them for the sake of uniformity.
          deps=''
          base_pkgs=''
          # script_arg: one positional argument for the build script, for a
          # repository whose script packages more than one thing. Empty for
          # every target whose script takes none.
          script_arg=''
          # arches: the architectures this target's build inputs exist for --
          # not the architectures its source supports. An x86_64-only entry is
          # a statement about what is missing, named at the target.
          arches=x86_64
          # publish_runs_on: where the upload job runs. The hosted runners
          # reach Nexus at tens of KB/s and the connection drops after about
          # an hour, which the 80 MB FlagTree rpms survive only sometimes;
          # the self-hosted runner already pushes FlagTree wheels there.
          publish_runs_on='["ubuntu-latest"]'
          case "${TARGET}" in
            libtriton_jit)
              repo=libtriton_jit
              script=packaging/rpm/build-rpm.sh
              base_arg=flag
              spec=packaging/rpm/libtriton-jit.spec
              outdir=rpm-packages
              ref=master
              ver=''
              # x86_64 only because of the build inputs, not the source: the
              # build installs torch and triton from flagos-pypi-nvidia, which
              # publishes both for x86_64 alone while upstream has aarch64
              # wheels for both. Add aarch64 here once the index carries them.
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagTree)
              repo=FlagTree
              script=packaging/rpm/helpers/build-flagtree-rpm.sh
              base_arg=env
              spec=packaging/rpm/specs/flagtree.spec
              outdir=dist-rpm/output
              # GA tag at the tip of 0.7.0-rc2-triton3.6; the "+triton3.6"
              # local label is not a package version, so ver is spelled out.
              ref=0.7.0+triton3.6
              ver=0.7.0
              image_fedora43=fedora:43
              image_openeuler2403=openeuler/openeuler:24.03-lts
              image_rhel9=
              publish_runs_on='["self-hosted", "h20"]' ;;
            FlagTree-ascend)
              # A second package class out of the same repository, not a second
              # repository: this one is assembled from the wheel the ascend
              # delivery workflow publishes, where the FlagTree target above
              # compiles its own. The two differ in everything a row carries --
              # architecture, suite, and the wheel-vs-source build -- so they
              # are separate targets rather than one target with a dimension.
              repo=FlagTree
              script=packaging/rpm/helpers/build-flagtree-rpm.sh
              # Quoted: shellcheck reads a bare `env` as a command.
              base_arg='env'
              script_arg=ascend
              spec=packaging/rpm/specs/flagtree.spec
              outdir=dist-rpm/output
              # aarch64 only, and openEuler 24.03 only: the published wheel is
              # cp311 + linux_aarch64, and 24.03 is the only suite here whose
              # python3 is 3.11. An rpm for aarch64 has to be built on aarch64
              # anyway, so this is one hosted arm64 row.
              arches=aarch64
              # The spec's Version also selects which published wheel is taken
              # (0.6.1 -> the highest flagtree-0.6.1+ascend*), so `version`
              # here moves both together.
              #
              # Packaging lands with flagos-ai/FlagTree#1461. Until a release
              # tag carries it, this target builds only from `pull/1461`, which
              # cannot be published.
              ref=main
              ver=''
              image_fedora43=
              image_openeuler2403=openeuler/openeuler:24.03-lts
              image_rhel9=
              publish_runs_on='["self-hosted", "h20"]' ;;
            FlagDNN)
              repo=FlagDNN
              script=packaging/rpm/build-flag-dnn-rpm.sh
              base_arg=arg
              spec=packaging/rpm/specs/flag-dnn.spec
              outdir=rpm-packages
              ref=v0.3.0
              ver=v0.3.0
              deps='libtriton-jit-nvidia libtriton-jit-nvidia-devel'
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagTensor)
              repo=FlagTensor
              script=packaging/rpm/build-flagtensor-rpm.sh
              base_arg=arg
              spec=packaging/rpm/specs/flagtensor.spec
              outdir=rpm-packages
              ref=v0.3.0
              ver=v0.3.0
              deps='libtriton-jit-nvidia libtriton-jit-nvidia-devel'
              image_fedora43=
              image_openeuler2403=
              image_rhel9=nvidia/cuda:12.6.0-devel-rockylinux9 ;;
            FlagFFT)
              repo=FlagFFT
              script=packaging/rpm/build-flagfft-rpm.sh
              base_arg=flag
              spec=packaging/rpm/specs/flagfft.spec
              outdir=rpm-packages
              # openeuler24.03 is the only suite with an image, and this tag
              # does not build there: the bundled libtriton_jit wants
              # nlohmann_json >= 3.11.3 where openEuler ships 3.11.2 (FlagFFT#26
              # is the workaround on main). No rpm until a release carries it.
              ref=v0.2.0
              ver=v0.2.0
              # The spec BuildRequires nlohmann-json-devel, which the
              # Dockerfile does not install; add it here.
              base_pkgs="nlohmann-json-devel python3-wheel"
              image_fedora43=
              image_openeuler2403=openeuler/cuda:13.0.0-oe2403lts
              image_rhel9= ;;
            flagtree-cpu)
              repo=flagtree-cpu
              script=packaging/rpm/helpers/build-flagtree-cpu-rpm.sh
              # Quoted: shellcheck reads a bare `env` as a command substitution.
              base_arg='env'
              spec=packaging/rpm/specs/flagtree-cpu.spec
              outdir=dist-rpm/output
              # The CPU backend needs no vendor SDK and no accelerator, so it
              # is the one native target that builds from the distribution
              # alone on both architectures -- its spec is ExclusiveArch:
              # aarch64 x86_64. It builds LLVM, which takes about two hours on
              # a hosted arm64 runner.
              arches='x86_64 aarch64'
              # Packaging lands with flagos-ai/flagtree-cpu#8; until then this
              # target builds only from `pull/8`, which cannot be published.
              ref=main
              ver=''
              image_fedora43=fedora:43
              image_openeuler2403=openeuler/openeuler:24.03-lts
              image_rhel9= ;;
            *)
              echo "::error::unknown target '${TARGET}'"; exit 1 ;;
          esac
          {
            echo "repo_url=https://github.com/flagos-ai/${repo}.git"
            echo "script=${script}"
            echo "base_arg=${base_arg}"
            echo "script_arg=${script_arg}"
            echo "deps=${deps}"
            echo "publish_runs_on=${publish_runs_on}"
            echo "base_pkgs=${base_pkgs}"
            echo "spec=${spec}"
            echo "outdir=${outdir}"
            echo "default_ref=${ref}"
            echo "default_version=${ver}"
            echo "arches=${arches}"
          } >> "$GITHUB_OUTPUT"
          # An override may narrow the architecture list but never widen it --
          # same rule as the suites below, for the same reason.
          for a in ${ARCHES:-}; do
            case " ${arches} " in
              *" ${a} "*) ;;
              *)
                echo "::error::'${a}' is not an architecture ${TARGET} is valid for (${arches})"
                exit 1 ;;
            esac
          done
          case " ${ARCHES:-${arches}} " in
            *" ${ARCH} "*) echo "build_arch=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "build_arch=false" >> "$GITHUB_OUTPUT" ;;
          esac
          # The base image for the suite this matrix row builds. Empty means the
          # target has no image for that distribution and the row is skipped --
          # so this has to be emitted, or every row skips and the run reports
          # success having built nothing.
          valid_suites=""
          [ -n "${image_fedora43}" ] && valid_suites="fedora43"
          [ -n "${image_openeuler2403}" ] && valid_suites="${valid_suites:+$valid_suites }openeuler24.03"
          [ -n "${image_rhel9}" ] && valid_suites="${valid_suites:+$valid_suites }rhel9"
          for s in ${SUITES_REQ:-}; do
            case " ${valid_suites} " in
              *" ${s} "*) ;;
              *)
                echo "::error::'${s}' is not a suite ${TARGET} is valid for (${valid_suites})"
                exit 1 ;;
            esac
          done
          selected_image=""
          case " ${SUITES_REQ:-${valid_suites}} " in
            *" ${SUITE} "*)
              case "${SUITE}" in
                fedora43)       selected_image="${image_fedora43}" ;;
                openeuler24.03) selected_image="${image_openeuler2403}" ;;
                rhel9)          selected_image="${image_rhel9}" ;;
              esac ;;
          esac
          echo "base_image=${selected_image}" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish what was not verified
        if: ${{ inputs.publish }}
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.verify }}" != "true" ]; then
            echo "::error::publish requires verify - an unverified package must not reach the repository"
            exit 1
          fi
          # The matrix above is what gets built and verified; a suite outside
          # it has no package to publish, and asking for one is a mistake worth
          # naming rather than a silent no-op.
          BUILT="fedora43 openeuler24.03 rhel9"
          for suite in ${SUITES:-}; do
            case " ${BUILT} " in
              *" ${suite} "*) ;;
              *)
                echo "::error::'${suite}' is not built by this workflow (${BUILT})"
                exit 1 ;;
            esac
          done
          echo "Publish targets: ${SUITES:-${BUILT}}"

      # Only for scripts/clone-ref.sh; the component source goes under src/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            scripts/clone-ref.sh
            scripts/stamp_pkg_version.py
          sparse-checkout-cone-mode: false

      - name: Clone ${{ inputs.target }}
        id: clone
        env:
          REF: ${{ inputs.ref || steps.cfg.outputs.default_ref }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "${REF}" == pull/* && "${PUBLISH}" == "true" ]]; then
            echo "::error::${REF} is a pull request head; it can be built and verified but not published"
            exit 1
          fi
          scripts/clone-ref.sh --submodules "${{ steps.cfg.outputs.repo_url }}" "${REF}" src
          cd src
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          tag_sha=$(git rev-parse -q --verify "refs/tags/${REF}^{commit}" || true)
          if [ -n "$tag_sha" ] && [ "$tag_sha" = "$sha" ]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${REF} is a branch, not a tag - this build is not reproducible by ref name alone"
          fi
          echo "Built ${REF} = ${sha}"
          for f in "${{ steps.cfg.outputs.script }}" "${{ steps.cfg.outputs.spec }}"; do
            test -f "$f" \
              || { echo "::error::ref '${REF}' has no RPM packaging definition ($f is missing)"; exit 1; }
          done

      - name: Stamp the release version
        working-directory: src
        env:
          SPEC: ${{ steps.cfg.outputs.spec }}
          REF: ${{ steps.clone.outputs.ref }}
          REF_IS_TAG: ${{ steps.clone.outputs.is_tag }}
          REQUESTED: ${{ inputs.version }}
          PINNED: ${{ inputs.ref == '' && steps.cfg.outputs.default_version || '' }}
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/stamp_pkg_version.py" rpm "${SPEC}" \
            --ref "${REF}" \
            --is-tag "${REF_IS_TAG}" \
            --requested "${REQUESTED}" \
            --pinned "${PINNED}"
          grep -E '^(Version|Release):' "${SPEC}"

      - name: Skip a row this target is not built for
        if: ${{ steps.cfg.outputs.base_image == '' || steps.cfg.outputs.build_arch != 'true' }}
        run: |
          if [ -z "${{ steps.cfg.outputs.base_image }}" ]; then
            echo "::notice::${{ inputs.target }} has no ${{ matrix.suite }} base image; skipping"
          else
            echo "::notice::${{ inputs.target }} is not built for ${{ matrix.arch }} (valid: ${{ steps.cfg.outputs.arches }})"
          fi

      - name: Fetch FlagOS build dependencies for ${{ matrix.suite }}
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' && steps.cfg.outputs.deps != '' }}
        working-directory: src
        env:
          DEPS: ${{ steps.cfg.outputs.deps }}
          BASE: ${{ env.NEXUS_REPO_BASE }}/flagos-yum-${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p packaging/rpm/local-deps
          python3 - <<'PY'
          import gzip, os, re, sys, urllib.request, xml.etree.ElementTree as ET
          base, out = os.environ["BASE"], "packaging/rpm/local-deps"
          ns = {"r": "http://linux.duke.edu/metadata/repo", "c": "http://linux.duke.edu/metadata/common"}
          get = lambda u: urllib.request.urlopen(u).read()
          href = ET.fromstring(get(f"{base}/repodata/repomd.xml")).find(
              "r:data[@type='primary']/r:location", ns).get("href")
          primary = ET.fromstring(gzip.decompress(get(f"{base}/{href}")))
          key = lambda v: [int(x) if x.isdigit() else x for x in re.split(r"(\d+)", v)]
          for dep in os.environ["DEPS"].split():
              found = [(p.find("c:version", ns), p.find("c:location", ns).get("href"))
                       for p in primary.findall("c:package", ns)
                       if p.find("c:name", ns).text == dep and p.find("c:arch", ns).text != "src"]
              if not found:
                  sys.exit(f"::error::{dep} is not in {base}")
              v, loc = max(found, key=lambda f: (key(f[0].get("ver")), key(f[0].get("rel"))))
              print(f">>> {dep} {v.get('ver')}-{v.get('rel')}")
              urllib.request.urlretrieve(f"{base}/{loc}", os.path.join(out, os.path.basename(loc)))
          PY

      - name: Build the .rpm packages for ${{ matrix.suite }} on ${{ matrix.arch }}
        id: build
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        working-directory: src
        env:
          BASE_IMAGE: ${{ steps.cfg.outputs.base_image }}
          BASE_PKGS: ${{ steps.cfg.outputs.base_pkgs }}
          SCRIPT_ARG: ${{ steps.cfg.outputs.script_arg }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_PKGS}" ]; then
            printf 'FROM %s\nRUN dnf install -y %s && dnf clean all\n' "${BASE_IMAGE}" "${BASE_PKGS}" \
              | docker build -t "flagos-base:${{ matrix.suite }}-${{ matrix.arch }}" -
            BASE_IMAGE="flagos-base:${{ matrix.suite }}-${{ matrix.arch }}"
          fi
          # ${VAR:+"${VAR}"} so a target without a script argument passes
          # none, rather than an empty positional the script would read as one.
          case "${{ steps.cfg.outputs.base_arg }}" in
            flag) bash "${{ steps.cfg.outputs.script }}" --base-image "${BASE_IMAGE}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            env)  RPM_BASE_IMAGE="${BASE_IMAGE}" bash "${{ steps.cfg.outputs.script }}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            arg)  bash "${{ steps.cfg.outputs.script }}" "${BASE_IMAGE}" ${SCRIPT_ARG:+"${SCRIPT_ARG}"} ;;
            *)    echo "::error::unknown base_arg"; exit 1 ;;
          esac
          # Every binary package, not the first: these builds emit a runtime
          # and a -devel package, and taking one would silently drop the other.
          # Source rpms are build inputs, not something a user installs.
          mapfile -t rpms < <(find "${{ steps.cfg.outputs.outdir }}" -name '*.rpm' ! -name '*.src.rpm' | sort)
          [ "${#rpms[@]}" -gt 0 ] || { echo "::error::the build produced no binary rpm"; exit 1; }
          mkdir -p out && cp "${rpms[@]}" out/
          # Read back by the publish job, which has to learn the suite from
          # inside the artifact rather than from its name -- see there.
          echo "${{ matrix.suite }}" > out/SUITE
          echo "built=yes" >> "$GITHUB_OUTPUT"
          echo "Built ${#rpms[@]} package(s):"
          for r in "${rpms[@]}"; do
            echo ">>> $(basename "$r")"
            rpm -qp --qf '%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$r" 2>/dev/null || true
          done

      - name: Record built row manifest
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        run: |
          mkdir -p built-manifest
          echo "${{ matrix.suite }} ${{ matrix.arch }} ${{ steps.clone.outputs.sha }}" > "built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}"

      - name: Upload built row manifest
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.target }}-rpm-built-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}
          retention-days: 7

      - name: Upload the .rpm packages
        if: ${{ steps.cfg.outputs.base_image != '' && steps.cfg.outputs.build_arch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.target }}-rpm-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            src/out/*.rpm
            src/out/SUITE
          retention-days: 7

  verify:
    needs: build
    if: ${{ inputs.verify }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        suite: [fedora43, openeuler24.03, rhel9]
        arch: [x86_64, aarch64]
        include:
          - suite: fedora43
            image: fedora:43
          - suite: openeuler24.03
            image: openeuler/openeuler:24.03-lts
          - suite: rhel9
            image: rockylinux:9
            repos: epel-release
    steps:
      - name: Clean workspace artifacts
        run: rm -rf pkg built-manifest

      - name: Download built row manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.target }}-rpm-built-*
          path: built-manifest
          merge-multiple: true

      - name: Check whether ${{ matrix.suite }} ${{ matrix.arch }} was built
        id: expect
        run: |
          set -euo pipefail
          compgen -G "built-manifest/BUILT_*" > /dev/null             || { echo "::error::no suite produced a package - nothing was verified"; exit 1; }
          if [ -f "built-manifest/BUILT_${{ matrix.suite }}_${{ matrix.arch }}" ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nothing was built for ${{ matrix.suite }} ${{ matrix.arch }}"
          fi

      - name: Download the .rpm packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.target }}-rpm-${{ matrix.suite }}-${{ matrix.arch }}
          path: pkg

      - name: Install and check in a clean ${{ matrix.image }}
        if: ${{ steps.expect.outputs.built == 'true' }}
        env:
          REPOS: ${{ matrix.repos }}
          # A package that depends on another FlagOS package gets the FlagOS
          # repository it will be published to.
          FLAGOS_YUM: ${{ needs.build.outputs.deps != '' && format('{0}/flagos-yum-{1}', env.NEXUS_REPO_BASE, matrix.suite) || '' }}
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/pkg:/pkg:ro" -e REPOS -e FLAGOS_YUM ${{ matrix.image }} bash -c '
            set -e
            if [ -n "${REPOS:-}" ]; then
              dnf install -y -q ${REPOS}
              # EPEL packages assume CRB is enabled alongside.
              case " ${REPOS} " in *" epel-release "*) dnf config-manager --set-enabled crb 2>/dev/null || true ;; esac
            fi
            if [ -n "${FLAGOS_YUM:-}" ]; then
              printf "[flagos]\nname=FlagOS\nbaseurl=%s\nenabled=1\ngpgcheck=0\n" "${FLAGOS_YUM}" > /etc/yum.repos.d/flagos.repo
            fi
            # Installing the files themselves is the test: dnf has to satisfy
            # their own Requires from the distribution and the repositories its
            # row names, nothing else. All of them, so a -devel package whose
            # runtime is unsatisfiable fails here rather than in a user'"'"'s
            # terminal.
            dnf install -y -q --setopt=install_weak_deps=False /pkg/*.rpm
            dnf install -y -q binutils > /dev/null 2>&1 || true

            checked=0
            is_public_dir() {
              case "$1" in
                /lib|/lib64|/usr/lib|/usr/lib64) return 0 ;;
                /lib/*-linux-gnu*|/usr/lib/*-linux-gnu*)
                  _sub=${1#/usr}; _sub=${_sub#/lib/}
                  case "$_sub" in */*) return 1 ;; *) return 0 ;; esac ;;
                *) return 1 ;;
              esac
            }
            host_governs_plugin() {
              if is_public_dir "$1"; then return 0; fi
              case "$2/" in "$1/"*) return 0 ;; esac
              _hp=$(dirname "$1"); _hb=$(basename "$1")
              case "$_hb:$2/" in _C:"$_hp/"*|lib:"$_hp/"*) return 0 ;; esac
              return 1
            }
            needed_dirs_for() {
              _queue="$1"; _seen=""; _dirs=""
              while [ -n "$_queue" ]; do
                _cur=${_queue%% *}
                if [ "$_cur" = "$_queue" ]; then _queue=""; else _queue=${_queue#* }; fi
                case " $_seen " in *" $_cur "*) continue ;; esac
                _seen="$_seen $_cur"
                for _soname in $(readelf -d "$_cur" 2>/dev/null | grep "(NEEDED)" | sed -E "s/.*\[([^]]+)\].*/\1/"); do
                  for _cand in $pkg_sos; do
                    if [ "$(basename "$_cand")" = "$_soname" ]; then
                      _cdir=$(dirname "$(readlink -f "$_cand")")
                      _dirs="${_dirs:+$_dirs:}$_cdir"
                      _queue="${_queue:+$_queue }$_cand"
                    fi
                  done
                done
              done
              printf "%s" "$_dirs"
            }
            for pkg in $(rpm -qp --qf "%{NAME}\n" /pkg/*.rpm | sort -u); do
              pkg_sos=$(rpm -ql "$pkg" | grep -E "\.so($|\.)" | while read -r s; do [ -f "$s" ] && echo "$s"; done || true)
              pkg_dirs=$(printf "%s\n" "$pkg_sos" | sed -E "s|/[^/]+$||" | sort -u | paste -sd: -)
              loadable_hosts=""
              unpreload_hosts=""
              for h in $pkg_sos; do
                case "$(basename "$h")" in *.cpython-*.so) continue ;; esac
                nm -D -u "$h" 2>/dev/null | awk "{print \$NF}" | sed "s/@.*//" | grep -qx "dlopen" || continue
                h_dirs=$(needed_dirs_for "$h")
                if ! LD_LIBRARY_PATH="$h_dirs" ldd "$h" 2>&1 | grep -q "not found" \
                   && ! LD_LIBRARY_PATH="$h_dirs" ldd -r "$h" 2>&1 | grep -vE "undefined symbol: _?Py" | grep -q "undefined symbol"; then
                  loadable_hosts="${loadable_hosts:+$loadable_hosts }$h"
                else
                  unpreload_hosts="${unpreload_hosts:+$unpreload_hosts }$h"
                fi
              done

              for so in $pkg_sos; do
                checked=$((checked + 1))
                real_so=$(readlink -f "$so")
                so_dir=$(dirname "$real_so")
                if is_public_dir "$so_dir"; then is_public=1; else is_public=0; fi
                owner=$(rpm -qf "$real_so" --qf "%{NAME}\n" | head -1)
                env_missing=0
                for lib in $(ldd "$so" 2>&1 | grep "not found" | awk "{print \$1}"); do
                  provider=$(rpm -q --whatprovides "${lib}()(64bit)" --qf "%{NAME}\n" 2>/dev/null | head -1 || true)
                  if [ -z "$provider" ] || echo "$provider" | grep -q "no package provides"; then
                    cand_files=$(for d in $(echo "$pkg_dirs" | tr : " "); do [ -e "$d/$lib" ] && echo "$d/$lib"; done || true)
                    if [ -n "$cand_files" ]; then
                      provider=$(rpm -qf $cand_files --qf "%{NAME}\n" 2>/dev/null | head -1 || true)
                    fi
                  fi
                  if [ "$provider" = "$owner" ]; then
                    if [ "$is_public" -eq 1 ]; then
                      echo "$(basename "$so"): $lib is shipped by $owner outside the loader path, and $(basename "$so") has no RUNPATH to reach it"
                      exit 1
                    fi
                    echo "  $(basename "$so"): $lib shipped by the package itself"
                  elif [ -n "$provider" ] && ! echo "$provider" | grep -q "no package provides" \
                       && ! rpm -q --requires "$owner" | grep -Eq "^(${provider}($|[ (])|${lib}[(][)])"; then
                    echo "$(basename "$so"): $lib is provided by an installed package ($provider) but not declared"
                    exit 1
                  else
                    echo "  $(basename "$so"): $lib left to the environment"
                    env_missing=$((env_missing + 1))
                  fi
                done

                if [ "$env_missing" -gt 0 ]; then
                  echo "  $(basename "$so"): $env_missing left to the environment, symbols not checked"
                elif [ "$is_public" -eq 1 ]; then
                  if undefined=$(ldd -r "$so" 2>&1 | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" | awk "{print \$3}"); [ -n "$undefined" ]; then
                    echo "$(basename "$so") has undefined symbols:"
                    printf "%s\n" "$undefined" | head -5
                    exit 1
                  else
                    echo "  $(basename "$so"): links resolve"
                  fi
                else
                  so_dirs=$(needed_dirs_for "$so")
                  defined_unpreload="/tmp/defined-unpreload-$$"
                  : > "$defined_unpreload"
                  for h in $unpreload_hosts; do
                    h_real=$(readlink -f "$h")
                    [ "$h_real" = "$real_so" ] && continue
                    if host_governs_plugin "$(dirname "$h_real")" "$so_dir"; then
                      nm -D --defined-only "$h" 2>/dev/null | awk "{print \$NF}" | sed "s/@.*//" >> "$defined_unpreload"
                    fi
                  done
                  sort -u -o "$defined_unpreload" "$defined_unpreload"
                  gov_hosts=""
                  for h in $loadable_hosts; do
                    h_real=$(readlink -f "$h")
                    [ "$h_real" = "$real_so" ] && continue
                    if host_governs_plugin "$(dirname "$h_real")" "$so_dir"; then
                      gov_hosts="${gov_hosts:+$gov_hosts }$h"
                    fi
                  done
                  resolved=0
                  undefined=""
                  if [ -n "$gov_hosts" ]; then
                    for h in $gov_hosts; do
                      hd=$(needed_dirs_for "$h")
                      try_dirs="${so_dirs}${hd:+:${hd}}"
                      try_dirs="${try_dirs#:}"
                      cand_undef=$(LD_PRELOAD="$h" LD_LIBRARY_PATH="$try_dirs" ldd -r "$so" 2>&1 \
                                   | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" \
                                   | awk "{print \$3}" | grep -vxF -f "$defined_unpreload" || true)
                      if [ -z "$cand_undef" ]; then
                        resolved=1
                        undefined=""
                        break
                      fi
                      undefined="$cand_undef"
                    done
                  else
                    undefined=$(LD_LIBRARY_PATH="$so_dirs" ldd -r "$so" 2>&1 \
                                | grep "undefined symbol" | grep -vE "undefined symbol: _?Py" \
                                | awk "{print \$3}" | grep -vxF -f "$defined_unpreload" || true)
                    [ -z "$undefined" ] && resolved=1
                  fi
                  rm -f "$defined_unpreload"
                  if [ "$resolved" -eq 0 ]; then
                    echo "$(basename "$so") has undefined symbols:"
                    printf "%s\n" "$undefined" | head -5
                    exit 1
                  else
                    echo "  $(basename "$so"): links resolve"
                  fi
                fi
              done
            done
            test "$checked" -gt 0 || { echo "no shared library shipped - is this a native package?"; exit 1; }
            echo "OK: $checked shared librar(y|ies) checked, nothing undeclared"
          '

      - name: Attest verified .rpm packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        run: echo "${{ matrix.suite }} ${{ matrix.arch }}" > "pkg/VERIFIED_${{ matrix.suite }}_${{ matrix.arch }}"

      - name: Upload verified .rpm packages
        if: ${{ steps.expect.outputs.built == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verified-${{ inputs.target }}-rpm-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            pkg/*.rpm
            pkg/SUITE
            pkg/VERIFIED_${{ matrix.suite }}_${{ matrix.arch }}
          retention-days: 7

  publish:
    needs: [build, verify]
    if: ${{ inputs.publish }}
    runs-on: ${{ fromJSON(needs.build.outputs.publish_runs_on) }}
    steps:
      - name: Clean workspace artifacts
        run: rm -rf pkg built-manifest

      - name: Download built row manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.target }}-rpm-built-*
          path: built-manifest
          merge-multiple: true

      # Only verified-* artifacts are downloaded here, and every built row in
      # the selected suites must present its VERIFIED marker before upload.
      - name: Download verified .rpm packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: verified-${{ inputs.target }}-rpm-*
          path: pkg
          merge-multiple: false

      - name: Verify every built row passed verification
        env:
          SUITES: ${{ inputs.suites }}
        run: |
          set -euo pipefail
          compgen -G "built-manifest/BUILT_*" > /dev/null             || { echo "::error::no built manifest found"; exit 1; }
          expected_sha=""
          for f in built-manifest/BUILT_*; do
            read -r bsuite barch bsha < "$f"
            if [ -n "${SUITES:-}" ]; then
              case " ${SUITES} " in *" ${bsuite} "*) ;; *) continue ;; esac
            fi
            if [ -n "$expected_sha" ] && [ "$bsha" != "$expected_sha" ]; then
              echo "::error::built rows resolved to different commits ($expected_sha vs $bsha)"
              exit 1
            fi
            expected_sha="$bsha"
            found=$(find pkg -name "VERIFIED_${bsuite}_${barch}" -print -quit)
            [ -n "$found" ] || { echo "::error::${bsuite} ${barch} was built but has no verification attestation"; exit 1; }
          done

      - name: Publish to the yum repositories
        env:
          NEXUS_TOKEN: ${{ secrets.NEXUS_TOKEN }}
          SUITES: ${{ inputs.suites }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_TOKEN:-}" ]; then
            echo "::error::NEXUS_TOKEN secret is empty or unset"
            exit 1
          fi
          echo "Publishing packages built from ${{ needs.build.outputs.built_sha }}"
          uploaded=0
          attempted=0
          # Each artifact holds the packages of one suite and architecture
          # and a SUITE file naming the suite (written by the build job).
          mapfile -t markers < <(find pkg -name SUITE | sort)
          [ "${#markers[@]}" -gt 0 ] || { echo "::error::no package directory under pkg/"; exit 1; }
          # Empty means every suite this target was built for, not every
          # suite there is: most targets have no image for some of them.
          if [ -z "${SUITES:-}" ]; then
            SUITES=$(cat "${markers[@]}" | sort -u | tr '\n' ' ')
          fi
          for suite in ${SUITES}; do
            # Each suite gets the rpm built for that distribution and no other:
            # the Release field carries the distribution tag, and a native
            # package links against that distribution's libraries. Every
            # architecture of the suite goes into the same repository, which
            # serves them all from one set of metadata.
            rpms=()
            for m in "${markers[@]}"; do
              [ "$(cat "$m")" = "${suite}" ] || continue
              mapfile -t -O "${#rpms[@]}" rpms < <(find "$(dirname "$m")" -name '*.rpm' ! -name '*.src.rpm' | sort)
            done
            if [ "${#rpms[@]}" -eq 0 ]; then
              echo "::error::nothing was built for '${suite}' - it failed or was skipped"
              exit 1
            fi
            repo="${NEXUS_REPO_BASE}/flagos-yum-${suite}/"
            for r in "${rpms[@]}"; do
              attempted=$((attempted + 1))
              echo ">>> ${suite}: $(basename "$r")"
              if curl -f -u "${NEXUS_TOKEN}" --upload-file "$r" \
                   "${repo}$(basename "$r")"; then
                echo "  -> OK"
                uploaded=$((uploaded + 1))
              else
                echo "  -> FAILED"
              fi
            done
          done
          if [ "$uploaded" -eq 0 ]; then
            echo "::error::no suite accepted the upload"
            exit 1
          fi
          # A partial success is worse than none: a -devel package can be
          # installable while the runtime it needs is absent.
          if [ "$uploaded" -ne "$attempted" ]; then
            echo "::error::published ${uploaded} of ${attempted} upload(s)"
            exit 1
          fi
          echo "Published all ${uploaded} upload(s)"
