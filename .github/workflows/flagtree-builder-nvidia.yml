name: FlagTree NVIDIA Builder

# Publishes `--target builder` of packaging/flagtree/nvidia-cuda: the FlagTree
# build machine for the nvidia backend.
#
# WHY A BUILDER: the nvidia wheel build starts from a cold `ubuntu:22.04` -- apt,
# deadsnakes python, and 1.23 GB of prebuilt LLVM -- before the clone even runs,
# and the day's FlagTree commit often has not moved. Splitting that into a
# published stage leaves the daily with the clone and the compile, and gives the
# staged part a place to be rebuilt when it changes rather than every run.
#
# SEPARATE FROM flagtree-builder.yml ON PURPOSE. That line publishes iluvatar's
# builder and proves it by building the flagtree image and a wheel on top of it;
# here the stage is the whole deliverable, the proof is the daily consuming it,
# and neither line touches the other's file.
#
# THE WHEEL IS NOT BUILT HERE. The builder stage holds no FlagTree source at all;
# flagtree-wheel-daily.yml builds the wheel on top of this image.
#
# THE TAG IS THE STACK VERSION, and the stage is flat: a rebuild overwrites it.
# The wheel build re-reads the consumer's cmake/llvm-hash.txt against the hash
# baked in here and fails when they differ, so a stale builder is a failed build
# naming this workflow, not a silently wrong wheel.

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'push the builder image to Harbor'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  authorize:
    # Only accounts listed in .github/builders.txt may trigger this workflow
    # manually. checkout lets the local composite action resolve from the
    # workspace; check-trigger-author short-circuits on a non-dispatch event.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/check-trigger-author

  build:
    needs: authorize
    # The same runner the wheel build uses, so the published stage is built on
    # the hardware that consumes it.
    runs-on: [self-hosted, h20]
    env:
      TARGET: nvidia-cuda
      BUILDER_IMAGE: flagtree-builder-nvidia-cuda:ci
    steps:
      - name: Checkout build-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check disk space
        run: |
          # Roughly: the apt toolchain, the deadsnakes python, the 1.23 GB LLVM
          # tarball and the 4.7 GB tree it extracts to. The tarball is removed
          # once unpacked, and no triton compile happens here.
          FREE_KB=$(df -P . | awk 'NR==2{print $4}')
          FREE_GB=$((FREE_KB / 1024 / 1024))
          echo "Free disk space: ${FREE_GB}G"
          if [ "$FREE_GB" -lt 15 ]; then
            echo "ERROR: insufficient disk space (${FREE_GB}G < 15G). Docker needs cleanup."
            df -h .
            exit 1
          fi

      - name: Resolve the published image ref
        id: ref
        run: |
          set -euo pipefail
          # Same shape as every other published image ref: registry host and
          # prefix from build-config.yml, tag from configs.yaml. The wheel build
          # derives the identical string.
          version=$(python3 -c "import yaml;print(yaml.safe_load(open('configs.yaml'))['version'])")
          host=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['host'])")
          prefix=$(python3 -c "import yaml;print(yaml.safe_load(open('.github/build-config.yml'))['registry']['prefixes']['builder'])")
          echo "image=${host}/${prefix}/flagtree-builder-nvidia-cuda:${version}" >> "$GITHUB_OUTPUT"

      - name: Harbor login (push only)
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_PW: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          host="${IMAGE_REF%%/*}"
          for i in 1 2 3; do
            if printf '%s' "$HARBOR_PW" | docker login "$host" -u "$HARBOR_USER" --password-stdin; then
              exit 0
            fi
            echo "Harbor login attempt $i failed, retrying..."
            sleep 30
          done
          echo "::error::Harbor login failed after 3 attempts"
          exit 1

      - name: Build the builder stage
        working-directory: packaging/flagtree
        env:
          HTTP_PROXY_SECRET: ${{ secrets.HTTP_PROXY }}
        run: |
          set -euo pipefail
          # Proxy: the runner's own, else the secret. Relay the value and nothing
          # else -- the Containerfile declares only http_proxy/https_proxy, so
          # those are the two that go through.
          proxy_url="${https_proxy:-${HTTPS_PROXY:-${http_proxy:-${HTTP_PROXY:-}}}}"
          proxy_url="${proxy_url:-${HTTP_PROXY_SECRET}}"
          build_args=()
          if [ -n "${proxy_url}" ]; then
            build_args+=(--build-arg "https_proxy=${proxy_url}")
            build_args+=(--build-arg "http_proxy=${proxy_url}")
          fi
          # No --build-arg BUILDER_IMAGE: this stage's base is the Containerfile's
          # own `ubuntu:22.04` default, which is what makes this a cold build.
          # Caching is wanted here -- the stage is content-addressed by the apt
          # list and the LLVM args, so a re-run that changes nothing reuses it.
          docker build --target builder "${build_args[@]}" -t "$BUILDER_IMAGE" -f "$TARGET" .
          docker tag "$BUILDER_IMAGE" "${{ steps.ref.outputs.image }}"

      # The stage is only useful if it can carry the wheel build. Assert the
      # things that build reads from it -- the toolchain, the interpreter, the
      # patcher and the LLVM tree -- plus the marker its guard keys on, so a stage
      # that skipped its own setup fails here rather than inside a daily run.
      #
      # `lib/cmake/mlir` is the real contract, not `bin/clang`: this is the same
      # oaitriton tree the flagcx line measured as shipping no clang
      # (packaging/flagcx/WHEEL-DESIGN.md), and FlagTree consumes it as an MLIR
      # install tree -- find_package(MLIR) off LLVM_LIBRARY_DIR.
      - name: Verify the stage carries what the wheel build reads
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE_REF" bash -euo pipefail -c '
            test -f /opt/flagtree-build-env.ready
            command -v git cmake ninja make wget curl >/dev/null
            python3.12 -c "import sys; assert sys.version_info[:2] == (3, 12)"
            python3.12 -m pip --version
            test -f /usr/local/bin/patch-flagtree-version.py
            test -d "${LLVM_SYSPATH}/lib/cmake/mlir"
            ls "${LLVM_SYSPATH}"/lib/cmake/mlir/*Config.cmake >/dev/null
            # The staleness gate in the wheel build reads this; without it every
            # warm build would refuse to start.
            test -s /opt/flagtree-build-env.llvm
            echo ">>> LLVM_SYSPATH=${LLVM_SYSPATH}, staged $(cat /opt/flagtree-build-env.llvm)"
          '

      - name: Push the builder image
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"

      # The push is only accepted, not served: read the tag back the way a
      # consumer does, and compare what the registry serves with what was built.
      - name: Verify the pushed image reads back
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.ref.outputs.image }}
        run: |
          set -euo pipefail
          built="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          docker pull "$IMAGE_REF"
          served="$(docker image inspect --format '{{.Id}}' "$IMAGE_REF")"
          if [ "$built" != "$served" ]; then
            echo "::error::$IMAGE_REF: the registry serves $served, this run built $built"
            exit 1
          fi
          echo ">>> $IMAGE_REF reads back as $served"

      - name: Clean up
        if: ${{ always() }}
        run: docker rmi "$BUILDER_IMAGE" 2>/dev/null || true
