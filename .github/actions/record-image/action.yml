name: Record image push
description: |-
  Run scripts/record_image.py for one layer on a self-hosted runner, picking a
  runner interpreter that can actually import the YAML modules the record needs
  (ruamel.yaml for the changelog backfill's round-trip, PyYAML for the
  gen_descriptions run that refreshes the layer's Changelog section), and
  failing loudly when none can.

  Why this is not just `python3 -m pip install`: the image workflows used to
  assume the runner host has a `python3` with pip, and swallowed the install
  failure behind `|| true`. On ix23 (iluvatar) `/usr/bin/python3` is 3.10 with
  no pip at all, so the install did nothing, the step carried on, and the record
  died later and less legibly inside the script:

      File "scripts/backfill_changelog_date.py", line 31
        from ruamel.yaml import YAML
      ModuleNotFoundError: No module named 'ruamel'

  — after the image had already been pushed, leaving a tag in the registry that
  no changelog or status matrix knows about. Selecting the interpreter here and
  checking the import keeps that from being silent.

  Shared by every image-pushing workflow: base, runtime, and the app ones,
  which differ only in the layer, the paths and the tag.

inputs:
  layer:
    description: 'Tree to record into: base, runtime or app'
    required: true
  backend:
    description: 'Backend key this dispatch pushed (the matrix row that built it)'
    required: true
  tag:
    description: 'Full pushed image ref, tag included (the workflow own image tag)'
    required: true
  matrix:
    description: 'app only: status-matrix YAML path (e.g. packaging/sglang/status_matrix.sglang0.5.18.yaml)'
    required: false
    default: ''
  changelog:
    description: 'app only: per-image changelog YAML (e.g. app/sglang/changelogs/sglang0.5.18-<backend>.yaml)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Record image push
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Candidates in preference order: whatever `python3` is, then the
        # versioned names a distro may expose separately.
        candidates="python3 python3.13 python3.12 python3.11 python3.10"

        # Both are imported by the record path: ruamel.yaml by the changelog
        # backfill's round-trip, and PyYAML by gen_descriptions.py, which the
        # record runs to refresh the layer's Changelog section. Genuinely
        # distinct modules, so either can be the one that is missing.
        probe='import ruamel.yaml, yaml'

        py=""
        # 1. An interpreter that already imports both needs nothing installed.
        for cand in ${candidates}; do
          command -v "${cand}" >/dev/null 2>&1 || continue
          if "${cand}" -c "${probe}" >/dev/null 2>&1; then
            py="${cand}"
            break
          fi
        done

        # 2. Otherwise one that has pip and can install them. --break-system-packages
        #    only exists on newer pip; the plain --user form is the fallback.
        if [ -z "${py}" ]; then
          for cand in ${candidates}; do
            command -v "${cand}" >/dev/null 2>&1 || continue
            "${cand}" -m pip --version >/dev/null 2>&1 || continue
            if ! "${cand}" -m pip install --quiet --user 'ruamel.yaml>=0.18' 'PyYAML>=6' >/dev/null 2>&1; then
              "${cand}" -m pip install --quiet --user --break-system-packages \
                'ruamel.yaml>=0.18' 'PyYAML>=6' >/dev/null 2>&1 || continue
            fi
            if "${cand}" -c "${probe}" >/dev/null 2>&1; then
              py="${cand}"
              break
            fi
          done
        fi

        if [ -z "${py}" ]; then
          echo "::error::no runner interpreter can provide ruamel.yaml and PyYAML (tried: ${candidates})." \
               "The changelog backfill needs the first and the description refresh the second;" \
               "install pip for one of them on this runner."
          exit 1
        fi

        # The app layer's extra paths are only meaningful there; base/runtime
        # address their changelog by layer and backend alone.
        echo ">>> recording ${{ inputs.tag }} as ${{ inputs.layer }}/${{ inputs.backend }} with ${py} ($(${py} -V 2>&1))"
        if [ "${{ inputs.layer }}" = "app" ]; then
          "${py}" scripts/record_image.py \
            --layer app \
            --backend "${{ inputs.backend }}" \
            --tag "${{ inputs.tag }}" \
            --matrix "${{ inputs.matrix }}" \
            --changelog "${{ inputs.changelog }}"
        else
          "${py}" scripts/record_image.py \
            --layer "${{ inputs.layer }}" \
            --backend "${{ inputs.backend }}" \
            --tag "${{ inputs.tag }}"
        fi
