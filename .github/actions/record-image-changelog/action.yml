name: Record image changelog
description: |-
  Run scripts/record_runtime_image.py for one layer on a self-hosted runner.
  The interpreter is picked and its ruamel.yaml import checked up front — the
  backfill needs the round-trip YAML, and a runner with no pip used to swallow
  that install and fail later, after the image was already pushed. Same reason
  as the app layer's record action, which this mirrors.

  Shared by the runtime and base image workflows: they differ only in the layer
  and the changelog path, and the interpreter dance is the same for both.

inputs:
  layer:
    description: 'Changelog tree to record into: runtime or base'
    required: false
    default: runtime
  backend:
    description: 'Backend key this dispatch pushed (the matrix row that built it)'
    required: true
  image:
    description: 'Full pushed image ref, tag included (the workflow own IMAGE_TAG)'
    required: true

runs:
  using: composite
  steps:
    - name: Record image push
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Candidates in preference order: whatever `python3` is, then the
        # versioned names a distro may expose separately.
        candidates="python3 python3.13 python3.12 python3.11 python3.10"

        py=""
        # 1. An interpreter that already imports ruamel needs nothing installed.
        for cand in ${candidates}; do
          command -v "${cand}" >/dev/null 2>&1 || continue
          if "${cand}" -c "import ruamel.yaml" >/dev/null 2>&1; then
            py="${cand}"
            break
          fi
        done

        # 2. Otherwise one that has pip and can install it. --break-system-packages
        #    only exists on newer pip; the plain --user form is the fallback.
        if [ -z "${py}" ]; then
          for cand in ${candidates}; do
            command -v "${cand}" >/dev/null 2>&1 || continue
            "${cand}" -m pip --version >/dev/null 2>&1 || continue
            if ! "${cand}" -m pip install --quiet --user 'ruamel.yaml>=0.18' >/dev/null 2>&1; then
              "${cand}" -m pip install --quiet --user --break-system-packages \
                'ruamel.yaml>=0.18' >/dev/null 2>&1 || continue
            fi
            if "${cand}" -c "import ruamel.yaml" >/dev/null 2>&1; then
              py="${cand}"
              break
            fi
          done
        fi

        if [ -z "${py}" ]; then
          echo "::error::no runner interpreter can provide ruamel.yaml (tried: ${candidates})." \
               "The changelog backfill needs it; install pip for one of them on this runner."
          exit 1
        fi

        echo ">>> recording ${{ inputs.image }} as ${{ inputs.layer }}/${{ inputs.backend }} with ${py} ($(${py} -V 2>&1))"
        "${py}" scripts/record_runtime_image.py \
          --layer "${{ inputs.layer }}" \
          "${{ inputs.backend }}" "${{ inputs.image }}"
