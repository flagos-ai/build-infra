# Global build configuration, shared across image layers (base / runtime / app).
#
# Read by scripts/generate_matrix.py (runners) and scripts/build_base.py (registry).
# Keep globally-shared build settings here instead of threading them through
# workflow inputs.

# Container registry
registry:
  host: harbor.baai.ac.cn
  prefixes:
    base: flagos-base
    runtime: flagos-runtime
    # Builder toolchain images
    builder: flagos-dev
    # App images live under flagos-app
    app: flagos-app

# Runner labels for backends
runners:
  default: [self-hosted, h20]
  overrides:
    ascend-cann8.5.0: [self-hosted, cann850]
    ascend-cann9.0.0: [self-hosted, cann900]
    cambricon-neuware4.4.3: [self-hosted, cambricon]
    cambricon-neuware4.7.2: [self-hosted, cambricon]
    enflame-tops1.9.10: [self-hosted, tops1106]
    enflame-tops1.10.6: [self-hosted, tops1106]
    hygon-dtk26.04: [self-hosted, hygon]
    iluvatar-corex4.4.0: [self-hosted, corex440]
    iluvatar-corex4.5.0: [self-hosted, corex450]
    kunlunxin-xre5.37.1: [self-hosted, kunlunxin]
    metax-maca3.7.2.1: [self-hosted, maca372]
    metax-maca3.8.1.3: [self-hosted, maca381]
    mthreads-musa4.3.6: [self-hosted, musa520]
    mthreads-musa5.2.0: [self-hosted, musa520]
    sunrise-tangrt1.2.0: [self-hosted, sunrise]
    tsingmicro-tsm260610: [self-hosted, tsingmicro]

# `docker run` flags needed to expose each vendor's accelerator to a container.
#
# TODO: confirm the exact device flags for each vendor. Only nvidia is filled in;
# the rest are placeholders — replace the TODO strings with the real flags.
# Each vendor may carry up to two launch styles, toolkit first:
#   toolkit:     flags added to `docker run` when the vendor's container toolkit is
#                installed on the host.
#   toolkit_cmd: a full wrapper command ({image} placeholder) for launchers that
#                REPLACE `docker run` entirely (e.g. metax-docker).
#   raw:         device-passthrough flags for plain docker/podman + the vendor driver,
#                no toolkit. Empty raw ("") = generic `docker run <image>`, no flags.
run:
  default: ""
  vendors:
    nvidia:
      toolkit: "--gpus all"
      # raw needs the host driver: nvidia-smi + libnvidia-ml (for smi) + libcuda (CUDA).
      raw: "--device /dev/nvidia0 --device /dev/nvidiactl --device /dev/nvidia-uvm -v /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro -v /usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ml.so.1:ro -v /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro"
    ascend:
      # Note: explicit device indices only — ASCEND_VISIBLE_DEVICES=all fails.
      toolkit: "-e ASCEND_VISIBLE_DEVICES=0"
      raw: "--device /dev/davinci0 --device /dev/davinci_manager --device /dev/devmm_svm --device /dev/hisi_hdc -v /usr/local/Ascend/driver:/usr/local/Ascend/driver -v /usr/local/dcmi:/usr/local/dcmi -v /usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi"
    hygon:
      toolkit: "-e DCU_VISIBLE_DEVICES=all"
      # Note: needs BOTH kfd nodes — /dev/kfd alone leaves power/perf N/A and hy-smi
      # errors "Open mkfd failed"; /dev/mkfd carries that telemetry.
      raw: "--device /dev/kfd --device /dev/mkfd --device /dev/dri --group-add video -v /opt/hyhal:/opt/hyhal --security-opt seccomp=unconfined"
    metax:
      # metax-docker is a `docker` wrapper (drop-in replacement), not flags.
      toolkit_cmd: "metax-docker run --rm -it {image} bash"
      raw: "--device /dev/mxcd --device /dev/dri --group-add video"
    mthreads:
      toolkit: "--runtime mthreads --env MTHREADS_VISIBLE_DEVICES=all"
      raw: "--device /dev/mtgpu.0 --device /dev/dri -v /usr/bin/mthreads-gmi:/usr/bin/mthreads-gmi:ro"
    iluvatar:
      toolkit: "--runtime iluvatar --env IX_VISIBLE_DEVICES=all"
      raw: "--device /dev/iluvatar0"
    cambricon:
      # No container toolkit/runtime known.
      raw: "--device /dev/cambricon_dev0 --device /dev/cambricon_ctl"
    kunlunxin:
      # Note: env var is CXPU_VISIBLE_DEVICES (not XPU_), explicit index.
      toolkit: "--runtime xpu -e CXPU_VISIBLE_DEVICES=0"
      raw: "--device /dev/xpu0 --device /dev/xpuctrl"
    tsingmicro:
      toolkit: "--runtime=tsingmicro -e TSINGMICRO_VISIBLE_DEVICES=all"
      raw: "--device /dev/accel --device /dev/accel_drv_mgr"
    enflame:
      # Note:
      # 1. toolkit uses --network host + env var, no --runtime flag.
      # 2. On Tencent cloud we use one environment variable, in standalone
      #    environments, we use another, so we set both.
      toolkit: "--network host -e ENFLAME_VISIBLE_DEVICES=all -e TENCENT_VISIBLE_DEVICES=all"
      raw: "--privileged -v /dev:/dev"
    sunrise:
      raw: "--privileged -v /dev:/dev"

  # Host prerequisite (container toolkit) for the toolkit tier, per vendor.
  prereq:
    nvidia: "nvidia-container-toolkit"
    ascend: "Ascend-docker-runtime >= 6.0.RC3"
    hygon: "dcu-container-toolkit >= 1.3.0"
    metax: "metax-docker >= 0.15.3"
    kunlunxin: "xpu_container >= 1.0.13"
    mthreads: "KUAE Cloud Native Toolkits (MT Container Toolkit) >= 2.1.0"
    iluvatar: "ix-container-toolkit >= 1.1.0"
    tsingmicro: "tx-container-toolkit >= 2.5.0"
    enflame: "tencent-container-toolkit >= 2.0.52"

# Device-enumeration command per vendor
verify:
  vendors:
    nvidia: "nvidia-smi"
    ascend: "npu-smi info"
    metax: "mx-smi"
    cambricon: "cnmon"
    iluvatar: "ixsmi"
    hygon: "hy-smi"
    kunlunxin: "xpu-smi"
    mthreads: "mthreads-gmi"
    enflame: "efsmi"
    sunrise: "pt_smi"
    tsingmicro: "tsm_smi"
